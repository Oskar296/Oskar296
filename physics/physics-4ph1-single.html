<script>
/* data/exam-5-8.js */
EXAMQS.push(

{ s:5, title:'Density and pressure in a liquid', context:
  'A rectangular block of metal measures 0.20 m × 0.10 m × 0.05 m and has a mass of 7.9 kg.',
  parts:[
    { q:'Calculate the volume of the block.', marks:2,
      ms:['V = 0.20 × 0.10 × 0.05','= 1.0 × 10⁻³ m³'],
      tip:'Keep every length in metres and the volume comes out in m³ directly.' },
    { q:'Calculate the density of the metal.', marks:2,
      ms:['ρ = m / V = 7.9 / 1.0 × 10⁻³','= 7900 kg/m³'],
      tip:'A metal density of a few thousand kg/m³ is a good sanity check. Water is 1000.' },
    { q:'The block rests on its largest face. Calculate the pressure it exerts on the ground. (g = 10 N/kg)', marks:3,
      ms:['W = m × g = 7.9 × 10 = 79 N','A = 0.20 × 0.10 = 0.02 m²','p = F / A = 79 / 0.02 = 3950 Pa'],
      tip:'The force is the weight, not the mass. Largest face means smallest pressure.' },
    { q:'Calculate the pressure due to the water at a depth of 15 m in a lake. (density of water = 1000 kg/m³)', marks:2,
      ms:['p = h × ρ × g = 15 × 1000 × 10','= 150 000 Pa'],
      tip:'This is the pressure due to the water alone. If asked for total pressure, add atmospheric pressure on top.' }
  ]},

{ s:5, title:'Heating and specific heat capacity', context:
  'A 2.0 kg aluminium block is heated by a 50 W immersion heater. Its temperature rises from 20 °C to 45 °C in 15 minutes.',
  parts:[
    { q:'Calculate the energy supplied by the heater.', marks:3,
      ms:['t = 15 × 60 = 900 s','E = P × t = 50 × 900','= 45 000 J'],
      tip:'Convert minutes to seconds. This single step accounts for a huge share of dropped marks.' },
    { q:'Calculate the specific heat capacity of aluminium from these results.', marks:3,
      ms:['ΔT = 45 − 20 = 25 °C','c = ΔQ / (m × ΔT) = 45 000 / (2.0 × 25)','= 900 J/(kg °C)'],
      tip:'Use the temperature change, not the final temperature. Rearrange ΔQ = mcΔT carefully.' },
    { q:'The accepted value is lower than the value calculated. Explain why.', marks:2,
      ms:['Some energy is transferred to the surroundings rather than to the block',
          'So the measured energy supplied is greater than the energy actually gained by the block, making the calculated value too high'],
      tip:'Then give the improvement: lag the block with insulation. Examiners often add a mark for it.' },
    { q:'Explain, in terms of particles, why the temperature of water stays constant while it boils.', marks:3,
      ms:['The energy supplied is used to break the forces of attraction between the particles',
          'It is not used to increase the average kinetic energy of the particles',
          'Temperature is a measure of average kinetic energy, so the temperature does not change'],
      tip:'The chain "energy breaks bonds → kinetic energy unchanged → temperature unchanged" is the full three marks.' }
  ]},

{ s:5, title:'Gas laws and kinetic theory', context:
  'A sealed cylinder contains 0.030 m³ of gas at a pressure of 1.0 × 10⁵ Pa and a temperature of 27 °C.',
  parts:[
    { q:'The gas is compressed to 0.010 m³ at constant temperature. Calculate the new pressure.', marks:3,
      ms:['p₁V₁ = p₂V₂','1.0 × 10⁵ × 0.030 = p₂ × 0.010','p₂ = 3.0 × 10⁵ Pa'], p2:true,
      tip:'Boyle’s law. Volume down by a factor of 3, so pressure up by a factor of 3 — check your answer against that.' },
    { q:'Explain, in terms of molecules, why the pressure increases when the gas is compressed.', marks:3,
      ms:['The molecules are now in a smaller volume',
          'So they collide with the walls more frequently',
          'More collisions per second on each unit of area means a greater pressure'],
      tip:'Say "more often", not "harder". At constant temperature the molecules move at the same average speed.' },
    { q:'The cylinder is returned to 0.030 m³ and heated from 27 °C to 127 °C at constant volume. Calculate the new pressure.', marks:4,
      ms:['T₁ = 27 + 273 = 300 K, T₂ = 127 + 273 = 400 K','p₁/T₁ = p₂/T₂','1.0 × 10⁵ / 300 = p₂ / 400','p₂ = 1.33 × 10⁵ Pa'], p2:true,
      tip:'Convert to kelvin first — using Celsius here gives a wildly wrong answer and scores nothing.' },
    { q:'Explain what is meant by absolute zero.', marks:2,
      ms:['The lowest temperature possible, −273 °C or 0 K',
          'At this temperature the particles have the minimum possible kinetic energy'], p2:true,
      tip:'Give both the value and the meaning. One without the other is one mark.' }
  ]},

{ s:6, title:'The motor effect', context:
  'A straight wire of length 0.15 m lies at right angles to a magnetic field of flux density 0.20 T. A current of 3.0 A flows in the wire.',
  parts:[
    { q:'Calculate the force on the wire.', marks:2,
      ms:['F = B × I × l = 0.20 × 3.0 × 0.15','= 0.090 N'], p2:true,
      tip:'The equation only works when the wire is at 90° to the field. If the wire lies along the field, the force is zero.' },
    { q:'State two ways the force could be increased.', marks:2,
      ms:['Increase the current','Use a stronger magnetic field (or increase the length of wire in the field)'],
      tip:'Reversing the current or the field changes the direction, not the size. Read the question.' },
    { q:'Describe how to find the direction of the force.', marks:2,
      ms:['Use Fleming’s left-hand rule',
          'First finger points along the field from N to S, second finger along the conventional current, and the thumb then gives the direction of the force'],
      tip:'Left hand for the motor effect. Name the rule and describe it — both are creditworthy.' },
    { q:'Explain how a split-ring commutator keeps a d.c. motor turning in one direction.', marks:3,
      ms:['The two sides of the coil carry current in opposite directions, so the forces on them are opposite and the coil rotates',
          'Every half turn the commutator reverses the current in the coil',
          'So the force on each side always acts in the direction that keeps the coil turning the same way'],
      tip:'Without the commutator the coil would turn half a turn and then stop or oscillate. Saying that earns credit.' }
  ]},

{ s:6, title:'Transformers and the National Grid', context:
  'A transformer has 200 turns on its primary coil and 5000 turns on its secondary coil. The input is 230 V a.c.',
  parts:[
    { q:'Calculate the output voltage.', marks:3,
      ms:['V_p / V_s = n_p / n_s','230 / V_s = 200 / 5000','V_s = 5750 V'],
      tip:'More turns on the secondary means a step-up transformer, so expect a bigger output. Check your answer fits.' },
    { q:'The transformer is 100% efficient and the primary current is 2.0 A. Calculate the secondary current.', marks:3,
      ms:['V_p × I_p = V_s × I_s','230 × 2.0 = 5750 × I_s','I_s = 0.080 A'],
      tip:'Power in equals power out. Voltage up by 25 times means current down by 25 times.' },
    { q:'Explain why a transformer does not work with a direct current supply.', marks:3,

<script>
/* data/technique.js */
/* Exam technique reference: command words, calculation method, graph skills,
   unit conversions and the traps that cost the most marks. */
window.TECHNIQUE = {

  commands: [
    { w:'State', m:'Give a short factual answer. No explanation needed and no marks for adding one.', e:'"State the unit of momentum." → kg m/s' },
    { w:'Give', m:'The same as state. One short piece of information.', e:'"Give one use of gamma radiation." → sterilising surgical instruments' },
    { w:'Name', m:'Identify something using the correct technical term.', e:'"Name the force that keeps a planet in orbit." → gravitational force' },
    { w:'Describe', m:'Say what happens, in the right order. No reasons required.', e:'"Describe what happens to the needle as the magnet is pushed in." → it deflects to one side' },
    { w:'Explain', m:'Say why it happens. Every explain mark needs a reason — look for "because", "so" and "therefore" in your own answer.', e:'"Explain why the resistance of a filament lamp increases." → the filament heats up, so the ions vibrate more, so electrons collide more often' },
    { w:'Calculate', m:'Work out a numerical answer. Always show the equation, the substitution and the final answer with a unit.', e:'Three lines, every time. You can earn marks even when the final number is wrong.' },
    { w:'Determine', m:'Like calculate, but you usually have to extract the data yourself, often from a graph.', e:'"Determine the acceleration from the graph." → draw a triangle, take the gradient' },
    { w:'Compare', m:'Write about both things, and make the link explicit. Use "whereas" or "but".', e:'"Alpha is stopped by paper, whereas gamma needs thick lead."' },
    { w:'Suggest', m:'Apply what you know to an unfamiliar situation. There is often more than one acceptable answer.', e:'"Suggest why the readings varied." → the count rate is random, so repeats differ' },
    { w:'Predict', m:'Say what will happen, based on a pattern or a relationship you have been given.', e:'Look for the trend in the data and continue it.' },
    { w:'Evaluate', m:'Give advantages and disadvantages, then reach a conclusion. The conclusion is usually worth a mark on its own.', e:'"Evaluate the use of wind power." → advantages, disadvantages, then a judgement' },
    { w:'Suggest an improvement', m:'Name a specific change to the method and say what error it reduces.', e:'"Use light gates instead of a stopwatch, to remove reaction-time error."' },
    { w:'Show that', m:'Work towards the value given in the question, and quote your answer to more figures than the question does.', e:'"Show that the speed is about 7 m/s." → end with 7.33 m/s, not "about 7"' },
    { w:'Sketch', m:'Draw the correct shape with the axes labelled. Accurate plotting is not required, but the shape must be right.', e:'A filament lamp I–V graph: an S-shaped curve through the origin' }
  ],

  calcSteps: [
    { t:'Write the equation first', d:'Even if you get stuck straight afterwards, the equation usually earns a mark. Write it in symbols exactly as it appears on the Equations tab.' },
    { t:'Convert every quantity to SI units', d:'Minutes to seconds, km to m, g to kg, cm³ to m³, kHz to Hz, °C to K for any gas law. Do this before you substitute, not after.' },
    { t:'Rearrange before you substitute', d:'It is far easier to make the unknown the subject while the letters are still letters. Numbers make rearranging harder, not easier.' },
    { t:'Substitute and show it', d:'Write the line with the numbers in it. This is the substitution mark and it survives an arithmetic slip.' },
    { t:'Give the answer with a unit', d:'A number with no unit usually loses the final mark. Check the unit matches the quantity you were asked for.' },
    { t:'Sanity check', d:'Is a car really travelling at 3000 m/s? Is the efficiency above 100%? Is the refractive index below 1? If so, something has gone wrong — say so if you cannot fix it.' },
    { t:'Significant figures', d:'Match the least precise value in the question, usually 2 or 3 s.f. Never round part-way through a multi-step calculation.' }
  ],

  graphs: [
    { t:'Distance–time graph', d:'Gradient = speed. Flat means stationary. Curving upwards means accelerating. For the speed at an instant, draw a tangent and take its gradient.' },
    { t:'Velocity–time graph', d:'Gradient = acceleration. Area under the line = distance travelled. A flat line means constant velocity, not stationary.' },
    { t:'Force–extension graph', d:'The straight portion through the origin obeys Hooke\'s law. Gradient = spring constant. The point where it starts to curve is the limit of proportionality.' },
    { t:'Current–voltage graph', d:'Gradient = 1/resistance. A straight line through the origin means constant resistance. A flattening curve means resistance is increasing.' },
    { t:'Taking a gradient', d:'Use a triangle spanning at least half the line, read the corners off gridlines, and show the triangle on the graph. Small triangles lose accuracy marks.' },
    { t:'Drawing a line of best fit', d:'A smooth single line with roughly equal numbers of points either side. Do not join the dots, and do not force it through the origin unless the physics requires it.' },
    { t:'Plotting points', d:'Use sensible scales that fill at least half the grid, label both axes with the quantity and its unit, and mark points with a small neat cross.' }
  ],

  units: [
    { f:'kilometres (km)', t:'metres (m)', h:'× 1000' },
    { f:'centimetres (cm)', t:'metres (m)', h:'÷ 100' },
    { f:'millimetres (mm)', t:'metres (m)', h:'÷ 1000' },
    { f:'grams (g)', t:'kilograms (kg)', h:'÷ 1000' },
    { f:'tonnes (t)', t:'kilograms (kg)', h:'× 1000' },
    { f:'minutes', t:'seconds (s)', h:'× 60' },
    { f:'hours', t:'seconds (s)', h:'× 3600' },
    { f:'km/h', t:'m/s', h:'÷ 3.6' },
    { f:'cm² ', t:'m²', h:'÷ 10 000' },
    { f:'cm³', t:'m³', h:'÷ 1 000 000' },
    { f:'g/cm³', t:'kg/m³', h:'× 1000' },
    { f:'milliamps (mA)', t:'amps (A)', h:'÷ 1000' },
    { f:'kilowatts (kW)', t:'watts (W)', h:'× 1000' },
    { f:'megawatts (MW)', t:'watts (W)', h:'× 1 000 000' },
    { f:'kilohertz (kHz)', t:'hertz (Hz)', h:'× 1000' },
    { f:'megahertz (MHz)', t:'hertz (Hz)', h:'× 1 000 000' },
    { f:'degrees Celsius (°C)', t:'kelvin (K)', h:'+ 273' },
    { f:'kilojoules (kJ)', t:'joules (J)', h:'× 1000' }
  ],

  sixMark: [
    'Read the question twice and underline the command word and the context.',
    'Spend a minute planning: jot four or five bullet points in the margin before you write anything.',
    'Write in continuous prose, in a logical order. Six-mark questions carry marks for how well the answer is organised, not just for the facts.',
    'Use the technical vocabulary — resultant force, dissipated, ionising, induced, terminal velocity. Everyday words rarely score.',
    'If the question says "explain", make sure most sentences contain a reason.',
    'If it says "evaluate" or "discuss", cover both sides and finish with a clear conclusion.',
    'Refer to the specific context in the question, not a generic textbook answer.',
    'Aim for roughly six or seven clear points. Length alone earns nothing.'
  ],

  traps: [
    { t:'Confusing mass and weight', d:'Mass is in kg and never changes. Weight is a force in N and depends on g. "The astronaut’s mass on the Moon" is still the Earth value.' },
    { t:'Reading the wrong graph type', d:'Check the y-axis label before you say "gradient is speed". Distance–time and velocity–time graphs can look identical.' },
    { t:'Forgetting to square or square-root', d:'KE = ½mv² needs the square. v² = u² + 2as needs the square root at the end.' },
    { t:'Not converting time to seconds', d:'Any answer in joules or watts needs the time in seconds.' },
    { t:'Measuring angles from the surface', d:'All angles in optics are measured from the normal, which is at 90° to the surface.' },
    { t:'Using Celsius in a gas law', d:'p₁/T₁ = p₂/T₂ and any temperature-proportionality argument require kelvin.' },
    { t:'Saying energy is "lost"', d:'Energy is dissipated or transferred to the surroundings. It is never destroyed.' },
    { t:'Saying forces "cancel out and it stops"', d:'At terminal velocity the resultant force is zero, so the object keeps moving at constant velocity.' },
    { t:'Mixing up moderator and control rods', d:'The moderator slows neutrons down. The control rods absorb them.' },
    { t:'Forgetting background radiation', d:'Subtract the background count rate before any half-life calculation.' },
    { t:'Protons moving in electrostatics', d:'Only electrons move. A positive charge means electrons have been removed.' },
    { t:'Ionising vs penetrating', d:'Alpha is the most ionising but the least penetrating. Gamma is the reverse.' }
  ]
};
</script>
<script>
/* data/drills.js */
/* Randomised calculation drills. Each drill's gen() returns a fresh question:
     given  [[label, value, unit], ...]   the data supplied
     ask    [label, unit]                 what to calculate
     ans    the correct value
     work   the worked solution shown after answering
   Answers are marked correct within a small tolerance so rounding is not punished. */
(function () {
  function ri(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function sf(x, n) { return Number(x.toPrecision(n || 3)); }

  window.DRILLS = [

  { s:1, name:'Average speed', eq:'v = s / t', gen:function () {
      var s = ri(20, 60) * 10, t = ri(4, 40);
      return { given:[['distance moved', s, 'm'], ['time taken', t, 's']],
        ask:['average speed', 'm/s'], ans:s / t,
        work:'v = s / t = ' + s + ' / ' + t + ' = ' + sf(s / t) + ' m/s' };
    }},

  { s:1, name:'Acceleration', eq:'a = (v − u) / t', gen:function () {
      var u = ri(0, 12), v = u + ri(4, 30), t = ri(2, 15);
      return { given:[['initial velocity u', u, 'm/s'], ['final velocity v', v, 'm/s'], ['time taken', t, 's']],
        ask:['acceleration', 'm/s²'], ans:(v - u) / t,
        work:'a = (v − u) / t = (' + v + ' − ' + u + ') / ' + t + ' = ' + sf((v - u) / t) + ' m/s²' };
    }},

  { s:1, name:'Newton’s second law', eq:'F = m × a', gen:function () {
      var m = ri(2, 150) * 10, a = ri(1, 9);
      return { given:[['mass', m, 'kg'], ['acceleration', a, 'm/s²']],
        ask:['resultant force', 'N'], ans:m * a,
        work:'F = m × a = ' + m + ' × ' + a + ' = ' + (m * a) + ' N' };
    }},

  { s:1, name:'Weight', eq:'W = m × g', gen:function () {
      var m = ri(2, 90), g = pick([10, 1.6, 3.7, 25]);
      var where = { 10:'Earth', 1.6:'the Moon', 3.7:'Mars', 25:'Jupiter' }[g];
      return { given:[['mass', m, 'kg'], ['gravitational field strength on ' + where, g, 'N/kg']],
        ask:['weight', 'N'], ans:m * g,
        work:'W = m × g = ' + m + ' × ' + g + ' = ' + sf(m * g) + ' N' };
    }},

  { s:1, name:'Uniform acceleration (no time)', eq:'v² = u² + 2as', gen:function () {
      var u = pick([0, 0, 4, 6]), a = ri(2, 6), s = ri(10, 90);
      var v = Math.sqrt(u * u + 2 * a * s);
      return { given:[['initial speed u', u, 'm/s'], ['acceleration', a, 'm/s²'], ['distance moved', s, 'm']],
        ask:['final speed', 'm/s'], ans:v,
        work:'v² = u² + 2as = ' + (u * u) + ' + 2 × ' + a + ' × ' + s + ' = ' + sf(u * u + 2 * a * s) +
             '\nv = √' + sf(u * u + 2 * a * s) + ' = ' + sf(v) + ' m/s' };
    }},

  { s:1, name:'Moment of a force', eq:'M = F × d', gen:function () {
      var F = ri(5, 60) * 5, d = ri(2, 25) / 10;
      return { given:[['force', F, 'N'], ['perpendicular distance from pivot', d, 'm']],
        ask:['moment', 'N m'], ans:F * d,
        work:'moment = F × d = ' + F + ' × ' + d + ' = ' + sf(F * d) + ' N m' };
    }},

  { s:1, name:'Momentum', eq:'p = m × v', p2:true, gen:function () {
      var m = ri(1, 200) * 5, v = ri(2, 30);
      return { given:[['mass', m, 'kg'], ['velocity', v, 'm/s']],
        ask:['momentum', 'kg m/s'], ans:m * v,
        work:'p = m × v = ' + m + ' × ' + v + ' = ' + (m * v) + ' kg m/s' };
    }},

  { s:2, name:'Ohm’s law', eq:'V = I × R', gen:function () {
      var I = ri(1, 50) / 10, R = ri(2, 120);
      return { given:[['current', I, 'A'], ['resistance', R, 'Ω']],
        ask:['voltage', 'V'], ans:I * R,
        work:'V = I × R = ' + I + ' × ' + R + ' = ' + sf(I * R) + ' V' };
    }},

  { s:2, name:'Resistance from V and I', eq:'R = V / I', gen:function () {
      var V = pick([1.5, 3, 6, 9, 12, 230]), I = ri(1, 40) / 10;
      return { given:[['voltage', V, 'V'], ['current', I, 'A']],
        ask:['resistance', 'Ω'], ans:V / I,
        work:'R = V / I = ' + V + ' / ' + I + ' = ' + sf(V / I) + ' Ω' };
    }},

  { s:2, name:'Electrical power', eq:'P = I × V', gen:function () {
      var V = pick([12, 24, 230]), I = ri(2, 130) / 10;
      return { given:[['voltage', V, 'V'], ['current', I, 'A']],
        ask:['power', 'W'], ans:I * V,
        work:'P = I × V = ' + I + ' × ' + V + ' = ' + sf(I * V) + ' W' };
    }},

  { s:2, name:'Charge', eq:'Q = I × t', gen:function () {
      var I = ri(1, 60) / 10, mins = ri(1, 10);
      var t = mins * 60;
      return { given:[['current', I, 'A'], ['time', mins, 'minutes']],
        ask:['charge', 'C'], ans:I * t,
        work:'t = ' + mins + ' × 60 = ' + t + ' s\nQ = I × t = ' + I + ' × ' + t + ' = ' + sf(I * t) + ' C' };
    }},

  { s:3, name:'Wave equation', eq:'v = f × λ', gen:function () {
      var f = ri(2, 90) * 5, lam = ri(2, 60) / 10;
      return { given:[['frequency', f, 'Hz'], ['wavelength', lam, 'm']],
        ask:['wave speed', 'm/s'], ans:f * lam,
        work:'v = f × λ = ' + f + ' × ' + lam + ' = ' + sf(f * lam) + ' m/s' };
    }},

  { s:3, name:'Frequency from period', eq:'f = 1 / T', gen:function () {
      var T = pick([0.5, 0.25, 0.2, 0.1, 0.05, 0.04, 0.02, 0.01, 0.004]);
      return { given:[['time period', T, 's']],
        ask:['frequency', 'Hz'], ans:1 / T,
        work:'f = 1 / T = 1 / ' + T + ' = ' + sf(1 / T) + ' Hz' };
    }},

  { s:3, name:'Refractive index', eq:'n = sin i / sin r', gen:function () {
      var i = ri(20, 70), r = Math.round(i * (0.55 + Math.random() * 0.15));
      var n = Math.sin(i * Math.PI / 180) / Math.sin(r * Math.PI / 180);
      return { given:[['angle of incidence i', i, '°'], ['angle of refraction r', r, '°']],
        ask:['refractive index', '(no unit)'], ans:n,
        work:'n = sin i / sin r = sin ' + i + '° / sin ' + r + '°\n= ' +
             sf(Math.sin(i * Math.PI / 180), 3) + ' / ' + sf(Math.sin(r * Math.PI / 180), 3) + ' = ' + sf(n) };
    }},

  { s:4, name:'Work done', eq:'W = F × d', gen:function () {
      var F = ri(5, 80) * 10, d = ri(2, 40);
      return { given:[['force', F, 'N'], ['distance moved in direction of force', d, 'm']],
        ask:['work done', 'J'], ans:F * d,
        work:'W = F × d = ' + F + ' × ' + d + ' = ' + (F * d) + ' J' };
    }},

  { s:4, name:'Kinetic energy', eq:'KE = ½ m v²', gen:function () {
      var m = ri(1, 120) * 10, v = ri(2, 30);
      return { given:[['mass', m, 'kg'], ['speed', v, 'm/s']],
        ask:['kinetic energy', 'J'], ans:0.5 * m * v * v,
        work:'KE = ½ × m × v² = 0.5 × ' + m + ' × ' + v + '²\n= 0.5 × ' + m + ' × ' + (v * v) +
             ' = ' + sf(0.5 * m * v * v) + ' J' };
    }},

  { s:4, name:'Gravitational potential energy', eq:'GPE = m × g × h', gen:function () {
      var m = ri(1, 90), h = ri(2, 40);
      return { given:[['mass', m, 'kg'], ['gravitational field strength', 10, 'N/kg'], ['height gained', h, 'm']],
        ask:['gravitational potential energy', 'J'], ans:m * 10 * h,
        work:'GPE = m × g × h = ' + m + ' × 10 × ' + h + ' = ' + (m * 10 * h) + ' J' };
    }},

  { s:4, name:'Power', eq:'P = W / t', gen:function () {
      var W = ri(10, 400) * 100, t = ri(5, 120);
      return { given:[['work done', W, 'J'], ['time taken', t, 's']],
        ask:['power', 'W'], ans:W / t,
        work:'P = W / t = ' + W + ' / ' + t + ' = ' + sf(W / t) + ' W' };
    }},

  { s:4, name:'Efficiency', eq:'efficiency = (useful out / total in) × 100%', gen:function () {
      var total = ri(10, 90) * 100, useful = Math.round(total * (ri(20, 85) / 100));
      return { given:[['total energy input', total, 'J'], ['useful energy output', useful, 'J']],
        ask:['efficiency', '%'], ans:useful / total * 100,
        work:'efficiency = (' + useful + ' / ' + total + ') × 100 = ' + sf(useful / total * 100) + '%' };
    }},

  { s:5, name:'Density', eq:'ρ = m / V', gen:function () {
      var m = ri(5, 400) / 10, V = ri(5, 90) / 1000;
      return { given:[['mass', m, 'kg'], ['volume', V, 'm³']],
        ask:['density', 'kg/m³'], ans:m / V,
        work:'ρ = m / V = ' + m + ' / ' + V + ' = ' + sf(m / V) + ' kg/m³' };

  { s:5, name:'Pressure', eq:'p = F / A', gen:function () {
      var F = ri(10, 90) * 10, A = ri(1, 60) / 100;

      return { given:[['depth', h, 'm'], ['density of liquid', rho, 'kg/m³'], ['gravitational field strength', 10, 'N/kg']],

        work:'p = h × ρ × g = ' + h + ' × ' + rho + ' × 10 = ' + sf(h * rho * 10) + ' Pa' };
    }},

  { s:5, name:'Specific heat capacity', eq:'ΔQ = m × c × ΔT', gen:function () {

      return { given:[['magnetic flux density', B, 'T'], ['current', I, 'A'], ['length in the field', l, 'm']],

        work:'F = B × I × l = ' + B + ' × ' + I + ' × ' + l + ' = ' + sf(B * I * l) + ' N' };
    }},

  { s:6, name:'Transformer turns ratio', eq:'V_p / V_s = n_p / n_s', gen:function () {
      var np = ri(1, 20) * 50, ns = ri(1, 40) * 50, Vp = pick([12, 24, 230, 400]);
      return { given:[['primary turns n_p', np, ''], ['secondary turns n_s', ns, ''], ['primary voltage V_p', Vp, 'V']],
        ask:['secondary voltage V_s', 'V'], ans:Vp * ns / np,
        work:'V_p / V_s = n_p / n_s\nV_s = V_p × n_s / n_p = ' + Vp + ' × ' + ns + ' / ' + np +

  { s:6, name:'Ideal transformer current', eq:'V_p I_p = V_s I_s', gen:function () {
      var Vp = pick([230, 400, 25000]), Ip = ri(5, 200) / 10, Vs = pick([12, 50, 132000, 400000]);
      return { given:[['primary voltage', Vp, 'V'], ['primary current', Ip, 'A'], ['secondary voltage', Vs, 'V']],
        ask:['secondary current', 'A'], ans:Vp * Ip / Vs,
        work:'V_p × I_p = V_s × I_s\nI_s = (' + Vp + ' × ' + Ip + ') / ' + Vs + ' = ' + sf(Vp * Ip / Vs) + ' A' };
    }},

  { s:7, name:'Half-life', eq:'halve once per half-life', gen:function () {
      var A0 = pick([640, 800, 960, 1280, 512]), n = ri(2, 5), hl = ri(2, 12);
      return { given:[['initial activity', A0, 'Bq'], ['half-life', hl, 'hours'], ['time elapsed', n * hl, 'hours']],

    }},

  { s:8, name:'Orbital speed', eq:'v = 2πr / T', gen:function () {

    }},

  { s:8, name:'Hubble’s law', eq:'v = H₀ × d', gen:function () {
      var d = ri(1, 90) * 1e23;

    }}

  ];
})();

</script>
<script>
/* app.js */
/* IGCSE Physics (Edexcel 4PH1) study app - view logic and progress tracking. */
(function () {
'use strict';

var KEY = 'igcse-phys-4ph1-v1';
var view = document.getElementById('view');
var tabsEl = document.getElementById('tabs');
var searchEl = document.getElementById('search');

var TABS = [
  { id:'home',      label:'Overview' },
  { id:'equations', label:'Equations' },
  { id:'practicals',label:'Practicals' },
  { id:'glossary',  label:'Definitions' },
  { id:'cards',     label:'Flashcards' },
  { id:'quiz',      label:'Quiz' },
  { id:'exam',      label:'Exam Qs' },
  { id:'drills',    label:'Drills' },
  { id:'technique', label:'Technique' }
];

var state = load();
var route = { tab:'home', section:null };

function load() {
  /* stats[sectionId] = { qa: quiz answered, qc: quiz correct,
                          da: drills answered, dc: drills correct,
                          em: exam marks scored, eo: exam marks out of } */
  var d = { progress:{}, theme:'dark', stats:{}, seen:0 };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        d.progress = p.progress || {};
        d.theme = p.theme === 'light' ? 'light' : 'dark';
        d.stats = p.stats || {};
        d.seen = p.seen || 0;
      }
    }
  } catch (e) { /* storage blocked or corrupt - carry on with defaults */ }
  return d;
}
/* Record an attempt against a section. kind is 'q' (quiz), 'd' (drill) or 'e' (exam). */
function record(sectionId, kind, scored, outOf) {
  var s = state.stats[sectionId] || (state.stats[sectionId] = {});
  if (kind === 'e') {
    s.em = (s.em || 0) + scored;
    s.eo = (s.eo || 0) + outOf;
  } else {
    s[kind + 'a'] = (s[kind + 'a'] || 0) + (outOf || 1);
    s[kind + 'c'] = (s[kind + 'c'] || 0) + scored;
  }
  save();
}
function statsFor(id) {
  var s = state.stats[id] || {};
  var attempted = (s.qa || 0) + (s.da || 0) + (s.eo || 0);
  var correct = (s.qc || 0) + (s.dc || 0) + (s.em || 0);
  return { attempted:attempted, correct:correct,
           pct: attempted ? correct / attempted : null };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function el(html) {
  var t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function allPoints() {
  var out = [];
  SPEC.sections.forEach(function (sec) {
    sec.topics.forEach(function (top) {
      top.points.forEach(function (p) { out.push({ sec:sec, top:top, p:p }); });
    });
  });
  return out;
}
function sectionPoints(sec) {
  var out = [];
  sec.topics.forEach(function (t) { t.points.forEach(function (p) { out.push(p); }); });
  return out;
}
function statusOf(ref) { return state.progress[ref] || 0; }
function countBy(points, v) {
  var n = 0;
  points.forEach(function (p) { if (statusOf(p.n) === v) n++; });
  return n;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800);
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Section accents are tuned for the dark theme; darken them for the light theme
   so coloured headings keep enough contrast on white. */
function secColour(sec) {
  if (state.theme !== 'light') return sec.colour;
  var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(sec.colour);
  if (!m) return sec.colour;
  var c = [1, 2, 3].map(function (i) {
    return Math.round(parseInt(m[i], 16) * 0.58);
  });
  return 'rgb(' + c.join(',') + ')';
}
function track(pct, colour) {
  return '<div class="track"><i style="width:' + pct + '%' +
    (colour ? ';background:' + colour : '') + '"></i></div>';
}

/* ---------- chrome ---------- */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
}
function renderTabs() {
  tabsEl.innerHTML = '';
  TABS.forEach(function (t) {
    var b = el('<button' + (route.tab === t.id ? ' class="on"' : '') + '>' + t.label + '</button>');
    b.onclick = function () { go(t.id); };
    tabsEl.appendChild(b);
  });
}
function renderHeaderProgress() {
  var pts = allPoints().map(function (x) { return x.p; });
  var done = countBy(pts, 2);
  var pct = Math.round(done / pts.length * 100);
  document.getElementById('hdrProg').innerHTML =
    track(pct) + '<span class="mono">' + done + '/' + pts.length + ' confident</span>';
}
/* Routing runs through location.hash so the browser back button works and any
   view can be linked to directly. go() only writes the hash; hashchange renders. */
function go(tab, section) {
  var h = '#' + tab + (section ? '/' + section : '');
  if (location.hash === h) applyRoute(); else location.hash = h;
}
function applyRoute() {
  var m = /^#([a-z]+)(?:\/(\d+))?/.exec(location.hash || '#home');
  var tab = m && m[1], section = m && m[2] ? Number(m[2]) : null;
  if (!TABS.some(function (t) { return t.id === tab; })) tab = 'home';
  if (section !== null && !SPEC.sections.some(function (s) { return s.id === section; })) section = null;
  route.tab = tab;
  route.section = section;
  searchEl.value = '';
  renderTabs();
  render();
  window.scrollTo(0, 0);
}

/* ---------- views ---------- */
function render() {
  renderHeaderProgress();
  if (route.section !== null) return viewSection(route.section);
  ({
    home: viewHome,
    equations: viewEquations,
    practicals: viewPracticals,
    glossary: viewGlossary,
    cards: viewCards,
    quiz: viewQuiz,
    exam: viewExam,
    drills: viewDrills,
    technique: viewTechnique
  }[route.tab] || viewHome)();
}

function viewHome() {
  var pts = allPoints().map(function (x) { return x.p; });
  var conf = countBy(pts, 2), learn = countBy(pts, 1);
  var p2 = pts.filter(function (p) { return p.p2; }).length;
  var examMarks = EXAMQS.reduce(function (n, q) {
    return n + q.parts.reduce(function (m, p) { return m + p.marks; }, 0);
  }, 0);

  var h = '<h1>The whole Edexcel IGCSE Physics course</h1>' +
    '<p class="lede">All eight sections of the Pearson Edexcel International GCSE Physics specification (4PH1), ' +
    'with every learning objective, an explanation of what it actually means, the equations, the core practicals ' +
    'and the definitions. Tick points off as you learn them and your progress is saved in this browser.</p>' +
    '<div class="stats">' +
      '<div class="stat"><div class="v">' + pts.length + '</div><div class="k">Spec points</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--good)">' + conf + '</div><div class="k">Confident</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--warn)">' + learn + '</div><div class="k">Still learning</div></div>' +
      '<div class="stat"><div class="v">' + EQUATIONS.length + '</div><div class="k">Equations</div></div>' +
      '<div class="stat"><div class="v">' + PRACTICALS.length + '</div><div class="k">Core practicals</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--p2)">' + p2 + '</div><div class="k">Physics only</div></div>' +
      '<div class="stat"><div class="v">' + QUESTIONS.length + '</div><div class="k">Quiz questions</div></div>' +
      '<div class="stat"><div class="v">' + examMarks + '</div><div class="k">Exam marks</div></div>' +
      '<div class="stat"><div class="v">' + GLOSSARY.length + '</div><div class="k">Definitions</div></div>' +
    '</div>' +
    '<h2>Start here</h2><div id="nextUp"></div>' +
    '<h2>Sections</h2><div class="grid" id="secGrid"></div>' +
    '<h2>How the exam works</h2>' +
    '<div class="row"><div class="rt">Paper 1 · 2 hours · 110 marks · 61.1%</div>' +
      '<div class="rw">Covers all the non-bold content from sections 1 to 8. Short answers, calculations and ' +
      'extended writing.</div></div>' +
    '<div class="row"><div class="rt">Paper 2 · 1 hour 15 minutes · 70 marks · 38.9%</div>' +
      '<div class="rw">Targets the <span class="pill p2">Physics only</span> content shown in bold in the ' +
      'specification, and can also draw on anything from Paper 1. Points carrying that tag in this app are the ' +
      'ones to prioritise for Paper 2.</div></div>' +
    '<div class="row"><div class="rt">No formula sheet</div>' +
      '<div class="rw">Plan to recall every equation in the Equations tab from memory, including the rearrangements. ' +
      'Check the front page of your most recent past paper to confirm what your series provides.</div></div>';

  view.innerHTML = h;
  renderNextUp(document.getElementById('nextUp'));

  var grid = document.getElementById('secGrid');
  SPEC.sections.forEach(function (sec) {
    var sp = sectionPoints(sec);
    var d = countBy(sp, 2);
    var pct = Math.round(d / sp.length * 100);
    var st = statsFor(sec.id);
    var card = el(
      '<button class="sec-card" style="border-top:3px solid ' + secColour(sec) + '">' +
        '<span class="num" style="color:' + secColour(sec) + '">SECTION ' + sec.id + '</span>' +
        '<span class="ttl">' + esc(sec.title) + '</span>' +
        '<span class="sub">' + sp.length + ' spec points · ' + sec.topics.length + ' topics</span>' +
        track(pct, secColour(sec)) +
        '<span class="foot"><span>' + pct + '% confident</span>' +
          '<span>' + (st.attempted
            ? Math.round(st.pct * 100) + '% scored'
            : d + '/' + sp.length) + '</span></span>' +
      '</button>');
    card.onclick = function () { go('home', sec.id); };
    grid.appendChild(card);
  });
}

/* Turns the section ranking into a concrete next action. */
function renderNextUp(host) {
  if (!host) return;
  var ranked = rankedSections();
  var top = ranked.slice(0, 3);
  var totalAttempted = SPEC.sections.reduce(function (n, s) { return n + statsFor(s.id).attempted; }, 0);

  host.innerHTML = '<p class="lede" style="margin:0 0 12px">' +
    (totalAttempted === 0
      ? 'Nothing tracked yet — this is ordered by the checklist alone. Answer some quiz questions or drills and it will start using how you actually score.'
      : 'Ranked by how much work each section still needs, from ' + totalAttempted +
        ' recorded attempts alongside the checklist.') +
    '</p><div class="nextgrid"></div>' +
    '<div class="btnrow"><button class="btn" id="goWeak">Quiz my weak spots</button>' +
    '<button class="btn ghost" id="goDrill">Practise calculations</button></div>';

  var g = host.querySelector('.nextgrid');
  top.forEach(function (r, i) {
    var sec = SPEC.sections.filter(function (s) { return s.id === r.id; })[0];
    var why = r.untested
      ? (r.ticked > 0.5 ? 'ticked off but never tested' : 'barely started')
      : Math.round(r.st.pct * 100) + '% scored from ' + r.st.attempted + ' attempts';
    var b = el('<button class="nextcard">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="nb"><b style="color:' + secColour(sec) + '">' + sec.id + '. ' + esc(sec.title) + '</b>' +
      '<i>' + esc(why) + '</i></span></button>');
    b.onclick = function () { go('home', sec.id); };
    g.appendChild(b);
  });

  host.querySelector('#goWeak').onclick = function () {
    qz.filter = 'weak'; dealQuiz(); go('quiz');
  };
  host.querySelector('#goDrill').onclick = function () {
    dr.filter = 'all'; dr.drill = null; nextDrill(); go('drills');
  };
}

function viewSection(id) {
  var sec = SPEC.sections.filter(function (s) { return s.id === id; })[0];
  if (!sec) return go('home');
  var sp = sectionPoints(sec);
  var pct = Math.round(countBy(sp, 2) / sp.length * 100);

  view.innerHTML =
    '<button class="backlink" id="back">← All sections</button>' +
    '<h1 style="color:' + secColour(sec) + '">' + sec.id + '. ' + esc(sec.title) + '</h1>' +
    '<p class="lede">' + esc(sec.blurb) + '</p>' +
    track(pct, secColour(sec)) +
    '<p style="font-size:12px;color:var(--dim);margin:7px 0 6px">' + countBy(sp, 2) + ' of ' + sp.length +
    ' points marked confident · ' + countBy(sp, 1) + ' still learning</p>' +
    (function () {
      var st = statsFor(sec.id);
      if (!st.attempted) return '<p style="font-size:12px;color:var(--dim2);margin:0 0 24px">' +
        'No quiz, drill or exam attempts recorded for this section yet.</p>';
      return '<p style="font-size:12px;color:var(--dim2);margin:0 0 24px">Scored ' +
        st.correct + ' of ' + st.attempted + ' (' + Math.round(st.pct * 100) +
        '%) across quiz questions, drills and self-marked exam answers.</p>';
    })() +
    '<div id="topics"></div>';

  document.getElementById('back').onclick = function () { go('home'); };
  var wrap = document.getElementById('topics');

  sec.topics.forEach(function (top) {
    var box = el('<div class="topic"><div class="topic-h"><span class="tid">' + top.id +
      '</span><span class="tname">' + esc(top.title) + '</span></div></div>');
    top.points.forEach(function (p) { box.appendChild(pointNode(p, sec)); });
    wrap.appendChild(box);
  });
}

function diagramsFor(ref) {
  return DIAGRAMS.filter(function (d) { return d.points.indexOf(ref) > -1; });
}
function diagramHTML(d) {
  return '<figure class="dgwrap"><figcaption class="dgt">' + esc(d.title) + '</figcaption>' +
    d.svg + '<p class="dgc">' + esc(d.caption) + '</p></figure>';
}

function pointNode(p, sec) {
  var st = statusOf(p.n);
  var tags = '';
  if (p.p2) tags += '<span class="pill p2">Physics only</span> ';
  if (p.cp) tags += '<span class="pill cp">Core practical</span> ';
  if (p.eq) tags += '<span class="pill eq">Equation</span> ';
  if (diagramsFor(p.n).length) tags += '<span class="pill dg">Diagram</span> ';

  var node = el(
    '<div class="pt' + (st ? ' s' + st : '') + '">' +
      '<div class="pt-h">' +
        '<span class="ref">' + p.n + '</span>' +

    '</div>');

  node.querySelector('.pt-h').onclick = function () { node.classList.toggle('open'); };

    var cur = statusOf(p.n);
    for (var i = 0; i < btns.length; i++) {

    }

    ? 'Drawn from sections ' + weakSections(3).join(', ') + ' — the three where you have marked the fewest points confident.'
    : 'You will get ' + Math.min(10, pool.length) + ' of them, shuffled.';

function poolFor(f) {
  if (f === 'all') return QUESTIONS;
  if (f === 'weak') {
    var w = weakSections(3);
    return QUESTIONS.filter(function (q) { return w.indexOf(q.s) > -1; });
  }
  return QUESTIONS.filter(function (q) { return q.s === f; });

function dealQuiz() {
  qz.deck = shuffle(poolFor(qz.filter)).slice(0, 10);

function drawQ() {
  var body = document.getElementById('qzBody');

  if (qz.i >= qz.deck.length) {
    var pct = Math.round(qz.score / qz.deck.length * 100);
    var msg = pct >= 80 ? 'Strong. Move on to the next section.'
            : pct >= 50 ? 'Getting there. Re-read the points you missed.'
            : 'Go back over this section before trying again.';
    body.innerHTML = '<div class="row" style="text-align:center;padding:30px">' +
      '<div class="score" style="color:' + (pct >= 80 ? 'var(--good)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)') + '">' +
      qz.score + '/' + qz.deck.length + '</div><div class="rw">' + msg + '</div>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn" id="retry">New quiz</button></div></div>';

  body.innerHTML =
    '<div class="qbar"><span>Question ' + (qz.i + 1) + ' of ' + qz.deck.length + '</span>' +
    '<span style="color:' + secColour(sec) + '">Section ' + sec.id + ' · Score ' + qz.score + '</span></div>' +
    '<div class="qtext">' + esc(q.q) + '</div>' +
    '<div id="opts">' + q.o.map(function (o, k) {
      return '<button class="opt" data-k="' + k + '">' + esc(o) + '</button>';
    }).join('') + '</div><div id="fb"></div>';

  var opts = body.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].onclick = function () {
      if (qz.answered) return;

      if (k === q.a) qz.score++;

      for (var j = 0; j < opts.length; j++) {

    };
  }
}

var dr = { filter:'all', drill:null, cur:null, done:0, right:0, streak:0, best:0, checked:false };

function viewDrills() {
  view.innerHTML = '<h1>Calculation drills</h1>' +
    '<p class="lede">Fresh numbers every time, so you cannot memorise the answer. Work it out on paper the way ' +

  chipRow('drChips', dr.filter, function (v) { dr.filter = v; dr.drill = null; nextDrill(); viewDrills(); });
  if (!dr.cur) nextDrill();
  drawDrill();
}
function drillPool() {
  return dr.filter === 'all' ? DRILLS : DRILLS.filter(function (d) { return d.s === dr.filter; });
}
function nextDrill() {
  var pool = drillPool();
  if (!pool.length) { dr.cur = null; return; }
  dr.drill = pool[Math.floor(Math.random() * pool.length)];
  dr.cur = dr.drill.gen();
  dr.checked = false;
}
function drawDrill() {
  var body = document.getElementById('drBody');
  if (!body || !dr.cur) return;
  var d = dr.drill, g = dr.cur;
  var sec = SPEC.sections.filter(function (s) { return s.id === d.s; })[0];

  body.innerHTML =
    '<div class="qbar" style="max-width:640px"><span>Answered ' + dr.done + ' · correct ' + dr.right +
      '</span><span>Streak ' + dr.streak + ' · best ' + dr.best + '</span></div>' +
    '<div class="row" style="max-width:640px">' +
      '<div class="rt"><span class="mono" style="color:' + secColour(sec) + '">S' + d.s + '</span> ' +
        esc(d.name) + (d.p2 ? ' <span class="pill p2">Physics only</span>' : '') + '</div>' +
      '<code class="eqf" style="display:inline-block;margin:6px 0 12px">' + esc(d.eq) + '</code>' +
      '<table class="given">' + g.given.map(function (row) {
        return '<tr><td>' + esc(row[0]) + '</td><td class="mono">' + esc(String(row[1])) + ' ' + esc(row[2]) + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="askrow"><label for="drIn">Calculate the ' + esc(g.ask[0]) +
        ' <span class="mono">(' + esc(g.ask[1]) + ')</span></label>' +
        '<input id="drIn" type="text" inputmode="decimal" autocomplete="off" placeholder="your answer"/></div>' +
      '<div class="btnrow"><button class="btn" id="drCheck">Check</button>' +
        '<button class="btn ghost" id="drSkip">Skip</button></div>' +
      '<div id="drFb"></div>' +
    '</div>';

  var input = document.getElementById('drIn');
  input.focus();
  input.onkeydown = function (e) { if (e.key === 'Enter') check(); };
  document.getElementById('drCheck').onclick = check;
  document.getElementById('drSkip').onclick = function () { nextDrill(); drawDrill(); };

  function check() {
    if (dr.checked) return;
    var raw = input.value.trim().replace(/,/g, '');
    var val = Number(raw);
    if (raw === '' || !isFinite(val)) { toast('Type a number first'); return; }
    dr.checked = true;
    dr.done++;
    var tol = Math.max(Math.abs(g.ans) * 0.01, 1e-9);
    var ok = Math.abs(val - g.ans) <= tol;
    if (ok) { dr.right++; dr.streak++; if (dr.streak > dr.best) dr.best = dr.streak; }
    else dr.streak = 0;
    record(d.s, 'd', ok ? 1 : 0, 1);

    input.disabled = true;
    input.className = ok ? 'ok' : 'no';
    document.getElementById('drFb').innerHTML =
      '<div class="expl" style="border-left-color:' + (ok ? 'var(--good)' : 'var(--bad)') + '">' +
        '<b>' + (ok ? 'Correct. ' : 'Not quite — the answer is ' + fmt(g.ans) + ' ' + esc(g.ask[1]) + '. ') + '</b>' +
        '<pre class="work">' + esc(g.work) + '</pre></div>';
    var btn = document.getElementById('drCheck');
    btn.textContent = 'Next question';
    btn.onclick = function () { nextDrill(); drawDrill(); };
  }
}
function fmt(x) {
  var a = Math.abs(x);
  if (a !== 0 && (a < 0.001 || a >= 1e6)) return x.toExponential(2);
  return String(Number(x.toPrecision(3)));
}

/* Ranks sections by how much work they still need. Measured performance (quiz,
   drills, self-marked exam questions) is the better signal, so it is weighted
   twice as heavily as the self-ticked checklist. Sections you have never
   attempted score as unknown rather than as perfect, so they surface too. */
function sectionNeed(sec) {
  var sp = sectionPoints(sec);
  var ticked = countBy(sp, 2) / sp.length;
  var st = statsFor(sec.id);
  if (st.attempted < 4) return { id:sec.id, need:1 - ticked * 0.5, untested:true, ticked:ticked, st:st };
  return { id:sec.id, need:1 - (ticked + 2 * st.pct) / 3, untested:false, ticked:ticked, st:st };
}
function rankedSections() {
  return SPEC.sections.map(sectionNeed).sort(function (a, b) { return b.need - a.need; });
}
function weakSections(n) {
  return rankedSections().slice(0, n || 3).map(function (x) { return x.id; });
}

function chipRow(id, current, onPick, extra) {
  var wrap = document.getElementById(id);
  if (!wrap) return;
  var items = [{ v:'all', label:'All sections' }].concat(extra || []).concat(SPEC.sections.map(function (s) {
    return { v:s.id, label:s.id + '. ' + s.title };
  }));
  items.forEach(function (it) {
    var b = el('<button' + (it.v === current ? ' class="on"' : '') + '>' + esc(it.label) + '</button>');
    b.onclick = function () { onPick(it.v); };
    wrap.appendChild(b);
  });
}

/* ---------- search ---------- */
function viewSearch(term) {
  var q = term.trim().toLowerCase();
  var hits = [];

  allPoints().forEach(function (x) {
    var hay = (x.p.n + ' ' + x.p.t + ' ' + (x.p.note || '') + ' ' + (x.p.eq || '')).toLowerCase();
    if (hay.indexOf(q) > -1) {
      hits.push({ kind:'Spec point ' + x.p.n + ' · Section ' + x.sec.id, body:x.p.t, sec:x.sec.id, colour:secColour(x.sec) });
    }
  });
  EQUATIONS.forEach(function (e) {
    if ((e.name + ' ' + e.eq + ' ' + e.words).toLowerCase().indexOf(q) > -1) {
      hits.push({ kind:'Equation · Section ' + e.s, body:e.name + ' — ' + e.eq, tab:'equations' });
    }
  });
  GLOSSARY.forEach(function (g) {
    if ((g.term + ' ' + g.def).toLowerCase().indexOf(q) > -1) {
      hits.push({ kind:'Definition · Section ' + g.s, body:g.term + ' — ' + g.def, tab:'glossary' });
    }
  });
  PRACTICALS.forEach(function (p) {
    if ((p.title + ' ' + p.aim + ' ' + p.method.join(' ') + ' ' + p.errors).toLowerCase().indexOf(q) > -1) {
      hits.push({ kind:'Core practical ' + p.ref, body:p.title, tab:'practicals' });
    }
  });
  EXAMQS.forEach(function (x) {
    x.parts.forEach(function (part) {
      if ((part.q + ' ' + part.ms.join(' ') + ' ' + part.tip).toLowerCase().indexOf(q) > -1) {
        hits.push({ kind:'Exam question · Section ' + x.s + ' · ' + x.title,
                    body:part.q + '  [' + part.marks + ']', tab:'exam' });
      }
    });
  });
  TECHNIQUE.commands.forEach(function (c) {
    if ((c.w + ' ' + c.m + ' ' + c.e).toLowerCase().indexOf(q) > -1) {
      hits.push({ kind:'Command word', body:c.w + ' — ' + c.m, tab:'technique' });
    }
  });
  TECHNIQUE.traps.concat(TECHNIQUE.graphs, TECHNIQUE.calcSteps).forEach(function (t) {
    if ((t.t + ' ' + t.d).toLowerCase().indexOf(q) > -1) {
      hits.push({ kind:'Exam technique', body:t.t + ' — ' + t.d, tab:'technique' });
    }
  });

  var h = '<h1>Search</h1><p class="lede">' + hits.length + ' result' + (hits.length === 1 ? '' : 's') +
    ' for “' + esc(term) + '”.</p>';
  if (!hits.length) h += '<div class="empty">Nothing matched. Try a shorter word, such as “momentum” or “half-life”.</div>';
  view.innerHTML = h;

  hits.slice(0, 80).forEach(function (hit) {
    var node = el('<div class="hit"><div class="hk"' + (hit.colour ? ' style="color:' + hit.colour + '"' : '') +
      '>' + esc(hit.kind) + '</div><div class="hb">' + mark(hit.body, q) + '</div></div>');
    node.onclick = function () {
      if (hit.sec) go('home', hit.sec); else go(hit.tab);
    };
    view.appendChild(node);
  });
}
function mark(text, q) {
  var s = esc(text);
  var i = s.toLowerCase().indexOf(q);
  if (i < 0) return s;
  return s.slice(0, i) + '<mark>' + s.slice(i, i + q.length) + '</mark>' + s.slice(i + q.length);
}

/* ---------- wiring ---------- */
searchEl.addEventListener('input', function () {
  var v = searchEl.value;
  if (v.trim().length < 2) {
    renderTabs();
    render();
  } else {
    tabsEl.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
    viewSearch(v);
  }
});
document.getElementById('themeBtn').onclick = function () {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  save(); applyTheme(); render();
};
document.getElementById('resetBtn').onclick = function () {
  if (!confirm('Clear the syllabus checklist and every recorded quiz, drill and exam score? This cannot be undone.')) return;
  state.progress = {};
  state.stats = {};
  save(); render();
  toast('Progress cleared');
};

/* Keyboard shortcuts. Ignored while the user is typing in a field. */
document.addEventListener('keydown', function (e) {
  var t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === '/') { e.preventDefault(); searchEl.focus(); return; }
  if (e.key === '?') { e.preventDefault(); toggleHelp(); return; }

  if (route.tab === 'quiz' && qz.running) {
    if (e.key >= '1' && e.key <= '4' && !qz.answered) {
      var opt = view.querySelectorAll('.opt')[Number(e.key) - 1];
      if (opt) { e.preventDefault(); opt.click(); }
    } else if ((e.key === 'Enter' || e.key === ' ') && qz.answered) {
      var nx = document.getElementById('nx');
      if (nx) { e.preventDefault(); nx.click(); }
    }
  }

  if (route.tab === 'cards') {
    if (e.key === ' ' || e.key === 'Enter') {
      var card = document.getElementById('card');
      if (card) { e.preventDefault(); card.click(); }
    } else if (fc.flipped && (e.key === 'ArrowRight' || e.key === 'y')) {
      var yes = document.getElementById('yes'); if (yes) yes.click();
    } else if (fc.flipped && (e.key === 'ArrowLeft' || e.key === 'n')) {
      var no = document.getElementById('no'); if (no) no.click();
    }
  }
});

function toggleHelp() {
  var open = document.getElementById('helpbox');
  if (open) { open.remove(); return; }
  var box = el('<div id="helpbox"><div class="hpanel">' +
    '<div class="hh">Keyboard shortcuts</div>' +
    '<dl>' +
      '<dt>/</dt><dd>focus search</dd>' +
      '<dt>1 – 4</dt><dd>answer the current quiz question</dd>' +
      '<dt>Enter</dt><dd>next question · check a drill answer</dd>' +
      '<dt>Space</dt><dd>flip the current flashcard</dd>' +
      '<dt>← / →</dt><dd>flashcard: not yet / knew it</dd>' +
      '<dt>?</dt><dd>show or hide this list</dd>' +
    '</dl></div></div>');
  box.onclick = function () { box.remove(); };
  document.body.appendChild(box);
}

window.addEventListener('hashchange', applyRoute);
applyTheme();
applyRoute();

})();
</script>
</body>
