<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>IGCSE Physics · Edexcel 4PH1 Study App</title>
<meta name="description" content="A revision app covering the whole Pearson Edexcel International GCSE Physics (4PH1) specification: syllabus checklist, equations, core practicals, definitions, flashcards and quizzes."/>
<meta name="theme-color" content="#0b1016"/>
<style>
:root{
  --bg:#0b1016; --bg2:#111923; --card:#141e2a; --card2:#18242f;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --ink:#e9f2f6; --dim:#9db0bd; --dim2:#6c8393;
  --acc:#5ef2d6; --acc2:#7effc0; --warn:#ffcf6a; --bad:#ff7d92; --p2:#b79bff;
  --good:#57e6a8;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --sh:0 10px 34px rgba(0,0,0,.34);
}
html[data-theme="light"]{
  --bg:#f4f7fa; --bg2:#ffffff; --card:#ffffff; --card2:#f0f4f8;
  --line:rgba(10,25,40,.12); --line2:rgba(10,25,40,.24);
  --ink:#12212e; --dim:#4a6376; --dim2:#6f8496;
  --acc:#0d9b84; --acc2:#0b8a5f; --warn:#b57500; --bad:#c53b56; --p2:#6f4bd8;
  --good:#0e9463;
  --sh:0 8px 26px rgba(20,40,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.55;
  padding-bottom:40px}
button,input,select{font-family:inherit;color:inherit}
b{font-weight:650}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:30;background:var(--bg2);
  border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(0,0,0,.16)}
.hdr-in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:22px;line-height:1}
.btxt{display:flex;flex-direction:column;line-height:1.2}
.btxt b{font-size:15px;letter-spacing:.2px}
.btxt i{font-style:normal;font-size:11px;color:var(--dim2);letter-spacing:.6px}
.hdr-prog{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
.hdr-prog .track{flex:1;min-width:70px}
.hdr-tools{display:flex;align-items:center;gap:8px}
#search{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;font-size:13px;width:210px;outline:none;transition:.15s}
#search:focus{border-color:var(--acc);width:250px}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--dim);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.15s;flex:none}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}

#tabs{max-width:1080px;margin:0 auto;padding:0 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;
  font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap;transition:.15s}
#tabs button:hover{color:var(--ink)}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 18px 10px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.1px}
h3{font-size:14px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:1.4px;font-weight:650}
.lede{color:var(--dim);font-size:14px;margin:0 0 20px;max-width:70ch}
.track{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.track>i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .35s}
.mono{font-family:var(--mono)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;vertical-align:middle}
.pill.p2{color:var(--p2)} .pill.cp{color:var(--warn)} .pill.eq{color:var(--acc)}
.empty{color:var(--dim2);font-size:14px;padding:28px 0;text-align:center}

/* ---------- home / section grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.sec-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  cursor:pointer;transition:.16s;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.sec-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.sec-card .num{font-family:var(--mono);font-size:11px;letter-spacing:1.4px;opacity:.85}
.sec-card .ttl{font-size:15.5px;font-weight:650;line-height:1.3}
.sec-card .sub{font-size:12px;color:var(--dim2)}
.sec-card .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin:0 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}

/* ---------- spec points ---------- */
.topic{margin:0 0 20px}
.topic-h{display:flex;align-items:baseline;gap:9px;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.topic-h .tid{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.topic-h .tname{font-size:14.5px;font-weight:650}
.pt{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden;transition:.15s}
.pt.s1{border-left:3px solid var(--warn)}
.pt.s2{border-left:3px solid var(--good)}
.pt-h{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;cursor:pointer}
.pt-h:hover{background:var(--card2)}
.pt .ref{font-family:var(--mono);font-size:11.5px;color:var(--dim2);flex:none;min-width:34px;padding-top:2px}
.pt .obj{flex:1;font-size:14px;min-width:0}
.pt .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pt .caret{color:var(--dim2);font-size:11px;flex:none;padding-top:3px;transition:.2s}
.pt.open .caret{transform:rotate(90deg)}
.pt-b{display:none;padding:0 13px 13px 58px;font-size:13.5px;color:var(--dim);border-top:1px solid var(--line);
  padding-top:11px;margin-top:0}
.pt.open .pt-b{display:block}
.pt-b .eqbox{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 10px;display:block;overflow-x:auto}
.status{display:flex;gap:5px;margin-top:11px}
.status button{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
  background:none;color:var(--dim2);cursor:pointer;transition:.15s}
.status button:hover{border-color:var(--line2);color:var(--ink)}
.status button.on{font-weight:650}
.status button[data-v="1"].on{color:var(--warn);border-color:var(--warn)}
.status button[data-v="2"].on{color:var(--good);border-color:var(--good)}
.status button[data-v="0"].on{color:var(--ink);border-color:var(--line2)}

/* ---------- generic cards ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:0 0 8px}
.row .rt{font-size:14px;font-weight:650;margin:0 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .rw{font-size:13px;color:var(--dim)}
.row .rq{font-size:11.5px;color:var(--dim2);margin-top:5px}
.eqrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eqrow .eqf{font-family:var(--mono);font-size:15px;color:var(--acc);background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:6px 11px;white-space:nowrap}
.prac ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--dim)}
.prac ol li{margin:0 0 5px}
.prac .meta{font-size:12.5px;color:var(--dim2);margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.prac .meta b{color:var(--dim)}

/* ---------- quiz ---------- */
.qwrap{max-width:640px}
.qbar{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:0 0 10px}
.qtext{font-size:16.5px;font-weight:600;margin:0 0 16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;margin:0 0 8px;font-size:14px;cursor:pointer;transition:.14s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.expl{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--dim);margin:12px 0 0}
.btn{background:var(--acc);color:#04120f;border:0;border-radius:10px;padding:9px 18px;
  font-size:13.5px;font-weight:650;cursor:pointer;transition:.14s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
  font-size:12.5px;color:var(--dim);cursor:pointer;transition:.14s}
.chips button:hover{color:var(--ink);border-color:var(--line2)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#04120f;font-weight:650}
.score{font-size:44px;font-weight:700;line-height:1;margin:0 0 4px}

/* ---------- flashcards ---------- */
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px 26px;
  min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;box-shadow:var(--sh);max-width:640px}
.fc .side{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim2);margin-bottom:14px}
.fc .term{font-size:23px;font-weight:650;line-height:1.3}
.fc .def{font-size:15.5px;color:var(--dim);line-height:1.6;max-width:52ch}
.fc .hint{font-size:11.5px;color:var(--dim2);margin-top:18px}

/* ---------- exam-style questions ---------- */
.exq .ctx{font-size:13.5px;color:var(--dim);background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;margin:6px 0 12px}
.part{border-top:1px solid var(--line);padding:11px 0 3px}
.part:first-child{border-top:0}
.pq{display:flex;gap:9px;font-size:14px;align-items:baseline}
.pq .pl{font-weight:650;color:var(--dim);flex:none}
.pq .mk{color:var(--dim2);font-family:var(--mono);font-size:12px;margin-left:7px;white-space:nowrap}
.part .reveal{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 11px;
  font-size:11.5px;color:var(--dim2);cursor:pointer;margin:8px 0 0 28px;transition:.14s}
.part .reveal:hover{color:var(--ink);border-color:var(--line2)}
.part .ans{display:none;margin:10px 0 4px 28px}
.part.open .ans{display:block}
.part .ans ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--dim)}
.part .ans ul li{margin:0 0 5px}
.part .tip{font-size:12.5px;color:var(--dim2);background:var(--card2);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;margin-top:10px}
.part .tip b{color:var(--dim)}

/* ---------- drills ---------- */
table.given{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13.5px}
table.given td{padding:6px 0;border-bottom:1px solid var(--line);color:var(--dim)}
table.given td:last-child{text-align:right;color:var(--ink);white-space:nowrap}
.askrow label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}
.askrow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;font-size:16px;font-family:var(--mono);outline:none;transition:.15s}
.askrow input:focus{border-color:var(--acc)}
.askrow input.ok{border-color:var(--good)} .askrow input.no{border-color:var(--bad)}
pre.work{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:pre-wrap;
  margin:8px 0 0;line-height:1.7}

/* ---------- technique tables ---------- */
table.conv{width:100%;border-collapse:collapse;font-size:13.5px}
table.conv th{text-align:left;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim2);font-weight:650;padding:0 10px 7px 0;border-bottom:1px solid var(--line2)}
table.conv td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);color:var(--dim)}
table.conv td:last-child{color:var(--acc);white-space:nowrap}
ol.tech{margin:0;padding-left:20px;font-size:13.5px;color:var(--dim)}
ol.tech li{margin:0 0 7px}

/* ---------- next up ---------- */
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin:0 0 4px}
.nextcard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;color:inherit}
.nextcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.nextcard .rank{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--dim2);flex:none;width:20px}
.nextcard .nb{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.nextcard .nb b{font-size:13.5px}
.nextcard .nb i{font-style:normal;font-size:11.5px;color:var(--dim2)}

/* ---------- exam self-marking ---------- */
.selfmark{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;
  border-top:1px solid var(--line);padding-top:11px}
.selfmark span{font-size:12px;color:var(--dim2);margin-right:2px}
.selfmark button{min-width:30px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:var(--card2);color:var(--dim);font-size:12.5px;cursor:pointer;transition:.14s}
.selfmark button:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.selfmark button.on{background:var(--good);border-color:var(--good);color:#04120f;font-weight:700}
.selfmark button:disabled{opacity:.45;cursor:default}
.selfmark button.on:disabled{opacity:1}

/* ---------- keyboard help ---------- */
#helpbox{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:pointer}
#helpbox>*{pointer-events:none}
#helpbox .hpanel{background:var(--card);border:1px solid var(--line2);border-radius:14px;
  padding:20px 24px;box-shadow:var(--sh);max-width:90vw}
#helpbox .hh{font-size:13px;font-weight:650;margin-bottom:14px;letter-spacing:.3px;color:var(--ink)}
#helpbox dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
#helpbox dt{font-family:var(--mono);font-size:12px;color:var(--acc);white-space:nowrap}
#helpbox dd{margin:0;font-size:13px;color:var(--dim)}

.pill.dg{color:var(--dim)}

/* ---------- diagrams ---------- */
.dgwrap{background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;margin:0 0 12px;overflow-x:auto}
.dgwrap .dgt{font-size:12px;font-weight:650;margin:0 0 8px;color:var(--ink)}
.dgwrap .dgc{font-size:12px;color:var(--dim2);margin:8px 0 0;line-height:1.5}
svg.dg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
svg.dg .ax{stroke:var(--dim2);stroke-width:1.6}
svg.dg .dash{stroke:var(--dim2);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
svg.dg .c1{stroke:var(--warn);stroke-width:2.6;fill:none;stroke-linecap:round}
svg.dg .c2{stroke:var(--acc);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.dg .c3{stroke:var(--p2);stroke-width:2.6;fill:none;stroke-linecap:round}
svg.dg .c1t{fill:var(--warn)} svg.dg .c2t{fill:var(--acc)} svg.dg .c3t{fill:var(--p2)}
svg.dg .fill{fill:var(--acc);opacity:.14}
svg.dg .k{fill:var(--dim);font-size:11px;font-family:var(--font)}
svg.dg .k.dim{fill:var(--dim2)}
svg.dg .k.dark{fill:#10202c}
svg.dg .mid{text-anchor:middle} svg.dg .end{text-anchor:end}
svg.dg .lab{fill:var(--dim2);font-size:11.5px;text-anchor:middle;font-family:var(--font)}
svg.dg .pt{fill:var(--bad)}
svg.dg .arw{stroke:var(--dim);stroke-width:1.6;fill:none;marker-end:url(#ah)}
svg.dg .arw2{stroke:var(--acc);stroke-width:2.2;fill:none;marker-end:url(#ah-a)}
#defs{position:absolute}
#ah path{fill:var(--dim)}
#ah-a path{fill:var(--acc)}
#ah-w path{fill:var(--warn)}
svg.dg .tick{stroke:var(--acc);stroke-width:2}
svg.dg .block{fill:var(--acc);opacity:.10}
svg.dg .bnd{stroke:var(--dim);stroke-width:1.6}
svg.dg .ray{stroke:var(--warn);stroke-width:2.2;marker-end:url(#ah-w)}
svg.dg .arc{stroke:var(--dim2);stroke-width:1.2;fill:none}
svg.dg .wire,svg.dg .wire2{stroke:var(--dim);stroke-width:1.8;fill:none}
svg.dg .comp{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
svg.dg .cell{stroke:var(--ink);stroke-width:3} svg.dg .cell2{stroke:var(--ink);stroke-width:1.6}
svg.dg .sank-in{fill:var(--acc);opacity:.55}
svg.dg .sank-use{fill:var(--good);opacity:.6}
svg.dg .sank-waste{fill:var(--bad);opacity:.4}
svg.dg .mol{fill:var(--acc);opacity:.55}
svg.dg .magN{fill:var(--bad);opacity:.8} svg.dg .magS{fill:var(--acc);opacity:.8}
svg.dg .fl{stroke:var(--dim);stroke-width:1.3;fill:none}
svg.dg .core{fill:none;stroke:var(--dim2);stroke-width:14}
svg.dg .core-in{fill:none;stroke:var(--dim2);stroke-width:0}
svg.dg .coil{stroke:var(--warn);stroke-width:2.4;fill:none}
svg.dg .coil2{stroke:var(--acc);stroke-width:2.4;fill:none}
svg.dg .absorb{fill:var(--dim2);opacity:.55}
svg.dg .ray-a{stroke:var(--bad);stroke-width:2.6}
svg.dg .ray-b{stroke:var(--warn);stroke-width:2.6}
svg.dg .ray-g{stroke:var(--p2);stroke-width:2.6}
svg.dg .flow rect{fill:var(--card);stroke:var(--line2);stroke-width:1.4}
.dgtoggle{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 11px;
  font-size:11.5px;color:var(--dim2);cursor:pointer;transition:.14s;margin:0 0 10px}
.dgtoggle:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- search results ---------- */
.hit{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin:0 0 7px;
  cursor:pointer;transition:.14s}
.hit:hover{border-color:var(--line2)}
.hit .hk{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);margin-bottom:3px}
.hit .hb{font-size:13.5px}
mark{background:color-mix(in srgb,var(--acc) 32%,transparent);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- footer / toast ---------- */
#ftr{max-width:1080px;margin:34px auto 0;padding:18px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim2);line-height:1.6}
#ftr p{margin:0 0 7px;max-width:80ch}
.linkbtn{background:none;border:0;color:var(--dim2);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0}
.linkbtn:hover{color:var(--bad)}
/* Hidden rather than merely shifted off-screen, so the empty box is never painted. */
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--card);
  border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:13px;box-shadow:var(--sh);
  transition:transform .28s,opacity .28s,visibility .28s;z-index:60;pointer-events:none;
  opacity:0;visibility:hidden}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

<script>

SPEC.sections.push({
  id: 1,
  title: 'Forces and motion',
  colour: '#5ef2d6',
  blurb: 'Speed, acceleration, graphs of motion, Newton’s laws, weight, springs, momentum and moments. The biggest section on Paper 1 and the one most likely to carry long calculation questions.',
  topics: [

  { id:'1a', title:'Units', points:[
    { n:'1.1', t:'Use the following units: kilogram (kg), metre (m), metre/second (m/s), metre/second² (m/s²), newton (N), second (s), newton per kilogram (N/kg), kilogram metre/second (kg m/s).',
      note:'Marks are thrown away on units every year. Learn the unit that belongs to each quantity, and always convert to SI before substituting: km → m (×1000), g → kg (÷1000), minutes → s (×60), km/h → m/s (÷3.6).' }
  ]},

  { id:'1b', title:'Movement and position', points:[
    { n:'1.2', t:'Plot and interpret distance–time graphs.',
      note:'On a distance–time graph: gradient = speed. A flat line means stationary. A straight sloping line means constant speed. A curve that gets steeper means speeding up. To find speed at an instant on a curve, draw a tangent and take its gradient.' },
    { n:'1.3', t:'Know and use the relationship between average speed, distance moved and time.',
      eq:'average speed = distance moved ÷ time taken   (v = s / t)',
      note:'Average speed uses total distance over total time — not the average of the individual speeds. That trap appears in almost every paper that asks about a two-stage journey.' },
    { n:'1.4', t:'Describe experiments to investigate the motion of everyday objects such as toy cars or tennis balls.',
      cp:true,
      note:'Typical method: mark equal distances along a runway, release the trolley from rest, time it to each mark with light gates (more precise) or a stopwatch (has reaction-time error). Repeat and mean. Plot distance against time.' },
    { n:'1.5', t:'Know and use the relationship between acceleration, velocity and time.',
      eq:'acceleration = change in velocity ÷ time taken   (a = (v − u) / t)',
      note:'u is the initial velocity, v the final velocity. A negative acceleration means slowing down (deceleration) or accelerating in the negative direction. Units m/s².' },
    { n:'1.6', t:'Plot and interpret velocity–time graphs.',
      note:'On a velocity–time graph: gradient = acceleration, area under the line = distance travelled. A horizontal line means constant velocity (zero acceleration), not stationary. Do not confuse this with a distance–time graph — read the axis label first, every time.' },
    { n:'1.7', t:'Determine acceleration from the gradient of a velocity–time graph.',
      note:'Gradient = rise ÷ run = change in velocity ÷ change in time. Use a large triangle spanning most of the line for accuracy, and read values off gridlines.' },
    { n:'1.8', t:'Determine the distance travelled from the area between a velocity–time graph and the time axis.',
      note:'Split the shape into rectangles and triangles. Rectangle = v × t. Triangle = ½ × base × height. Trapezium = ½(a + b) × h. Add them up, and give the answer in metres.' },
    { n:'1.9', t:'Use the relationship between final speed, initial speed, acceleration and distance moved.',
      eq:'v² = u² + 2 × a × s',
      note:'Use this when time is not given and not asked for. Remember to square-root at the end — a very common lost mark. For an object dropped from rest, u = 0 so v² = 2as.' }
  ]},

  { id:'1c', title:'Forces, movement, shape and momentum', points:[
    { n:'1.10', t:'Describe the effects of forces between bodies such as changes in speed, shape or direction.',
      note:'A force can change an object’s speed, its direction of motion, or its shape. Forces always come in pairs between two bodies.' },
    { n:'1.11', t:'Identify different types of force such as gravitational or electrostatic.',
      note:'Contact forces: friction, air resistance, normal contact (reaction), tension, upthrust. Non-contact forces: gravitational, electrostatic, magnetic. Label force arrows with the type of force and what exerts it.' },
    { n:'1.12', t:'Distinguish between vector and scalar quantities.',
      note:'Vectors have magnitude and direction: force, weight, velocity, acceleration, momentum, displacement. Scalars have magnitude only: mass, speed, distance, time, energy, temperature. Learn two lists — this is a guaranteed easy mark.' },
    { n:'1.13', t:'Understand that force is a vector quantity.',
      note:'Because force has direction, forces in opposite directions subtract. Always define a positive direction before you start a calculation.' },
    { n:'1.14', t:'Find the resultant force of forces that act along a line.',
      note:'Same direction: add. Opposite directions: subtract, and the resultant acts in the direction of the larger force. Zero resultant means constant velocity (which includes staying still).' },
    { n:'1.15', t:'Understand that friction is a force that opposes motion.',
      note:'Friction acts between surfaces sliding over each other; drag or air resistance is friction with a fluid and increases with speed. Friction transfers kinetic energy to the thermal energy store.' },
    { n:'1.16', t:'Know and use the relationship between unbalanced force, mass and acceleration.',
      eq:'force = mass × acceleration   (F = m × a)',
      note:'F here is the resultant (unbalanced) force. Newton’s second law. If the resultant force is zero the object stays at rest or keeps moving at constant velocity (Newton’s first law).' },
    { n:'1.17', t:'Know and use the relationship between weight, mass and gravitational field strength.',
      eq:'weight = mass × gravitational field strength   (W = m × g)',
      note:'Mass in kg is the amount of matter and never changes. Weight in N is a force and changes with g. On Earth g ≈ 10 N/kg (the paper will state the value to use).' },
    { n:'1.18', t:'Know that the stopping distance of a vehicle is made up of the sum of the thinking distance and the braking distance.',
      eq:'stopping distance = thinking distance + braking distance',
      note:'Thinking distance is travelled during the driver’s reaction time. Braking distance is travelled while the brakes act.' },
    { n:'1.19', t:'Describe the factors affecting vehicle stopping distance, including speed, mass, road condition and reaction time.',
      note:'Thinking distance increases with speed, tiredness, alcohol, drugs, distraction. Braking distance increases with speed (it goes up with v²), greater mass, worn brakes or tyres, and wet or icy roads.' },
    { n:'1.20', t:'Describe the forces acting on falling objects and explain why falling objects reach a terminal velocity.',
      note:'At release, weight > drag, so the object accelerates. As speed rises, drag rises. When drag = weight the resultant force is zero, acceleration is zero, and the object falls at a constant terminal velocity. Say "resultant force becomes zero" — not "the forces cancel out and it stops".' },
    { n:'1.21', t:'Describe experiments to investigate the forces acting on falling objects, such as sycamore seeds or parachutes.',
      cp:true,
      note:'Drop paper cake cases from a fixed height, timing the fall over the lower part of the drop where velocity is constant. Vary the number of cases (which varies weight) and plot terminal velocity against weight.' },
    { n:'1.22', t:'Practical: investigate how extension varies with applied force for helical springs, metal wires and rubber bands.',
      cp:true,
      note:'Clamp the spring, measure the unstretched length, add masses one at a time, measure the new length each time. Extension = stretched length − original length. Plot force (y) against extension (x); the gradient is the spring constant. Wear eye protection and place a mat under the masses.' },
    { n:'1.23', t:'Know that the initial linear region of a force–extension graph is associated with Hooke’s law.',
      eq:'force = spring constant × extension   (F = k × x)',
      note:'Hooke’s law: extension is directly proportional to force, provided the limit of proportionality is not exceeded. On the graph this is the straight line through the origin; beyond the limit of proportionality the line curves.' },
    { n:'1.24', t:'Describe elastic behaviour as the ability of a material to recover its original shape after the forces causing deformation have been removed.',
      note:'Elastic deformation reverses when the force is removed. Inelastic (plastic) deformation is permanent — the object stays stretched.' },
    { n:'1.25', t:'Know and use the relationship between momentum, mass and velocity.', p2:true,
      eq:'momentum = mass × velocity   (p = m × v)',
      note:'Units kg m/s. Momentum is a vector, so give opposite directions opposite signs before you add anything.' },
    { n:'1.26', t:'Use the idea of momentum to explain safety features.', p2:true,
      note:'Crumple zones, airbags, seat belts and helmets all increase the time taken for the momentum to change. Since force = change in momentum ÷ time, a longer time means a smaller force on the passenger, so less injury. Always link back to the equation.' },
    { n:'1.27', t:'Use the conservation of momentum to calculate the mass, velocity or momentum of objects.', p2:true,
      eq:'total momentum before = total momentum after',
      note:'Momentum is conserved in any collision or explosion where no external force acts. For objects that stick together: m₁u₁ + m₂u₂ = (m₁ + m₂)v. For an explosion starting at rest, total momentum stays zero, so the two pieces move apart with equal and opposite momentum.' },
    { n:'1.28', t:'Use the relationship between force, change in momentum and time taken.', p2:true,
      eq:'force = change in momentum ÷ time taken   (F = (mv − mu) / t)',
      note:'This is Newton’s second law written in terms of momentum. It is the same physics as F = ma.' },
    { n:'1.29', t:'Demonstrate an understanding of Newton’s third law.', p2:true,
      note:'When body A exerts a force on body B, B exerts an equal and opposite force on A. The pair act on different objects, are the same type of force, and are equal in size and opposite in direction — that is why they never cancel out.' },
    { n:'1.30', t:'Know and use the relationship between the moment of a force and its distance from the pivot.',
      eq:'moment = force × perpendicular distance from the pivot',
      note:'Units N m. The distance must be perpendicular to the line of action of the force — if the force is at an angle, this is a common trap.' },
    { n:'1.31', t:'Recall that the weight of a body acts through its centre of gravity.',
      note:'The centre of gravity is the single point where all the weight can be taken to act. For a uniform ruler that is at its midpoint.' },
    { n:'1.32', t:'Know and use the principle of moments for a simple system of parallel forces acting in one plane.',
      eq:'sum of clockwise moments = sum of anticlockwise moments',
      note:'True when the object is in equilibrium (balanced). Work out each moment as force × distance from the pivot, then set the two totals equal and solve.' },
    { n:'1.33', t:'Understand that the upward forces on a light beam, supported at its ends, vary with the position of a heavy object placed on the beam.',
      note:'Move the load towards one support and that support takes more of the weight. Take moments about one support to find the force at the other, then use the fact that the two upward forces add to the total weight.' }
  ]}

]});
</script>
<script>

SPEC.sections.push({
  id: 2,
  title: 'Electricity',
  colour: '#ffcf6a',
  blurb: 'Mains safety, power and energy, circuits, current and voltage rules, resistance, and the current–voltage behaviour of components. Heavy on circuit reasoning and on the V = I × R family of calculations.',
  topics: [

  { id:'2a', title:'Units', points:[
    { n:'2.1', t:'Use the following units: ampere (A), coulomb (C), joule (J), ohm (Ω), second (s), volt (V), watt (W).',
      note:'Current in A, charge in C, energy in J, resistance in Ω, potential difference in V, power in W. Watch for mA (÷1000) and kW (×1000).' }
  ]},

  { id:'2b', title:'Mains electricity', points:[
    { n:'2.2', t:'Understand and identify the hazards of electricity including frayed cables, long cables, damaged plugs, water around sockets, and pushing metal objects into sockets.',
      note:'Each hazard question wants the hazard plus why it is dangerous: exposed live wire → electric shock; water → water conducts, completing a circuit through the person; overloaded socket → overheating and fire.' },
    { n:'2.3', t:'Understand the uses of insulation, double insulation, earthing, fuses and circuit breakers in a range of domestic appliances.',
      note:'Earth wire gives a low-resistance path to ground if the live wire touches a metal case, so a large current flows and the fuse blows, cutting the supply. Double-insulated appliances have plastic cases and need no earth wire. Circuit breakers do the same job as fuses but switch off faster and can be reset.' },
    { n:'2.4', t:'Understand that a current in a resistor results in the electrical transfer of energy and an increase in temperature, and how this can be used in a variety of domestic contexts.',

    { n:'2.5', t:'Know and use the relationship between power, current and voltage, and apply the relationship to the selection of appropriate fuses.',
      eq:'power = current × voltage   (P = I × V)',
      note:'To choose a fuse: work out the normal operating current with I = P ÷ V, then pick the next fuse rating above it (usually 3 A, 5 A or 13 A).' },
    { n:'2.6', t:'Use the relationship between energy transferred, current, voltage and time.',
      eq:'energy transferred = current × voltage × time   (E = I × V × t)',
      note:'Time must be in seconds for the answer to be in joules. This is just P = IV multiplied by time.' },
    { n:'2.7', t:'Understand the difference between mains electricity being alternating current (a.c.) and direct current (d.c.) supplied by a cell or battery.',
      note:'d.c. flows in one direction only; a.c. constantly reverses direction. UK mains is about 230 V at 50 Hz. On an oscilloscope, d.c. is a flat horizontal line and a.c. is a wave.' }
  ]},

  { id:'2c', title:'Energy and potential difference in circuits', points:[
    { n:'2.8', t:'Explain why a series or parallel circuit is more appropriate for particular applications, including domestic lighting.',
      note:'Series: one switch controls everything, and if one lamp breaks they all go out. Parallel: each branch gets the full supply voltage, components can be switched separately, and one failure does not affect the rest — which is why house lighting is wired in parallel.' },
    { n:'2.9', t:'Understand that the current in a series circuit depends on the applied voltage and the number and nature of other components.',
      note:'Adding more resistors in series increases total resistance, so current falls. Adding resistors in parallel decreases total resistance, so total current rises.' },
    { n:'2.10', t:'Describe how current varies with voltage in wires, resistors, metal filament lamps and diodes, and how this can be investigated.',
      cp:true,
      note:'Resistor at constant temperature: straight line through origin (constant resistance). Filament lamp: S-shaped curve that flattens, because the filament heats up and resistance increases. Diode: no current until the forward voltage is reached, and almost no current in reverse.' },
    { n:'2.11', t:'Describe the qualitative effect of changing resistance on the current in a circuit.',
      note:'For a fixed supply voltage, more resistance means less current. A variable resistor is used to change the current in an experiment.' },
    { n:'2.12', t:'Describe the qualitative variation of resistance of light-dependent resistors (LDRs) with illumination and of thermistors with temperature.',
      note:'LDR: brighter light → lower resistance. Thermistor: higher temperature → lower resistance. Both are used as sensors in potential divider circuits, for example in a fire alarm or a street light.' },
    { n:'2.13', t:'Know that lamps and LEDs can be used to indicate the presence of a current in a circuit.',
      note:'LEDs use much less power than filament lamps and only conduct one way round.' },
    { n:'2.14', t:'Know and use the relationship between voltage, current and resistance.',
      eq:'voltage = current × resistance   (V = I × R)',
      note:'The single most used equation in this section. Rearranged: I = V ÷ R and R = V ÷ I.' },
    { n:'2.15', t:'Understand that current is the rate of flow of charge.',
      note:'One amp is one coulomb of charge passing a point per second.' },
    { n:'2.16', t:'Know and use the relationship between charge, current and time.',
      eq:'charge = current × time   (Q = I × t)',
      note:'Time in seconds, charge in coulombs.' },
    { n:'2.17', t:'Know that electric current in solid metallic conductors is a flow of negatively charged electrons.',
      note:'Conventional current is drawn from + to −, but the electrons actually drift from − to +. Say "delocalised" or "free" electrons.' },
    { n:'2.18', t:'Understand that the current in a series circuit is the same everywhere, and that the current from the source is the sum of the currents in the separate branches of a parallel circuit.',
      note:'Series: I is the same at every point. Parallel: currents split at a junction and add back together, so I_total = I₁ + I₂.' },
    { n:'2.19', t:'Know that the voltage across components in parallel is the same, and that the sum of the voltages across components in series is the supply voltage.',
      note:'Series: V_supply = V₁ + V₂ + … Parallel: every branch has the full supply voltage across it.' },
    { n:'2.20', t:'Know that voltage is the energy transferred per unit charge passed and that the volt is a joule per coulomb.',
      eq:'energy transferred = charge × voltage   (E = Q × V)',
      note:'One volt means one joule of energy transferred per coulomb of charge. A 12 V supply gives 12 J to every coulomb.' },
    { n:'2.21', t:'Know how to connect and use an ammeter and a voltmeter.',
      note:'Ammeter in series with the component, and it has very low resistance. Voltmeter in parallel across the component, and it has very high resistance so it draws almost no current.' }
  ]},

  { id:'2d', title:'Electric charge', points:[
    { n:'2.22', t:'Identify common materials which are electrical conductors or insulators, including metals and plastics.',
      note:'Conductors (metals, graphite) have free electrons. Insulators (plastic, rubber, glass) do not, so charge stays where it is put.' },
    { n:'2.23', t:'Practical: investigate how insulating materials can be charged by friction.',
      cp:true,
      note:'Rub a polythene rod with a dry cloth and it gains electrons, becoming negative; rub an acetate rod and it loses electrons, becoming positive. Only electrons move — never say protons moved.' },
    { n:'2.24', t:'Explain that charging by friction involves a transfer of electrons.',
      note:'Friction rubs electrons from one material onto the other. The one that gains electrons is negative, the one that loses them is positive by an equal amount.' },
    { n:'2.25', t:'Explain that objects with like charges repel and objects with unlike charges attract.',

    { n:'2.26', t:'Explain electrostatic phenomena in terms of the movement of electrons.',

    { n:'2.27', t:'Explain the potential dangers of electrostatic charges, e.g. when fuelling aircraft and tankers.',

    { n:'2.28', t:'Explain some uses of electrostatic charges, e.g. in photocopiers and inkjet printers.',
      note:'Inkjet printer: droplets are charged then deflected by charged plates to land in the right place. Photocopier: a charged drum attracts oppositely charged toner powder in the pattern of the image.' }
  ]}

<script>

  title: 'Waves',

  blurb: 'Wave properties and the wave equation, the electromagnetic spectrum, reflection and refraction, total internal reflection, and sound. Lots of ray diagrams — practise drawing them with a ruler.',
  topics: [

  { id:'3a', title:'Units', points:[
    { n:'3.1', t:'Use the following units: degree (°), hertz (Hz), metre (m), metre/second (m/s), second (s).',

  ]},

    { n:'3.2', t:'Explain the difference between longitudinal and transverse waves.',
      note:'Transverse: vibrations are perpendicular to the direction of energy transfer (light, all EM waves, water ripples, waves on a rope). Longitudinal: vibrations are parallel to the direction of energy transfer, giving compressions and rarefactions (sound, ultrasound, P-waves).' },
    { n:'3.3', t:'Know the definitions of amplitude, wavefront, frequency, wavelength and period of a wave.',
      note:'Amplitude: maximum displacement from the rest position. Wavelength: distance between two adjacent identical points, e.g. crest to crest. Frequency: number of complete waves passing a point per second. Period: time for one complete wave. Wavefront: a line joining points that are all in phase, e.g. a line of crests.' },
    { n:'3.4', t:'Know that waves transfer energy and information without transferring matter.',

    { n:'3.5', t:'Know and use the relationship between the speed, frequency and wavelength of a wave.',
      eq:'wave speed = frequency × wavelength   (v = f × λ)',
      note:'The most used equation in this section. Check units: Hz × m gives m/s.' },
    { n:'3.6', t:'Use the relationship between frequency and time period.',
      eq:'frequency = 1 ÷ time period   (f = 1 / T)',
      note:'A 0.02 s period gives a frequency of 50 Hz. Also useful for reading periods off oscilloscope traces.' },
    { n:'3.7', t:'Use the above relationships in different contexts including sound waves and electromagnetic waves.',
      note:'All EM waves travel at 3 × 10⁸ m/s in a vacuum. Sound travels at about 340 m/s in air, faster in liquids and faster still in solids.' },
    { n:'3.8', t:'Understand that waves can be diffracted when they pass an edge or through a gap.',

    { n:'3.9', t:'Understand that waves can be reflected and refracted at the boundary between two media.',
      note:'Reflection: the wave bounces back, angle of incidence = angle of reflection. Refraction: the wave changes speed and so changes direction when it enters a new medium at an angle.' },
    { n:'3.10', t:'Understand that waves can be refracted due to a change of speed, and that this may cause a change of direction.',
      note:'Entering a denser medium: the wave slows, the wavelength shortens, and the ray bends towards the normal. Leaving a denser medium: it speeds up and bends away from the normal. Frequency never changes during refraction.' }
  ]},

  { id:'3c', title:'The electromagnetic spectrum', points:[
    { n:'3.11', t:'Know that light is part of a continuous electromagnetic spectrum which includes radio, microwave, infrared, visible, ultraviolet, X-ray and gamma-ray radiations, and that all these waves travel at the same speed in free space.',
      note:'Order from longest wavelength / lowest frequency to shortest wavelength / highest frequency: Radio, Microwave, Infrared, Visible, Ultraviolet, X-ray, Gamma. All travel at 3 × 10⁸ m/s in a vacuum.' },
    { n:'3.12', t:'Identify the order of the electromagnetic spectrum in terms of decreasing wavelength and increasing frequency, including the colours of the visible spectrum.',

    { n:'3.13', t:'Explain some of the uses of electromagnetic radiations.',
      note:'Radio: broadcasting and communications. Microwave: cooking and satellite transmissions. Infrared: heaters, night-vision, remote controls, optical fibres. Visible: vision and photography. Ultraviolet: fluorescent lamps, security marking, sun beds. X-ray: seeing inside the body and inside objects such as luggage. Gamma: sterilising food and equipment, and treating cancer.' },
    { n:'3.14', t:'Explain the detrimental effects of excessive exposure of the human body to electromagnetic waves, and describe simple protective measures.',
      note:'Microwaves: internal heating of body tissue. Infrared: skin burns. Ultraviolet: skin cancer, damage to eyes, premature ageing. X-rays and gamma: ionising, so they can mutate DNA and cause cancer. Protection: sunscreen and sunglasses, lead aprons and screens, and limiting exposure time.' }
  ]},

  { id:'3d', title:'Light and sound', points:[
    { n:'3.15', t:'Know that light waves are transverse waves which can be reflected, refracted and diffracted.',

    { n:'3.16', t:'Use the law of reflection (the angle of incidence equals the angle of reflection).',

      note:'Use a sharp pencil and a ruler, add an arrow to show the direction of travel, draw the normal as a dashed line, and label the angles.' },
    { n:'3.18', t:'Construct ray diagrams to illustrate the formation of an image by a plane mirror.',
      note:'The image in a plane mirror is virtual, upright, the same size as the object, laterally inverted, and as far behind the mirror as the object is in front. Draw the reflected rays as solid lines and extend them back behind the mirror as dashed lines to locate the image.' },
    { n:'3.19', t:'Describe experiments to investigate the refraction of light through rectangular blocks, including the measurement of the angles of incidence and refraction.',
      cp:true,
      note:'Draw round the block, shine a ray in, mark the entry and exit points with crosses, remove the block and join the crosses. Measure both angles from the normal with a protractor and repeat for several angles of incidence.' },
    { n:'3.20', t:'Know and use the relationship between refractive index, angle of incidence and angle of refraction.',
      eq:'refractive index = sin i ÷ sin r   (n = sin i / sin r)',
      note:'i is in air, r is in the denser medium. Refractive index has no units and is always greater than 1. Make sure your calculator is in degrees.' },
    { n:'3.21', t:'Describe an experiment to investigate the refractive index of glass using a glass block.',
      cp:true,
      note:'Measure pairs of i and r for several angles, then either work out n = sin i / sin r each time and take the mean, or plot sin i against sin r and take the gradient.' },
    { n:'3.22', t:'Describe the role of total internal reflection in transmitting information along optical fibres and in prisms.',
      note:'Light hits the boundary at more than the critical angle so it is totally internally reflected and stays inside the fibre, letting it carry data over long distances with little loss. Prisms use 45° total internal reflection in periscopes and binoculars.' },
    { n:'3.23', t:'Explain the meaning of critical angle c.',
      note:'The critical angle is the angle of incidence inside the denser medium at which the angle of refraction is exactly 90°. Below c the light mostly refracts out; above c it is all reflected back inside.' },
    { n:'3.24', t:'Know and use the relationship between critical angle and refractive index.',
      eq:'sin c = 1 ÷ n',
      note:'For glass with n = 1.5, sin c = 0.667 so c ≈ 42°. Total internal reflection needs light going from a denser to a less dense medium, at an angle greater than c.' },
    { n:'3.25', t:'Know that sound waves are longitudinal waves which can be reflected, refracted and diffracted.',
      note:'Sound needs a medium, so it cannot travel through a vacuum. Reflected sound is an echo.' },
    { n:'3.26', t:'Know the range of frequencies audible to humans is 20 Hz to 20 000 Hz.',
      note:'Above 20 000 Hz is ultrasound. The upper limit falls with age.' },
    { n:'3.27', t:'Understand how an oscilloscope and microphone can be used to display a sound wave.',
      note:'The microphone converts sound to an electrical signal that the oscilloscope displays as a transverse-looking trace. Bigger amplitude means louder; higher frequency (waves closer together) means higher pitch.' },
    { n:'3.28', t:'Describe an experiment to measure the speed of sound in air.',
      cp:true,
      note:'Two students stand a measured distance apart; one bangs cymbals, the other times from seeing the bang to hearing it, and speed = distance ÷ time. Better: use two microphones a fixed distance apart connected to a timer, which removes reaction-time error. Repeat and take a mean.' },
    { n:'3.29', t:'Understand how the pitch and loudness of a sound relate to the frequency and amplitude of the wave.',
      note:'Pitch depends on frequency; loudness depends on amplitude. Do not mix these up.' }
  ]}

]});
</script>
<script>
/* data/spec-4.js */
SPEC.sections.push({
  id: 4,
  title: 'Energy resources and energy transfers',
  colour: '#7effc0',
  blurb: 'Energy stores and transfers, conduction, convection and radiation, work, power, efficiency and Sankey diagrams, and how electricity is generated from renewable and non-renewable resources.',
  topics: [

  { id:'4a', title:'Units', points:[
    { n:'4.1', t:'Use the following units: kilogram (kg), joule (J), metre (m), metre/second (m/s), metre/second² (m/s²), newton (N), second (s), watt (W).',
      note:'Energy and work in J, power in W (which is J/s). 1 kW = 1000 W, 1 MW = 1 000 000 W.' }
  ]},

  { id:'4b', title:'Energy transfer', points:[
    { n:'4.2', t:'Describe energy transfers involving energy stores: chemical, kinetic, gravitational, elastic, thermal, magnetic, electrostatic and nuclear.',
      note:'Describe a change as "energy is transferred from the X store to the Y store". Falling ball: gravitational to kinetic. Bow being drawn: chemical (in the archer) to elastic. Never write "heat energy" as a store — it is thermal.' },
    { n:'4.3', t:'Describe how energy transfers can be shown by mechanical working, electrical working, heating and radiation (by light or sound).',
      note:'These four are the pathways by which energy moves between stores.' },
    { n:'4.4', t:'Know and use the principle of conservation of energy.',
      note:'Energy cannot be created or destroyed, only transferred from one store to another. Energy that is not usefully transferred is dissipated to the surroundings, usually as thermal energy, and becomes less useful.' },
    { n:'4.5', t:'Describe how thermal energy transfer may take place by conduction, convection and radiation.',
      note:'Conduction: vibrating particles pass energy on by collisions, and in metals free electrons carry it much faster — mainly in solids. Convection: heated fluid expands, becomes less dense, rises, cools and sinks, setting up a convection current — only in liquids and gases. Radiation: infrared waves, and the only one that works through a vacuum.' },
    { n:'4.6', t:'Explain the role of convection in everyday phenomena.',
      note:'Sea breezes, hot-air balloons, radiators heating a room, and the freezer compartment at the top of a fridge so cold air sinks through it.' },
    { n:'4.7', t:'Explain how emission and absorption of radiation are related to surface and temperature.',
      note:'Matt black surfaces are the best emitters and best absorbers of infrared. Shiny silver surfaces are the worst emitters and best reflectors. Hotter objects emit more radiation, and emit it at shorter wavelengths.' },
    { n:'4.8', t:'Practical: investigate thermal energy transfer by conduction, convection and radiation.',
      cp:true,
      note:'Conduction: rods of different metals with wax-attached pins; the pin drops first on the best conductor. Convection: potassium manganate(VII) crystal in water, or smoke in a convection box. Radiation: Leslie cube filled with hot water with an infrared detector at a fixed distance from each face.' },
    { n:'4.9', t:'Explain ways of reducing unwanted energy transfer, such as insulation.',
      note:'Loft insulation and cavity wall insulation trap air, which is a poor conductor and cannot easily convect. Double glazing traps air or a vacuum between the panes. Draught excluders stop convection currents. Shiny foil behind a radiator reflects infrared back into the room.' },
    { n:'4.10', t:'Know and use the relationship between efficiency, useful energy output and total energy output.',
      eq:'efficiency = (useful energy output ÷ total energy input) × 100%',
      note:'The same formula works with power instead of energy. Efficiency can never be more than 100%; if yours is, you have swapped the numbers over.' },
    { n:'4.11', t:'Describe and use Sankey diagrams to represent energy transfers.',
      note:'The width of each arrow is proportional to the amount of energy. Input on the left, useful output going straight on, wasted energy branching downwards. Total in must equal total out.' }
  ]},

  { id:'4c', title:'Work and power', points:[
    { n:'4.12', t:'Know and use the relationship between work done, force and distance moved in the direction of the force.',
      eq:'work done = force × distance moved   (W = F × d)',
      note:'Work done in joules equals the energy transferred. The distance must be in the direction of the force — carrying a box horizontally does no work against gravity.' },
    { n:'4.13', t:'Know that work done is equal to energy transferred.',
      note:'1 joule of work is done when a force of 1 N moves an object 1 m in the direction of the force.' },
    { n:'4.14', t:'Know and use the relationship between gravitational potential energy, mass, gravitational field strength and height.',
      eq:'GPE = mass × gravitational field strength × height   (GPE = m × g × h)',
      note:'h is the vertical height gained, not the distance travelled along a slope.' },
    { n:'4.15', t:'Know and use the relationship between kinetic energy, mass and speed.',
      eq:'KE = ½ × mass × speed²   (KE = ½ m v²)',
      note:'Square the speed before multiplying. Doubling the speed gives four times the kinetic energy — which is exactly why braking distance grows so fast with speed.' },
    { n:'4.16', t:'Understand how conservation of energy produces a link between gravitational potential energy, kinetic energy and work.',
      note:'For a falling object with no air resistance, GPE lost = KE gained, so mgh = ½mv², which rearranges to v = √(2gh). The mass cancels, so all objects fall at the same rate in the absence of air resistance.' },
    { n:'4.17', t:'Describe power as the rate of transfer of energy or the rate of doing work.',
      note:'A more powerful device transfers the same energy in less time.' },
    { n:'4.18', t:'Know and use the relationship between power, work done (energy transferred) and time taken.',
      eq:'power = work done ÷ time taken   (P = W / t)',
      note:'1 watt = 1 joule per second. Time in seconds.' }
  ]},

  { id:'4d', title:'Energy resources and electricity generation', points:[
    { n:'4.19', t:'Describe the energy transfers involved in generating electricity using wind, water, geothermal resources, solar heating systems, solar cells, fossil fuels and nuclear power.',
      note:'Most stations: a fuel or flow turns a turbine, the turbine turns a generator, and the generator produces electricity. Solar cells are the exception — they transfer light directly to electricity with no turbine.' },
    { n:'4.20', t:'Describe the advantages and disadvantages of methods of large-scale electricity production from various renewable and non-renewable resources.',
      note:'Non-renewable (coal, oil, gas, nuclear): reliable, high output, available on demand, but fossil fuels release CO₂ and cause climate change, and nuclear produces radioactive waste with high decommissioning costs. Renewable (wind, solar, hydroelectric, tidal, wave, geothermal, biomass): no fuel cost and little or no CO₂ in use, but often unreliable, weather- or location-dependent, with high set-up cost and visual impact.' },
    { n:'4.21', t:'Know that energy from most of our resources originally came from the Sun.',
      note:'Fossil fuels store energy from ancient plants that photosynthesised. Wind and waves are driven by uneven solar heating of the atmosphere. Hydroelectricity relies on solar-driven evaporation. The exceptions are nuclear, geothermal and tidal (which comes from the Moon’s gravity).' },
    { n:'4.22', t:'Describe the National Grid and explain why electricity is transmitted at high voltage.',
      note:'Step-up transformers raise the voltage after the power station, which lowers the current for the same power. Lower current means much less energy wasted heating the cables, since power lost = I²R. Step-down transformers reduce the voltage again for safe use in homes.' }
  ]}

]});
</script>
<script>
/* data/spec-5.js */
SPEC.sections.push({
  id: 5,
  title: 'Solids, liquids and gases',
  colour: '#ff7d92',
  blurb: 'Density and pressure, the particle model and changes of state, specific heat capacity, the Kelvin scale and the gas laws. The Physics-only gas law calculations sit here.',
  topics: [

  { id:'5a', title:'Units', points:[
    { n:'5.1', t:'Use the following units: degree Celsius (°C), joule (J), kelvin (K), kilogram (kg), kilogram/metre³ (kg/m³), metre (m), metre²(m²), metre³ (m³), metre/second (m/s), newton (N), pascal (Pa).',
      note:'Pressure in Pa (which is N/m²), density in kg/m³. Convert cm³ to m³ by dividing by 1 000 000, and g/cm³ to kg/m³ by multiplying by 1000.' }
  ]},

  { id:'5b', title:'Density and pressure', points:[
    { n:'5.2', t:'Know and use the relationship between density, mass and volume.',
      eq:'density = mass ÷ volume   (ρ = m / V)',
      note:'Water has a density of 1000 kg/m³ (1 g/cm³). Anything less dense than water floats on it.' },
    { n:'5.3', t:'Practical: investigate the densities of solids and liquids.',
      cp:true,
      note:'Regular solid: measure mass on a balance, measure the sides with a ruler or vernier callipers and calculate the volume. Irregular solid: use a displacement can or a measuring cylinder, where the volume of water displaced equals the volume of the object. Liquid: weigh an empty measuring cylinder, add the liquid, weigh again, and subtract to get the mass.' },
    { n:'5.4', t:'Know and use the relationship between pressure, force and area.',
      eq:'pressure = force ÷ area   (p = F / A)',
      note:'Smaller area gives greater pressure — hence sharp knives and drawing pins. Larger area gives less pressure — hence snowshoes and wide tractor tyres. Area must be in m².' },
    { n:'5.5', t:'Understand that the pressure at a point in a gas or liquid at rest acts equally in all directions.',
      note:'This is why a balloon inflates evenly and why a submarine is squeezed from every side.' },
    { n:'5.6', t:'Know and use the relationship for pressure difference.',
      eq:'pressure difference = height × density × g   (p = h × ρ × g)',
      note:'Pressure in a liquid increases with depth and with density, but does not depend on the surface area or the shape of the container. This is why dam walls are thicker at the base.' }
  ]},

  { id:'5c', title:'Change of state', points:[
    { n:'5.7', t:'Understand the changes that occur when a solid melts to form a liquid, and when a liquid evaporates or boils to form a gas.',
      note:'Solid: particles closely packed in a fixed regular pattern, vibrating in place. Liquid: close together but able to move past each other, with no fixed shape. Gas: far apart, moving quickly in all directions, filling the container. Melting and boiling need energy input to break the forces between particles.' },
    { n:'5.8', t:'Describe the arrangement and motion of particles in solids, liquids and gases.',
      note:'Be ready to draw the three diagrams and describe both arrangement and motion, plus the relative spacing. Density order: solid > liquid ≫ gas.' },
    { n:'5.9', t:'Understand the significance of the temperature of a substance in terms of the motion of its particles.',
      note:'Temperature is a measure of the average kinetic energy of the particles. Hotter means faster-moving particles.' },
    { n:'5.10', t:'Understand that during a change of state the temperature stays constant while the energy supplied changes the arrangement of the particles.',
      note:'On a heating curve the flat sections are the changes of state. The energy goes into breaking the forces between particles, not into raising their kinetic energy, so the thermometer reading does not change.' },
    { n:'5.11', t:'Know and use the relationship between specific heat capacity, mass, temperature change and energy transferred.',
      eq:'change in thermal energy = mass × specific heat capacity × change in temperature   (ΔQ = m × c × ΔT)',
      note:'Specific heat capacity is the energy needed to raise 1 kg of a substance by 1 °C, in J/(kg °C). Water’s is very high at 4200, which is why it is used in central heating and why the sea warms slowly.' },
    { n:'5.12', t:'Practical: investigate the specific heat capacity of materials including water and some solids.',
      cp:true,
      note:'Use an immersion heater in an insulated metal block or beaker of water, with a joulemeter or with energy = power × time, and measure the temperature rise with a thermometer. Insulate to reduce energy lost to the surroundings, which is the main source of error and makes the measured value too high.' }
  ]},

  { id:'5d', title:'Ideal gas molecules', points:[
    { n:'5.13', t:'Understand that molecules in a gas have random motion and that they exert a force and hence a pressure on the walls of a container.', p2:true,
      note:'Gas molecules collide with the walls. Each collision changes the molecule’s momentum, so a force is exerted on the wall, and force over area gives pressure.' },
    { n:'5.14', t:'Understand why there is an absolute zero of temperature which is −273 °C.', p2:true,
      note:'As a gas is cooled its particles move more slowly, so pressure and volume fall. Extrapolating a pressure–temperature graph back to zero pressure gives −273 °C. At absolute zero particles have the minimum possible kinetic energy, and you cannot go colder.' },
    { n:'5.15', t:'Describe the Kelvin scale of temperature and be able to convert between the Kelvin and Celsius scales.', p2:true,
      eq:'T (K) = θ (°C) + 273',
      note:'Always convert to kelvin before using any gas law. 27 °C = 300 K. A negative kelvin answer is impossible.' },
    { n:'5.16', t:'Understand that an increase in temperature results in an increase in the average speed of gas molecules.', p2:true,
      note:'Faster molecules hit the walls harder and more often, so in a fixed container the pressure rises.' },
    { n:'5.17', t:'Know that the Kelvin temperature of a gas is proportional to the average kinetic energy of its molecules.', p2:true,
      note:'Double the kelvin temperature and you double the average kinetic energy. This is not true for the Celsius scale, which is why kelvin is used.' },
    { n:'5.18', t:'Describe the qualitative relationship between pressure and Kelvin temperature for a gas in a sealed container.', p2:true,
      note:'At constant volume, pressure is directly proportional to kelvin temperature. This explains why an aerosol can may explode if heated.' },
    { n:'5.19', t:'Use the relationship between the pressure and Kelvin temperature of a fixed mass of gas at constant volume.', p2:true,
      eq:'p₁ / T₁ = p₂ / T₂',
      note:'Temperatures in kelvin. Constant volume only.' },
    { n:'5.20', t:'Use the relationship between the pressure and volume of a fixed mass of gas at constant temperature.', p2:true,
      eq:'p₁ × V₁ = p₂ × V₂',
      note:'Boyle’s law. Squeeze a gas into half the volume at constant temperature and the pressure doubles, because the molecules hit the walls twice as often.' }
  ]}

]});
</script>
<script>
/* data/spec-6.js */
SPEC.sections.push({
  id: 6,
  title: 'Magnetism and electromagnetism',
  colour: '#ff5ec7',
  blurb: 'Magnetic fields, electromagnets, the motor effect and Fleming’s left-hand rule, electromagnetic induction, generators and transformers. Practise the two hand rules until they are automatic.',
  topics: [

  { id:'6a', title:'Units', points:[
    { n:'6.1', t:'Use the following units: ampere (A), volt (V), watt (W).',
      note:'Transformer questions combine these three, so keep P = I × V to hand.' }
  ]},

  { id:'6b', title:'Magnetism', points:[
    { n:'6.2', t:'Understand that magnets repel and attract other magnets, and attract magnetic substances.',
      note:'Like poles repel, unlike poles attract. Only repulsion proves that something is a magnet, because a magnet also attracts unmagnetised magnetic material.' },
    { n:'6.3', t:'Describe the properties of magnetically hard and soft materials.',
      note:'Magnetically soft (iron): easily magnetised and easily demagnetised, so it is used for electromagnet and transformer cores. Magnetically hard (steel): harder to magnetise but keeps its magnetism, so it is used for permanent magnets.' },
    { n:'6.4', t:'Understand the term magnetic field line.',
      note:'A field line shows the direction of the force on a north pole at that point. Lines go from north to south outside the magnet, never cross, and are closer together where the field is stronger.' },
    { n:'6.5', t:'Know that magnetism is induced in some materials when they are placed in a magnetic field.',
      note:'A nearby magnet induces poles in a piece of iron — the closest end becomes the opposite pole, so it is attracted. This is how a chain of paper clips hangs from a magnet.' },
    { n:'6.6', t:'Practical: investigate the magnetic field pattern for a permanent bar magnet and between two bar magnets.',
      cp:true,
      note:'Use a plotting compass around the magnet, marking the direction at each position and joining the dots, or sprinkle iron filings over paper on top of the magnet. Between unlike poles the lines run straight across; between like poles there is a neutral point where the fields cancel.' },
    { n:'6.7', t:'Describe how to use two permanent magnets to produce a uniform magnetic field pattern.',
      note:'Place a north pole facing a south pole with a gap between them. The field between the poles is uniform: evenly spaced parallel lines running from N to S.' }
  ]},

  { id:'6c', title:'Electromagnetism', points:[
    { n:'6.8', t:'Understand that an electric current in a conductor produces a magnetic field round it.',
      note:'The field around a straight wire is a set of concentric circles. Use the right-hand grip rule: thumb points along the conventional current, fingers curl in the direction of the field.' },
    { n:'6.9', t:'Describe the construction of electromagnets.',
      note:'A coil (solenoid) of insulated wire wound round a soft iron core. The field of a solenoid looks like that of a bar magnet. Strength increases with more turns, more current, or a soft iron core. An electromagnet can be switched off, which a permanent magnet cannot.' },
    { n:'6.10', t:'Sketch and recognise magnetic field patterns for a straight wire, a flat circular coil and a solenoid, and know how the field is affected by the magnitude and direction of the current.',
      note:'Reverse the current and the field reverses. Increase the current and the field gets stronger, so the lines are drawn closer together.' },
    { n:'6.11', t:'Understand that a force is exerted on a current-carrying wire in a magnetic field, and how this leads to the turning effect in an electric motor.',
      note:'This is the motor effect. In a d.c. motor the two sides of the coil carry current in opposite directions, so they feel forces in opposite directions and the coil rotates. A split-ring commutator reverses the current every half turn to keep it spinning the same way.' },
    { n:'6.12', t:'Use the left-hand rule to predict the direction of the resulting force when a wire carries a current perpendicular to a magnetic field.',
      note:'Fleming’s left-hand rule, using your left hand: First finger = Field (N to S), seCond finger = Current (conventional, + to −), thuMb = Motion (force). The force is zero when the wire is parallel to the field.' },
    { n:'6.13', t:'Describe how the force on a current-carrying conductor in a magnetic field changes with the magnitude and direction of the field and the current.',
      note:'Force increases with a stronger field or a larger current. Reversing either one reverses the force; reversing both leaves it unchanged.' },
    { n:'6.14', t:'Know and use the relationship between force, magnetic flux density, current and length.', p2:true,
      eq:'force = magnetic flux density × current × length   (F = B × I × l)',
      note:'B is measured in tesla (T), l is the length of wire in the field in metres. Valid when the wire is at 90° to the field.' },
    { n:'6.15', t:'Explain how a loudspeaker works.', p2:true,
      note:'An a.c. signal passes through a coil attached to the cone and sitting in a permanent magnetic field. The motor effect pushes the coil back and forth as the current reverses, the cone vibrates, and it makes sound waves in the air at the same frequency as the signal.' }
  ]},

  { id:'6d', title:'Electromagnetic induction', points:[
    { n:'6.16', t:'Know that a voltage is induced in a conductor or a coil when it moves through a magnetic field or when a magnetic field changes through it, and describe the factors which affect the size of the induced voltage.',
      note:'The generator effect. There must be relative movement or a changing field — a stationary magnet in a stationary coil induces nothing. Bigger voltage from: faster movement, a stronger magnet, more turns on the coil, or a larger area. Reversing the direction of motion reverses the voltage.' },
    { n:'6.17', t:'Practical: investigate electromagnetic induction.',
      cp:true,
      note:'Move a bar magnet in and out of a coil connected to a sensitive centre-zero galvanometer. The needle deflects while moving and returns to zero when still, and deflects the other way when the magnet is pulled out or the poles are swapped.' },
    { n:'6.18', t:'Describe the generation of electricity by the rotation of a magnet within a coil of wire and of a coil of wire within a magnetic field, and describe the factors which affect the size of the induced voltage.',
      note:'An a.c. generator uses slip rings so the output alternates. The output trace on an oscilloscope has a larger amplitude and a higher frequency if the coil spins faster.' },
    { n:'6.19', t:'Describe the structure of a transformer, and understand that a transformer changes the size of an alternating voltage.',
      note:'A primary coil and a secondary coil wound on a soft iron core. The a.c. in the primary creates a changing magnetic field in the core, which induces an alternating voltage in the secondary. Transformers only work with a.c., because d.c. gives a steady field with no change to induce a voltage.' },
    { n:'6.20', t:'Know and use the relationship between input (primary) and output (secondary) voltages and the turns ratio for a transformer.',
      eq:'V_p / V_s = n_p / n_s',
      note:'Step-up: more turns on the secondary, so a higher output voltage. Step-down: fewer turns on the secondary. Keep primary quantities on the same side of the equation.' },
    { n:'6.21', t:'Know and use the relationship for 100% efficiency in a transformer.',
      eq:'V_p × I_p = V_s × I_s',
      note:'Power in equals power out for an ideal transformer, so when the voltage is stepped up the current is stepped down by the same factor.' },
    { n:'6.22', t:'Understand why, in the National Grid, electricity is transmitted at high voltage.',
      note:'High voltage means low current for the same power. Energy wasted heating the cables is I²R, so halving the current cuts the losses to a quarter. That makes transmission far more efficient.' }
  ]}

]});
</script>
<script>
/* data/spec-7.js */
SPEC.sections.push({
  id: 7,
  title: 'Radioactivity and particles',
  colour: '#57e6a8',
  blurb: 'Atomic structure, background radiation, the three types of ionising radiation, nuclear equations, half-life, safety and uses, plus fission and fusion. Nuclear equations are free marks once you can balance them.',
  topics: [

  { id:'7a', title:'Units', points:[
    { n:'7.1', t:'Use the following unit: becquerel (Bq).',
      note:'1 Bq = one nuclear decay per second. Activity is measured in Bq, and count rate is what a detector actually records.' }
  ]},

  { id:'7b', title:'Radioactivity', points:[
    { n:'7.2', t:'Describe the structure of an atom in terms of protons, neutrons and electrons, and use symbols such as ¹⁴₆C to describe particular nuclei.',
      note:'Protons and neutrons are in the nucleus; electrons orbit in shells. In the notation, the top number is the mass number A (protons + neutrons) and the bottom number is the atomic number Z (protons). Neutrons = A − Z.' },
    { n:'7.3', t:'Know the terms atomic (proton) number, mass (nucleon) number and isotope.',
      note:'Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons. They behave identically chemically but can differ in nuclear stability.' },
    { n:'7.4', t:'Know that atoms may be represented in terms of their atomic and mass numbers and the relative masses and charges of protons, neutrons and electrons.',
      note:'Proton: relative mass 1, charge +1. Neutron: relative mass 1, charge 0. Electron: relative mass 1/1836 (effectively 0), charge −1. A neutral atom has equal numbers of protons and electrons.' },
    { n:'7.5', t:'Describe the results of Geiger and Marsden’s alpha particle scattering experiment and the evidence this provided for the nuclear atom.',
      note:'Most alpha particles passed straight through gold foil, so the atom is mostly empty space. A few were deflected through large angles and a very small number bounced back, so the positive charge and nearly all the mass are concentrated in a tiny dense nucleus.' },
    { n:'7.6', t:'Describe the nature of alpha and beta particles and gamma rays, and recall that they may be distinguished in terms of penetrating power and ability to ionise.',
      note:'Alpha: a helium nucleus, 2 protons + 2 neutrons, charge +2, strongly ionising, stopped by paper or a few cm of air. Beta: a fast electron from the nucleus, charge −1, moderately ionising, stopped by a few mm of aluminium. Gamma: an EM wave, no charge or mass, weakly ionising, reduced but never fully stopped by thick lead or concrete. Ionising power and penetrating power are opposites.' },
    { n:'7.7', t:'Describe the effects on the atomic and mass numbers of a nucleus of the emission of each of the three main types of radiation.',
      note:'Alpha decay: mass number −4, atomic number −2. Beta decay: mass number unchanged, atomic number +1 (a neutron turns into a proton and an electron). Gamma emission: neither number changes, the nucleus just loses energy.' },
    { n:'7.8', t:'Understand how to complete balanced nuclear equations in terms of mass and atomic numbers.',
      note:'The totals of the top numbers must match on both sides, and so must the totals of the bottom numbers. Alpha particle: ⁴₂He (or ⁴₂α). Beta particle: ⁰₋₁e (or ⁰₋₁β).' },
    { n:'7.9', t:'Understand how the emission of nuclear radiation can cause a change in the nucleus.',
      note:'Decay happens because the nucleus is unstable; emitting radiation moves it towards a more stable configuration. Alpha and beta decay change the element, gamma emission does not.' },
    { n:'7.10', t:'Describe the sources of background radiation.',
      note:'Natural: radon gas from rocks (the largest contributor in most places), rocks and soil, cosmic rays from space, food and drink. Artificial: medical X-rays and scans, nuclear industry and weapons fallout. Always subtract the background count rate before doing half-life work.' },
    { n:'7.11', t:'Know that radioactive decay is a random process and that the activity of a source decreases over a period of time.',
      note:'You cannot predict which nucleus will decay or when, only the probability. That is why count rates fluctuate and why repeat readings matter.' },
    { n:'7.12', t:'Know the definition of the term half-life and understand that it is different for different radioactive isotopes.',

    { n:'7.13', t:'Use the concept of half-life to carry out simple calculations on activity, including graphical methods.',
      note:'Each half-life halves the activity: 100 → 50 → 25 → 12.5. To find a half-life from a graph, read off the time taken to drop from any value to half that value and repeat at a couple of places, then take a mean.' },
    { n:'7.14', t:'Describe the dangers of ionising radiation, including damage to cells and tissue, and the problems arising from the disposal of radioactive waste.',
      note:'Ionising radiation damages or kills cells, and can mutate DNA leading to cancer. Alpha is most dangerous inside the body because it is strongly ionising over a short range; beta and gamma are the bigger risk from outside because they penetrate the skin. High-level waste stays dangerous for thousands of years and has to be sealed and stored deep underground.' },
    { n:'7.15', t:'Explain the precautions taken to ensure the safe handling and storage of radioactive materials, and the safe management of radioactive waste.',

    { n:'7.16', t:'Describe the uses of radioactivity in industry and medicine.',
      note:'Medical tracers (gamma, short half-life), radiotherapy for cancer (gamma), sterilising instruments and food (gamma), smoke alarms (alpha), thickness monitoring in a paper or foil mill (beta), leak detection in pipes (gamma tracer), and carbon dating of once-living material.' }
  ]},

  { id:'7c', title:'Fission and fusion', points:[
    { n:'7.17', t:'Describe the process of nuclear fission.', p2:true,
      note:'A slow-moving neutron is absorbed by a large unstable nucleus such as uranium-235, which splits into two smaller daughter nuclei, releasing two or three more neutrons and a large amount of energy.' },
    { n:'7.18', t:'Describe how a chain reaction is set up and controlled in a nuclear reactor.', p2:true,
      note:'The released neutrons go on to cause further fissions, giving a chain reaction. Control rods (boron or cadmium) absorb neutrons to keep the rate steady, and a moderator (graphite or water) slows the fast neutrons down so they are more likely to be absorbed and cause fission.' },

    { n:'7.21', t:'Describe nuclear fusion as the creation of larger nuclei from smaller nuclei, resulting in a loss of mass and a release of energy, and know that fusion is the energy source for stars.', p2:true,
