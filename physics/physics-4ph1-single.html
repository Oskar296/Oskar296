  { s:1, term:'Weight', def:'The force acting on an object due to gravity, measured in newtons. It depends on the gravitational field strength.' },
  { s:1, term:'Terminal velocity', def:'The constant maximum velocity reached by a falling object when the drag force equals its weight, so the resultant force is zero.' },
  { s:1, term:'Hooke’s law', def:'The extension of a spring is directly proportional to the force applied, provided the limit of proportionality is not exceeded.' },
  { s:1, term:'Limit of proportionality', def:'The point beyond which extension is no longer directly proportional to the force applied.' },
  { s:1, term:'Elastic behaviour', def:'The ability of a material to return to its original shape once the deforming forces are removed.' },
  { s:1, term:'Momentum', def:'The product of an object’s mass and its velocity, measured in kg m/s. A vector quantity.' },
  { s:1, term:'Conservation of momentum', def:'In a closed system with no external forces, the total momentum before an event equals the total momentum after it.' },
  { s:1, term:'Moment', def:'The turning effect of a force, equal to the force multiplied by the perpendicular distance from the pivot.' },
  { s:1, term:'Principle of moments', def:'When an object is in equilibrium, the sum of the clockwise moments about a pivot equals the sum of the anticlockwise moments.' },
  { s:1, term:'Centre of gravity', def:'The single point through which the entire weight of an object can be taken to act.' },

  { s:2, term:'Electric current', def:'The rate of flow of electric charge. In a metal it is a flow of free electrons.' },
  { s:2, term:'Potential difference (voltage)', def:'The energy transferred per unit charge passing between two points. One volt is one joule per coulomb.' },
  { s:2, term:'Resistance', def:'The opposition of a component to the flow of current, equal to voltage divided by current. Measured in ohms.' },
  { s:2, term:'Ohm’s law', def:'The current through a conductor is directly proportional to the voltage across it, provided the temperature stays constant.' },
  { s:2, term:'Coulomb', def:'The quantity of charge that passes when a current of one ampere flows for one second.' },
  { s:2, term:'Direct current (d.c.)', def:'Current that flows in one direction only, as supplied by a cell or battery.' },
  { s:2, term:'Alternating current (a.c.)', def:'Current that repeatedly reverses direction, as supplied by the mains.' },
  { s:2, term:'Fuse', def:'A thin wire that melts and breaks the circuit if the current exceeds a safe value.' },
  { s:2, term:'Earthing', def:'Connecting the metal case of an appliance to the ground by a low-resistance wire, so a fault causes a large current that blows the fuse.' },
  { s:2, term:'Double insulation', def:'An appliance with a plastic case and no exposed metal parts, so no earth wire is needed.' },
  { s:2, term:'Thermistor', def:'A resistor whose resistance decreases as its temperature increases.' },
  { s:2, term:'Light-dependent resistor (LDR)', def:'A resistor whose resistance decreases as the light intensity on it increases.' },

  { s:3, term:'Transverse wave', def:'A wave in which the oscillations are perpendicular to the direction of energy transfer, such as light.' },
  { s:3, term:'Longitudinal wave', def:'A wave in which the oscillations are parallel to the direction of energy transfer, such as sound.' },
  { s:3, term:'Amplitude', def:'The maximum displacement of a point on a wave from its rest position.' },
  { s:3, term:'Wavelength', def:'The distance between two adjacent points on a wave that are in phase, for example crest to crest.' },
  { s:3, term:'Frequency', def:'The number of complete waves passing a point per second, measured in hertz.' },
  { s:3, term:'Time period', def:'The time taken for one complete wave to pass a point.' },
  { s:3, term:'Wavefront', def:'A line joining all the points on a wave that are in phase, such as a line of crests.' },
  { s:3, term:'Diffraction', def:'The spreading out of a wave as it passes through a gap or around an obstacle.' },
  { s:3, term:'Refraction', def:'The change in direction of a wave as it crosses a boundary, caused by a change in its speed.' },
  { s:3, term:'Refractive index', def:'A measure of how much a material slows light down, equal to sin i divided by sin r.' },
  { s:3, term:'Critical angle', def:'The angle of incidence inside a denser medium for which the angle of refraction is 90°.' },
  { s:3, term:'Total internal reflection', def:'When light travelling in a denser medium strikes the boundary at an angle greater than the critical angle, and is entirely reflected back inside.' },
  { s:3, term:'Normal', def:'The construction line drawn at 90° to a surface at the point where a ray meets it. All angles are measured from it.' },

  { s:4, term:'Conservation of energy', def:'Energy cannot be created or destroyed, only transferred from one store to another.' },
  { s:4, term:'Conduction', def:'The transfer of thermal energy through a material by vibrating particles and, in metals, by free electrons.' },
  { s:4, term:'Convection', def:'The transfer of thermal energy in a fluid, where warmer, less dense regions rise and cooler, denser regions sink.' },
  { s:4, term:'Radiation (thermal)', def:'The transfer of energy by infrared electromagnetic waves, which requires no medium.' },
  { s:4, term:'Efficiency', def:'The proportion of the energy supplied to a device that is transferred usefully, usually written as a percentage.' },
  { s:4, term:'Work done', def:'The energy transferred when a force moves an object through a distance in the direction of the force.' },
  { s:4, term:'Power', def:'The rate at which energy is transferred, or the rate of doing work. Measured in watts.' },
  { s:4, term:'Renewable resource', def:'An energy resource that is replenished as fast as it is used, such as wind, solar or hydroelectric.' },
  { s:4, term:'Non-renewable resource', def:'An energy resource that is used faster than it is replaced, such as coal, oil, gas or nuclear fuel.' },
  { s:4, term:'Dissipation', def:'The spreading out of energy to the surroundings, usually as thermal energy, where it becomes less useful.' },

  { s:5, term:'Density', def:'The mass per unit volume of a substance.' },
  { s:5, term:'Pressure', def:'The force acting per unit area, at right angles to a surface. Measured in pascals.' },
  { s:5, term:'Specific heat capacity', def:'The energy needed to raise the temperature of one kilogram of a substance by one degree Celsius.' },
  { s:5, term:'Temperature', def:'A measure of the average kinetic energy of the particles in a substance.' },
  { s:5, term:'Absolute zero', def:'The lowest possible temperature, −273 °C or 0 K, at which particles have the minimum possible kinetic energy.' },
  { s:5, term:'Boyle’s law', def:'For a fixed mass of gas at constant temperature, pressure multiplied by volume is constant.' },
  { s:5, term:'Evaporation', def:'The escape of the fastest-moving particles from the surface of a liquid, which happens at any temperature.' },

  { s:6, term:'Magnetic field', def:'The region around a magnet or current-carrying wire in which a magnetic material experiences a force.' },
  { s:6, term:'Magnetically hard', def:'A material such as steel that is difficult to magnetise but keeps its magnetism, used for permanent magnets.' },
  { s:6, term:'Magnetically soft', def:'A material such as iron that is easily magnetised and easily demagnetised, used for electromagnet cores.' },
  { s:6, term:'Induced magnetism', def:'Magnetism produced in a magnetic material when it is placed in a magnetic field.' },
  { s:6, term:'Motor effect', def:'The force experienced by a current-carrying conductor placed in a magnetic field.' },
  { s:6, term:'Fleming’s left-hand rule', def:'With the left hand, First finger = Field, seCond finger = Current, thuMb = Motion, all at right angles.' },
  { s:6, term:'Electromagnetic induction', def:'The generation of a voltage in a conductor when it moves through a magnetic field, or when the field through it changes.' },
  { s:6, term:'Transformer', def:'A device with primary and secondary coils on a soft iron core that changes the size of an alternating voltage.' },

  { s:7, term:'Isotope', def:'Atoms of the same element with the same number of protons but different numbers of neutrons.' },
  { s:7, term:'Atomic number', def:'The number of protons in the nucleus of an atom.' },
  { s:7, term:'Mass number', def:'The total number of protons and neutrons in the nucleus of an atom.' },
  { s:7, term:'Alpha particle', def:'A helium nucleus — two protons and two neutrons — emitted from an unstable nucleus. Strongly ionising, weakly penetrating.' },
  { s:7, term:'Beta particle', def:'A fast-moving electron emitted from the nucleus when a neutron changes into a proton.' },
  { s:7, term:'Gamma ray', def:'A high-frequency electromagnetic wave emitted from a nucleus that has excess energy. Weakly ionising, highly penetrating.' },
  { s:7, term:'Half-life', def:'The average time taken for half the undecayed nuclei in a sample to decay, or for the activity to fall by half.' },
  { s:7, term:'Activity', def:'The number of nuclear decays per second, measured in becquerels.' },
  { s:7, term:'Background radiation', def:'The low level of ionising radiation always present around us, from natural sources such as radon, rocks, cosmic rays and food, and from artificial sources such as medical scans.' },
  { s:7, term:'Nuclear fission', def:'The splitting of a large unstable nucleus into two smaller nuclei, releasing neutrons and energy.' },
  { s:7, term:'Nuclear fusion', def:'The joining of two small nuclei to form a larger one, with a loss of mass and a release of energy.' },
  { s:7, term:'Chain reaction', def:'A reaction in which neutrons released by one fission go on to cause further fissions.' },

  { s:8, term:'Galaxy', def:'An enormous collection of stars, gas and dust held together by gravity.' },
  { s:8, term:'Gravitational field strength', def:'The force of gravity acting per kilogram of mass, measured in N/kg.' },
  { s:8, term:'Main sequence star', def:'A stable star in which the outward pressure from fusion balances the inward pull of gravity.' },
  { s:8, term:'Supernova', def:'The explosion of a red supergiant at the end of its life, leaving a neutron star or a black hole.' },
  { s:8, term:'Red shift', def:'The increase in the observed wavelength of light from a source moving away from the observer.' },
  { s:8, term:'Cosmic microwave background radiation', def:'Low-level microwave radiation coming from all directions in space, the cooled remnant of the early Universe.' },
  { s:8, term:'Big Bang theory', def:'The theory that the Universe began from a very hot, very dense point about 13.8 billion years ago and has been expanding ever since.' },
  { s:8, term:'Hubble constant', def:'The constant of proportionality linking a galaxy’s speed of recession to its distance from us.' }
];
</script>
<script>
/* data/questions.js */
/* Multiple-choice question bank. a = index of the correct option. */
window.QUESTIONS = [
  // ---- Section 1: Forces and motion ----
  { s:1, q:'A car travels 150 m in 12 s. What is its average speed?', o:['12.5 m/s','1800 m/s','0.08 m/s','162 m/s'], a:0, e:'v = s / t = 150 ÷ 12 = 12.5 m/s.' },
  { s:1, q:'What does the gradient of a velocity–time graph represent?', o:['Distance travelled','Acceleration','Average speed','Momentum'], a:1, e:'Gradient = change in velocity ÷ change in time, which is acceleration. The area under the line gives distance.' },
  { s:1, q:'Which of these is a vector quantity?', o:['Mass','Energy','Momentum','Temperature'], a:2, e:'Momentum has both size and direction, so it is a vector. Mass, energy and temperature are all scalars.' },
  { s:1, q:'A 1200 kg car accelerates at 2.5 m/s². What resultant force acts on it?', o:['480 N','3000 N','1202.5 N','0.002 N'], a:1, e:'F = m × a = 1200 × 2.5 = 3000 N.' },
  { s:1, q:'A skydiver reaches terminal velocity. Which statement is correct?', o:['The forces on her are zero','Her weight is now zero','Air resistance equals her weight, so the resultant force is zero','She has stopped moving'], a:2, e:'At terminal velocity drag has grown until it balances weight. The resultant force is zero, so acceleration is zero — but she is still falling, at constant speed.' },
  { s:1, q:'On the Moon, g = 1.6 N/kg. What is the weight of a 60 kg astronaut there?', o:['96 N','600 N','37.5 N','60 N'], a:0, e:'W = m × g = 60 × 1.6 = 96 N. The mass stays 60 kg wherever she goes.' },
  { s:1, q:'A spring obeys Hooke’s law up to a certain point. What is that point called?', o:['The elastic constant','The limit of proportionality','The terminal point','The centre of gravity'], a:1, e:'Beyond the limit of proportionality, extension is no longer directly proportional to force and the graph curves.' },
  { s:1, q:'A 0.5 kg ball moves at 8 m/s. What is its momentum?', o:['4 kg m/s','16 kg m/s','0.0625 kg m/s','32 kg m/s'], a:0, e:'p = m × v = 0.5 × 8 = 4 kg m/s.' },
  { s:1, q:'Why does an airbag reduce injury in a crash?', o:['It reduces the passenger’s momentum to zero instantly','It increases the time over which momentum changes, reducing the force','It absorbs all the kinetic energy as sound','It increases the passenger’s mass'], a:1, e:'Force = change in momentum ÷ time. The same momentum change spread over a longer time means a smaller force.' },
  { s:1, q:'A 20 N force acts 0.3 m from a pivot, perpendicular to the bar. What is the moment?', o:['66.7 N m','20.3 N m','6 N m','0.015 N m'], a:2, e:'Moment = force × perpendicular distance = 20 × 0.3 = 6 N m.' },
  { s:1, q:'A car starts from rest and accelerates at 3 m/s² over 24 m. What is its final speed?', o:['12 m/s','8 m/s','144 m/s','72 m/s'], a:0, e:'v² = u² + 2as = 0 + 2 × 3 × 24 = 144, so v = √144 = 12 m/s. Remember the square root.' },
  { s:1, q:'Which change increases the braking distance of a car?', o:['The driver being more alert','A wet road surface','A lower speed','A lighter load'], a:1, e:'A wet road reduces friction between tyres and road, so the car needs further to stop. Driver alertness affects thinking distance, not braking distance.' },

  // ---- Section 2: Electricity ----
  { s:2, q:'A 2 A current flows through a 12 Ω resistor. What is the voltage across it?', o:['6 V','24 V','0.17 V','14 V'], a:1, e:'V = I × R = 2 × 12 = 24 V.' },
  { s:2, q:'How should an ammeter and a voltmeter be connected?', o:['Both in series','Both in parallel','Ammeter in series, voltmeter in parallel','Ammeter in parallel, voltmeter in series'], a:2, e:'The ammeter goes in series so the same current flows through it. The voltmeter goes in parallel across the component.' },
  { s:2, q:'What is the current in a 2300 W heater running on a 230 V supply?', o:['10 A','0.1 A','529 000 A','2070 A'], a:0, e:'I = P ÷ V = 2300 ÷ 230 = 10 A. You would fit a 13 A fuse.' },
  { s:2, q:'Why does the current–voltage graph for a filament lamp curve rather than being straight?', o:['The lamp stores charge','As the filament heats up, its resistance increases','The voltmeter is faulty','Current only flows one way'], a:1, e:'Higher current heats the filament, the metal ions vibrate more, electrons collide more often, and resistance rises — so the graph flattens.' },
  { s:2, q:'A charge of 60 C flows in 20 s. What is the current?', o:['1200 A','3 A','0.33 A','80 A'], a:1, e:'I = Q ÷ t = 60 ÷ 20 = 3 A.' },
  { s:2, q:'In a parallel circuit, which quantity is the same across every branch?', o:['Current','Resistance','Voltage','Charge'], a:2, e:'Each branch has the full supply voltage across it. The current splits between the branches.' },
  { s:2, q:'What is the purpose of the earth wire in an appliance with a metal case?', o:['To reduce the voltage supplied','To provide a low-resistance path so a fault current blows the fuse','To store excess charge','To convert a.c. into d.c.'], a:1, e:'If the live wire touches the case, a large current flows to earth, the fuse melts and the appliance is disconnected before anyone is shocked.' },
  { s:2, q:'How does the resistance of a thermistor change as it gets hotter?', o:['It increases','It decreases','It stays the same','It becomes zero'], a:1, e:'Thermistor resistance falls as temperature rises, which makes it useful as a temperature sensor.' },
  { s:2, q:'A polythene rod is rubbed with a cloth and becomes negatively charged. What happened?', o:['Protons moved onto the rod','Electrons moved from the cloth onto the rod','Neutrons moved onto the rod','Electrons moved from the rod to the cloth'], a:1, e:'Only electrons move in charging by friction. Gaining electrons makes the rod negative and leaves the cloth positive.' },
  { s:2, q:'A 12 V battery drives 0.5 A through a lamp for 60 s. How much energy is transferred?', o:['360 J','6 J','1440 J','30 J'], a:0, e:'E = I × V × t = 0.5 × 12 × 60 = 360 J.' },
  { s:2, q:'Two 10 Ω resistors are connected in series to a 20 V supply. What is the current?', o:['2 A','1 A','4 A','0.5 A'], a:1, e:'Total resistance in series = 10 + 10 = 20 Ω, so I = V ÷ R = 20 ÷ 20 = 1 A.' },

  // ---- Section 3: Waves ----
  { s:3, q:'Which of these is a longitudinal wave?', o:['Light','Sound','Radio waves','Water ripples'], a:1, e:'In sound the particles vibrate parallel to the direction of energy transfer, making compressions and rarefactions.' },
  { s:3, q:'A wave has frequency 50 Hz and wavelength 6 m. What is its speed?', o:['8.3 m/s','300 m/s','56 m/s','0.12 m/s'], a:1, e:'v = f × λ = 50 × 6 = 300 m/s.' },
  { s:3, q:'Which electromagnetic wave has the longest wavelength?', o:['Gamma rays','Ultraviolet','Radio waves','X-rays'], a:2, e:'Order of increasing frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. Radio has the longest wavelength.' },
  { s:3, q:'What happens to light entering a glass block from air at an angle?', o:['It speeds up and bends away from the normal','It slows down and bends towards the normal','It slows down and bends away from the normal','Its frequency decreases'], a:1, e:'Glass is optically denser, so light slows and refracts towards the normal. Frequency never changes during refraction.' },
  { s:3, q:'A wave has a time period of 0.004 s. What is its frequency?', o:['250 Hz','0.004 Hz','4 Hz','400 Hz'], a:0, e:'f = 1 ÷ T = 1 ÷ 0.004 = 250 Hz.' },
  { s:3, q:'Light passes from glass into air with an angle of incidence greater than the critical angle. What happens?', o:['It refracts away from the normal','It is totally internally reflected','It is absorbed','It refracts along the boundary'], a:1, e:'Above the critical angle none of the light escapes — it is all reflected back inside. This is how optical fibres work.' },
  { s:3, q:'Glass has a refractive index of 1.5. What is its critical angle?', o:['About 42°','About 30°','About 62°','About 90°'], a:0, e:'sin c = 1 ÷ n = 1 ÷ 1.5 = 0.667, so c = sin⁻¹(0.667) ≈ 42°.' },
  { s:3, q:'What is the approximate range of human hearing?', o:['2 Hz to 2000 Hz','20 Hz to 20 000 Hz','200 Hz to 200 000 Hz','0 Hz to 100 Hz'], a:1, e:'20 Hz to 20 000 Hz. Anything above that range is ultrasound.' },
  { s:3, q:'On an oscilloscope trace, a sound is made louder. What changes?', o:['The waves get closer together','The amplitude increases','The trace shifts upwards','The wavelength increases'], a:1, e:'Loudness depends on amplitude. Pitch depends on frequency, which is how close the waves are together.' },
  { s:3, q:'Which property of a wave describes the maximum displacement from the rest position?', o:['Wavelength','Frequency','Amplitude','Period'], a:2, e:'Amplitude. Measure it from the middle line to a crest, not from crest to trough.' },
  { s:3, q:'Excessive exposure to ultraviolet radiation can cause which harm?', o:['Internal heating of body tissue','Skin cancer and eye damage','Deafness','Broken bones'], a:1, e:'UV is ionising enough to damage skin cells and the eyes. Microwaves cause internal heating; infrared causes skin burns.' },

  // ---- Section 4: Energy ----
  { s:4, q:'A 200 N force moves a box 4 m in the direction of the force. How much work is done?', o:['50 J','800 J','204 J','0.02 J'], a:1, e:'W = F × d = 200 × 4 = 800 J.' },
  { s:4, q:'A motor supplies 500 J and usefully transfers 350 J. What is its efficiency?', o:['70%','143%','35%','150%'], a:0, e:'Efficiency = (350 ÷ 500) × 100 = 70%.' },
  { s:4, q:'Which method of thermal energy transfer works through a vacuum?', o:['Conduction','Convection','Radiation','All of them'], a:2, e:'Infrared radiation is an electromagnetic wave, so it needs no particles. That is how the Sun’s energy reaches Earth.' },
  { s:4, q:'A 2 kg object is lifted 5 m. Using g = 10 N/kg, how much GPE does it gain?', o:['100 J','10 J','25 J','1 J'], a:0, e:'GPE = m × g × h = 2 × 10 × 5 = 100 J.' },
  { s:4, q:'A 1000 kg car travels at 20 m/s. What is its kinetic energy?', o:['20 000 J','10 000 J','200 000 J','400 000 J'], a:2, e:'KE = ½mv² = 0.5 × 1000 × 20² = 0.5 × 1000 × 400 = 200 000 J.' },
  { s:4, q:'Which surface is the best emitter of infrared radiation?', o:['Shiny silver','Matt black','Shiny white','Clear glass'], a:1, e:'Matt black surfaces are the best emitters and the best absorbers. Shiny silver is the best reflector and the worst emitter.' },
  { s:4, q:'Which of these is a renewable energy resource?', o:['Natural gas','Coal','Geothermal','Uranium'], a:2, e:'Geothermal energy is replenished continuously by heat from the Earth’s interior. The other three are non-renewable.' },
  { s:4, q:'A machine does 6000 J of work in 30 s. What is its power output?', o:['200 W','180 000 W','0.005 W','5 W'], a:0, e:'P = W ÷ t = 6000 ÷ 30 = 200 W.' },
  { s:4, q:'Why is electricity transmitted through the National Grid at very high voltage?', o:['Because high voltage is safer','To reduce the current, and so reduce energy wasted heating the cables','To increase the current in the cables','Because transformers only work at high current'], a:1, e:'For a given power, higher voltage means lower current. Energy wasted in the cables is I²R, so a smaller current wastes far less.' },
  { s:4, q:'In a Sankey diagram, what does the width of each arrow show?', o:['The temperature','The amount of energy transferred','The time taken','The efficiency percentage'], a:1, e:'Arrow width is proportional to the energy, and the total leaving must equal the total entering.' },
  { s:4, q:'Cavity wall insulation reduces heat loss mainly because', o:['it reflects all infrared radiation','it traps air, which is a poor conductor and cannot easily convect','it makes the wall thinner','it converts thermal energy into electricity'], a:1, e:'Trapped air conducts poorly and, because it cannot circulate freely, convection currents are suppressed too.' },

  // ---- Section 5: Solids, liquids and gases ----
  { s:5, q:'An object has a mass of 240 kg and a volume of 0.3 m³. What is its density?', o:['72 kg/m³','800 kg/m³','0.00125 kg/m³','240.3 kg/m³'], a:1, e:'ρ = m ÷ V = 240 ÷ 0.3 = 800 kg/m³. Less dense than water, so it would float.' },
  { s:5, q:'A force of 500 N acts on an area of 0.25 m². What is the pressure?', o:['125 Pa','2000 Pa','500.25 Pa','0.0005 Pa'], a:1, e:'p = F ÷ A = 500 ÷ 0.25 = 2000 Pa.' },
  { s:5, q:'Why does a sharp knife cut more easily than a blunt one?', o:['It has less mass','The smaller contact area gives a greater pressure for the same force','It applies a larger force','It has a lower density'], a:1, e:'Pressure = force ÷ area. A very small area concentrates the same force into a much higher pressure.' },
  { s:5, q:'What happens to the temperature of a substance while it is melting?', o:['It rises steadily','It falls','It stays constant','It rises then falls'], a:2, e:'During a change of state the energy supplied breaks the forces between particles rather than raising their kinetic energy, so the temperature does not change.' },
  { s:5, q:'What is 27 °C in kelvin?', o:['300 K','246 K','27 K','−246 K'], a:0, e:'T = θ + 273 = 27 + 273 = 300 K.' },
  { s:5, q:'A fixed mass of gas at constant temperature is compressed to half its volume. What happens to the pressure?', o:['It halves','It doubles','It stays the same','It quadruples'], a:1, e:'Boyle’s law: p₁V₁ = p₂V₂. Halving V doubles p, because the molecules hit the walls twice as often.' },
  { s:5, q:'How much energy is needed to raise 2 kg of water by 10 °C? (c = 4200 J/kg °C)', o:['84 000 J','8400 J','840 J','420 J'], a:0, e:'ΔQ = m × c × ΔT = 2 × 4200 × 10 = 84 000 J.' },
  { s:5, q:'What is absolute zero on the Celsius scale?', o:['0 °C','−100 °C','−273 °C','−373 °C'], a:2, e:'−273 °C, or 0 K. Particles have the minimum possible kinetic energy and you cannot get colder.' },
  { s:5, q:'Why does the pressure of a gas in a sealed rigid container rise when it is heated?', o:['The molecules get bigger','The molecules move faster, so they hit the walls harder and more often','The volume increases','The number of molecules increases'], a:1, e:'Higher temperature means greater average kinetic energy, so collisions with the walls are more frequent and more forceful.' },
  { s:5, q:'Pressure in a liquid increases with', o:['depth and density','surface area only','the shape of the container','the mass of the container'], a:0, e:'p = h × ρ × g. It depends on depth and density only — not on the container’s shape or area.' },

  // ---- Section 6: Magnetism and electromagnetism ----
  { s:6, q:'Which observation proves that a bar of metal is a magnet?', o:['It attracts iron filings','It repels one end of a known magnet','It is made of steel','It attracts a paper clip'], a:1, e:'Only repulsion proves it, because a magnet also attracts unmagnetised magnetic material.' },
  { s:6, q:'Which material is best for the core of an electromagnet?', o:['Steel, because it stays magnetised','Soft iron, because it magnetises and demagnetises easily','Copper, because it conducts well','Plastic, because it insulates'], a:1, e:'A soft iron core loses its magnetism as soon as the current stops, which is exactly what an electromagnet needs.' },
  { s:6, q:'In Fleming’s left-hand rule, what does the thumb represent?', o:['The magnetic field','The current','The motion or force','The voltage'], a:2, e:'First finger = Field, seCond finger = Current, thuMb = Motion. Use your left hand for the motor effect.' },
  { s:6, q:'How can the strength of an electromagnet be increased?', o:['Use fewer turns of wire','Reduce the current','Add more turns and increase the current','Remove the core'], a:2, e:'More turns, a bigger current, and a soft iron core all strengthen the field.' },
  { s:6, q:'A magnet is held stationary inside a coil connected to a galvanometer. What is the reading?', o:['A large steady deflection','Zero','A small alternating deflection','It increases with time'], a:1, e:'Induction needs a changing magnetic field. With no relative movement there is no change, so no voltage is induced.' },
  { s:6, q:'A transformer has 100 primary turns and 500 secondary turns. The input is 20 V. What is the output?', o:['4 V','100 V','2500 V','20 V'], a:1, e:'V_p/V_s = n_p/n_s, so 20/V_s = 100/500. V_s = 20 × 5 = 100 V. This is a step-up transformer.' },
  { s:6, q:'Why do transformers not work with direct current?', o:['d.c. is too weak','d.c. produces a steady magnetic field, so nothing changes to induce a voltage','d.c. destroys the iron core','d.c. flows in both directions'], a:1, e:'Induction requires a changing field. Only a.c. gives the continually changing field needed in the core.' },
  { s:6, q:'A wire carrying 3 A sits at 90° to a 0.4 T field, with 0.2 m in the field. What force acts on it?', o:['0.24 N','2.4 N','15 N','0.6 N'], a:0, e:'F = B × I × l = 0.4 × 3 × 0.2 = 0.24 N.' },
  { s:6, q:'What does a split-ring commutator do in a d.c. motor?', o:['Increases the magnetic field strength','Reverses the current in the coil every half turn','Converts a.c. to sound','Stops the coil from overheating'], a:1, e:'Without it, the coil would stop after half a turn. Reversing the current keeps the turning force acting the same way round.' },
  { s:6, q:'Magnetic field lines around a bar magnet run', o:['from south to north outside the magnet','from north to south outside the magnet','in straight lines only','in random directions'], a:1, e:'Outside the magnet the lines go from N to S. They never cross, and they are closest together where the field is strongest.' },

  // ---- Section 7: Radioactivity and particles ----
  { s:7, q:'What is an alpha particle?', o:['A fast electron','A helium nucleus','A high-frequency electromagnetic wave','A free neutron'], a:1, e:'Two protons and two neutrons, charge +2. Strongly ionising but stopped by a sheet of paper.' },
  { s:7, q:'Which radiation is the most penetrating?', o:['Alpha','Beta','Gamma','They are all equal'], a:2, e:'Gamma is only reduced by thick lead or concrete. Ionising power and penetrating power are opposites.' },
  { s:7, q:'An atom is written as ²³⁵₉₂U. How many neutrons does it have?', o:['92','235','143','327'], a:2, e:'Neutrons = mass number − atomic number = 235 − 92 = 143.' },
  { s:7, q:'What happens to a nucleus when it emits a beta particle?', o:['Mass number falls by 4, atomic number falls by 2','Mass number is unchanged, atomic number rises by 1','Both numbers are unchanged','Mass number rises by 1'], a:1, e:'A neutron becomes a proton and an electron. The total nucleon count is unchanged, but there is now one more proton.' },
  { s:7, q:'A source has an activity of 800 Bq and a half-life of 3 days. What is its activity after 9 days?', o:['400 Bq','200 Bq','100 Bq','0 Bq'], a:2, e:'9 days is three half-lives: 800 → 400 → 200 → 100 Bq.' },
  { s:7, q:'What is the single largest source of natural background radiation for most people?', o:['Nuclear power stations','Radon gas from rocks','Mobile phones','Cosmic rays'], a:1, e:'Radon gas seeping out of rocks and soil is the biggest natural contributor in most regions.' },
  { s:7, q:'Radioactive decay is described as random. What does this mean?', o:['Every nucleus decays at a fixed time','You cannot predict which nucleus will decay next, or when','The activity never changes','Half-life changes over time'], a:1, e:'Only the probability of decay is known. That is why count rates fluctuate and repeats matter.' },
  { s:7, q:'Which source is most suitable for a medical tracer injected into a patient?', o:['An alpha emitter with a long half-life','A gamma emitter with a short half-life','An alpha emitter with a short half-life','A beta emitter with a half-life of 1000 years'], a:1, e:'Gamma escapes the body to be detected, and a short half-life means the patient is not exposed for long.' },
  { s:7, q:'What is the role of the moderator in a nuclear reactor?', o:['To absorb neutrons and slow the reaction','To slow down fast neutrons so they can cause further fission','To shield workers from radiation','To turn the turbine'], a:1, e:'The moderator (graphite or water) slows neutrons so they are more likely to be absorbed by uranium-235. Control rods are the ones that absorb neutrons.' },
  { s:7, q:'Why is nuclear fusion difficult to achieve on Earth?', o:['There is not enough hydrogen','Nuclei are positively charged and repel, so extremely high temperature and pressure are needed','Fusion releases no energy','Fusion produces too much radioactive waste'], a:1, e:'Electrostatic repulsion between the positive nuclei must be overcome, which needs conditions like those inside a star.' },
  { s:7, q:'What did the alpha scattering experiment show?', o:['Atoms are solid spheres','The atom is mostly empty space with a tiny, dense, positive nucleus','Electrons are in the nucleus','Alpha particles have no charge'], a:1, e:'Most alphas passed straight through, but a few were deflected sharply back, which only a concentrated positive nucleus can explain.' },

  // ---- Section 8: Astrophysics ----
  { s:8, q:'What force keeps a planet in orbit around the Sun?', o:['Magnetic force','Gravitational force','Electrostatic force','Friction'], a:1, e:'Gravity provides the centripetal force, always directed towards the centre of the orbit.' },
  { s:8, q:'Which is the correct order of the first four planets from the Sun?', o:['Mercury, Venus, Earth, Mars','Venus, Mercury, Mars, Earth','Earth, Mars, Venus, Mercury','Mercury, Earth, Venus, Mars'], a:0, e:'Mercury, Venus, Earth, Mars, then Jupiter, Saturn, Uranus and Neptune.' },
  { s:8, q:'A satellite orbits at radius 7.0 × 10⁶ m with a period of 6000 s. What is its orbital speed?', o:['About 7300 m/s','About 1170 m/s','About 4.2 × 10¹⁰ m/s','About 860 m/s'], a:0, e:'v = 2πr ÷ T = (2 × π × 7.0 × 10⁶) ÷ 6000 ≈ 7330 m/s.' },
  { s:8, q:'What happens to a comet’s speed as it approaches the Sun?', o:['It slows down','It speeds up','It stays constant','It stops'], a:1, e:'Closer to the Sun the gravitational force is stronger, so it accelerates — converting gravitational potential energy to kinetic energy.' },
  { s:8, q:'What is the correct life cycle for a star like the Sun?', o:['Nebula → main sequence → red giant → white dwarf','Nebula → red giant → supernova → black hole','Main sequence → nebula → neutron star','Protostar → supernova → white dwarf'], a:0, e:'Sun-like stars end as white dwarfs. Only stars far more massive than the Sun go supernova.' },
  { s:8, q:'What keeps a main sequence star stable?', o:['It has no forces acting on it','The outward pressure from fusion balances the inward pull of gravity','It is too cold to change','Its magnetic field holds it together'], a:1, e:'This balance holds for as long as there is hydrogen left in the core to fuse.' },
  { s:8, q:'Light from a distant galaxy is red shifted. What does this show?', o:['The galaxy is moving towards us','The galaxy is moving away from us','The galaxy is stationary','The galaxy is very hot'], a:1, e:'Recession stretches the waves, increasing the wavelength and lowering the frequency. Greater red shift means faster recession.' },
  { s:8, q:'What is cosmic microwave background radiation evidence for?', o:['The existence of black holes','The Big Bang','The formation of the Solar System','Nuclear fission in stars'], a:1, e:'CMB comes from every direction and is the cooled remnant heat of the early Universe, which the Big Bang theory predicts.' },
  { s:8, q:'On a temperature–luminosity diagram, where do white dwarfs sit?', o:['Hot and very bright','Cool and very bright','Hot but dim','Cool and dim, on the main sequence'], a:2, e:'White dwarfs are extremely hot but tiny, so they emit little total light and sit below the main sequence.' },
  { s:8, q:'How can the age of the Universe be estimated?', o:['Multiply the Hubble constant by the distance to the nearest star','Take the reciprocal of the Hubble constant','Divide the speed of light by the Hubble constant','Count the number of galaxies'], a:1, e:'Age ≈ 1 ÷ H₀, which gives roughly 14 billion years.' },
  { s:8, q:'Which statement about a moon is correct?', o:['It produces its own light by fusion','It is a natural satellite that orbits a planet','It orbits a star directly','It is a collection of billions of stars'], a:1, e:'Moons orbit planets and only reflect light. Stars fuse; galaxies are collections of stars.' }
];
</script>
<script>
/* data/questions-2.js */
/* Second multiple-choice bank, appended to the first. */
QUESTIONS.push(

  // ---- Section 1 ----
  { s:1, q:'A distance–time graph shows a horizontal line. What is the object doing?', o:['Moving at constant speed','Stationary','Accelerating','Decelerating'], a:1, e:'No change in distance over time means the object is not moving. On a velocity–time graph a horizontal line would instead mean constant velocity.' },
  { s:1, q:'Which pair are both scalar quantities?', o:['Force and velocity','Mass and speed','Weight and displacement','Momentum and acceleration'], a:1, e:'Mass and speed have magnitude only. Force, velocity, weight, displacement, momentum and acceleration are all vectors.' },
  { s:1, q:'A car of mass 900 kg experiences a resultant force of 2700 N. What is its acceleration?', o:['3 m/s²','0.33 m/s²','2 430 000 m/s²','1800 m/s²'], a:0, e:'a = F ÷ m = 2700 ÷ 900 = 3 m/s².' },
  { s:1, q:'Forces of 30 N right and 12 N left act on a box. What is the resultant?', o:['42 N right','18 N right','18 N left','360 N right'], a:1, e:'Opposite directions subtract: 30 − 12 = 18 N, acting in the direction of the larger force.' },
  { s:1, q:'A spring with a spring constant of 25 N/m is stretched by 0.4 m. What force is applied?', o:['62.5 N','10 N','0.016 N','25.4 N'], a:1, e:'F = k × x = 25 × 0.4 = 10 N.' },
  { s:1, q:'Which increases thinking distance but not braking distance?', o:['Worn tyres','Icy road','Driver tiredness','Greater vehicle mass'], a:2, e:'Tiredness lengthens reaction time, which is thinking distance. Tyres, road conditions and mass affect braking distance.' },
  { s:1, q:'Two children balance on a seesaw. The heavier child must sit', o:['further from the pivot','closer to the pivot','at the same distance','directly over the pivot'], a:1, e:'Moment = force × distance. A larger force needs a smaller distance to give the same moment.' },
  { s:1, q:'A trolley is pushed with constant force on a frictionless surface. What happens?', o:['It moves at constant speed','It accelerates uniformly','It stays still','It decelerates'], a:1, e:'A constant resultant force gives a constant acceleration, by F = ma. Constant speed would need zero resultant force.' },
  { s:1, q:'An object is dropped from rest and falls for 3 s with a = 10 m/s². What is its speed?', o:['3.3 m/s','13 m/s','30 m/s','90 m/s'], a:2, e:'v = u + at = 0 + 10 × 3 = 30 m/s.' },
  { s:1, q:'A gun of mass 4 kg fires a 0.01 kg bullet at 400 m/s. What is the gun’s recoil speed?', o:['1 m/s','4 m/s','0.001 m/s','100 m/s'], a:0, e:'Momentum before is zero, so momentum after must be zero. 0.01 × 400 = 4 kg m/s, so the gun recoils at 4 ÷ 4 = 1 m/s in the opposite direction.' },
  { s:1, q:'Newton’s third law force pairs are', o:['equal, opposite, and act on the same object','equal, opposite, and act on different objects','unequal and act on different objects','equal and act in the same direction'], a:1, e:'They act on different objects, which is exactly why they do not cancel each other out.' },

  // ---- Section 2 ----
  { s:2, q:'Three 6 Ω resistors are connected in series. What is the total resistance?', o:['2 Ω','18 Ω','6 Ω','0.5 Ω'], a:1, e:'Series resistances add: 6 + 6 + 6 = 18 Ω.' },
  { s:2, q:'A current of 0.25 A flows for 4 minutes. How much charge passes?', o:['1 C','60 C','240 C','0.001 C'], a:1, e:'t = 4 × 60 = 240 s. Q = I × t = 0.25 × 240 = 60 C.' },
  { s:2, q:'Why does a voltmeter have a very high resistance?', o:['To increase the circuit voltage','So it draws almost no current and barely affects the circuit','To protect the battery','So it can be connected in series'], a:1, e:'A high-resistance voltmeter in parallel takes a negligible share of the current, so the reading reflects the real potential difference.' },
  { s:2, q:'A 9 V battery transfers 45 J of energy. How much charge has flowed?', o:['5 C','405 C','0.2 C','54 C'], a:0, e:'E = Q × V, so Q = E ÷ V = 45 ÷ 9 = 5 C.' },
  { s:2, q:'In a parallel circuit the branch currents are 0.4 A and 0.7 A. What is the supply current?', o:['0.3 A','1.1 A','0.28 A','0.55 A'], a:1, e:'Currents in parallel branches add: 0.4 + 0.7 = 1.1 A.' },
  { s:2, q:'A diode is connected in reverse in a circuit. What happens?', o:['A large current flows','Almost no current flows','The current alternates','The resistance falls to zero'], a:1, e:'A diode conducts in one direction only. In reverse its resistance is extremely high.' },
  { s:2, q:'Which appliance does NOT need an earth wire?', o:['A metal-cased toaster','A double-insulated plastic hairdryer','A metal kettle','A washing machine with a metal case'], a:1, e:'Double insulation means a plastic case with no exposed metal, so the case can never become live.' },
  { s:2, q:'A balloon rubbed on a jumper sticks to a wall. Why?', o:['The balloon has gained protons','The charged balloon induces an opposite charge in the wall and is attracted','The wall is magnetic','Air pressure holds it there'], a:1, e:'Charge separation is induced in the wall’s surface, so the nearer surface carries the opposite charge and attracts the balloon.' },
  { s:2, q:'A 60 W lamp runs for 5 minutes. How much energy does it transfer?', o:['300 J','18 000 J','12 J','3600 J'], a:1, e:'E = P × t = 60 × 300 = 18 000 J. Convert 5 minutes to 300 s first.' },
  { s:2, q:'Why is a fuel tanker earthed by a bonding wire during filling?', o:['To keep the fuel cool','So static charge flows safely away rather than building up and sparking','To increase the flow rate','To measure the amount of fuel'], a:1, e:'Fuel flowing through a pipe builds up charge. A spark could ignite the vapour, so the charge is conducted safely to earth.' },
  { s:2, q:'The resistance of an LDR in bright sunlight compared with darkness is', o:['higher','lower','the same','zero'], a:1, e:'More light means lower resistance for an LDR. Remember it alongside the thermistor, where more heat means lower resistance.' },

  // ---- Section 3 ----
  { s:3, q:'Sound cannot travel through a vacuum because', o:['it travels too slowly','it is a longitudinal wave that needs particles to vibrate','it has too low a frequency','it is absorbed by the vacuum'], a:1, e:'Sound needs a medium. Electromagnetic waves do not, which is why light from the Sun reaches us but its sound does not.' },
  { s:3, q:'A ray hits a plane mirror at 30° to the mirror surface. What is the angle of reflection?', o:['30°','60°','90°','15°'], a:1, e:'Angles are measured from the normal. 30° from the surface is 60° from the normal, so the reflected ray is also at 60°.' },
  { s:3, q:'The image in a plane mirror is', o:['real, inverted and smaller','virtual, upright and the same size','real, upright and larger','virtual, inverted and smaller'], a:1, e:'It is virtual, upright, the same size, laterally inverted, and as far behind the mirror as the object is in front.' },
  { s:3, q:'Which EM wave is used in television remote controls?', o:['Ultraviolet','X-rays','Infrared','Gamma'], a:2, e:'Infrared carries the coded signal over the short distance to the television.' },
  { s:3, q:'A sound wave travels at 340 m/s with a frequency of 170 Hz. What is its wavelength?', o:['2 m','0.5 m','57 800 m','510 m'], a:0, e:'λ = v ÷ f = 340 ÷ 170 = 2 m.' },
  { s:3, q:'When a wave is diffracted, the spreading is greatest when', o:['the gap is much larger than the wavelength','the gap is about the same size as the wavelength','the gap is much smaller than the wavelength','the wave has a high amplitude'], a:1, e:'Maximum spreading occurs when the gap width is comparable to the wavelength.' },
  { s:3, q:'Which property of a wave does NOT change when it refracts?', o:['Speed','Wavelength','Frequency','Direction'], a:2, e:'Frequency is fixed by the source. Speed and wavelength both change, which is what causes the change in direction.' },
  { s:3, q:'A material has a refractive index of 2.0. What is its critical angle?', o:['30°','45°','60°','90°'], a:0, e:'sin c = 1 ÷ n = 0.5, so c = 30°.' },
  { s:3, q:'Which is a longitudinal wave feature?', o:['Crests and troughs','Compressions and rarefactions','Peaks and nodes','Wavefronts only'], a:1, e:'Longitudinal waves have regions where particles are squashed together (compressions) and spread apart (rarefactions).' },
  { s:3, q:'Two oscilloscope traces have the same amplitude, but trace B has waves twice as close together. Trace B is', o:['louder','quieter','higher pitched','lower pitched'], a:2, e:'Closer waves mean a higher frequency, so a higher pitch. Equal amplitude means equal loudness.' },
  { s:3, q:'Which EM radiation is used to sterilise surgical instruments?', o:['Radio waves','Gamma rays','Microwaves','Visible light'], a:1, e:'Gamma rays are highly penetrating and ionising, so they kill bacteria inside sealed packaging.' },

  // ---- Section 4 ----
  { s:4, q:'A device is 25% efficient and is supplied with 2000 J. How much energy is usefully transferred?', o:['500 J','1500 J','8000 J','250 J'], a:0, e:'Useful = 25% of 2000 = 500 J. The other 1500 J is dissipated, mostly as thermal energy.' },
  { s:4, q:'Which is the correct energy store for a stretched elastic band?', o:['Chemical','Elastic potential','Thermal','Nuclear'], a:1, e:'Stretching or compressing an object transfers energy to its elastic potential store.' },
  { s:4, q:'Why does the freezer compartment sit at the top of some fridges?', o:['So warm air rises past it','So the cold air it produces sinks and circulates by convection','To keep it away from the motor','Because cold air rises'], a:1, e:'Cooled air becomes denser and sinks, setting up a convection current that cools the whole fridge.' },
  { s:4, q:'A crane lifts a 500 N load 12 m in 20 s. What is its power output?', o:['300 W','833 W','6000 W','120 000 W'], a:0, e:'W = F × d = 500 × 12 = 6000 J. P = W ÷ t = 6000 ÷ 20 = 300 W.' },
  { s:4, q:'Which resource does NOT ultimately get its energy from the Sun?', o:['Wind','Hydroelectric','Tidal','Biomass'], a:2, e:'Tidal energy comes from the gravitational pull of the Moon (and the Sun’s gravity), not from solar heating. Nuclear and geothermal are the other exceptions.' },
  { s:4, q:'A ball of mass 0.2 kg is dropped from 5 m. Ignoring air resistance, what is its speed on landing? (g = 10 N/kg)', o:['10 m/s','50 m/s','5 m/s','100 m/s'], a:0, e:'mgh = ½mv², so v = √(2gh) = √(2 × 10 × 5) = √100 = 10 m/s. The mass cancels.' },
  { s:4, q:'In a Sankey diagram, what must be true?', o:['The useful arrow is always widest','Total width in equals total width out','Wasted energy is not shown','The arrows must all be the same width'], a:1, e:'Energy is conserved, so the total energy entering equals the total leaving.' },
  { s:4, q:'Which surface is the best absorber of infrared radiation?', o:['Shiny silver','Matt black','Polished white','Mirror glass'], a:1, e:'Matt black is the best absorber and the best emitter. Shiny surfaces reflect.' },
  { s:4, q:'Which is a disadvantage of solar cells for large-scale generation?', o:['They release carbon dioxide','Output depends on the weather and time of day','They need a turbine','They produce radioactive waste'], a:1, e:'Solar output is unreliable and zero at night, so it must be backed by storage or other sources.' },
  { s:4, q:'Doing 1 J of work means', o:['applying 1 N over 1 m in the direction of the force','applying 1 N for 1 second','moving 1 kg by 1 m','transferring 1 W of power'], a:0, e:'W = F × d, so 1 joule is one newton-metre.' },
  { s:4, q:'Energy is "dissipated" means it is', o:['destroyed','spread out to the surroundings and becomes less useful','converted into mass','stored permanently'], a:1, e:'Energy is never destroyed. Dissipated energy is spread thinly to the surroundings, usually as thermal energy.' },

  // ---- Section 5 ----
  { s:5, q:'A liquid has a density of 800 kg/m³. What is the mass of 0.25 m³ of it?', o:['3200 kg','200 kg','0.0003 kg','800.25 kg'], a:1, e:'m = ρ × V = 800 × 0.25 = 200 kg.' },
  { s:5, q:'Why do wide tyres help a tractor cross soft ground?', o:['They increase the force on the ground','They reduce the pressure by spreading the weight over a larger area','They reduce the tractor’s weight','They increase friction only'], a:1, e:'p = F ÷ A. A larger contact area gives a lower pressure, so the tractor sinks less.' },
  { s:5, q:'In which state are particles far apart and moving quickly in all directions?', o:['Solid','Liquid','Gas','All equally'], a:2, e:'Gas particles are widely spaced with random rapid motion, which is why gases fill their container and have low density.' },
  { s:5, q:'What is 100 K in degrees Celsius?', o:['373 °C','−173 °C','173 °C','−373 °C'], a:1, e:'θ = T − 273 = 100 − 273 = −173 °C.' },
  { s:5, q:'A gas at 300 K and 2.0 × 10⁵ Pa is heated to 600 K at constant volume. What is the new pressure?', o:['1.0 × 10⁵ Pa','2.0 × 10⁵ Pa','4.0 × 10⁵ Pa','6.0 × 10⁵ Pa'], a:2, e:'p₁/T₁ = p₂/T₂. Doubling the kelvin temperature at constant volume doubles the pressure.' },
  { s:5, q:'How much energy raises 0.5 kg of copper by 20 °C? (c = 385 J/kg °C)', o:['3850 J','7700 J','385 J','19 250 J'], a:0, e:'ΔQ = m × c × ΔT = 0.5 × 385 × 20 = 3850 J.' },
  { s:5, q:'A dam wall is built thicker at the bottom because', o:['water is denser at the bottom','pressure increases with depth','the water is colder there','it looks better'], a:1, e:'p = hρg. Greater depth means greater pressure, so the wall needs to be stronger lower down.' },
  { s:5, q:'What is the volume in m³ of a 500 cm³ container?', o:['0.5 m³','0.05 m³','0.0005 m³','500 000 m³'], a:2, e:'Divide by 1 000 000: 500 ÷ 1 000 000 = 5 × 10⁻⁴ m³.' },
  { s:5, q:'During condensation, particles', o:['gain energy and move further apart','lose energy and move closer together','stay at the same energy','break apart into atoms'], a:1, e:'Condensation is gas to liquid. Energy is released to the surroundings as the particles come closer together.' },
  { s:5, q:'How would you find the volume of an irregular stone?', o:['Measure its sides with a ruler','Use a displacement can and measure the water pushed out','Weigh it on a balance','Divide its mass by its density'], a:1, e:'The volume of water displaced equals the volume of the object.' },

  // ---- Section 6 ----
  { s:6, q:'Where is a magnetic field strongest around a bar magnet?', o:['At the centre','At the poles','Halfway along the side','It is uniform everywhere'], a:1, e:'Field lines are closest together at the poles, which shows the field is strongest there.' },
  { s:6, q:'What is the shape of the magnetic field around a long straight current-carrying wire?', o:['Straight parallel lines','Concentric circles around the wire','A bar magnet pattern','No field is produced'], a:1, e:'Use the right-hand grip rule: thumb along the conventional current, fingers curl in the direction of the field.' },
  { s:6, q:'A transformer steps 400 000 V down to 230 V. If the primary has 800 000 turns, how many are on the secondary?', o:['460','230','1600','400'], a:0, e:'n_s = n_p × V_s/V_p = 800 000 × 230/400 000 = 460 turns.' },
  { s:6, q:'Reversing both the current and the magnetic field direction in a motor', o:['reverses the force','leaves the force direction unchanged','doubles the force','makes the force zero'], a:1, e:'Two reversals cancel out. Reversing just one of them would reverse the force.' },
  { s:6, q:'A solenoid’s magnetic field pattern most closely resembles that of', o:['a single straight wire','a bar magnet','a horseshoe magnet with no gap','no recognisable pattern'], a:1, e:'Outside a solenoid the field looks just like a bar magnet’s, with a north and a south end.' },
  { s:6, q:'Which is NOT a way to increase the voltage induced in a coil?', o:['Move the magnet faster','Use more turns on the coil','Hold the magnet still inside the coil','Use a stronger magnet'], a:2, e:'A stationary magnet produces no change in field, so no voltage at all is induced.' },
  { s:6, q:'In a loudspeaker, what makes the cone vibrate?', o:['Electromagnetic induction in the magnet','The motor effect on the current-carrying coil in a magnetic field','Static charge on the cone','Heating of the coil'], a:1, e:'The alternating current in the coil experiences a reversing force in the permanent field, pushing the cone back and forth.' },
  { s:6, q:'A steel bar is a better choice than iron for', o:['a transformer core','an electromagnet core','a permanent magnet','a relay core'], a:2, e:'Steel is magnetically hard, so it keeps its magnetism. Iron is magnetically soft and is used where the magnetism must switch off.' },
  { s:6, q:'Increasing the speed of rotation of an a.c. generator causes the output to have', o:['larger amplitude and higher frequency','smaller amplitude and lower frequency','larger amplitude only','higher frequency only'], a:0, e:'Faster rotation means the field changes more rapidly, giving a bigger peak voltage, and more cycles per second.' },
  { s:6, q:'Why must the two magnetic field lines never cross?', o:['They would cancel out','A point cannot have two different field directions at once','They would create a monopole','Crossing lines mean zero field'], a:1, e:'A field line shows the direction of the force at that point, and there can only be one such direction.' },

  // ---- Section 7 ----
  { s:7, q:'Which particle has a relative charge of +1?', o:['Electron','Neutron','Proton','Alpha particle'], a:2, e:'Proton +1, electron −1, neutron 0. An alpha particle is +2 because it contains two protons.' },
  { s:7, q:'How many protons and neutrons are in ²³₁₁Na?', o:['11 protons, 23 neutrons','11 protons, 12 neutrons','12 protons, 11 neutrons','23 protons, 11 neutrons'], a:1, e:'Protons = atomic number = 11. Neutrons = 23 − 11 = 12.' },
  { s:7, q:'After alpha decay, the mass number of the nucleus', o:['decreases by 2','decreases by 4','increases by 1','stays the same'], a:1, e:'An alpha particle carries away 2 protons and 2 neutrons, so A falls by 4 and Z falls by 2.' },
  { s:7, q:'Which radiation is deflected most by a magnetic field?', o:['Alpha','Beta','Gamma','All equally'], a:1, e:'Beta particles are much lighter than alpha particles, so for a given charge they are deflected far more. Gamma is uncharged and is not deflected at all.' },
  { s:7, q:'A source falls from 480 Bq to 60 Bq in 12 days. What is its half-life?', o:['2 days','3 days','4 days','6 days'], a:2, e:'480 → 240 → 120 → 60 is three half-lives in 12 days, so the half-life is 4 days.' },
  { s:7, q:'Which is used in a smoke alarm?', o:['A gamma emitter','An alpha emitter','A beta emitter','A neutron source'], a:1, e:'Alpha radiation ionises the air in the chamber, allowing a small current. Smoke absorbs the alpha, the current falls and the alarm sounds.' },
  { s:7, q:'Which is an artificial source of background radiation?', o:['Radon gas','Cosmic rays','Medical X-rays','Rocks and soil'], a:2, e:'Medical imaging and the nuclear industry are artificial. Radon, cosmic rays, rocks and food are natural.' },
  { s:7, q:'What is released, along with energy, when uranium-235 undergoes fission?', o:['Only gamma rays','Two smaller nuclei and two or three neutrons','A single large nucleus','Alpha particles only'], a:1, e:'The extra neutrons are what allow the chain reaction to continue.' },
  { s:7, q:'In beta decay, what happens inside the nucleus?', o:['A proton becomes a neutron','A neutron becomes a proton and an electron','Two protons are ejected','An electron is captured from a shell'], a:1, e:'The electron produced is emitted as the beta particle, leaving one more proton behind.' },
  { s:7, q:'Which measure does NOT reduce a worker’s exposure to a radioactive source?', o:['Handling it with long tongs','Storing it in a lead-lined box','Holding it closer to see it better','Limiting the time spent near it'], a:2, e:'Distance, shielding and time are the three protections. Reducing distance increases exposure.' },
  { s:7, q:'Beta radiation is used to monitor the thickness of aluminium foil because', o:['it passes straight through unchanged','the amount absorbed changes noticeably with small thickness changes','it is completely blocked by foil','it has no effect on the foil'], a:1, e:'Alpha would be blocked entirely and gamma would pass through almost unaffected, so neither would detect a change.' },

  // ---- Section 8 ----
  { s:8, q:'Why does Neptune take much longer than Mercury to orbit the Sun?', o:['It is much heavier','It is much further away, so it travels a longer path more slowly','It orbits in the opposite direction','It has more moons'], a:1, e:'A larger orbital radius means a much longer circumference and a weaker gravitational pull, so a slower orbital speed.' },
  { s:8, q:'Which object emits its own light?', o:['A moon','A planet','A star','A comet'], a:2, e:'Stars produce light by nuclear fusion. Moons, planets and comets only reflect it.' },
  { s:8, q:'Gravitational field strength on Jupiter is about 25 N/kg. What would a 50 kg person weigh there?', o:['2 N','75 N','1250 N','500 N'], a:2, e:'W = m × g = 50 × 25 = 1250 N. Their mass is still 50 kg.' },
  { s:8, q:'Which stage comes immediately after a red supergiant?', o:['White dwarf','Supernova','Nebula','Main sequence'], a:1, e:'Massive stars explode as a supernova, leaving a neutron star or a black hole.' },
  { s:8, q:'A satellite in a circular orbit at constant speed', o:['has zero acceleration','is accelerating towards the centre of its orbit','is accelerating away from the Earth','has no force acting on it'], a:1, e:'Its direction changes constantly, so its velocity changes. The acceleration and the gravitational force both point towards the centre.' },
  { s:8, q:'Greater red shift in the light from a galaxy means the galaxy is', o:['closer and slower','further away and receding faster','moving towards us','stationary'], a:1, e:'Hubble’s law: speed of recession is proportional to distance, and red shift increases with speed.' },
  { s:8, q:'The asteroid belt lies between', o:['Earth and Mars','Mars and Jupiter','Jupiter and Saturn','Neptune and the Sun'], a:1, e:'Most asteroids in the Solar System orbit in a belt between Mars and Jupiter.' },
  { s:8, q:'Cosmic microwave background radiation is observed', o:['only from the direction of the Milky Way','coming equally from all directions','only near black holes','only from the Sun'], a:1, e:'Its uniformity in every direction is what makes it strong evidence for the Big Bang.' },
  { s:8, q:'On a temperature–luminosity diagram, red giants are', o:['hot and dim','cool but very bright','hot and very bright','cool and dim'], a:1, e:'They are cool at the surface but enormous, so their total light output is high. They sit above the main sequence.' },
  { s:8, q:'A protostar becomes a main sequence star when', o:['it stops contracting','it becomes hot and dense enough for hydrogen fusion to begin','it runs out of hydrogen','it explodes'], a:1, e:'Fusion starting is the defining moment, and the outward pressure it creates then balances gravity.' },
  { s:8, q:'Uncertainty in the age of the Universe is mainly because', o:['the Hubble constant is hard to measure accurately','red shift cannot be detected','galaxies do not move','the speed of light is unknown'], a:0, e:'Measuring distances to very remote galaxies is difficult, so H₀ carries a large uncertainty and age ≈ 1/H₀ inherits it.' }

);

<script>
/* data/exam-1-4.js */
/* Exam-style structured questions with mark schemes.
   parts[]: q = question, marks = mark allocation, ms[] = mark scheme points,
   tip = what examiners are actually looking for. */
window.EXAMQS = window.EXAMQS || [];

EXAMQS.push(

{ s:1, title:'A journey on a velocity–time graph', context:
  'A cyclist starts from rest. She accelerates uniformly to 8 m/s in 10 s, travels at that speed for 30 s, then brakes uniformly and stops in a further 4 s.',
  parts:[
    { q:'Calculate the acceleration during the first 10 s.', marks:2,
      ms:['a = (v − u) / t = (8 − 0) / 10','= 0.8 m/s²'],
      tip:'One mark for the substitution, one for the answer with its unit. Write the equation first — it earns credit even if the arithmetic goes wrong.' },
    { q:'Calculate the total distance travelled.', marks:3,
      ms:['Acceleration phase: ½ × 10 × 8 = 40 m','Constant phase: 30 × 8 = 240 m','Braking phase: ½ × 4 × 8 = 16 m; total = 296 m'],
      tip:'Distance is the area under a velocity–time graph. Split it into a triangle, a rectangle and a triangle, then add.' },
    { q:'Calculate the deceleration during braking.', marks:2,
      ms:['a = (0 − 8) / 4','= −2 m/s² (a deceleration of 2 m/s²)'],
      tip:'A negative answer is correct here. Say "deceleration of 2 m/s²" or keep the minus sign — do not do both.' },
    { q:'The cyclist and her bike have a total mass of 75 kg. Calculate the braking force.', marks:2,
      ms:['F = m × a = 75 × 2','= 150 N'],
      tip:'Use the size of the deceleration. The force acts backwards, opposite to the motion.' }
  ]},

{ s:1, title:'Falling and terminal velocity', context:
  'A skydiver of mass 80 kg jumps from a plane. Take g = 10 N/kg.',
  parts:[
    { q:'Calculate her weight.', marks:2,
      ms:['W = m × g = 80 × 10','= 800 N'],
      tip:'Weight is a force in newtons. Mass stays 80 kg throughout.' },
    { q:'Explain, in terms of the forces acting, why she reaches a terminal velocity.', marks:4,
      ms:['At first weight is greater than air resistance, so there is a resultant force downwards and she accelerates',
          'As her speed increases, air resistance increases',
          'Eventually air resistance equals her weight',
          'The resultant force is now zero, so she stops accelerating and falls at a constant (terminal) velocity'],
      tip:'This is a classic 4-marker. Examiners want the sequence: unbalanced → drag grows → balanced → zero resultant → constant velocity. Never write that she "stops" — she is still falling.' },
    { q:'She opens her parachute. Describe and explain what happens to her velocity.', marks:3,
      ms:['Air resistance increases suddenly and becomes greater than her weight',
          'There is now a resultant force upwards, so she decelerates',
          'As she slows, air resistance falls until it again equals weight, giving a new, lower terminal velocity'],
      tip:'She decelerates — she does not move upwards. The forces re-balance at a slower speed.' }
  ]},

{ s:1, title:'Momentum in a collision', context:
  'A 1200 kg car travelling at 15 m/s collides with a stationary 800 kg car. The two vehicles lock together and move off along the same straight line.',
  parts:[
    { q:'Calculate the momentum of the moving car before the collision.', marks:2,
      ms:['p = m × v = 1200 × 15','= 18 000 kg m/s'], p2:true,
      tip:'Momentum units are kg m/s. There is no shortcut name for them.' },
    { q:'Calculate the velocity of the wreckage immediately after the collision.', marks:3,
      ms:['Total momentum before = total momentum after','18 000 = (1200 + 800) × v','v = 18 000 / 2000 = 9 m/s'], p2:true,
      tip:'State conservation of momentum explicitly — it is worth a mark. The stationary car contributes zero momentum before.' },
    { q:'Explain how a crumple zone reduces the force on the driver.', marks:3,
      ms:['The crumple zone increases the time taken for the momentum to change',
          'Force = change in momentum ÷ time',
          'For the same change in momentum, a longer time means a smaller force'], p2:true,
      tip:'You must quote the relationship. "It absorbs the impact" on its own scores nothing.' }
  ]},

{ s:1, title:'Moments and a balanced beam', context:
  'A uniform plank of weight 200 N and length 4.0 m rests on a pivot at its centre. A child of weight 300 N sits 1.2 m from the pivot on the left.',
  parts:[
    { q:'Calculate the moment of the child about the pivot.', marks:2,
      ms:['moment = force × perpendicular distance = 300 × 1.2','= 360 N m'],
      tip:'Units are N m, not N/m. The distance must be measured from the pivot.' },
    { q:'A second child sits on the right and the plank balances. She is 1.5 m from the pivot. Calculate her weight.', marks:3,
      ms:['Principle of moments: clockwise moment = anticlockwise moment','W × 1.5 = 360','W = 240 N'],
      tip:'The plank is uniform and pivoted at its centre, so its own weight acts through the pivot and has zero moment — ignore it.' },
    { q:'State what is meant by the centre of gravity of an object.', marks:1,
      ms:['The single point through which the whole weight of the object can be taken to act'],
      tip:'A one-line definition. Do not confuse it with the centre of the object, though for a uniform object they coincide.' }
  ]},

{ s:2, title:'A series and parallel circuit', context:
  'A 12 V battery is connected to a 4 Ω resistor in series with a parallel combination of two 6 Ω resistors.',
  parts:[
    { q:'Calculate the resistance of the two 6 Ω resistors in parallel.', marks:2,
      ms:['Two equal resistors in parallel give half the resistance of one','= 3 Ω'],
      tip:'For two identical resistors in parallel, halve the value. It is the fastest route and it is fully creditworthy.' },
    { q:'Calculate the current drawn from the battery.', marks:3,
      ms:['Total resistance = 4 + 3 = 7 Ω','I = V / R = 12 / 7','= 1.7 A (2 s.f.)'],
      tip:'Add series resistances first, then apply V = IR to the whole circuit.' },
    { q:'Calculate the voltage across the 4 Ω resistor.', marks:2,
      ms:['V = I × R = 1.7 × 4','= 6.9 V (allow 6.86 V)'],
      tip:'The current through a series component is the full circuit current. Carry your unrounded value through to avoid drift.' },
    { q:'Explain why household lighting circuits are wired in parallel rather than in series.', marks:3,
      ms:['Each lamp gets the full mains voltage so it operates at normal brightness',
          'If one lamp fails the others stay on, because each branch is a separate path',
          'Each lamp can be switched on and off independently'],
      tip:'Three distinct reasons for three marks. Do not repeat the same idea in different words.' }
  ]},

{ s:2, title:'Mains electricity and safety', context:
  'An electric kettle is rated at 2300 W and runs from a 230 V mains supply.',
  parts:[
    { q:'Calculate the current in the kettle when it is working normally.', marks:2,
      ms:['I = P / V = 2300 / 230','= 10 A'],
      tip:'Rearrange P = IV. Keep the numbers tidy — this one divides exactly.' },
    { q:'Fuses of 3 A, 5 A and 13 A are available. State which should be fitted and explain why.', marks:2,
      ms:['13 A','It is the next rating above the normal operating current of 10 A, so the fuse carries the working current without melting but still blows if a fault causes a larger current'],
      tip:'Always pick the next standard rating above the working current. A 5 A fuse would blow every time the kettle was used.' },
    { q:'Calculate the energy transferred when the kettle runs for 3 minutes.', marks:3,
      ms:['t = 3 × 60 = 180 s','E = P × t = 2300 × 180','= 414 000 J'],
      tip:'Convert minutes to seconds first. Forgetting this is one of the most common errors on the paper.' },
    { q:'The kettle has a metal case connected to the earth wire. Explain how this protects the user.', marks:3,
      ms:['If the live wire touches the metal case, the case would become live',
          'The earth wire provides a low-resistance path to the ground, so a very large current flows',
          'This melts the fuse, breaking the live connection and isolating the appliance'],
      tip:'The earth wire alone does not make it safe — it works together with the fuse. Say so.' }
  ]},

{ s:2, title:'Current–voltage characteristics', context:
  'A student investigates how the current through a filament lamp varies with the voltage across it.',
  parts:[
    { q:'Draw and describe the shape of the current–voltage graph obtained.', marks:2,
      ms:['An S-shaped curve passing through the origin','The gradient decreases as voltage increases (the curve flattens)'],
      tip:'Sketch it symmetrically through the origin — the lamp behaves the same way whichever direction the current flows.' },
    { q:'Explain the shape of the graph.', marks:3,
      ms:['As current increases, the filament gets hotter',
          'The metal ions vibrate more, so electrons collide with them more often',
          'The resistance therefore increases, so current rises less steeply than voltage'],
      tip:'Link temperature to ion vibration to collisions to resistance. "It heats up" alone is one mark at best.' },
    { q:'State how the resistance of a thermistor changes as its temperature rises, and give one use.', marks:2,
      ms:['The resistance decreases','Used as a temperature sensor, e.g. in a thermostat, fire alarm or oven controller'],
      tip:'Thermistor: temperature up, resistance down. LDR: light up, resistance down. Learn both together.' }
  ]},

{ s:3, title:'Wave properties and the wave equation', context:
  'A water wave has a wavelength of 2.5 m. Twelve complete waves pass a fixed post in 30 s.',
  parts:[
    { q:'Calculate the frequency of the wave.', marks:2,
      ms:['f = number of waves ÷ time = 12 / 30','= 0.4 Hz'],
      tip:'Frequency is waves per second. You can also get it from f = 1/T with T = 2.5 s.' },
    { q:'Calculate the speed of the wave.', marks:2,
      ms:['v = f × λ = 0.4 × 2.5','= 1.0 m/s'],
      tip:'Check the units multiply correctly: Hz × m = m/s.' },
    { q:'The waves pass into shallower water and slow down. State what happens to the frequency and to the wavelength.', marks:2,
      ms:['The frequency stays the same','The wavelength decreases'],
      tip:'Frequency is fixed by the source and never changes at a boundary. It is the wavelength that adjusts.' },
    { q:'Explain the difference between a transverse and a longitudinal wave, giving one example of each.', marks:3,
      ms:['Transverse: the oscillations are at right angles to the direction of energy transfer, e.g. light or water waves',
          'Longitudinal: the oscillations are parallel to the direction of energy transfer, e.g. sound',
          'Longitudinal waves consist of compressions and rarefactions'],
      tip:'Say "direction of energy transfer", not "direction the wave moves in" — the examiner wants the precise phrasing.' }
  ]},

{ s:3, title:'Refraction and total internal reflection', context:
  'A ray of light travels from air into a glass block. The angle of incidence is 40° and the angle of refraction is 25°.',
  parts:[
    { q:'Calculate the refractive index of the glass.', marks:3,
      ms:['n = sin i / sin r','= sin 40 / sin 25 = 0.643 / 0.423','= 1.52'],
      tip:'Refractive index has no unit and must come out greater than 1. If yours is below 1, you have the angles the wrong way round.' },
    { q:'Calculate the critical angle for this glass.', marks:3,
      ms:['sin c = 1 / n = 1 / 1.52','sin c = 0.658','c = 41°'],
      tip:'Remember the inverse sine at the end. Check your calculator is in degrees.' },
    { q:'Explain how light is carried along an optical fibre.', marks:3,
      ms:['Light strikes the boundary at an angle of incidence greater than the critical angle',
          'It is totally internally reflected rather than refracting out',
          'It repeatedly reflects along the fibre, so almost no light escapes and the signal travels a long distance'],
      tip:'Both conditions must be stated: going from denser to less dense, and above the critical angle.' },
    { q:'State one advantage of using optical fibres rather than copper cables for communication.', marks:1,
      ms:['They carry far more information / lose less signal over distance / are not affected by electrical interference'],
      tip:'Any one clear advantage will do. Keep it specific.' }
  ]},

{ s:3, title:'The electromagnetic spectrum', context:
  'The electromagnetic spectrum is a family of transverse waves that all travel at the same speed in a vacuum.',
  parts:[
    { q:'List the seven regions of the electromagnetic spectrum in order of increasing frequency.', marks:2,
      ms:['Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma','All seven in the correct order'],
      tip:'Make up a mnemonic and write the list out in the margin at the start of the exam.' },
    { q:'A radio wave has a frequency of 200 kHz. Calculate its wavelength. (speed of EM waves = 3 × 10⁸ m/s)', marks:3,
      ms:['f = 200 000 Hz','λ = v / f = 3 × 10⁸ / 2 × 10⁵','= 1500 m'],
      tip:'Convert kHz to Hz before substituting. Standard form keeps this tidy.' },
    { q:'Describe one use and one danger for each of ultraviolet and microwave radiation.', marks:4,
      ms:['UV use: fluorescent lamps, security marking or sun beds','UV danger: skin cancer, eye damage or premature skin ageing',
          'Microwave use: cooking food or satellite and mobile phone communication','Microwave danger: internal heating of body tissue'],
      tip:'Four separate marks — answer all four parts explicitly rather than writing one general paragraph.' }
  ]},

{ s:4, title:'Energy transfers on a slide', context:
  'A child of mass 30 kg slides down a slide of vertical height 2.5 m. She reaches the bottom at 5.0 m/s. Take g = 10 N/kg.',
  parts:[
    { q:'Calculate the gravitational potential energy she loses.', marks:2,
      ms:['GPE = m × g × h = 30 × 10 × 2.5','= 750 J'],
      tip:'h is the vertical height, not the length of the slide.' },
    { q:'Calculate her kinetic energy at the bottom.', marks:2,
      ms:['KE = ½ m v² = 0.5 × 30 × 5.0²','= 375 J'],
      tip:'Square the speed before multiplying. 0.5 × 30 × 25, not (0.5 × 30 × 5)².' },
    { q:'Explain why the two answers are different.', marks:2,
      ms:['Energy is transferred to the thermal store by friction between the child and the slide (and by air resistance)',
          'This energy is dissipated to the surroundings, so it is not transferred to the kinetic store'],
      tip:'Energy is never "lost" — it is dissipated or transferred to the surroundings. Use that wording.' },
    { q:'Calculate the efficiency of the slide in transferring GPE to KE.', marks:2,
      ms:['efficiency = (375 / 750) × 100','= 50%'],
      tip:'Useful output over total input. An answer above 100% means you divided the wrong way round.' }
  ]},

{ s:4, title:'Reducing heat loss from a house', context:
  'A homeowner wants to reduce the energy wasted from her house in winter.',
  parts:[
    { q:'Explain how loft insulation reduces energy transfer.', marks:3,
      ms:['The insulation traps pockets of air',
          'Air is a poor conductor, so conduction through the roof is reduced',
          'The trapped air cannot circulate, so convection currents are also reduced'],
      tip:'Two mechanisms, conduction and convection, both need naming for full marks.' },
    { q:'Explain why shiny foil placed behind a radiator helps.', marks:2,
      ms:['A shiny surface is a good reflector of infrared radiation',
          'It reflects the radiation back into the room instead of it being absorbed by the wall'],
      tip:'Radiation only. Foil does nothing useful for conduction or convection here.' },
    { q:'Describe how you would investigate which surface is the best emitter of infrared radiation.', marks:4,
      ms:['Fill a Leslie cube with hot water and place it on a mat',
          'Hold an infrared detector a fixed distance from one face and record the reading',
          'Repeat for the matt black, shiny black, matt white and shiny silver faces at the same distance',
          'Control the water temperature and the distance; matt black gives the highest reading'],
      tip:'The examiner is looking for the controlled variable — the same distance every time — as much as for the method.' }
  ]},

{ s:4, title:'Generating electricity', context:
  'A country is choosing between building a new gas-fired power station and a wind farm of the same output.',
  parts:[
    { q:'Describe the energy transfers in a gas-fired power station.', marks:3,
      ms:['Chemical energy in the gas is transferred to thermal energy by burning',
          'The thermal energy boils water to make steam, which turns a turbine (kinetic)',
          'The turbine drives a generator, which transfers energy electrically'],
      tip:'Follow the chain in order: chemical → thermal → kinetic → electrical.' },
    { q:'Give two advantages and two disadvantages of the wind farm compared with the gas station.', marks:4,
      ms:['Advantage: no fuel cost, and no carbon dioxide released in use',
          'Advantage: the resource is renewable and will not run out',
          'Disadvantage: output is unreliable because it depends on the wind',
          'Disadvantage: high set-up cost, visual impact and noise, and many turbines are needed for the same output'],
      tip:'Balanced evaluation questions want distinct points on both sides. Avoid vague answers like "it is better for the environment".' },
    { q:'Explain why electricity is transmitted across the National Grid at very high voltage.', marks:3,
      ms:['For a given power, a higher voltage means a smaller current',
          'Energy wasted heating the cables depends on the square of the current',
          'So a smaller current means far less energy dissipated, making transmission more efficient'],
      tip:'The step-up transformer raises voltage and lowers current. That current reduction is the whole point.' }
  ]}

);
