<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>BITWISE · IGCSE Computer Science</title>
<meta name="description" content="The whole Cambridge IGCSE Computer Science (0478) syllabus as notes, flashcards, quizzes and interactive labs. Works offline, saves your progress."/>
<meta name="theme-color" content="#0b0f17"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0f17'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='monospace' fill='%2364f0c8'%3E%3C/%3E%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <a class="brand" href="#/home">
    <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
    <span class="brand-text">
      <b>BITWISE</b>
      <small>IGCSE Computer Science 0478</small>
    </span>
  </a>

  <button class="search-trigger" id="searchTrigger">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Search the syllabus</span>
    <kbd>/</kbd>
  </button>

  <div class="topbar-right">
    <div class="streak" id="streakChip" title="Days studied in a row">
      <span class="flame" aria-hidden="true">&#128293;</span><b id="streakNum">0</b>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Syllabus navigation">
    <nav id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <div class="overall">
        <div class="overall-top"><span>Syllabus covered</span><b id="overallPct">0%</b></div>
        <div class="bar"><i id="overallBar" style="width:0%"></i></div>
      </div>
      <button class="ghost-btn" id="resetBtn">Reset my progress</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1"></main>
</div>

<div class="searchbox" id="searchBox" hidden>
  <div class="searchbox-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="searchbox-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Try: two's complement, DDoS, trace table, SELECT" autocomplete="off" spellcheck="false"/>
      <kbd>esc</kbd>
    </div>
    <div class="searchbox-results" id="searchResults"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<script src="./js/data/syllabus-p1.js"></script>
<script src="./js/data/syllabus-p2.js"></script>
<script src="./js/data/questions.js"></script>
<script src="./js/store.js"></script>
<script src="./js/tools.js"></script>
<script src="./js/quiz.js"></script>
<script src="./js/cards.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
