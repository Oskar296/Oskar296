      edges: [["s", "in"], ["in", "d"], ["d", "p", "Yes", "left"], ["d", "f", "No", "right"], ["p", "e", "", "join"], ["f", "e", "", "join"]],
      cond: { d: st => st.Mark >= 50 }
    },
    {
      name: "Total five numbers",
      about: "A count-controlled loop drawn as a decision with a back edge. Follow the arrow that goes back up.",
      vars: ["Count", "Total", "Num"],
      inputs: [4, 8, 15, 16, 23],
      nodes: [
        { id: "s", type: "term", x: 210, y: 26, t: "BEGIN", next: "init" },
        { id: "init", type: "proc", x: 210, y: 96, t: "Total = 0, Count = 0", next: "in", act: st => { st.Total = 0; st.Count = 0; } },
        { id: "in", type: "io", x: 210, y: 170, t: "INPUT Num", next: "add", act: (st, io) => { st.Num = io.next(); } },
        { id: "add", type: "proc", x: 210, y: 244, t: "Total = Total + Num", next: "inc", act: st => { st.Total += st.Num; } },
        { id: "inc", type: "proc", x: 210, y: 318, t: "Count = Count + 1", next: "d", act: st => { st.Count += 1; } },
        { id: "d", type: "dec", x: 210, y: 404, t: "Count = 5?", yes: "out", no: "in" },
        { id: "out", type: "io", x: 210, y: 500, t: "OUTPUT Total", next: "e", act: (st, io) => io.out(st.Total) },
        { id: "e", type: "term", x: 210, y: 574, t: "END" }
      ],
      edges: [["s", "init"], ["init", "in"], ["in", "add"], ["add", "inc"], ["inc", "d"],
              ["d", "out", "Yes"], ["d", "in", "No", "back"]],
      cond: { d: st => st.Count === 5 }
    },
    {
      name: "Largest of three",
      about: "Two decisions in sequence. Trace it carefully when two of the numbers are equal.",
      vars: ["A", "B", "C", "Big"],
      inputs: [12, 40, 7],
      nodes: [
        { id: "s", type: "term", x: 210, y: 26, t: "BEGIN", next: "in" },
        { id: "in", type: "io", x: 210, y: 96, t: "INPUT A, B, C", next: "set", act: (st, io) => { st.A = io.next(); st.B = io.next(); st.C = io.next(); } },
        { id: "set", type: "proc", x: 210, y: 170, t: "Big = A", next: "d1", act: st => { st.Big = st.A; } },
        { id: "d1", type: "dec", x: 210, y: 256, t: "B > Big?", yes: "sb", no: "d2" },
        { id: "sb", type: "proc", x: 60, y: 256, t: "Big = B", next: "d2", act: st => { st.Big = st.B; } },
        { id: "d2", type: "dec", x: 210, y: 360, t: "C > Big?", yes: "sc", no: "out" },
        { id: "sc", type: "proc", x: 60, y: 360, t: "Big = C", next: "out", act: st => { st.Big = st.C; } },
        { id: "out", type: "io", x: 210, y: 456, t: "OUTPUT Big", next: "e", act: (st, io) => io.out(st.Big) },
        { id: "e", type: "term", x: 210, y: 530, t: "END" }
      ],
      edges: [["s", "in"], ["in", "set"], ["set", "d1"], ["d1", "sb", "Yes", "side"], ["d1", "d2", "No"],
              ["sb", "d2", "", "rejoin"], ["d2", "sc", "Yes", "side"], ["d2", "out", "No"], ["sc", "out", "", "rejoin"]],
      cond: { d1: st => st.B > st.Big, d2: st => st.C > st.Big }
    },
    {
      name: "Validate with a rogue value",
      about: "A loop that stops on a rogue value, and rejects anything out of range on the way. Enter -1 to finish.",
      vars: ["Num", "Count"],
      inputs: [15, 250, 40, -1],
      nodes: [
        { id: "s", type: "term", x: 210, y: 26, t: "BEGIN", next: "init" },
        { id: "init", type: "proc", x: 210, y: 96, t: "Count = 0", next: "in", act: st => { st.Count = 0; } },
        { id: "in", type: "io", x: 210, y: 170, t: "INPUT Num", next: "d1", act: (st, io) => { st.Num = io.next(); } },
        { id: "d1", type: "dec", x: 210, y: 256, t: "Num = -1?", yes: "out", no: "d2" },
        { id: "d2", type: "dec", x: 210, y: 366, t: "Num > 100?", yes: "err", no: "inc" },
        { id: "err", type: "io", x: 60, y: 366, t: 'OUTPUT "Too big"', next: "in", act: (st, io) => io.out("Too big") },
        { id: "inc", type: "proc", x: 210, y: 462, t: "Count = Count + 1", next: "in", act: st => { st.Count += 1; } },
        { id: "out", type: "io", x: 210, y: 546, t: "OUTPUT Count", next: "e", act: (st, io) => io.out(st.Count) },
        { id: "e", type: "term", x: 210, y: 620, t: "END" }
      ],
      edges: [["s", "init"], ["init", "in"], ["in", "d1"], ["d1", "d2", "No"], ["d1", "out", "Yes", "far"],
              ["d2", "err", "Yes", "side"], ["d2", "inc", "No"], ["err", "in", "", "up"], ["inc", "in", "", "back"]],
      cond: { d1: st => st.Num === -1, d2: st => st.Num > 100 }
    },
    {
      name: "Odd or even counter",
      about: "Uses MOD inside a count-controlled loop. Watch how the two counters only change on alternate passes.",
      vars: ["i", "Num", "Odd", "Even"],
      inputs: [4, 7, 10, 3],
      nodes: [
        { id: "s", type: "term", x: 210, y: 26, t: "BEGIN", next: "init" },
        { id: "init", type: "proc", x: 210, y: 96, t: "Odd = 0, Even = 0, i = 0", next: "in", act: st => { st.Odd = 0; st.Even = 0; st.i = 0; } },
        { id: "in", type: "io", x: 210, y: 170, t: "INPUT Num", next: "d1", act: (st, io) => { st.Num = io.next(); } },
        { id: "d1", type: "dec", x: 210, y: 256, t: "Num MOD 2 = 0?", yes: "ev", no: "od" },
        { id: "ev", type: "proc", x: 60, y: 340, t: "Even = Even + 1", next: "inc", act: st => { st.Even += 1; } },
        { id: "od", type: "proc", x: 350, y: 340, t: "Odd = Odd + 1", next: "inc", act: st => { st.Odd += 1; } },
        { id: "inc", type: "proc", x: 210, y: 416, t: "i = i + 1", next: "d2", act: st => { st.i += 1; } },
        { id: "d2", type: "dec", x: 210, y: 500, t: "i = 4?", yes: "out", no: "in" },
        { id: "out", type: "io", x: 210, y: 590, t: "OUTPUT Odd, Even", next: "e", act: (st, io) => io.out(st.Odd + " odd, " + st.Even + " even") },
        { id: "e", type: "term", x: 210, y: 664, t: "END" }
      ],
      edges: [["s", "init"], ["init", "in"], ["in", "d1"], ["d1", "ev", "Yes", "left"], ["d1", "od", "No", "right"],
              ["ev", "inc", "", "join"], ["od", "inc", "", "join"], ["inc", "d2"], ["d2", "out", "Yes"], ["d2", "in", "No", "back"]],
      cond: { d1: st => st.Num % 2 === 0, d2: st => st.i === 4 }
    },
    {
      name: "Password attempts",
      about: "A loop that gives up after three tries. Enter 0 for a wrong password and 1 for the right one.",
      vars: ["Tries", "Ok"],
      inputs: [0, 0, 1],
      nodes: [
        { id: "s", type: "term", x: 210, y: 26, t: "BEGIN", next: "init" },
        { id: "init", type: "proc", x: 210, y: 96, t: "Tries = 0", next: "in", act: st => { st.Tries = 0; } },
        { id: "in", type: "io", x: 210, y: 170, t: "INPUT Ok", next: "inc", act: (st, io) => { st.Ok = io.next(); } },
        { id: "inc", type: "proc", x: 210, y: 244, t: "Tries = Tries + 1", next: "d1", act: st => { st.Tries += 1; } },
        { id: "d1", type: "dec", x: 210, y: 330, t: "Ok = 1?", yes: "yes", no: "d2" },
        { id: "yes", type: "io", x: 60, y: 330, t: 'OUTPUT "Welcome"', next: "e", act: (st, io) => io.out("Welcome") },
        { id: "d2", type: "dec", x: 210, y: 440, t: "Tries = 3?", yes: "lock", no: "in" },
        { id: "lock", type: "io", x: 210, y: 530, t: 'OUTPUT "Locked out"', next: "e", act: (st, io) => io.out("Locked out") },
        { id: "e", type: "term", x: 210, y: 604, t: "END" }
      ],
      edges: [["s", "init"], ["init", "in"], ["in", "inc"], ["inc", "d1"], ["d1", "yes", "Yes", "side"],
              ["d1", "d2", "No"], ["d2", "lock", "Yes"], ["d2", "in", "No", "back"], ["yes", "e", "", "rejoin"]],
      cond: { d1: st => st.Ok === 1, d2: st => st.Tries === 3 }
    }
  ];

  function flowSvg(fc, activeId, visited) {
    const W = 440, H = Math.max.apply(null, fc.nodes.map(n => n.y)) + 80;
    const shape = n => {
      const w = n.type === "dec" ? 168 : 156, h = n.type === "dec" ? 66 : 42;
      const x = n.x - w / 2, y = n.y - h / 2;
      if (n.type === "term") return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '"/>';
      if (n.type === "proc") return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>';
      if (n.type === "io") return '<path d="M' + (x + 16) + ' ' + y + 'h' + w + 'l-16 ' + h + 'h-' + w + 'z"/>';
      return '<path d="M' + n.x + ' ' + y + 'l' + (w / 2) + ' ' + (h / 2) + 'l-' + (w / 2) + ' ' + (h / 2) + 'l-' + (w / 2) + ' -' + (h / 2) + 'z"/>';
    };
    const byId = id => fc.nodes.find(n => n.id === id);
    const half = n => (n.type === "dec" ? 33 : 21);

    let svg = '<defs><marker id="fcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
              '<path d="M0 0 L10 5 L0 10 z" class="fc-head"/></marker></defs>';

    fc.edges.forEach(([from, to, label, kind]) => {
      const a = byId(from), b = byId(to);
      let pts;
      if (kind === "back") {
        // return along the right, entering the target from its side so the
        // arrow does not sit on top of the forward edge coming down into it
        const x = a.x + 138;
        pts = [[a.x + 84, a.y], [x, a.y], [x, b.y], [b.x + 80, b.y]];
      } else if (kind === "left" || kind === "right") {
        pts = [[a.x + (kind === "left" ? -84 : 84), a.y], [b.x, a.y], [b.x, b.y - half(b)]];
      } else if (kind === "far") {
        const x = a.x - 138;
        pts = [[a.x - 84, a.y], [x, a.y], [x, b.y], [b.x - 80, b.y]];
      } else if (kind === "up") {
        pts = [[a.x, a.y - half(a)], [a.x, b.y - 34], [b.x - 80, b.y - 34], [b.x - 80, b.y]];
      } else if (kind === "side") {
        pts = [[a.x - 84, a.y], [b.x + 78, b.y]];
      } else if (kind === "rejoin") {
        pts = [[a.x, a.y + half(a)], [a.x, b.y], [b.x - 84, b.y]];
      } else if (kind === "join") {
        pts = [[a.x, a.y + half(a)], [a.x, b.y - 30], [b.x, b.y - 30], [b.x, b.y - half(b)]];
      } else {
        pts = [[a.x, a.y + half(a)], [b.x, b.y - half(b)]];
      }
      svg += '<polyline class="fc-wire" marker-end="url(#fcArrow)" points="' +
             pts.map(p => p[0] + "," + p[1]).join(" ") + '"/>';
      if (label) {
        // a vertical first segment needs the label beside the line, not on it
        const [x1, y1] = pts[0], [x2, y2] = pts[1];
        const vertical = Math.abs(x2 - x1) < 4;
        const lx = vertical ? x1 + 15 : x1 + (x2 - x1) / 2;
        const ly = vertical ? y1 + (y2 - y1) / 2 + 4 : y1 - 7;
        svg += '<text class="fc-yn" x="' + lx + '" y="' + ly + '">' + label + "</text>";
      }
    });

    fc.nodes.forEach(n => {
      const cls = "fc-node fc-" + n.type + (n.id === activeId ? " on" : "") + (visited.includes(n.id) ? " seen" : "");
      svg += '<g class="' + cls + '">' + shape(n) +
             '<text x="' + n.x + '" y="' + (n.y + 4) + '">' + esc(n.t) + "</text></g>";
    });

    return '<svg class="flowchart" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H +
           '" role="img" aria-label="Flowchart for ' + esc(fc.name) + '">' + svg + "</svg>";
  }

  const flowchart = {
    title: "Flowchart tracer", em: "\u{1F500}", topic: "7.2",
    blurb: "Walk through a real flowchart one box at a time, watching the variables change. Predict the output before you start.",
    render(el) {
      let fi = 0, cur = null, state = {}, visited = [], out = [], queue = [], done = false, steps = 0;

      el.innerHTML = `
        <div class="field"><label for="fcPick">Flowchart</label><select id="fcPick">
          ${FLOWCHARTS.map((f, i) => '<option value="' + i + '">' + esc(f.name) + "</option>").join("")}
        </select></div>
        <p id="fcAbout" style="font-size:13.5px;margin-top:-4px"></p>
        <div class="flow-wrap">
          <div class="flow-canvas" id="fcCanvas"></div>
          <div class="flow-side">
            <label>Input values</label>
            <input class="input" id="fcIn" spellcheck="false">
            <div class="btn-row">
              <button class="btn" id="fcStep">Step</button>
              <button class="btn sec" id="fcRun">Run to end</button>
              <button class="btn sec" id="fcReset">Reset</button>
            </div>
            <label style="margin-top:10px">Variables</label>
            <div class="table-wrap"><table class="mono" id="fcVars"></table></div>
            <label style="margin-top:14px">Output</label>
            <pre class="run-out" id="fcOut" style="min-height:70px"></pre>
            <div id="fcNote"></div>
          </div>
        </div>`;

      const byId = id => FLOWCHARTS[fi].nodes.find(n => n.id === id);

      function reset() {
        const fc = FLOWCHARTS[fi];
        queue = q(el, "#fcIn").value.split(",").map(v => v.trim()).filter(Boolean).map(Number);
        state = {}; fc.vars.forEach(v => { state[v] = "-"; });
        visited = []; out = []; done = false; steps = 0;
        cur = fc.nodes[0].id;
        paint();
        q(el, "#fcNote").innerHTML = "";
      }

      function paint() {
        const fc = FLOWCHARTS[fi];
        q(el, "#fcCanvas").innerHTML = flowSvg(fc, cur, visited);
        q(el, "#fcVars").innerHTML = fc.vars.map(v =>
          "<tr><td style='text-align:left'>" + v + "</td><td style='text-align:left'>" + esc(state[v]) + "</td></tr>").join("");
        q(el, "#fcOut").textContent = out.length ? out.join("\n") : "(nothing output yet)";
      }

      function step() {
        if (done) return false;
        const fc = FLOWCHARTS[fi];
        const n = byId(cur);
        if (!n) { done = true; return false; }
        visited.push(n.id);

        const io = {
          next: () => (queue.length ? queue.shift() : 0),
          out: v => out.push(String(v))
        };
        if (n.act) n.act(state, io);

        if (n.type === "dec") {
          const yes = fc.cond[n.id](state);
          cur = yes ? n.yes : n.no;
          q(el, "#fcNote").innerHTML = '<div class="callout" style="margin-top:12px"><div class="ttl">Decision</div><p>' +
            esc(n.t) + " is <b>" + (yes ? "true" : "false") + "</b>, so follow the <b>" + (yes ? "Yes" : "No") + "</b> branch.</p></div>";
        } else if (n.type === "term" && !n.next) {
          done = true;
          cur = null;
          q(el, "#fcNote").innerHTML = '<div class="callout tip" style="margin-top:12px"><div class="ttl">Finished</div><p>The flowchart reached END after ' +
            steps + " steps. Output: " + (out.length ? esc(out.join(", ")) : "nothing") + "</p></div>";
          Store.addXp(3);
        } else {
          cur = n.next;
          q(el, "#fcNote").innerHTML = "";
        }
        steps++;
        if (steps > 400) { done = true; }
        paint();
        return !done;
      }

      q(el, "#fcPick").onchange = e => { fi = +e.target.value; load(); };
      q(el, "#fcStep").onclick = () => step();
      q(el, "#fcRun").onclick = () => { let guard = 0; while (step() && guard++ < 400) {} };
      q(el, "#fcReset").onclick = reset;
      q(el, "#fcIn").onchange = reset;

      function load() {
        const fc = FLOWCHARTS[fi];
        q(el, "#fcAbout").textContent = fc.about;
        q(el, "#fcIn").value = fc.inputs.join(", ");
        reset();
      }
      load();
    }
  };

  return { convert, binlab, runner, scenario, filesize, charcodes, parity, fde, journey, logic, flowchart, sql, trace, threats, drill };
})();

</script>
<script>
/* ---- js/quiz.js ---- */
/* Quiz engine: auto-marked multiple choice plus self-marked written answers. */

const Quiz = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function pick(filter, limit) {
    let pool = QUESTIONS.filter(filter);
    pool = shuffle(pool);
    return limit ? pool.slice(0, limit) : pool;
  }

  /* opts: { title, subtitle, filter, limit, back } */
  function start(el, opts) {
    const qs = pick(opts.filter, opts.limit);
    if (!qs.length) {
      el.innerHTML = '<div class="card"><p>There are no questions for this selection yet.</p></div>';
      return;
    }

    let i = 0, right = 0, marksGot = 0, marksTotal = 0;
    const log = [];

    el.innerHTML = (opts.minutes ? '<div class="exam-timer" id="qTimer"></div>' : "") +
                   '<div class="q-shell" id="qShell"></div>';
    const shell = el.querySelector("#qShell");

    /* timed mock: one clock for the whole set, and it does not stop for you */
    let timer = null, left = (opts.minutes || 0) * 60;
    if (opts.minutes) {
      const tick = () => {
        const t = el.querySelector("#qTimer");
        if (!t) { clearInterval(timer); return; }
        const m = Math.floor(left / 60), s = left % 60;
        t.innerHTML = '<span class="lbl">Time left</span><b>' + m + ":" + String(s).padStart(2, "0") + "</b>";
        t.classList.toggle("low", left <= 120);
        if (left <= 0) { clearInterval(timer); finish(true); }
        left--;
      };
      tick();
      timer = setInterval(tick, 1000);
      el._cleanup = () => clearInterval(timer);
    }

    draw();

    function draw() {
      const q = qs[i];
      const pct = Math.round(i / qs.length * 100);
      shell.innerHTML = `
        <div class="q-progress">
          <span>${i + 1} / ${qs.length}</span>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span class="chip">${q.t}</span>
          <span class="chip">${q.m} mark${q.m > 1 ? "s" : ""}</span>
        </div>
        <p class="q-stem">${esc(q.q)}</p>
        <div id="qBody"></div>`;
      const body = shell.querySelector("#qBody");
      if (q.ty === "mcq") drawMcq(q, body); else drawTxt(q, body);
      shell.classList.add("fade-in");
    }

    function drawMcq(q, body) {
      const order = shuffle(q.o.map((text, idx) => ({ text, idx })));
      body.innerHTML = order.map((o, n) =>
        '<button class="opt" data-i="' + o.idx + '"><span class="key">' + "ABCD"[n] + "</span><span>" + esc(o.text) + "</span></button>"
      ).join("") + '<div id="qAfter"></div>';

      body.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
        const chosen = +btn.dataset.i, ok = chosen === q.a;
        body.querySelectorAll(".opt").forEach(b => {
          b.disabled = true;
          if (+b.dataset.i === q.a) b.classList.add("right");
          else if (b === btn) b.classList.add("wrong");
        });
        record(q, ok, ok ? q.m : 0);
        body.querySelector("#qAfter").innerHTML =
          '<div class="verdict ' + (ok ? "ok" : "no") + '"><h4>' + (ok ? "✓ Correct" : "✗ Not quite") + "</h4><p>" +
          esc(q.e) + "</p></div>" +
          '<div class="btn-row"><button class="btn" id="qNext">' + (i === qs.length - 1 ? "See results" : "Next question") + "</button></div>";
        body.querySelector("#qNext").onclick = advance;
        body.querySelector("#qNext").focus();
      });
    }

    function drawTxt(q, body) {
      body.innerHTML = `
        <p style="font-size:13px;color:var(--ink-3)">Write your answer, then mark it against the mark scheme. Be honest with yourself, that is the only way this is useful.</p>
        <textarea class="answer-box" id="qTa" placeholder="Your answer..."></textarea>
        <div class="btn-row"><button class="btn" id="qShow">Show the mark scheme</button></div>
        <div id="qAfter"></div>`;
      body.querySelector("#qTa").focus();
      body.querySelector("#qShow").onclick = () => {
        body.querySelector("#qShow").disabled = true;
        body.querySelector("#qAfter").innerHTML = `
          <div class="verdict">
            <h4>Mark scheme, ${q.m} mark${q.m > 1 ? "s" : ""} available${q.pts.length > q.m ? " (any " + q.m + " of these)" : ""}</h4>
            <ul>${q.pts.map(p => "<li>" + esc(p) + "</li>").join("")}</ul>
            <h4 style="margin-top:12px">A full answer</h4>
            <p>${esc(q.a)}</p>
          </div>
          <h4>How did you do?</h4>
          <div class="btn-row">
            <button class="btn sec" data-g="0">Missed it</button>
            <button class="btn sec" data-g="1">Got some points</button>
            <button class="btn" data-g="2">Got it all</button>
          </div>`;
        body.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
          const g = +b.dataset.g;
          record(q, g === 2, g === 2 ? q.m : g === 1 ? Math.max(1, Math.floor(q.m / 2)) : 0);
          advance();
        });
      };
    }

    function record(q, ok, marks) {
      if (ok) right++;
      marksGot += marks; marksTotal += q.m;
      Store.recordQuiz(q.t, ok);
      log.push({ q, ok, marks });
    }

    function advance() {
      i++;
      if (i < qs.length) draw(); else finish();
    }

    function finish(ranOut) {
      if (timer) clearInterval(timer);
      const clock = el.querySelector("#qTimer");
      if (clock) clock.remove();
      Store.touchStreak();
      Store.addXp(marksGot * 2);
      if (ranOut) {                       // unanswered questions still count against the total
        for (let k = i; k < qs.length; k++) marksTotal += qs[k].m;
      }
      const pct = Math.round(marksGot / Math.max(1, marksTotal) * 100);
      const byTopic = {};
      log.forEach(l => {
        const b = byTopic[l.q.t] || (byTopic[l.q.t] = { got: 0, tot: 0 });
        b.got += l.marks; b.tot += l.q.m;
      });
      const weak = Object.keys(byTopic).filter(k => byTopic[k].got / byTopic[k].tot < 0.6);

      shell.innerHTML = `
        <div class="card" style="text-align:center">
          <div class="score-ring" style="--p:${pct}"><b>${pct}%</b></div>
          <h2 style="margin:0 0 4px">${marksGot} out of ${marksTotal} marks</h2>
          ${ranOut ? '<p class="chip bad">Time ran out with ' + (qs.length - i) + ' question' + (qs.length - i === 1 ? '' : 's') + ' unanswered, so those marks are lost. That is the exam too.</p>' : ""}
          <p>${pct >= 80 ? "Strong. Move on to the next subtopic." : pct >= 55 ? "Solid start. The notes for the weak areas below are worth another read." : "Worth going back over the notes before you try again."}</p>
        </div>
        <h3>Marks by subtopic</h3>
        <div class="table-wrap"><table>
          <tr><th>Subtopic</th><th>Marks</th><th></th></tr>
          ${Object.keys(byTopic).sort().map(k => {
            const b = byTopic[k], p = Math.round(b.got / b.tot * 100);
            const sub = App.findSub(k);
            return "<tr><td>" + k + " " + esc(sub ? sub.title : "") + "</td><td>" + b.got + " / " + b.tot +
              '</td><td><span class="chip ' + (p >= 80 ? "good" : p >= 50 ? "warn" : "bad") + '">' + p + "%</span></td></tr>";
          }).join("")}
        </table></div>
        ${weak.length ? '<div class="callout trap"><div class="ttl">Go back to</div><p>' +
            weak.map(k => '<a href="#/sub/' + k + '">' + k + " " + esc((App.findSub(k) || {}).title || "") + "</a>").join(" &middot; ") + "</p></div>" : ""}
        <div class="btn-row">
          <button class="btn" id="qAgain">Try another set</button>
          <a class="btn sec" href="${opts.back || "#/home"}">Back</a>
          <a class="btn sec" href="#/progress">See my progress</a>
        </div>`;
      shell.querySelector("#qAgain").onclick = () => start(el, opts);
      if (pct >= 80) App.confetti();
      App.refreshChrome();
    }
  }

  return { start, count: f => QUESTIONS.filter(f).length };
})();

</script>
<script>
/* ---- js/cards.js ---- */
/* Flashcards. Every key term in the syllabus becomes a card, scheduled with Leitner boxes. */

const Cards = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function all() {
    const out = [];
    SYLLABUS.forEach(t => t.subs.forEach(s => s.terms.forEach(([term, def]) => {
      out.push({ id: s.id + "::" + term, term, def, sub: s.id, subTitle: s.title, topic: t.n, hue: t.hue });
    })));
    return out;
  }

  function deckFor(filter) {
    const cards = all().filter(filter || (() => true));
    const now = Date.now();
    const due = cards.filter(c => Store.cardState(c.id).due <= now);
    const pool = due.length ? due : cards;
    return pool.sort((a, b) => Store.cardState(a.id).box - Store.cardState(b.id).box ||
                               Store.cardState(a.id).due - Store.cardState(b.id).due);
  }

  /* opts: { title, filter, back } */
  function start(el, opts) {
    const deck = deckFor(opts.filter);
    if (!deck.length) {
      el.innerHTML = '<div class="card"><p>No cards match that selection.</p></div>';
      return;
    }
    let i = 0, done = 0, kept = 0, flipped = false;

    el.innerHTML = `
      <div class="q-progress">
        <span id="cdN"></span>
        <div class="bar"><i id="cdBar" style="width:0%"></i></div>
        <span class="chip" id="cdBox"></span>
      </div>
      <div class="deck"><div class="flip" id="cdFlip">
        <div class="face front">
          <span class="tag" id="cdTagF"></span>
          <div class="q" id="cdQ"></div>
          <span class="hint">click the card, or press space, to flip</span>
        </div>
        <div class="face back">
          <span class="tag" id="cdTagB"></span>
          <div class="a" id="cdA"></div>
          <span class="hint">how well did you know it?</span>
        </div>
      </div></div>
      <div class="btn-row" style="justify-content:center" id="cdBtns">
        <button class="btn sec" id="cdAgain" disabled>Didn't know it</button>
        <button class="btn" id="cdGood" disabled>Knew it</button>
      </div>
      <p style="text-align:center;font-size:12.5px;color:var(--ink-3)">
        Cards you know come back less often. Cards you miss come straight back. Keys: space to flip, 1 and 2 to grade.</p>`;

    const flip = el.querySelector("#cdFlip");

    function draw() {
      const c = deck[i];
      flipped = false;
      flip.classList.remove("on");
      el.querySelector("#cdQ").textContent = c.term;
      el.querySelector("#cdA").textContent = c.def;
      el.querySelector("#cdTagF").textContent = c.sub;
      el.querySelector("#cdTagB").textContent = c.sub + "  " + c.subTitle;
      el.querySelector("#cdN").textContent = (i + 1) + " / " + deck.length;
      el.querySelector("#cdBar").style.width = Math.round(done / deck.length * 100) + "%";
      el.querySelector("#cdBox").textContent = "box " + Store.cardState(c.id).box + " of 5";
      el.style.setProperty("--hue", c.hue);
      setGrade(false);
    }
    function setGrade(on) {
      el.querySelector("#cdAgain").disabled = !on;
      el.querySelector("#cdGood").disabled = !on;
    }
    function doFlip() {
      flipped = !flipped;
      flip.classList.toggle("on", flipped);
      if (flipped) setGrade(true);
    }
    function grade(good) {
      if (!flipped) return;
      Store.gradeCard(deck[i].id, good);
      if (good) kept++;
      done++;
      if (i < deck.length - 1) { i++; draw(); } else finish();
    }
    function finish() {
      Store.touchStreak();
      const pct = Math.round(kept / deck.length * 100);
      el.innerHTML = `
        <div class="card" style="text-align:center">
          <div class="score-ring" style="--p:${pct}"><b>${pct}%</b></div>
          <h2 style="margin:0 0 4px">${kept} of ${deck.length} known</h2>
          <p>The ones you missed are back in box 1 and will come round again straight away.</p>
          <div class="btn-row" style="justify-content:center">
            <button class="btn" id="cdMore">Go again</button>
            <a class="btn sec" href="${opts.back || "#/cards"}">Back</a>
          </div>
        </div>`;
      el.querySelector("#cdMore").onclick = () => start(el, opts);
      App.refreshChrome();
      if (pct >= 90) App.confetti();
    }

    flip.onclick = doFlip;
    el.querySelector("#cdAgain").onclick = () => grade(false);
    el.querySelector("#cdGood").onclick = () => grade(true);

    el._keys = e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); doFlip(); }
      if (e.key === "1") grade(false);
      if (e.key === "2") grade(true);
    };
    document.addEventListener("keydown", el._keys);
    el._cleanup = () => document.removeEventListener("keydown", el._keys);

    draw();
  }

  function hub(el) {
    const cards = all();
    const now = Date.now();
    const boxes = [0, 0, 0, 0, 0, 0];
    cards.forEach(c => boxes[Store.cardState(c.id).box]++);
    const due = cards.filter(c => Store.cardState(c.id).due <= now).length;
    const learned = boxes[3] + boxes[4] + boxes[5];

    el.innerHTML = `
      <div class="page-head">
        <span class="eyebrow">Flashcards</span>
        <h1>${cards.length} key terms, spaced out over time</h1>
        <p class="lede">Every definition in the syllabus is a card. Cards you get right come back after a longer gap, cards you miss come straight back. Ten minutes a day beats an hour the night before.</p>
      </div>

      <div class="stat-row">
        <div class="stat"><b>${due}</b><span>due right now</span></div>
        <div class="stat"><b>${learned}</b><span>in the long boxes</span></div>
        <div class="stat"><b>${boxes[1]}</b><span>still box 1</span></div>
        <div class="stat"><b>${cards.length}</b><span>cards total</span></div>
      </div>

      <div class="btn-row">
        <a class="btn" href="#/cards/due">Review ${due || cards.length} cards</a>
        <a class="btn sec" href="#/cards/all">Shuffle everything</a>
      </div>

      <h2>By topic</h2>
      <div class="grid g2">
        ${SYLLABUS.map(t => {
          const n = cards.filter(c => c.topic === t.n).length;
          const d = cards.filter(c => c.topic === t.n && Store.cardState(c.id).due <= now).length;
          return `<a class="topic-card" href="#/cards/topic/${t.n}" style="--hue:${t.hue}">
            <div class="tc-top"><span class="em">${t.em}</span><span class="tc-num">${t.n}</span><h3>${esc(t.title)}</h3></div>
            <div class="tc-meta"><span>${n} cards</span><span>${d} due</span></div>
          </a>`;
        }).join("")}
      </div>`;
  }

  return { start, hub, all, deckFor };
})();

</script>
<script>
/* ---- js/app.js ---- */
/* Router, chrome and pages. */

const SYLLABUS = window.SYLLABUS_P1.concat(window.SYLLABUS_P2);

const App = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = sel => document.querySelector(sel);
  const main = $("#main");

  const ALL_SUBS = SYLLABUS.flatMap(t => t.subs.map(s => Object.assign({ topic: t }, s)));
  const findSub = id => ALL_SUBS.find(s => s.id === id);
  const findTopic = n => SYLLABUS.find(t => t.n === n);

  /* ================================================================== */
  /* chrome                                                              */
  /* ================================================================== */
  function setHue(h) { document.documentElement.style.setProperty("--hue", h); }

  function buildSidebar() {
    const nav = $("#sidebarNav");
    const link = (href, label, em, extra) =>
      `<a class="nav-item" href="${href}" data-r="${href}"><span class="em">${em}</span><span class="lbl">${label}</span>${extra || ""}</a>`;

    let html = `<div class="nav-group">
      ${link("#/home", "Home", "\u{1F3E0}")}
      ${link("#/cards", "Flashcards", "\u{1F5C2}")}
      ${link("#/quiz/mixed", "Mixed quiz", "\u{1F3AF}")}
      ${link("#/tools", "Labs", "\u{1F9EA}")}
      ${link("#/progress", "My progress", "\u{1F4C8}")}
      ${link("#/exam", "Exam guide", "\u{1F393}")}
    </div>`;

    [1, 2].forEach(p => {
      html += '<div class="nav-group"><div class="nav-head">Paper ' + p + (p === 1 ? " &middot; Computer systems" : " &middot; Algorithms and logic") + "</div>";
      SYLLABUS.filter(t => t.paper === p).forEach(t => {
        const m = Store.topicMastery(t);
        html += `<a class="nav-item" href="#/topic/${t.n}" data-r="#/topic/${t.n}" style="--hue:${t.hue}">
            <span class="nav-num">${t.n}</span><span class="lbl">${esc(t.title)}</span>
            <span class="dot ${m >= 80 ? "p3" : m >= 40 ? "p2" : m > 0 ? "p1" : ""}"></span></a>
          <div class="nav-sub" id="ns${t.n}">
            ${t.subs.map(s => `<a class="nav-item" href="#/sub/${s.id}" data-r="#/sub/${s.id}">
              <span class="nav-num">${s.id}</span><span class="lbl">${esc(s.title)}</span></a>`).join("")}
          </div>`;
      });
      html += "</div>";
    });
    nav.innerHTML = html;
  }

  function refreshChrome() {
    const pct = Store.overall();
    $("#overallBar").style.width = pct + "%";
    $("#overallPct").textContent = pct + "%";
    const st = Store.state.streak;
    $("#streakNum").textContent = st.count;
    $("#streakChip").classList.toggle("hot", st.count > 0 && st.last === Store.todayKey());
    highlightNav();
  }

  function highlightNav() {
    const h = location.hash || "#/home";
    document.querySelectorAll(".nav-item").forEach(a => a.classList.toggle("active", a.dataset.r === h));
    document.querySelectorAll(".nav-sub").forEach(d => d.classList.remove("open"));
    const m = /^#\/(?:sub|topic)\/(\d+)/.exec(h);
    if (m) { const d = $("#ns" + m[1]); if (d) d.classList.add("open"); }
  }

  /* ================================================================== */
  /* pages                                                               */
  /* ================================================================== */
  function pageHome() {
    setHue(168);
    const pct = Store.overall();
    const dueCards = Cards.all().filter(c => Store.cardState(c.id).due <= Date.now()).length;
    const weakest = ALL_SUBS.slice().sort((a, b) => Store.mastery(a.id) - Store.mastery(b.id)).slice(0, 3);
    const started = ALL_SUBS.some(s => Store.mastery(s.id) > 0);

    main.innerHTML = `
      <section class="hero">
        <span class="eyebrow">Cambridge IGCSE 0478 &middot; 0984 &middot; exams 2026 to 2028</span>
        <h1>The whole syllabus, in a form you will actually use.</h1>
        <p class="lede">Ten topics, ${ALL_SUBS.length} subtopics, ${Cards.all().length} flashcards, ${QUESTIONS.length} exam-style questions and ${Object.keys(Tools).length} interactive labs. Everything saves in your browser, nothing needs an account.</p>
        <div class="btn-row">
          <a class="btn" href="${started ? "#/sub/" + weakest[0].id : "#/sub/1.1"}">${started ? "Pick up where you left off" : "Start with topic 1.1"}</a>
          <a class="btn sec" href="#/quiz/mixed">Mixed quiz</a>
          <a class="btn sec" href="#/cards/due">Review ${dueCards} cards</a>
        </div>
        <div class="stat-row">
          <div class="stat"><b>${pct}%</b><span>syllabus covered</span></div>
          <div class="stat"><b>${Store.state.streak.count}</b><span>day streak</span></div>
          <div class="stat"><b>${Store.state.xp}</b><span>XP earned</span></div>
          <div class="stat"><b>${dueCards}</b><span>cards due</span></div>
        </div>
      </section>

      ${started ? `<h2>Your three weakest subtopics</h2>
      <div class="grid g3">
        ${weakest.map(s => topicCardSub(s)).join("")}
      </div>` : ""}

      <h2>Paper 1 &middot; Computer systems</h2>
      <div class="grid g2">${SYLLABUS.filter(t => t.paper === 1).map(topicCard).join("")}</div>

      <h2>Paper 2 &middot; Algorithms, programming and logic</h2>
      <div class="grid g2">${SYLLABUS.filter(t => t.paper === 2).map(topicCard).join("")}</div>

      <h2>Labs worth opening</h2>
      <div class="grid g2">
        ${["runner", "scenario", "flowchart", "logic"].map(k => {
          const t = Tools[k];
          return `<a class="card tool-card" href="#/tool/${k}"><span class="em">${t.em}</span><div>
            <h3 style="margin:0 0 4px">${esc(t.title)}</h3><p style="margin:0;font-size:13px">${esc(t.blurb)}</p></div></a>`;
        }).join("")}
      </div>

      <div class="callout tip" style="margin-top:28px">
        <div class="ttl">How to use this properly</div>
        <p>Read a subtopic, rate your confidence honestly, then take its quiz straight away. Come back the next day and do the flashcards before you read anything new. Recall beats rereading every time, which is why the quizzes and cards drive your progress bar and reading alone only moves it a fifth of the way.</p>
      </div>`;
  }

  function topicCard(t) {
    const m = Store.topicMastery(t);
    const nq = QUESTIONS.filter(q => t.subs.some(s => s.id === q.t)).length;
    return `<a class="topic-card" href="#/topic/${t.n}" style="--hue:${t.hue}">
      <div class="tc-top"><span class="em">${t.em}</span><span class="tc-num">Topic ${t.n}</span></div>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.blurb)}</p>
      <div class="bar"><i style="width:${m}%"></i></div>
      <div class="tc-meta"><span>${t.subs.length} subtopics &middot; ${nq} questions</span><span>${m}%</span></div>
    </a>`;
  }
  function topicCardSub(s) {
    const m = Store.mastery(s.id);
    return `<a class="topic-card" href="#/sub/${s.id}" style="--hue:${s.topic.hue}">
      <div class="tc-top"><span class="tc-num">${s.id}</span></div>
      <h3>${esc(s.title)}</h3>
      <div class="bar"><i style="width:${m}%"></i></div>
      <div class="tc-meta"><span>${esc(s.topic.title)}</span><span>${m}%</span></div>
    </a>`;
  }

  function pageTopic(n) {
    const t = findTopic(n);
    if (!t) return pageHome();
    setHue(t.hue);
    const nq = QUESTIONS.filter(q => t.subs.some(s => s.id === q.t)).length;
    const nc = Cards.all().filter(c => c.topic === t.n).length;

    main.innerHTML = `
      <div class="crumbs"><a href="#/home">Home</a> / Paper ${t.paper} / Topic ${t.n}</div>
      <div class="page-head">
        <span class="eyebrow">${t.em} Topic ${t.n}</span>
        <h1>${esc(t.title)}</h1>
        <p class="lede">${esc(t.blurb)}</p>
      </div>
      <div class="btn-row">
        <a class="btn" href="#/quiz/topic/${t.n}">Quiz this topic (${nq} questions)</a>
        <a class="btn sec" href="#/cards/topic/${t.n}">Flashcards (${nc})</a>
        <a class="btn sec" href="#/sheet/${t.n}">Revision sheet</a>
      </div>
      <div class="grid g2">${t.subs.map(s => {
        const m = Store.mastery(s.id);
        return `<a class="topic-card" href="#/sub/${s.id}">
          <div class="tc-top"><span class="tc-num">${s.id}</span></div>
          <h3>${esc(s.title)}</h3>
          <p>${s.goals.length} objectives &middot; ${s.terms.length} key terms</p>
          <div class="bar"><i style="width:${m}%"></i></div>
          <div class="tc-meta"><span>${QUESTIONS.filter(q => q.t === s.id).length} questions</span><span>${m}%</span></div>
        </a>`;
      }).join("")}</div>`;
  }

  function pageSub(id) {
    const s = findSub(id);
    if (!s) return pageHome();
    setHue(s.topic.hue);
    Store.markRead(id);

    const idx = ALL_SUBS.findIndex(x => x.id === id);
    const prev = ALL_SUBS[idx - 1], next = ALL_SUBS[idx + 1];
    const nq = QUESTIONS.filter(q => q.t === id).length;
    const conf = Store.state.conf[id];

    main.innerHTML = `
      <div class="crumbs"><a href="#/home">Home</a> / <a href="#/topic/${s.topic.n}">${esc(s.topic.title)}</a> / ${s.id}</div>
      <div class="page-head">
        <span class="eyebrow">${s.topic.em} ${s.id}</span>
        <h1>${esc(s.title)}</h1>
      </div>

      <div class="sub-tabs" id="subTabs">
        <button class="sub-tab on" data-p="notes">Notes</button>
        <button class="sub-tab" data-p="terms">Key terms (${s.terms.length})</button>
        <button class="sub-tab" data-p="tips">Exam tips</button>
      </div>

      <div id="subPanel"></div>

      <div class="card" style="margin-top:26px">
        <h4 style="margin-top:0">How confident are you with ${s.id}?</h4>
        <div class="confidence" id="confRow">
          <button class="conf-btn ${conf === 1 ? "on" : ""}" data-v="1">Shaky</button>
          <button class="conf-btn ${conf === 2 ? "on" : ""}" data-v="2">Getting there</button>
          <button class="conf-btn ${conf === 3 ? "on" : ""}" data-v="3">Solid</button>
          <span style="font-size:12.5px;color:var(--ink-3);margin-left:6px">This feeds your progress bar. Be honest.</span>
        </div>
      </div>

      <div class="btn-row">
        ${nq ? `<a class="btn" href="#/quiz/${s.id}">Test yourself (${nq} questions)</a>` : ""}
        <a class="btn sec" href="#/cards/sub/${s.id}">Flashcards</a>
        ${(s.tools || []).map(([label, href]) => `<a class="btn sec" href="${href}">${esc(label)}</a>`).join("")}
        <button class="btn sec no-print" onclick="window.print()">Print these notes</button>
      </div>

      <div class="pager">
        ${prev ? `<a href="#/sub/${prev.id}"><small>Previous</small>${prev.id} ${esc(prev.title)}</a>` : "<span></span>"}
        ${next ? `<a href="#/sub/${next.id}" style="text-align:right"><small>Next</small>${next.id} ${esc(next.title)}</a>` : "<span></span>"}
      </div>`;

    const panel = $("#subPanel");
    const panels = {
      notes: () => `<div class="with-toc">
          <div class="notes-body">
            <ul class="goals">${s.goals.map(g => "<li>" + esc(g) + "</li>").join("")}</ul><hr>${s.notes}
          </div>
          <nav class="toc" id="toc" aria-label="On this page"></nav>
        </div>`,
      terms: () => '<div class="terms">' + s.terms.map(([t, d]) =>
        '<dl class="term"><dt>' + esc(t) + "</dt><dd>" + esc(d) + "</dd></dl>").join("") +
        '</div><div class="btn-row"><a class="btn sec" href="#/cards/sub/' + s.id + '">Drill these as flashcards</a></div>',
      tips: () => (s.tips || []).map(t => '<div class="callout tip"><div class="ttl">Tip</div><p>' + esc(t) + "</p></div>").join("") +
        '<div class="callout"><div class="ttl">Objectives for ' + s.id + '</div><ul>' +
        s.goals.map(g => "<li>" + esc(g) + "</li>").join("") + "</ul></div>"
    };
    const show = p => {
      panel.innerHTML = panels[p]();
      panel.classList.remove("fade-in"); void panel.offsetWidth; panel.classList.add("fade-in");
      enhanceCode(panel);
      if (p === "notes") buildToc(panel);
      trackReading();
    };
    document.querySelectorAll("#subTabs .sub-tab").forEach(b => b.onclick = () => {
      document.querySelectorAll("#subTabs .sub-tab").forEach(x => x.classList.toggle("on", x === b));
      show(b.dataset.p);
    });
    show("notes");

    document.querySelectorAll("#confRow .conf-btn").forEach(b => b.onclick = () => {
      Store.setConf(id, +b.dataset.v);
      document.querySelectorAll("#confRow .conf-btn").forEach(x =>
        x.classList.toggle("on", x === b && Store.state.conf[id] === +b.dataset.v));
      refreshChrome();
    });
  }

  function pageTools() {

  /* Backups are copy and paste rather than a file download: the artifact
     viewer's sandbox makes any page-initiated download inert. */
  function wireBackup() {
    const area = $("#bkArea");
    if (!area) return;
    $("#bkMake").onclick = () => {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(Store.state))));
      area.innerHTML = '<label style="display:block;font-size:11.5px;text-transform:uppercase;' +
        'letter-spacing:.09em;color:var(--ink-3);margin:14px 0 5px;font-weight:700">Your backup code</label>' +
        '<textarea class="input code-area" id="bkText" rows="4" readonly></textarea>' +
        '<div class="btn-row"><button class="btn sec sm" id="bkCopy">Copy to clipboard</button></div>';
      $("#bkText").value = code;
      $("#bkCopy").onclick = () => {
        const ta = $("#bkText");
        ta.select();
        const done = () => { $("#bkCopy").textContent = "Copied"; setTimeout(() => { $("#bkCopy").textContent = "Copy to clipboard"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, done);
        else { try { document.execCommand("copy"); done(); } catch (e) {} }
      };
    };
    $("#bkRestore").onclick = () => {
      area.innerHTML = '<label style="display:block;font-size:11.5px;text-transform:uppercase;' +
        'letter-spacing:.09em;color:var(--ink-3);margin:14px 0 5px;font-weight:700">Paste a backup code</label>' +
        '<textarea class="input code-area" id="bkIn" rows="4" placeholder="Paste here"></textarea>' +
        '<div class="btn-row"><button class="btn sm" id="bkGo">Restore it</button></div><div id="bkMsg"></div>';
      $("#bkGo").onclick = () => {
        let data = null;
        try { data = JSON.parse(decodeURIComponent(escape(atob($("#bkIn").value.trim())))); }
        catch (e) { data = null; }          // never surface a raw decoding error
        try {
          if (!data || typeof data !== "object" || !("conf" in data) || !("cards" in data)) {
            throw new Error("that does not look like a BITWISE backup code");
          }
          Object.assign(Store.state, data);
          Store.save();
          toast("Progress restored");
          buildSidebar();
          route();
        } catch (e) {
          $("#bkMsg").innerHTML = '<div class="callout trap"><div class="ttl">Could not restore</div><p>' +
            esc(e.message || "that does not look like a BITWISE backup code") +
            ". Check you copied the whole code, with nothing missing from either end.</p></div>";
        }
      };
    };
  }

  /* Give every code block a copy button. Students retype pseudocode into the
     runner constantly, and retyping is where transcription errors come from. */
  function enhanceCode(root) {
    root.querySelectorAll("pre").forEach(pre => {
      if (pre.parentElement.classList.contains("pre-wrap")) return;
      const wrap = document.createElement("div");
      wrap.className = "pre-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      const btn = document.createElement("button");
      btn.className = "copy";
      btn.type = "button";
      btn.textContent = "Copy";
      btn.onclick = () => {
        const text = pre.innerText;
        const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else fallback();
        function fallback() {                       // file:// and older browsers
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select it"; }
          ta.remove();
        }
      };
      wrap.appendChild(btn);
    });
  }

  /* A contents rail for the long note pages, built from the h3 headings. */
  let tocSpy = null;
  function buildToc(root) {
    const toc = root.querySelector("#toc");
    const body = root.querySelector(".notes-body");
    if (!toc || !body) return;
    const heads = Array.from(body.querySelectorAll("h3"));
    if (heads.length < 3) { toc.remove(); return; }

    heads.forEach((h, i) => { h.id = "h" + i + "-" + h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30); });
    toc.innerHTML = '<div class="toc-head">On this page</div>' +
      heads.map(h => '<a href="#' + h.id + '" data-id="' + h.id + '">' + esc(h.textContent) + "</a>").join("");

    toc.querySelectorAll("a").forEach(a => a.onclick = e => {
      e.preventDefault();                            // keep the hash route intact
      const target = document.getElementById(a.dataset.id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    if (tocSpy) tocSpy.disconnect();
    tocSpy = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        toc.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.id === en.target.id));
      });
    }, { rootMargin: "-70px 0px -70% 0px" });
    heads.forEach(h => tocSpy.observe(h));
  }

  function runSearch(term) {
    const res = $("#searchResults");
    term = term.trim().toLowerCase();
    if (!term) {
      res.innerHTML = ['#/quiz/mixed|Mixed quiz|questions pulled from the whole syllabus',
                       '#/cards/due|Flashcards due today|spaced repetition',
                       '#/tool/logic|Logic lab|truth tables from any expression',
                       '#/exam|Exam guide|command words and paper structure']
        .map(r => { const [href, t, s] = r.split("|");
          return '<a class="sr" href="' + href + '"><span class="kind">jump to</span><b>' + t + "</b><small>" + s + "</small></a>"; }).join("");
      return;
    }
    searchIndex = searchIndex || buildIndex();
    const words = term.split(/\s+/);
    const hits = searchIndex
      .map(e => {
        let score = 0;
        words.forEach(w => {
          if (!e.hay.includes(w)) { score = -999; return; }
          score += 1;
          if (e.title.toLowerCase().includes(w)) score += 4;
          if (e.title.toLowerCase().startsWith(w)) score += 3;
        });
        if (e.kind === "term") score += 1;
        return { e, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 14);

    res.innerHTML = hits.length
      ? hits.map(h => '<a class="sr" href="' + h.e.href + '"><span class="kind">' + h.e.kind + "</span><b>" +
          esc(h.e.title) + "</b><small>" + esc(h.e.sub.slice(0, 110)) + "</small></a>").join("")
      : '<div style="padding:18px;color:var(--ink-3);font-size:14px">Nothing found for that. Try a syllabus word such as "parity", "interrupt" or "validation".</div>';
  }

    $("#searchInput").value = "";
    runSearch("");
    setTimeout(() => $("#searchInput").focus(), 20);
  }
  function closeSearch() { $("#searchBox").hidden = true; }

  /* ================================================================== */
  /* extras                                                              */
  /* ================================================================== */
  const SHORTCUTS = [
    ["/ &nbsp;or&nbsp; Ctrl K", "Search the syllabus"],
    ["?", "Show this list"],
    ["g then h", "Go home"],
    ["g then c", "Flashcards"],
    ["g then q", "Mixed quiz"],
    ["g then l", "Labs"],
    ["g then p", "My progress"],
    ["g then e", "Exam guide"],
    ["j &nbsp;/&nbsp; k", "Next or previous subtopic"],
    ["t", "Switch theme"],
    ["space", "Flip a flashcard"],
    ["1 &nbsp;/&nbsp; 2", "Grade a flashcard"],
    ["Esc", "Close anything open"]
  ];

  function toggleSheet(force) {
    let sheet = $("#sheet");
    const open = force !== undefined ? force : !sheet;
    if (!open) { if (sheet) sheet.remove(); return; }
    if (sheet) return;
    sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.id = "sheet";
    sheet.innerHTML = `<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
        <h3>Keyboard shortcuts</h3>
        <div class="keys">${SHORTCUTS.map(([k, d]) => "<div><span>" + d + "</span><kbd>" + k + "</kbd></div>").join("")}</div>
        <div class="btn-row" style="margin-bottom:0"><button class="btn sec sm" id="sheetClose">Close</button></div>
      </div>`;
    document.body.appendChild(sheet);
    sheet.onclick = e => { if (e.target === sheet || e.target.id === "sheetClose") toggleSheet(false); };
  }

  function buildTabbar() {
    const bar = document.createElement("nav");
    bar.className = "tabbar";
    bar.id = "tabbar";
    bar.setAttribute("aria-label", "Main sections");
    bar.innerHTML = [
      ["#/home", "\u{1F3E0}", "Home"],
      ["#/cards/due", "\u{1F5C2}", "Cards"],
      ["#/quiz/mixed", "\u{1F3AF}", "Quiz"],
      ["#/tools", "\u{1F9EA}", "Labs"],
      ["#/progress", "\u{1F4C8}", "Progress"]
    ].map(([href, em, label]) =>
      '<a href="' + href + '" data-tab="' + href + '"><span class="em">' + em + "</span>" + label + "</a>").join("");
    document.body.appendChild(bar);
  }

  function highlightTabs() {
    const h = location.hash || "#/home";
    document.querySelectorAll("#tabbar a").forEach(a => {
      const root = a.dataset.tab.split("/")[1];
      a.classList.toggle("on", h.split("/")[1] === root);
    });
  }

  function toast(msg) {
    const d = document.createElement("div");
    d.className = "toast"; d.textContent = msg;
    $("#toasts").appendChild(d);
    setTimeout(() => d.remove(), 2600);
  }

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("#fx"), ctx = cv.getContext("2d");
    cv.width = innerWidth; cv.height = innerHeight;
    const hue = getComputedStyle(document.documentElement).getPropertyValue("--hue") || 168;
    const bits = Array.from({ length: 90 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * 260,
      y: innerHeight / 3,
      vx: (Math.random() - .5) * 9,
      vy: Math.random() * -11 - 3,
      r: 3 + Math.random() * 5,
      a: 1,
      c: "hsl(" + (+hue + Math.random() * 90 - 20) + " 85% 62%)"
    }));
    let frames = 0;
    (function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      bits.forEach(b => {
        b.vy += .38; b.x += b.vx; b.y += b.vy; b.a -= .011;
        ctx.globalAlpha = Math.max(0, b.a);
        ctx.fillStyle = b.c;
        ctx.fillRect(b.x, b.y, b.r, b.r * 1.6);
      });
      if (++frames < 110) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, cv.width, cv.height);
    })();
  }

  function applyTheme() {
    /* the reader's own choice wins; otherwise take a theme already stamped on the
       document by the host page, and fall back to the system preference */
    const stamped = document.documentElement.dataset.theme;
    const t = Store.state.theme || stamped ||
      (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = t;
  }

  /* ================================================================== */
  /* router                                                              */
  /* ================================================================== */
  function route() {
    if (main._cleanup) { main._cleanup(); main._cleanup = null; }
    closeSearch();
    const h = (location.hash || "#/home").replace(/^#\//, "");
    const p = h.split("/");

    switch (p[0]) {
      case "home": pageHome(); break;
      case "topic": pageTopic(p[1]); break;
      case "sub": pageSub(p[1]); break;
      case "tools": pageTools(); break;
      case "tool": pageTool(p[1]); break;
      case "progress": pageProgress(); wireBackup(); break;
      case "exam": pageExam(); break;
      case "glossary": pageGlossary(); break;
      case "sheet": pageSheet(p[1]); break;

      case "quiz": {
        let opts;
        if (p[1] === "mixed") opts = { filter: () => true, limit: 15, back: "#/home" };
        else if (p[1] === "mock") {
          const ids = SYLLABUS.filter(t => t.paper === +p[2]).flatMap(t => t.subs.map(s => s.id));
          opts = { filter: q => ids.includes(q.t), limit: 20, minutes: 30, back: "#/exam" };
        }
        else if (p[1] === "paper") {
          const ids = SYLLABUS.filter(t => t.paper === +p[2]).flatMap(t => t.subs.map(s => s.id));
          opts = { filter: q => ids.includes(q.t), limit: 15, back: "#/exam" };
        } else if (p[1] === "topic") {
          const t = findTopic(p[2]);
          const ids = t ? t.subs.map(s => s.id) : [];
          opts = { filter: q => ids.includes(q.t), back: "#/topic/" + p[2] };
          if (t) setHue(t.hue);
        } else {
          const s = findSub(p[1]);
          if (s) setHue(s.topic.hue);
          opts = { filter: q => q.t === p[1], back: "#/sub/" + p[1] };
        }
        const heading = p[1] === "mixed" ? "Mixed quiz" : p[1] === "mock" ? "Paper " + p[2] + " timed mock" :
          p[1] === "paper" ? "Paper " + p[2] + " quiz" :
          p[1] === "topic" ? "Topic " + p[2] + " quiz" : (findSub(p[1]) ? p[1] + " " + findSub(p[1]).title : "Quiz");
        main.innerHTML = `<div class="page-head"><span class="eyebrow">Quiz</span><h1>${esc(heading)}</h1></div><div id="quizMount"></div>`;
        const qm = $("#quizMount");
        Quiz.start(qm, opts);
        main._cleanup = qm._cleanup;      // stop the mock clock when navigating away
        break;
      }

      case "cards": {
        const mount = () => { main.innerHTML = '<div class="page-head"><span class="eyebrow">Flashcards</span><h1 id="cdTitle"></h1></div><div id="cardMount"></div>'; return $("#cardMount"); };
        if (!p[1]) { pageCardsHub(); break; }
        if (p[1] === "due") { const el = mount(); $("#cdTitle").textContent = "Cards due now"; Cards.start(el, { back: "#/cards" }); main._cleanup = el._cleanup; }
        else if (p[1] === "all") { const el = mount(); $("#cdTitle").textContent = "Every card, shuffled"; Cards.start(el, { filter: () => true, back: "#/cards" }); main._cleanup = el._cleanup; }
        else if (p[1] === "topic") {
          const t = findTopic(p[2]); if (t) setHue(t.hue);
          const el = mount(); $("#cdTitle").textContent = t ? "Topic " + t.n + " " + t.title : "Cards";
          Cards.start(el, { filter: c => c.topic === p[2], back: "#/cards" }); main._cleanup = el._cleanup;
        } else if (p[1] === "sub") {
          const s = findSub(p[2]); if (s) setHue(s.topic.hue);
          const el = mount(); $("#cdTitle").textContent = s ? s.id + " " + s.title : "Cards";
          Cards.start(el, { filter: c => c.sub === p[2], back: "#/sub/" + p[2] }); main._cleanup = el._cleanup;
        } else pageCardsHub();
        break;
      }

      default: pageHome();
    }

    function pageCardsHub() { setHue(168); Cards.hub(main); }

    enhanceCode(main);
    window.scrollTo(0, 0);
    main.classList.remove("fade-in"); void main.offsetWidth; main.classList.add("fade-in");
    refreshChrome();
    highlightTabs();
    toggleSheet(false);
    if (!/^#\/sub\//.test(location.hash)) {
      const bar = $("#readBar");
      if (bar) bar.style.width = "0";
    }
    document.getElementById("sidebar").classList.remove("open");
    $("#scrim").hidden = true;
  }

  /* ================================================================== */
  /* boot                                                                */
  /* ================================================================== */
  function init() {
    applyTheme();
    buildSidebar();
    buildTabbar();
    const rb = document.createElement("div");
    rb.className = "read-bar"; rb.id = "readBar";
    document.body.appendChild(rb);
    Store.touchStreak();

    addEventListener("hashchange", route);

    $("#themeToggle").onclick = () => {
      Store.state.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      Store.save(); applyTheme();
    };

    const sidebar = $("#sidebar"), scrim = $("#scrim");
    $("#navToggle").onclick = () => {
      const open = sidebar.classList.toggle("open");
      scrim.hidden = !open;
      $("#navToggle").setAttribute("aria-expanded", open);
    };
    scrim.onclick = () => { sidebar.classList.remove("open"); scrim.hidden = true; };

    $("#searchTrigger").onclick = openSearch;
    $("#searchInput").addEventListener("input", e => runSearch(e.target.value));
    $("#searchBox").addEventListener("click", e => { if (e.target === $("#searchBox")) closeSearch(); });
    $("#searchInput").addEventListener("keydown", e => {
      const items = Array.from(document.querySelectorAll("#searchResults .sr"));
      const cur = items.findIndex(i => i.classList.contains("sel"));
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!items.length) return;
        const nxt = e.key === "ArrowDown" ? Math.min(items.length - 1, cur + 1) : Math.max(0, cur - 1);
        items.forEach(i => i.classList.remove("sel"));
        items[nxt].classList.add("sel");
        items[nxt].scrollIntoView({ block: "nearest" });
      }
      if (e.key === "Enter") {
        const t = items[cur < 0 ? 0 : cur];
        if (t) { location.hash = t.getAttribute("href"); closeSearch(); }
      }
    });

    let goPending = false, goTimer = null;
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeSearch(); toggleSheet(false); }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      if (typing || e.metaKey || e.ctrlKey || e.altKey) {
        if (!typing && e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openSearch(); }
        return;
      }

      if (goPending) {                                  // second key of a "g then x" pair
        const dest = { h: "#/home", c: "#/cards", q: "#/quiz/mixed", l: "#/tools", p: "#/progress", e: "#/exam" }[e.key];
        goPending = false; clearTimeout(goTimer);
        if (dest) { e.preventDefault(); location.hash = dest; return; }
      }

      switch (e.key) {
        case "/": e.preventDefault(); openSearch(); break;
        case "?": e.preventDefault(); toggleSheet(); break;
        case "t": $("#themeToggle").click(); break;
        case "g":
          goPending = true;
          clearTimeout(goTimer);
          goTimer = setTimeout(() => { goPending = false; }, 900);
          break;
        case "j": case "k": {                           // step through subtopics in order
          const m = /^#\/sub\/([\d.]+)/.exec(location.hash);
          if (!m) break;
          const i = ALL_SUBS.findIndex(s => s.id === m[1]);
          const to = ALL_SUBS[e.key === "j" ? i + 1 : i - 1];
          if (to) location.hash = "#/sub/" + to.id;
          break;
        }
      }
    });

    $("#resetBtn").onclick = () => {
      if (!confirm("This clears your confidence ratings, quiz results, flashcard schedule and streak on this device. There is no undo. Continue?")) return;
      Store.reset(); applyTheme(); buildSidebar(); route(); toast("Progress cleared");
    };

    route();
  }

  return { init, toast, confetti, findSub, findTopic, refreshChrome, route };
})();

document.addEventListener("DOMContentLoaded", App.init);

</script>
</body>
</html>
