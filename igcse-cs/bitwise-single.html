{t:"3.2",ty:"txt",m:4,q:"A supermarket uses a barcode scanner at its checkouts. Describe what happens after the barcode is scanned.",a:"The scanner reads the pattern of black bars and white spaces and converts it into a binary number. This number is used to search the stock database for the record with the matching product code. If the record is found, the price and the product description are sent back and printed on the receipt and shown on the display. The quantity in stock for that product is then reduced by one, and if the stock level falls below the reorder level more stock is automatically ordered. If no matching record is found, an error message is displayed.",pts:["The scanned pattern is converted into a number","The number is looked up in the stock database","The price and description are returned and displayed or printed","The stock level is reduced by one, and reordering may be triggered"]},

/* ---------- 3.3 ---------- */
{t:"3.3",ty:"mcq",m:1,q:"Which storage medium uses pits and lands read by a laser?",o:["Optical","Magnetic","Solid state","Virtual"],a:0,e:"The reflection differs between a pit and a land, which is read as 1 or 0."},
{t:"3.3",ty:"mcq",m:1,q:"A computer slows down badly when many programs are open. Which is the most likely explanation?",o:["Heavy use of virtual memory, causing disk thrashing","The ROM has become full","The clock speed has decreased","The MAC address has changed"],a:0,e:"When RAM is full, pages are swapped to and from much slower secondary storage."},
{t:"3.3",ty:"txt",m:3,q:"Explain why a computer needs both RAM and ROM.",a:"ROM is non-volatile, so it keeps its contents when the power is off. This is essential for the start up instructions such as the BIOS, which must be available the moment the computer is switched on and must not be changed. RAM is volatile but can be read from and written to quickly and is much larger, so it holds the operating system, applications and data currently in use. Neither on its own would work: ROM cannot be written to during normal use, and RAM would be empty at switch on.",pts:["ROM is non-volatile and holds the start up instructions available at power on","ROM cannot be changed, which protects those instructions","RAM is volatile but can be written to and holds programs and data currently in use"]},

/* ---------- 3.4 ---------- */
{t:"3.4",ty:"mcq",m:1,q:"How many hexadecimal digits are there in a MAC address?",o:["12","8","6","32"],a:0,e:"48 bits divided into 12 hex digits, usually shown as six pairs."},
{t:"3.4",ty:"mcq",m:1,q:"Which address identifies a device's location on a network rather than the hardware itself?",o:["IP address","MAC address","Serial number","Manufacturer identifier"],a:0,e:"An IP address is assigned by the network and changes if the device joins a different network."},
{t:"3.4",ty:"txt",m:3,q:"Explain the purpose of a router in a home network.",a:"A router connects the home network to another network, normally the internet through the ISP. It reads the destination IP address in the header of each packet and uses a routing table to decide the best route to forward it along, so traffic reaches the correct destination. In a home it also assigns private IP addresses to the devices on the local network.",pts:["It connects one network to another, such as the LAN to the internet","It reads the destination IP address in each packet","It forwards packets along the best route, or assigns private IP addresses"]},

/* ---------- 4.1 ---------- */
{t:"4.1",ty:"mcq",m:1,q:"Where are the contents of the interrupted job stored while an interrupt is dealt with?",o:["On a stack","In the ROM","In the interrupt service routine","On the hard disk in virtual memory"],a:0,e:"Register contents are pushed onto the stack and restored afterwards so the job resumes exactly where it stopped."},
{t:"4.1",ty:"mcq",m:1,q:"Which task is NOT carried out by an operating system?",o:["Translating high-level source code into machine code","Managing memory allocation","Managing files and directories","Providing a user interface"],a:0,e:"Translation is done by a compiler or interpreter. That is system software, but it is not part of the OS's own management tasks."},
{t:"4.1",ty:"txt",m:4,q:"Describe two tasks carried out by an operating system.",a:"Memory management: the operating system allocates memory to each program that is running, keeps track of which areas are in use, and keeps programs separate so that one cannot overwrite another's data. File management: it names, saves, opens, moves and deletes files, organises them into directories, and controls access rights so users can only reach the files they are allowed to.",pts:["First task named","First task described correctly","Second task named","Second task described correctly"]},

/* ---------- 4.2 ---------- */
{t:"4.2",ty:"mcq",m:1,q:"Which translator has a one to one relationship between the source instructions and machine code instructions?",o:["Assembler","Compiler","Interpreter","Linker"],a:0,e:"Each assembly mnemonic corresponds to exactly one machine code instruction."},
{t:"4.2",ty:"mcq",m:1,q:"A finished program is sold to customers who do not have the source code. Which translator was most likely used?",o:["A compiler, because it produces an executable file","An interpreter, because it runs line by line","An assembler, because it produces mnemonics","No translator is needed"],a:0,e:"Compiling produces a distributable executable and keeps the source code private."},
{t:"4.2",ty:"txt",m:3,q:"Give one situation where a low-level language would be chosen instead of a high-level language, and explain why.",a:"A device driver or the software for an embedded system such as a washing machine controller would be written in a low-level language. A low-level language gives direct control over the hardware and over individual memory locations, which is necessary when the code has to talk to specific hardware. It can also be written to use very little memory and to run very quickly, which matters when the processor and memory are small.",pts:["A sensible situation, such as a device driver or embedded system","Gives direct control of the hardware or specific memory locations","More efficient in speed or memory use"]},

/* ---------- 5.1 ---------- */
{t:"5.1",ty:"mcq",m:1,q:"In the URL https://www.example.com/notes/binary.html, what is www.example.com?",o:["The domain name","The protocol","The file path","The web page"],a:0,e:"The protocol is https, and /notes/binary.html is the path and file name."},
{t:"5.1",ty:"mcq",m:1,q:"A user closes their browser and their shopping basket is emptied. Which type of cookie was being used?",o:["A session cookie","A persistent cookie","A tracking cookie","A secure cookie"],a:0,e:"Session cookies are held in memory only and are deleted when the browser closes."},
{t:"5.1",ty:"txt",m:4,q:"Describe two ways a website uses persistent cookies to improve a user's experience.",a:"A persistent cookie can store the user's log in details so they are recognised and signed in automatically the next time they visit, saving them from typing their details again. It can also store preferences such as the language, currency or theme the user chose, so the site appears the way they left it. Some sites use them to remember the contents of a basket between visits, or to recommend items based on pages the user previously viewed.",pts:["First use named, such as remembering log in details","Explanation of how that helps the user","Second use named, such as saving preferences or basket contents","Explanation of how that helps the user"]},

/* ---------- 5.2 ---------- */
{t:"5.2",ty:"mcq",m:1,q:"What does each block in a blockchain store, in addition to its transactions?",o:["Its own hash, the previous block's hash and a timestamp","The private keys of everyone involved","A full copy of the internet","The IP addresses of every user"],a:0,e:"Storing the previous block's hash is what chains the blocks together."},
{t:"5.2",ty:"mcq",m:1,q:"What does it mean to say a cryptocurrency is decentralised?",o:["No single bank or government controls it","It can only be spent in one country","It is stored on a single central server","It has no transaction record"],a:0,e:"The ledger is duplicated across the whole network rather than held by one authority."},
{t:"5.2",ty:"txt",m:3,q:"Explain one advantage and one disadvantage of digital currency compared with cash.",a:"An advantage is that a digital currency can be transferred instantly to anyone anywhere with an internet connection, without needing to physically hand over notes or coins, and transactions are recorded so they can be traced. A disadvantage is that it depends entirely on technology, so it cannot be used without a device and a connection, and if the value is not backed by a central bank it can change very quickly, meaning what someone holds may suddenly be worth much less.",pts:["A valid advantage, such as instant transfer over any distance or a permanent record","A valid disadvantage, such as needing a device and connection","A second valid point, such as volatility or no central authority to appeal to"]},

/* ---------- 5.3 ---------- */
{t:"5.3",ty:"mcq",m:1,q:"Malware that disguises itself as useful software and releases other malware once installed is a:",o:["Trojan horse","Worm","Virus","Adware"],a:0,e:"The disguise is the defining feature of a trojan."},
{t:"5.3",ty:"mcq",m:1,q:"Which threat relies on manipulating a person rather than exploiting the technology?",o:["Social engineering","A DDoS attack","Data interception","A brute force attack"],a:0,e:"Social engineering uses fear, curiosity or urgency to get someone to break security procedures themselves."},
{t:"5.3",ty:"mcq",m:1,q:"What does a proxy server do that helps protect a web server from a DDoS attack?",o:["It acts as an intermediary and takes the flood of requests instead of the web server","It encrypts all the traffic so the attack fails","It permanently deletes the attacker's IP address","It compresses incoming requests so they use less bandwidth"],a:0,e:"The proxy sits between users and the web server, so it absorbs the traffic and can filter it."},
{t:"5.3",ty:"txt",m:4,q:"A school is worried about ransomware. Describe how ransomware works and two measures that reduce the risk.",a:"Ransomware is malware that encrypts the files on the system so the user can no longer open them, and then displays a demand for payment in return for the decryption key. Keeping regular backups on separate, disconnected storage means the school can restore its files without paying anything. Up to date anti-malware software scans files against known signatures and quarantines threats before they run, and automatic software updates close the security weaknesses ransomware uses to get in. Staff training also helps, because ransomware often arrives through a phishing email attachment.",pts:["It encrypts the user's files so they cannot be accessed","A payment is demanded for the decryption key","A valid measure, such as regular separate backups","A second valid measure, such as anti-malware, updates or staff training"]},

/* ---------- 6.1 ---------- */
{t:"6.1",ty:"mcq",m:1,q:"In an automated car park barrier, which component raises the barrier?",o:["An actuator, such as a motor","An infrared sensor","The analogue to digital converter","The microprocessor"],a:0,e:"The microprocessor decides, but the actuator performs the physical movement."},
{t:"6.1",ty:"mcq",m:1,q:"Which is a disadvantage of an automated system?",o:["It can fail completely if a sensor develops a fault","It cannot work continuously","It responds more slowly than a human","It is always less accurate than a human"],a:0,e:"Automated systems are faster, more consistent and work continuously. The drawbacks are set up cost, maintenance and reliance on the sensors."},
{t:"6.1",ty:"txt",m:5,q:"Describe how an automated system controls the temperature in a chicken shed, where the temperature must stay between 18 and 22 degrees.",a:"A temperature sensor continuously measures the temperature inside the shed and sends its readings to the microprocessor, passing through an analogue to digital converter because the readings are analogue. The microprocessor compares each reading with the stored pre-set values of 18 and 22 degrees. If the reading is above 22, the microprocessor sends a signal to an actuator that switches on a fan or opens a vent. If the reading is below 18, a signal is sent to an actuator that switches on a heater. If the reading is within range no action is taken. The process repeats continuously without any human intervention.",pts:["The sensor continuously sends readings to the microprocessor","An ADC converts the analogue readings to digital","The reading is compared with stored pre-set values","Above the range, a signal operates a fan or vent; below it, a heater","The process repeats continuously with no human needed"]},

/* ---------- 6.2 ---------- */
{t:"6.2",ty:"mcq",m:1,q:"Which task is a robot least suited to?",o:["Dealing with an unexpected situation that it was not programmed for","Welding the same joint thousands of times","Working in a radioactive environment","Lifting heavy loads repeatedly"],a:0,e:"Lack of flexibility is the key limitation. A robot only does what it has been programmed to do."},
{t:"6.2",ty:"mcq",m:1,q:"A robot that works without any human operator is described as:",o:["Autonomous","Embedded","Asynchronous","Volatile"],a:0,e:"Autonomous means it operates on its own, using its sensors and programming."},
{t:"6.2",ty:"txt",m:3,q:"Give three characteristics of a robot.",a:"A robot has a mechanical structure or framework, and electrical components such as motors and a power supply. It contains programmable instructions, so what it does can be changed. It uses sensors to gather information about its surroundings, and actuators such as motors to move. It may be autonomous or controlled by a human operator.",pts:["A mechanical structure and electrical components","Programmable instructions that can be changed","Sensors to gather information about its surroundings","Actuators that produce movement"]},

/* ---------- 6.3 ---------- */
{t:"6.3",ty:"mcq",m:1,q:"Which part of an expert system holds the facts gathered from human experts?",o:["The knowledge base","The rule base","The inference engine","The user interface"],a:0,e:"The rule base holds the IF THEN rules, and the inference engine applies them to the knowledge base."},
{t:"6.3",ty:"mcq",m:1,q:"Which is a disadvantage of using an expert system for medical diagnosis?",o:["It has no common sense and cannot handle a situation outside its knowledge base","It can never be as fast as a human doctor","It cannot store more than a few facts","It gives a different answer every time for the same input"],a:0,e:"Expert systems are fast and consistent, but they only know what is in the knowledge base."},
{t:"6.3",ty:"txt",m:3,q:"Explain the difference between artificial intelligence and machine learning.",a:"Artificial intelligence is the broad idea of a computer simulating human intelligence: gathering data, applying rules and reaching conclusions or decisions in a way that mimics human reasoning. Machine learning is a particular type of artificial intelligence in which the system automatically improves its own performance as it is given more data, without a programmer rewriting its instructions. So all machine learning is AI, but not all AI learns.",pts:["AI simulates human intelligence by applying rules to data to reach conclusions","Machine learning improves its own performance as it receives more data","Machine learning is a type of AI, or does not need reprogramming to improve"]},

/* ---------- 7.1 ---------- */
{t:"7.1",ty:"mcq",m:1,q:"A program crashes when it tries to read element 11 of an array declared as ARRAY[1:10]. This is a:",o:["Run-time error","Syntax error","Logic error","Transposition error"],a:0,e:"The code is valid, so it runs, but the program stops while running."},
{t:"7.1",ty:"txt",m:4,q:"Explain what is meant by abstraction and decomposition, giving an example of each.",a:"Abstraction means keeping only the details that matter for solving the problem and removing everything else. An underground train map is an example: it keeps the order of the stations and the lines connecting them, and drops the real distances and the exact geography, because those do not help a passenger. Decomposition means breaking a problem into smaller sub-problems that can each be solved separately and then combined. Writing a game could be decomposed into handling player input, updating the score, drawing the screen and saving the high score, with each part written and tested on its own.",pts:["Abstraction defined as keeping only the relevant details","A valid abstraction example","Decomposition defined as breaking into smaller sub-problems","A valid decomposition example"]},

/* ---------- 7.2 ---------- */
{t:"7.2",ty:"mcq",m:1,q:"Which flowchart symbol is used for INPUT and OUTPUT?",o:["A parallelogram","A rectangle","A diamond","A rounded rectangle"],a:0,e:"A rectangle is a process, a diamond is a decision, a rounded rectangle is a terminator."},
{t:"7.2",ty:"mcq",m:1,q:"On Paper 2, in which question may you write your answer in Python instead of pseudocode?",o:["Only the 15 mark scenario question","Any question that asks for code","No question at all","Only questions about arrays"],a:0,e:"Everywhere else, a solution written in a programming language is not awarded marks."},
{t:"7.2",ty:"txt",m:3,q:"Describe what a structure diagram shows, and how it differs from a flowchart.",a:"A structure diagram shows a system broken down into its sub-systems as a hierarchy, with the whole system at the top and each level below showing the parts it decomposes into. It shows what the parts of the system are and how they relate to one another. A flowchart is different because it shows the order in which the steps are carried out, including the decisions and loops, rather than the structure of the system.",pts:["Shows a system broken into sub-systems in a hierarchy","Shows what the parts are and how they relate","A flowchart shows the order or sequence of steps instead"]},

/* ---------- 7.3 ---------- */
{t:"7.3",ty:"mcq",m:1,q:"Trace: A = 1; B = 1; FOR i = 1 TO 4: T = A + B; A = B; B = T; NEXT i. What is B at the end?",o:["8","5","13","6"],a:0,e:"The values run 1,1 then 2, 3, 5, 8. This builds the Fibonacci sequence."},
{t:"7.3",ty:"mcq",m:1,q:"In a trace table, what should you write for a variable on a row where its value does not change?",o:["Leave the cell blank","Repeat the previous value","Write a zero","Write the word same"],a:0,e:"Only record a value when the variable actually changes. Repeating values across rows loses marks."},

<script>
/* ---- js/store.js ---- */
/* Local progress store. Everything lives in localStorage, nothing leaves the browser. */

const Store = (function () {
  const KEY = "bitwise.igcse.v1";

  const fresh = () => ({
    theme: null,          // "dark" | "light" | null (follow system)
    conf: {},             // subtopic id -> 1 shaky, 2 ok, 3 solid
    read: {},             // subtopic id -> true once notes opened
    quiz: {},             // subtopic id -> {right, asked, best}
    cards: {},            // card id -> {box:1..5, due: epoch ms}
    xp: 0,
    streak: { count: 0, last: null },
    drill: { best: 0 }
  });

  let s = fresh();

  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { /* corrupted or blocked storage: fall back to defaults */ }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    }, 120);
  }

  const todayKey = () => new Date().toISOString().slice(0, 10);

  function touchStreak() {
    const t = todayKey();
    if (s.streak.last === t) return false;
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    s.streak.count = s.streak.last === y ? s.streak.count + 1 : 1;
    s.streak.last = t;
    save();
    return true;
  }

  function addXp(n) { s.xp += n; save(); }

  /* ---- progress model -------------------------------------------------
     A subtopic is scored out of 100 from three signals:
       read the notes          -> 20
       self-rated confidence   -> up to 30
       quiz accuracy           -> up to 50
  --------------------------------------------------------------------- */
  function mastery(id) {
    let v = 0;
    if (s.read[id]) v += 20;
    const c = s.conf[id];
    if (c) v += c * 10;
    const q = s.quiz[id];
    if (q && q.asked >= 3) v += Math.round((q.right / q.asked) * 50);
    else if (q && q.asked > 0) v += Math.round((q.right / q.asked) * 25);
    return Math.min(100, v);
  }

  function topicMastery(topic) {
    const vals = topic.subs.map(sub => mastery(sub.id));
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }

  function overall() {
    const ids = SYLLABUS.flatMap(t => t.subs.map(x => x.id));
    return Math.round(ids.reduce((a, id) => a + mastery(id), 0) / ids.length);
  }

  function recordQuiz(id, right) {
    const q = s.quiz[id] || (s.quiz[id] = { right: 0, asked: 0 });
    q.asked++;
    if (right) q.right++;
    save();
  }

  function setConf(id, v) {
    if (s.conf[id] === v) delete s.conf[id]; else s.conf[id] = v;
    save();
  }

  function markRead(id) {
    if (!s.read[id]) { s.read[id] = true; addXp(5); }
    touchStreak();
  }

  /* ---- flashcard scheduling: Leitner boxes ---------------------------- */
  const BOX_DAYS = [0, 0, 1, 3, 7, 16];   // index = box number

  function cardState(id) {
    return s.cards[id] || { box: 1, due: 0 };
  }
  function gradeCard(id, good) {
    const c = cardState(id);
    c.box = good ? Math.min(5, c.box + 1) : 1;
    c.due = Date.now() + BOX_DAYS[c.box] * 864e5;
    s.cards[id] = c;
    if (good) addXp(2);
    save();
  }
  function dueCount(cards) {
    const now = Date.now();
    return cards.filter(c => cardState(c.id).due <= now).length;
  }

  function reset() {
    s = fresh();
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  return {
    get state() { return s; },
    save, mastery, topicMastery, overall, recordQuiz, setConf, markRead,
    cardState, gradeCard, dueCount, addXp, touchStreak, reset, todayKey
  };
})();

</script>
<script>
/* ---- js/pseudocode.js ---- */
/* A small interpreter for Cambridge IGCSE pseudocode.

   Paper 2 requires solutions in pseudocode, so students need somewhere to run it.
   Supports: DECLARE / CONSTANT, assignment, INPUT / OUTPUT, IF / CASE,
   FOR / WHILE / REPEAT, 1D and 2D arrays, PROCEDURE / FUNCTION, and the
   library routines named in the syllabus.

   Errors carry a line number and say what to do about it, because a runner that
   only says "syntax error" teaches nothing.
*/

const Pseudo = (function () {

  const KEYWORDS = new Set([
    "DECLARE", "CONSTANT", "INPUT", "OUTPUT", "PRINT", "IF", "THEN", "ELSE", "ENDIF",
    "CASE", "OF", "OTHERWISE", "ENDCASE", "FOR", "TO", "STEP", "NEXT", "WHILE", "DO",
    "ENDWHILE", "REPEAT", "UNTIL", "PROCEDURE", "ENDPROCEDURE", "CALL", "FUNCTION",
    "RETURNS", "RETURN", "ENDFUNCTION", "ARRAY", "AND", "OR", "NOT", "MOD", "DIV",
    "TRUE", "FALSE", "INTEGER", "REAL", "CHAR", "STRING", "BOOLEAN"
  ]);

  const TYPES = new Set(["INTEGER", "REAL", "CHAR", "STRING", "BOOLEAN"]);

  class PseudoError extends Error {
    constructor(msg, line) { super(msg); this.line = line; }
  }
  const err = (msg, line) => { throw new PseudoError(msg, line); };

  /* ---------------------------------------------------------------- */
  /* tokenizer                                                         */
  /* ---------------------------------------------------------------- */
  function tokenize(src) {
    const out = [];
    let i = 0, line = 1;
    const push = (type, value) => out.push({ type, value, line });

    while (i < src.length) {
      const c = src[i];

      if (c === "\n") { push("nl"); line++; i++; continue; }
      if (c === " " || c === "\t" || c === "\r") { i++; continue; }

      // comments
      if (c === "/" && src[i + 1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }

      // assignment arrow, written either way
      if (c === "←") { push("op", "<-"); i++; continue; }
      if (c === "<" && src[i + 1] === "-") { push("op", "<-"); i += 2; continue; }

      // strings and chars
      if (c === '"' || c === "'") {
        const quote = c; let s = ""; i++;
        while (i < src.length && src[i] !== quote) {
          if (src[i] === "\n") err("A text value is missing its closing " + quote, line);
          s += src[i++];
        }
        if (i >= src.length) err("A text value is missing its closing " + quote, line);
        i++;
        push("str", s);
        continue;
      }

      // numbers
      if (/[0-9]/.test(c)) {
        let s = "";
        while (i < src.length && /[0-9.]/.test(src[i])) s += src[i++];
        if ((s.match(/\./g) || []).length > 1) err('"' + s + '" is not a valid number', line);
        push("num", parseFloat(s));
        continue;
      }

      // identifiers and keywords
      if (/[A-Za-z_]/.test(c)) {
        let s = "";
        while (i < src.length && /[A-Za-z0-9_]/.test(src[i])) s += src[i++];
        const up = s.toUpperCase();
        if (KEYWORDS.has(up)) push("kw", up); else push("id", s);
        continue;
      }

      // multi-character operators
      const two = src.substr(i, 2);
      if (two === "<=" || two === ">=" || two === "<>") { push("op", two); i += 2; continue; }

      if ("+-*/^=<>(),[]:&".includes(c)) { push("op", c); i++; continue; }

      err('The character "' + c + '" does not mean anything in pseudocode', line);
    }
    push("eof");
    return out;
  }

  /* ---------------------------------------------------------------- */
  /* parser                                                            */
  /* ---------------------------------------------------------------- */
  function parse(tokens) {
    let p = 0;
    const peek = () => tokens[p];
    const at = (type, value) => tokens[p].type === type && (value === undefined || tokens[p].value === value);
    const atKw = k => at("kw", k);
    const next = () => tokens[p++];
    const line = () => tokens[p].line;

    function expect(type, value, what) {
      if (!at(type, value)) {
        err("Expected " + (what || value) + " but found " + describe(tokens[p]), tokens[p].line);
      }
      return next();
    }
    function describe(t) {
      if (t.type === "eof") return "the end of the program";
      if (t.type === "nl") return "the end of the line";
      return '"' + t.value + '"';
    }
    const skipNl = () => { while (at("nl")) next(); };
    function endOfStatement() {
      if (at("nl") || at("eof")) { skipNl(); return; }
      err("Unexpected " + describe(tokens[p]) + " at the end of the statement", tokens[p].line);
    }

    /* ---- expressions ---- */
    function expression() { return orExpr(); }

    function orExpr() {
      let l = andExpr();
      while (atKw("OR")) { const ln = line(); next(); l = { k: "bin", op: "OR", l, r: andExpr(), line: ln }; }
      return l;
    }
    function andExpr() {
      let l = notExpr();
      while (atKw("AND")) { const ln = line(); next(); l = { k: "bin", op: "AND", l, r: notExpr(), line: ln }; }
      return l;
    }
    function notExpr() {
      if (atKw("NOT")) { const ln = line(); next(); return { k: "not", e: notExpr(), line: ln }; }
      return compare();
    }
    function compare() {
      let l = addSub();
      while (at("op", "=") || at("op", "<>") || at("op", "<") || at("op", "<=") || at("op", ">") || at("op", ">=")) {
        const ln = line(), op = next().value;
        l = { k: "bin", op, l, r: addSub(), line: ln };
      }
      return l;
    }
    function addSub() {
      let l = mulDiv();
      while (at("op", "+") || at("op", "-") || at("op", "&")) {
        const ln = line(), op = next().value;
        l = { k: "bin", op, l, r: mulDiv(), line: ln };
      }
      return l;
    }
    function mulDiv() {
      let l = power();
      while (at("op", "*") || at("op", "/") || atKw("MOD") || atKw("DIV")) {
        const ln = line(), op = next().value;
        l = { k: "bin", op, l, r: power(), line: ln };
      }
      return l;
    }
    function power() {
      const l = unary();
      if (at("op", "^")) { const ln = line(); next(); return { k: "bin", op: "^", l, r: power(), line: ln }; }
      return l;
    }
    function unary() {
      if (at("op", "-")) { const ln = line(); next(); return { k: "neg", e: unary(), line: ln }; }
      return primary();
    }
    function primary() {
      const t = peek(), ln = t.line;
      if (t.type === "num") { next(); return { k: "num", v: t.value, line: ln }; }
      if (t.type === "str") { next(); return { k: "str", v: t.value, line: ln }; }
      if (atKw("TRUE")) { next(); return { k: "bool", v: true, line: ln }; }
      if (atKw("FALSE")) { next(); return { k: "bool", v: false, line: ln }; }
      if (at("op", "(")) { next(); const e = expression(); expect("op", ")", "a closing bracket )"); return e; }
      if (t.type === "id") {
        next();
        if (at("op", "(")) {                                  // function call
          next();
          const args = [];
          if (!at("op", ")")) { do { args.push(expression()); } while (at("op", ",") && next()); }
          expect("op", ")", "a closing bracket )");
          return { k: "call", name: t.value, args, line: ln };
        }
        if (at("op", "[")) {                                  // array element
          next();
          const idx = [expression()];
          while (at("op", ",")) { next(); idx.push(expression()); }
          expect("op", "]", "a closing bracket ]");
          return { k: "index", name: t.value, idx, line: ln };
        }
        return { k: "var", name: t.value, line: ln };
      }
      err("Expected a value but found " + describe(t), ln);
    }

    /* ---- statements ---- */
    function block(stops) {
      const list = [];
      for (;;) {
        skipNl();
        if (at("eof")) break;
        if (peek().type === "kw" && stops.includes(peek().value)) break;
        list.push(statement());
      }
      return list;
    }

    function statement() {
      const t = peek(), ln = t.line;

      if (atKw("DECLARE")) {
        next();
        const name = expect("id", undefined, "a variable name").value;
        expect("op", ":", "a colon");
        if (atKw("ARRAY")) {
          next();
          expect("op", "[", "a square bracket [");
          const bounds = [];
          do {
            const lo = expression();
            expect("op", ":", "a colon between the bounds, as in [1:10]");
            bounds.push({ lo, hi: expression() });
          } while (at("op", ",") && next());
          expect("op", "]", "a closing bracket ]");
          expect("kw", "OF", "the word OF");
          const type = next().value;
          endOfStatement();
          return { k: "declareArray", name, bounds, type, line: ln };
        }
        const type = next().value;
        if (!TYPES.has(String(type))) err('"' + type + '" is not a data type. Use INTEGER, REAL, CHAR, STRING or BOOLEAN', ln);
        endOfStatement();
        return { k: "declare", name, type, line: ln };
      }

      if (atKw("CONSTANT")) {
        next();
        const name = expect("id", undefined, "a name").value;
        if (at("op", "=")) next(); else if (at("op", "<-")) next(); else err("Expected = after the constant name", ln);
        const value = expression();
        endOfStatement();
        return { k: "constant", name, value, line: ln };
      }

      if (atKw("INPUT")) {
        next();
        const target = lvalue();
        endOfStatement();
        return { k: "input", target, line: ln };
      }

      if (atKw("OUTPUT") || atKw("PRINT")) {
        next();
        const parts = [expression()];
        while (at("op", ",")) { next(); parts.push(expression()); }
        endOfStatement();
        return { k: "output", parts, line: ln };
      }

      if (atKw("IF")) {
        next();
        const cond = expression();
        skipNl();
        expect("kw", "THEN", "the word THEN");
        const then = block(["ELSE", "ENDIF"]);
        let other = null;
        if (atKw("ELSE")) { next(); other = block(["ENDIF"]); }
        expect("kw", "ENDIF", "the word ENDIF");
        endOfStatement();
        return { k: "if", cond, then, other, line: ln };
      }

      if (atKw("CASE")) {
        next();
        expect("kw", "OF", "the word OF");
        const subject = expression();
        skipNl();
        const arms = [];
        let otherwise = null;
        for (;;) {
          skipNl();
          if (atKw("ENDCASE") || at("eof")) break;
          if (atKw("OTHERWISE")) {
            next();
            if (at("op", ":")) next();
            otherwise = [statement()];
            continue;
          }
          const match = expression();
          expect("op", ":", "a colon after the case value");
          arms.push({ match, body: [statement()] });
        }
        expect("kw", "ENDCASE", "the word ENDCASE");
        endOfStatement();
        return { k: "case", subject, arms, otherwise, line: ln };
      }

      if (atKw("FOR")) {
        next();
        const name = expect("id", undefined, "the counter name").value;
        if (at("op", "<-")) next(); else if (at("op", "=")) next(); else err("Expected an assignment arrow after the counter", ln);
        const from = expression();
        expect("kw", "TO", "the word TO");
        const to = expression();
        let step = null;
        if (atKw("STEP")) { next(); step = expression(); }
        const body = block(["NEXT"]);
        expect("kw", "NEXT", "the word NEXT");
        if (peek().type === "id") next();                      // NEXT i, counter name optional
        endOfStatement();
        return { k: "for", name, from, to, step, body, line: ln };
      }

      if (atKw("WHILE")) {
        next();
        const cond = expression();
        if (atKw("DO")) next();
        const body = block(["ENDWHILE"]);
        expect("kw", "ENDWHILE", "the word ENDWHILE");
        endOfStatement();
        return { k: "while", cond, body, line: ln };
      }

      if (atKw("REPEAT")) {
        next();
        const body = block(["UNTIL"]);
        expect("kw", "UNTIL", "the word UNTIL");
        const cond = expression();
        endOfStatement();
        return { k: "repeat", cond, body, line: ln };
      }

      if (atKw("PROCEDURE") || atKw("FUNCTION")) {
        const isFn = peek().value === "FUNCTION";
        next();
        const name = expect("id", undefined, "a name").value;
        const params = [];
        if (at("op", "(")) {
          next();
          if (!at("op", ")")) {
            do {
              const pn = expect("id", undefined, "a parameter name").value;
              if (at("op", ":")) { next(); next(); }           // type is optional here
              params.push(pn);
            } while (at("op", ",") && next());
          }
          expect("op", ")", "a closing bracket )");
        }
        if (atKw("RETURNS")) { next(); next(); }
        const body = block([isFn ? "ENDFUNCTION" : "ENDPROCEDURE"]);
        expect("kw", isFn ? "ENDFUNCTION" : "ENDPROCEDURE", "the word END" + (isFn ? "FUNCTION" : "PROCEDURE"));
        endOfStatement();
        return { k: "subroutine", isFn, name, params, body, line: ln };
      }

      if (atKw("RETURN")) {
        next();
        const value = (at("nl") || at("eof")) ? null : expression();
        endOfStatement();
        return { k: "return", value, line: ln };
      }

      if (atKw("CALL")) {
        next();
        const name = expect("id", undefined, "a procedure name").value;
        const args = [];
        if (at("op", "(")) {
          next();
          if (!at("op", ")")) { do { args.push(expression()); } while (at("op", ",") && next()); }
          expect("op", ")", "a closing bracket )");
        }
        endOfStatement();
        return { k: "call", name, args, line: ln };
      }

      if (t.type === "id") {
        const target = lvalue();
        if (at("op", "<-") || at("op", "=")) {
          next();
          const value = expression();
          endOfStatement();
          return { k: "assign", target, value, line: ln };
        }
        if (at("op", "(")) {                                   // bare procedure call
          next();
          const args = [];
          if (!at("op", ")")) { do { args.push(expression()); } while (at("op", ",") && next()); }
          expect("op", ")", "a closing bracket )");
          endOfStatement();
          return { k: "call", name: target.name, args, line: ln };
        }
        err("Expected an assignment arrow after " + target.name + ". Write " + target.name + " ← value", ln);
      }

      err("A statement cannot start with " + describe(t), ln);
    }

    function lvalue() {
      const t = expect("id", undefined, "a variable name");
      if (at("op", "[")) {
        next();
        const idx = [expression()];
        while (at("op", ",")) { next(); idx.push(expression()); }
        expect("op", "]", "a closing bracket ]");
        return { k: "index", name: t.value, idx, line: t.line };
      }
      return { k: "var", name: t.value, line: t.line };
    }

    const program = block([]);
    return program;
  }

  /* ---------------------------------------------------------------- */
  /* interpreter                                                       */
  /* ---------------------------------------------------------------- */
  const RETURN = Symbol("return");

  function run(src, inputLines, opts) {
    opts = opts || {};
    const output = [];
    const inputs = (inputLines || []).slice();
    const subs = Object.create(null);
    const globals = new Map();
    const consts = new Set();
    let steps = 0;
    const LIMIT = opts.stepLimit || 2000000;
    const LOOP_LIMIT = 50000;   // a teaching program never legitimately spins this long

    const ast = parse(tokenize(src));
    ast.forEach(s => { if (s.k === "subroutine") subs[s.name.toLowerCase()] = s; });

    const fmt = v => {
      if (v === null || v === undefined) return "";
      if (typeof v === "boolean") return v ? "TRUE" : "FALSE";
      if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(Math.round(v * 1e10) / 1e10);
      return String(v);
    };

    function scopeGet(scope, name, line) {
      const key = name.toLowerCase();
      if (scope.has(key)) return scope.get(key);
      if (globals.has(key)) return globals.get(key);
      err('The variable "' + name + '" has not been given a value yet. Declare it or assign to it first.', line);
    }
    function scopeSet(scope, name, value, line) {
      const key = name.toLowerCase();
      if (consts.has(key)) err('"' + name + '" is a constant, so its value cannot be changed', line);
      if (scope.has(key) || scope === globals) scope.set(key, value);
      else if (globals.has(key)) globals.set(key, value);
      else scope.set(key, value);
    }

    function makeArray(node, scope) {
      const dims = node.bounds.map(b => ({ lo: Math.trunc(evalExpr(b.lo, scope)), hi: Math.trunc(evalExpr(b.hi, scope)) }));
      dims.forEach(d => { if (d.hi < d.lo) err("An array cannot have an upper bound below its lower bound", node.line); });
      return { array: true, dims, data: new Map(), type: node.type };
    }
    function arrayKey(arr, idx, line, name) {
      if (idx.length !== arr.dims.length) {
        err('"' + name + '" is a ' + arr.dims.length + "-dimensional array, so it needs " + arr.dims.length + " index value" + (arr.dims.length > 1 ? "s" : ""), line);
      }
      return idx.map((v, i) => {
        const n = Math.trunc(v);
        const d = arr.dims[i];
        if (n < d.lo || n > d.hi) {
          err("Index " + n + " is outside the array " + name + ", which runs from " + d.lo + " to " + d.hi, line);
        }
        return n;
      }).join(",");
    }

    const BUILTINS = {
      length: (a, line) => String(a[0] === undefined ? err("LENGTH needs a value", line) : a[0]).length,
      substring: (a, line) => {
        const s = String(a[0]), start = Math.trunc(a[1]), len = Math.trunc(a[2]);
        if (start < 1 || start > s.length) err("SUBSTRING was asked to start at position " + start + ", but the text is " + s.length + " characters long", line);
        return s.substr(start - 1, len);
      },
      ucase: a => String(a[0]).toUpperCase(),
      lcase: a => String(a[0]).toLowerCase(),
      round: a => { const p = Math.pow(10, Math.trunc(a[1] || 0)); return Math.round(a[0] * p) / p; },
      random: a => a.length ? Math.random() * a[0] : Math.random(),
      int: a => Math.trunc(a[0]),
      div: a => Math.trunc(a[0] / a[1]),
      mod: a => a[0] % a[1],
      num_to_string: a => String(a[0]),
      string_to_num: a => parseFloat(a[0])
    };

    function evalExpr(n, scope) {
      if (++steps > LIMIT) err("The program ran for too long. Check that every loop can actually finish.", n.line);
      switch (n.k) {
        case "num": case "str": case "bool": return n.v;
        case "var": {
          const v = scopeGet(scope, n.name, n.line);
          if (v && v.array) return v;
          return v;
        }
        case "neg": return -toNum(evalExpr(n.e, scope), n.line);
        case "not": return !truthy(evalExpr(n.e, scope), n.line);
        case "index": {
          const arr = scopeGet(scope, n.name, n.line);
          if (!arr || !arr.array) err('"' + n.name + '" is not an array', n.line);
          const key = arrayKey(arr, n.idx.map(e => evalExpr(e, scope)), n.line, n.name);
          if (!arr.data.has(key)) err("Nothing has been stored in " + n.name + "[" + key + "] yet", n.line);
          return arr.data.get(key);
        }
        case "call": {
          const key = n.name.toLowerCase();
          const args = n.args.map(a => evalExpr(a, scope));
          if (BUILTINS[key]) return BUILTINS[key](args, n.line);
          const sub = subs[key];
          if (!sub) err('There is no function called "' + n.name + '"', n.line);
          return callSub(sub, args, n.line);
        }
        case "bin": {
          const op = n.op;
          if (op === "AND") return truthy(evalExpr(n.l, scope), n.line) && truthy(evalExpr(n.r, scope), n.line);
          if (op === "OR") return truthy(evalExpr(n.l, scope), n.line) || truthy(evalExpr(n.r, scope), n.line);
          const a = evalExpr(n.l, scope), b = evalExpr(n.r, scope);
          switch (op) {
            case "+":
              if (typeof a === "string" || typeof b === "string") return String(fmt(a)) + String(fmt(b));
              return toNum(a, n.line) + toNum(b, n.line);
            case "&": return String(fmt(a)) + String(fmt(b));
            case "-": return toNum(a, n.line) - toNum(b, n.line);
            case "*": return toNum(a, n.line) * toNum(b, n.line);
            case "/":
              if (toNum(b, n.line) === 0) err("This divides by zero, which a computer cannot do", n.line);
              return toNum(a, n.line) / toNum(b, n.line);
            case "^": return Math.pow(toNum(a, n.line), toNum(b, n.line));
            case "MOD":
              if (toNum(b, n.line) === 0) err("MOD cannot be used with zero", n.line);
              return toNum(a, n.line) % toNum(b, n.line);
            case "DIV":
              if (toNum(b, n.line) === 0) err("DIV cannot be used with zero", n.line);
              return Math.trunc(toNum(a, n.line) / toNum(b, n.line));
            case "=": return eq(a, b);
            case "<>": return !eq(a, b);
            case "<": return cmp(a, b, n.line) < 0;
            case "<=": return cmp(a, b, n.line) <= 0;
            case ">": return cmp(a, b, n.line) > 0;
            case ">=": return cmp(a, b, n.line) >= 0;
          }
        }
      }
      err("Cannot work out that expression", n.line);
    }

    const eq = (a, b) => (typeof a === "string" || typeof b === "string") ? String(a) === String(b) : a === b;
    const cmp = (a, b, line) => {
      if (typeof a === "string" || typeof b === "string") return String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
      return toNum(a, line) - toNum(b, line);
    };
    function toNum(v, line) {
      if (typeof v === "number") return v;
      if (typeof v === "boolean") return v ? 1 : 0;
      const n = parseFloat(v);
      if (isNaN(n)) err('"' + v + '" is text, so it cannot be used in a calculation', line);
      return n;
    }
    function truthy(v, line) {
      if (typeof v === "boolean") return v;
      err("A condition has to be TRUE or FALSE, but this one gave " + fmt(v), line);
    }

    function callSub(sub, args, line) {
      if (args.length !== sub.params.length) {
        err(sub.name + " expects " + sub.params.length + " value" + (sub.params.length === 1 ? "" : "s") +
            " but was given " + args.length, line);
      }
      const local = new Map();
      sub.params.forEach((p, i) => local.set(p.toLowerCase(), args[i]));
      const r = execBlock(sub.body, local);
      if (r && r.type === RETURN) return r.value;
      if (sub.isFn) err(sub.name + " is a function, so it must RETURN a value", line);
      return null;
    }

    function execBlock(list, scope) {
      for (const st of list) {
        const r = exec(st, scope);
        if (r && r.type === RETURN) return r;
      }
      return null;
    }

    function exec(n, scope) {
      if (++steps > LIMIT) err("The program ran for too long. Check that every loop can actually finish.", n.line);
      switch (n.k) {
        case "subroutine": return null;                        // collected before the run

        case "declare":
          scope.set(n.name.toLowerCase(), n.type === "STRING" ? "" : n.type === "BOOLEAN" ? false : 0);
          return null;

        case "declareArray":
          scope.set(n.name.toLowerCase(), makeArray(n, scope));
          return null;

        case "constant": {
          const v = evalExpr(n.value, scope);
          globals.set(n.name.toLowerCase(), v);
          consts.add(n.name.toLowerCase());
          return null;
        }

        case "assign": {
          const v = evalExpr(n.value, scope);
          assignTo(n.target, v, scope);
          return null;
        }

        case "input": {
          if (!inputs.length) {
            err("The program asked for input but the input box is empty. Add a line for every INPUT the program reaches.", n.line);
          }
          const raw = inputs.shift();
          const asNum = raw.trim() === "" ? NaN : Number(raw);
          assignTo(n.target, isNaN(asNum) ? raw : asNum, scope);
          return null;
        }

        case "output":
          output.push(n.parts.map(e => fmt(evalExpr(e, scope))).join(""));
          if (output.length > 5000) err("The program produced far too much output. Check your loops.", n.line);
          return null;

        case "if":
          if (truthy(evalExpr(n.cond, scope), n.line)) return execBlock(n.then, scope);
          if (n.other) return execBlock(n.other, scope);
          return null;

        case "case": {
          const v = evalExpr(n.subject, scope);
          for (const arm of n.arms) {
            if (eq(v, evalExpr(arm.match, scope))) return execBlock(arm.body, scope);
          }
          if (n.otherwise) return execBlock(n.otherwise, scope);
          return null;
        }

        case "for": {
          const from = toNum(evalExpr(n.from, scope), n.line);
          const to = toNum(evalExpr(n.to, scope), n.line);
          const step = n.step ? toNum(evalExpr(n.step, scope), n.line) : 1;
          if (step === 0) err("A FOR loop with a STEP of 0 would never finish", n.line);
          let spins = 0;
          for (let i = from; step > 0 ? i <= to : i >= to; i += step) {
            scopeSet(scope, n.name, i, n.line);
            const r = execBlock(n.body, scope);
            if (r && r.type === RETURN) return r;
            if (++spins > LOOP_LIMIT) err("This FOR loop is running far more times than expected. Check its start and end values.", n.line);
          }
          return null;
        }

        case "while": {
          let spins = 0;
          while (truthy(evalExpr(n.cond, scope), n.line)) {
            const r = execBlock(n.body, scope);
            if (r && r.type === RETURN) return r;
            if (++spins > LOOP_LIMIT) err("This WHILE loop never becomes false, so it would run forever. Check that something inside the loop changes the condition.", n.line);
          }
          return null;
        }

        case "repeat": {
          let spins = 0;
          for (;;) {
            const r = execBlock(n.body, scope);
            if (r && r.type === RETURN) return r;
            if (truthy(evalExpr(n.cond, scope), n.line)) break;
            if (++spins > LOOP_LIMIT) err("This REPEAT loop never becomes true, so it would run forever. Check that something inside the loop changes the condition.", n.line);
          }
          return null;
        }

        case "return":
          return { type: RETURN, value: n.value ? evalExpr(n.value, scope) : null };

        case "call": {
          const key = n.name.toLowerCase();
          const args = n.args.map(a => evalExpr(a, scope));
          if (BUILTINS[key]) { BUILTINS[key](args, n.line); return null; }
          const sub = subs[key];
          if (!sub) err('There is no procedure called "' + n.name + '"', n.line);
          callSub(sub, args, n.line);
          return null;
        }
      }
      err("Cannot carry out that statement", n.line);
    }

    function assignTo(target, value, scope) {
      if (target.k === "var") { scopeSet(scope, target.name, value, target.line); return; }
      const arr = scopeGet(scope, target.name, target.line);
      if (!arr || !arr.array) err('"' + target.name + '" is not an array, so it cannot be given an index', target.line);
      const key = arrayKey(arr, target.idx.map(e => evalExpr(e, scope)), target.line, target.name);
      arr.data.set(key, value);
    }

    execBlock(ast.filter(s => s.k !== "subroutine"), globals);

    // final variable values, for the watch panel
    const vars = [];
    globals.forEach((v, k) => {
      if (v && v.array) {
        const items = [];
        v.data.forEach((val, key) => items.push("[" + key + "] = " + fmt(val)));
        vars.push({ name: k, value: items.length ? items.join(", ") : "(empty)", array: true });
      } else {
        vars.push({ name: k, value: fmt(v), array: false });
      }
    });

    return { output, vars, inputsLeft: inputs.length };
  }

  /* ---------------------------------------------------------------- */
  /* static analysis, for checking a solution against a mark scheme     */
  /* ---------------------------------------------------------------- */
  function walk(nodes, visit) {
    (nodes || []).forEach(n => {
      if (!n || typeof n !== "object") return;
      visit(n);
      ["then", "other", "body"].forEach(k => { if (Array.isArray(n[k])) walk(n[k], visit); });
      if (Array.isArray(n.arms)) n.arms.forEach(a => walk(a.body, visit));
      if (Array.isArray(n.otherwise)) walk(n.otherwise, visit);
    });
  }

  /* Reports which techniques a solution actually uses. The 15 mark scenario
     question rewards breadth, and students consistently forget the same
     things: declarations, comments, and messages on inputs and outputs. */
  function analyse(src) {
    let ast, parseError = null;
    try { ast = parse(tokenize(src)); }
    catch (e) { parseError = e; ast = []; }

    const seen = {
      declare: false, constant: false, input: false, output: false,
      outputMessage: false, selection: false, caseOf: false, loop: false,
      countLoop: false, condLoop: false, array: false, array2d: false,
      subroutine: false, functionReturns: false, totalling: false,
      comment: /\/\//.test(src), validation: false, nested: false
    };

    walk(ast, n => {
      if (n.k === "declare" || n.k === "declareArray") seen.declare = true;
      if (n.k === "declareArray") {
        seen.array = true;
        if (n.bounds.length > 1) seen.array2d = true;
      }
      if (n.k === "constant") seen.constant = true;
      if (n.k === "input") seen.input = true;
      if (n.k === "output") {
        seen.output = true;
        if (n.parts.some(p => p.k === "str" && p.v.trim().length > 1)) seen.outputMessage = true;
      }
      if (n.k === "if") seen.selection = true;
      if (n.k === "case") { seen.caseOf = true; seen.selection = true; }
      if (n.k === "for") { seen.loop = true; seen.countLoop = true; }
      if (n.k === "while" || n.k === "repeat") { seen.loop = true; seen.condLoop = true; }
      if (n.k === "subroutine") {
        seen.subroutine = true;
        if (n.isFn) seen.functionReturns = true;
      }
      // Total ← Total + something, or Count ← Count + 1
      if (n.k === "assign" && n.target.k === "var" && n.value.k === "bin" && n.value.op === "+" &&
          n.value.l.k === "var" && n.value.l.name.toLowerCase() === n.target.name.toLowerCase()) {
        seen.totalling = true;
      }
    });

    // a loop or IF whose condition bounds an input is doing validation
    walk(ast, n => {
      if (n.k !== "if" && n.k !== "while" && n.k !== "repeat") return;
      const c = n.cond;
      if (c && c.k === "bin" && ["<", "<=", ">", ">=", "<>", "AND", "OR"].includes(c.op)) seen.validation = true;
    });

    // nested loops: a loop appearing inside another loop's body
    walk(ast, n => {
      if (n.k !== "for" && n.k !== "while" && n.k !== "repeat") return;
      walk(n.body, inner => {
        if (inner.k === "for" || inner.k === "while" || inner.k === "repeat") seen.nested = true;
      });
    });

    return { parseError, seen, lines: src.split("\n").filter(l => l.trim()).length };
  }

  return { run, analyse, PseudoError };
})();

</script>
<script>
/* ---- js/tools.js ---- */
/* Interactive labs. Each tool exposes { title, em, blurb, topic, render(el) }. */

const Tools = (function () {

  /* ------------------------------------------------------------------ */
  /* helpers                                                             */
  /* ------------------------------------------------------------------ */
  const pad = (s, n) => s.padStart(n, "0");
  const toBin = (n, bits) => pad((n >>> 0).toString(2).slice(-bits), bits);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const q = (el, sel) => el.querySelector(sel);
  const qa = (el, sel) => Array.from(el.querySelectorAll(sel));

  /* ================================================================== */
  /* 1. NUMBER CONVERTER                                                 */
  /* ================================================================== */
  const convert = {
    title: "Number converter", em: "\u{1F501}", topic: "1.1",
    blurb: "Type in any base and watch the other two update, with the place value working shown underneath.",
    render(el) {
      el.innerHTML = `
        <div class="grid g3">
          <div class="field"><label>Denary</label><input class="input big" id="cDen" value="154" inputmode="numeric"></div>
          <div class="field"><label>Binary</label><input class="input big" id="cBin" value="10011010" inputmode="numeric"></div>
          <div class="field"><label>Hexadecimal</label><input class="input big" id="cHex" value="9A"></div>
        </div>
        <div id="cErr"></div>
        <h3>Place value working</h3>
        <div class="table-wrap"><table class="mono" id="cTable"></table></div>
        <div id="cSteps"></div>
        <div class="callout tip"><div class="ttl">Try it</div><p>Click any bit in the table to flip it. Watch which place value it adds or removes.</p></div>`;

      const den = q(el, "#cDen"), bin = q(el, "#cBin"), hex = q(el, "#cHex");

      function paint(v) {
        const bits = Math.max(8, Math.ceil((v.toString(2).length) / 4) * 4);
        const b = toBin(v, bits);
        let head = "<tr>", row = "<tr>", sum = [];
        for (let i = 0; i < bits; i++) {
          const pv = Math.pow(2, bits - 1 - i);
          head += "<th>" + pv + "</th>";
          row += '<td><button class="bitflip" data-i="' + i + '" style="all:unset;cursor:pointer;font-size:17px;color:' +
                 (b[i] === "1" ? "var(--accent)" : "var(--ink-3)") + '">' + b[i] + "</button></td>";
          if (b[i] === "1") sum.push(pv);
        }
        q(el, "#cTable").innerHTML = head + "</tr>" + row + "</tr>";
        q(el, "#cSteps").innerHTML = sum.length
          ? '<pre>' + sum.join(" + ") + " = <b>" + v + "</b>\n\nhex nibbles: " +
            b.match(/.{1,4}/g).map(n => n + " = " + parseInt(n, 2).toString(16).toUpperCase()).join("  ,  ") + "</pre>"
          : "<pre>0</pre>";

        qa(el, ".bitflip").forEach(btn => btn.onclick = () => {
          const i = +btn.dataset.i;
          const arr = b.split(""); arr[i] = arr[i] === "1" ? "0" : "1";
          set(parseInt(arr.join(""), 2));
        });
      }

      function set(v, from) {
        v = Math.max(0, Math.min(4294967295, v));
        if (from !== "den") den.value = v;
        if (from !== "bin") bin.value = toBin(v, Math.max(8, Math.ceil(v.toString(2).length / 4) * 4));
        if (from !== "hex") hex.value = v.toString(16).toUpperCase();
        paint(v);
      }

      const bad = (input, on) => input.classList.toggle("err", on);

      den.oninput = () => { const v = parseInt(den.value, 10); bad(den, isNaN(v)); if (!isNaN(v)) set(v, "den"); };
      bin.oninput = () => { const ok = /^[01]+$/.test(bin.value.replace(/\s/g, "")); bad(bin, !ok); if (ok) set(parseInt(bin.value.replace(/\s/g, ""), 2), "bin"); };

  function parseLogic(src) {
    const tokens = src.toUpperCase().replace(/\s+/g, " ")
      .replace(/\(/g, " ( ").replace(/\)/g, " ) ").trim().split(/\s+/).filter(Boolean);
    let p = 0;
    const peek = () => tokens[p];
    const eat = t => { if (tokens[p] === t) { p++; return true; } return false; };

    function expr() {                      // OR / NOR, lowest precedence
      let left = xor();
      while (peek() === "OR" || peek() === "NOR") {
        const op = tokens[p++]; left = { op, l: left, r: xor() };
      }
      return left;
    }
    function xor() {
      let left = and();
      while (peek() === "XOR") { p++; left = { op: "XOR", l: left, r: and() }; }
      return left;
    }
    function and() {
      let left = unary();
      while (peek() === "AND" || peek() === "NAND") {
        const op = tokens[p++]; left = { op, l: left, r: unary() };
      }
      return left;
    }
    function unary() {
      if (eat("NOT")) return { op: "NOT", l: unary() };
      if (eat("(")) { const e = expr(); if (!eat(")")) throw new Error("Missing a closing bracket"); return e; }
      const t = tokens[p++];
      if (!t) throw new Error("The expression ends too early");
      if (!/^[A-Z]$/.test(t)) throw new Error('"' + t + '" is not a single letter input or a gate name');
      return { op: "VAR", name: t };
    }
    const ast = expr();
    if (p < tokens.length) throw new Error('Unexpected "' + tokens[p] + '"');
    return ast;
  }

  function logicVars(n, set) {
    set = set || new Set();
    if (n.op === "VAR") set.add(n.name);
    else { if (n.l) logicVars(n.l, set); if (n.r) logicVars(n.r, set); }
    return set;
  }
  function logicText(n) {
    if (n.op === "VAR") return n.name;
    if (n.op === "NOT") return "NOT " + (n.l.op === "VAR" ? n.l.name : "(" + logicText(n.l) + ")");
    return "(" + logicText(n.l) + " " + n.op + " " + logicText(n.r) + ")";
  }
  function logicEval(n, env) {
    switch (n.op) {
      case "VAR": return env[n.name];
      case "NOT": return logicEval(n.l, env) ? 0 : 1;
      case "AND": return (logicEval(n.l, env) && logicEval(n.r, env)) ? 1 : 0;
      case "OR": return (logicEval(n.l, env) || logicEval(n.r, env)) ? 1 : 0;
      case "NAND": return (logicEval(n.l, env) && logicEval(n.r, env)) ? 0 : 1;
      case "NOR": return (logicEval(n.l, env) || logicEval(n.r, env)) ? 0 : 1;
      case "XOR": return (logicEval(n.l, env) !== logicEval(n.r, env)) ? 1 : 0;
    }
  }
  function logicSubs(n, out) {
    out = out || [];
    if (n.op === "VAR") return out;
    if (n.l) logicSubs(n.l, out);
    if (n.r) logicSubs(n.r, out);
    const label = logicText(n).replace(/^\(|\)$/g, "");
    if (!out.some(o => o.label === label)) out.push({ label, node: n });
    return out;
  }

  /* ---------------------------------------------------------------- */
  function gateShape(x, y, kind) {
    const w = 42, h = 30, cy = y, bub = 4;
    const body = {
      AND: '<path d="M' + x + ' ' + (cy - h / 2) + 'h' + (w * .45) + 'a' + (h / 2) + ' ' + (h / 2) + ' 0 0 1 0 ' + h + 'h-' + (w * .45) + 'z"/>',
      OR: '<path d="M' + x + ' ' + (cy - h / 2) + 'q' + (w * .55) + ' ' + (h * .12) + ' ' + w + ' ' + (h / 2) +
          'q-' + (w * .45) + ' ' + (h * .38) + ' -' + w + ' ' + (h / 2) + 'q' + (w * .3) + ' -' + (h / 2) + ' 0 -' + h + 'z"/>',
      NOT: '<path d="M' + x + ' ' + (cy - h / 2) + 'l' + w + ' ' + (h / 2) + 'l-' + w + ' ' + (h / 2) + 'z"/>'
    };
    const base = kind === "NAND" ? "AND" : kind === "NOR" ? "OR" : kind === "XOR" ? "OR" : kind;
    let svg = body[base] || body.AND;
    if (kind === "XOR") {
      svg = '<path d="M' + (x - 6) + ' ' + (cy - h / 2) + 'q' + (w * .3) + ' ' + (h / 2) + ' 0 ' + h + '"/>' + svg;
    }
    if (kind === "NAND" || kind === "NOR" || kind === "NOT") {
      svg += '<circle cx="' + (x + w + bub) + '" cy="' + cy + '" r="' + bub + '"/>';
    }
    return svg;
  }

  function drawCircuit(ast, vars) {
    const gates = [];
    (function collect(n) {
      if (!n || n.op === "VAR") return;
      if (n.l) collect(n.l);
      if (n.r) collect(n.r);
      gates.push(n);
    })(ast);
    if (gates.length > 7) return '<p style="font-size:13px;color:var(--ink-3)">That expression needs more than seven gates, which is more than the exam will ask you to draw.</p>';

    const ROW = 46, COL = 108, PADL = 62, PADT = 34, GW = 42;
    const depth = n => n.op === "VAR" ? 0 : 1 + Math.max(depth(n.l), n.r ? depth(n.r) : 0);
    const maxD = depth(ast);

    const varY = {};
    vars.forEach((v, i) => { varY[v] = PADT + i * ROW; });

    const pos = new Map();
    (function place(n) {
      if (n.op === "VAR") return { x: PADL - 14, y: varY[n.name] };
      const l = place(n.l), r = n.r ? place(n.r) : null;
      const x = PADL + (depth(n) - 1) * COL;
      const y = r ? (l.y + r.y) / 2 : l.y;
      const p = { x, y, l, r };
      pos.set(n, p);
      return { x: x + GW + 9, y };
    })(ast);

    const height = Math.max(PADT + vars.length * ROW, PADT + 2 * ROW) + 24;
    const width = PADL + maxD * COL + 58;

    let svg = "";
    // input rails and labels
    vars.forEach(v => {
      svg += '<text x="14" y="' + (varY[v] + 4) + '" class="cl-lbl">' + v + "</text>" +
             '<circle cx="' + (PADL - 30) + '" cy="' + varY[v] + '" r="2.6" class="cl-dot"/>';
    });

    const wire = (x1, y1, x2, y2) => {
      const mid = x1 + Math.max(12, (x2 - x1) / 2);
      return '<polyline class="cl-wire" points="' + x1 + "," + y1 + " " + mid + "," + y1 + " " + mid + "," + y2 + " " + x2 + "," + y2 + '"/>';
    };

    pos.forEach((p, n) => {
      const inTop = p.y - 8, inBot = p.y + 8;
      const src = c => c.op === "VAR"
        ? { x: PADL - 30, y: varY[c.name] }
        : { x: pos.get(c).x + GW + (["NAND", "NOR", "NOT"].includes(c.op) ? 8 : 0) + 2, y: pos.get(c).y };

      if (n.r) {
        const a = src(n.l), b = src(n.r);
        svg += wire(a.x, a.y, p.x, inTop) + wire(b.x, b.y, p.x, inBot);
      } else {
        const a = src(n.l);
        svg += wire(a.x, a.y, p.x, p.y);
      }
      svg += '<g class="cl-gate">' + gateShape(p.x, p.y, n.op) + "</g>";
      svg += '<text x="' + (p.x + GW / 2) + '" y="' + (p.y + 26) + '" class="cl-name">' + n.op + "</text>";
    });

    const root = pos.get(ast);
    if (root) {
      const outX = root.x + GW + (["NAND", "NOR", "NOT"].includes(ast.op) ? 8 : 0) + 2;
      svg += '<polyline class="cl-wire" points="' + outX + "," + root.y + " " + (width - 30) + "," + root.y + '"/>' +
             '<text x="' + (width - 22) + '" y="' + (root.y + 4) + '" class="cl-lbl">X</text>';
    }

    return '<div class="table-wrap"><svg class="circuit" viewBox="0 0 ' + width + " " + height +
           '" width="' + width + '" height="' + height + '" role="img" aria-label="Logic circuit diagram">' + svg + "</svg></div>";
  }

  function runSQL(sql) {
    const s = sql.trim().replace(/;+\s*$/, "");
    const m = /^SELECT\s+(.+?)\s+FROM\s+([A-Z_]+)(?:\s+WHERE\s+(.+?))?(?:\s+ORDER\s+BY\s+(.+?))?$/i.exec(s);
    if (!m) throw new Error("Expected the form SELECT ... FROM ... [WHERE ...] [ORDER BY ...]");
    const [, selRaw, tableRaw, whereRaw, orderRaw] = m;
    const table = DB[tableRaw.toUpperCase()];
    if (!table) throw new Error('There is no table called "' + tableRaw + '". Try Stock or Students.');

    const colIndex = name => {
      const i = table.fields.findIndex(f => f.toLowerCase() === name.trim().toLowerCase());
      if (i < 0) throw new Error('There is no field called "' + name.trim() + '" in ' + tableRaw);
      return i;
    };

    let rows = table.rows.slice();

    if (whereRaw) {
      // AND binds tighter than OR, so split on OR first and AND within each part
      const groups = whereRaw.split(/\s+OR\s+/i).map(g => g.split(/\s+AND\s+/i));
      rows = rows.filter(r => groups.some(g => g.every(cond => test(cond, r))));
    }
    function test(cond, row) {
      const c = /^\s*([A-Za-z_]+)\s*(>=|<=|<>|!=|=|>|<|LIKE)\s*(.+?)\s*$/i.exec(cond);
      if (!c) throw new Error('Cannot read the condition "' + cond.trim() + '"');
      const v = row[colIndex(c[1])];
      let lit = c[3].trim();
      const quoted = /^'(.*)'$/.test(lit) || /^"(.*)"$/.test(lit);
      lit = lit.replace(/^['"]|['"]$/g, "");
      let cmp = quoted ? lit : (/^(TRUE|FALSE)$/i.test(lit) ? /^TRUE$/i.test(lit) : (isNaN(+lit) ? lit : +lit));
      switch (c[2].toUpperCase()) {
        case "=": return v === cmp || String(v).toLowerCase() === String(cmp).toLowerCase();
        case "<>": case "!=": return !(v === cmp || String(v).toLowerCase() === String(cmp).toLowerCase());
        case ">": return v > cmp; case "<": return v < cmp;
        case ">=": return v >= cmp; case "<=": return v <= cmp;
        case "LIKE": {
          const re = new RegExp("^" + String(cmp).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/%/g, ".*").replace(/_/g, ".") + "$", "i");
          return re.test(String(v));
        }
      }
    }

    if (orderRaw) {
      const o = /^([A-Za-z_]+)\s*(ASC|DESC)?$/i.exec(orderRaw.trim());
      if (!o) throw new Error("ORDER BY needs a single field name, optionally with ASC or DESC");
      const i = colIndex(o[1]), dir = (o[2] || "ASC").toUpperCase() === "DESC" ? -1 : 1;
      rows.sort((a, b) => (a[i] > b[i] ? 1 : a[i] < b[i] ? -1 : 0) * dir);
    }

    const sel = selRaw.trim();
    const agg = /^(COUNT|SUM|AVG|MAX|MIN)\s*\(\s*(\*|[A-Za-z_]+)\s*\)$/i.exec(sel);
    if (agg) {
      const fn = agg[1].toUpperCase(), arg = agg[2];
      let val;
      if (fn === "COUNT") val = rows.length;
      else {
        const i = colIndex(arg);
        const nums = rows.map(r => +r[i]).filter(n => !isNaN(n));
        if (fn === "SUM") val = nums.reduce((a, b) => a + b, 0);
        if (fn === "AVG") val = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
        if (fn === "MAX") val = Math.max.apply(null, nums);
        if (fn === "MIN") val = Math.min.apply(null, nums);
        val = Math.round(val * 100) / 100;
      }
      return { fields: [fn + "(" + arg + ")"], rows: [[val]] };
    }

    const cols = sel === "*" ? table.fields.slice() : sel.split(",").map(c => table.fields[colIndex(c)]);
    const idx = cols.map(c => colIndex(c));
    return { fields: cols, rows: rows.map(r => idx.map(i => r[i])) };
  }

            const got = inp.value.trim();
            total++;

            inp.classList.toggle("ok", ok);

            if (ok) right++;

          const pct = Math.round(right / total * 100);

        q(el, "#trReveal").onclick = () => {
          qa(el, "#trT input").forEach(inp => {

        };
        q(el, "#trNext").onclick = () => { pi = (pi + 1) % TRACE.length; build(); };
      }
      build();
    }

  const parity = {
    title: "Parity block check", em: "\u{1F9EE}", topic: "2.2",
    blurb: "One bit has been corrupted in transmission. Use the row and column parity to find exactly which one.",
    render(el) {
      const N = 7;                       // 7 data bytes, plus a parity byte
      let grid = [], badR = 0, badC = 0, found = false, mode = "even";

      el.innerHTML = `
        <div class="seg" id="paMode" style="margin-bottom:14px">
          <button class="on" data-m="even">Even parity</button><button data-m="odd">Odd parity</button>
        </div>
        <p>Each of the first ${N} rows is a byte of data, with its <b>last bit</b> as the row's parity bit. The <b>bottom row</b> is the parity byte, which makes each column's parity correct. One bit has been flipped in transmission. Click the bit you think is wrong.</p>
        <div id="paGrid"></div>
        <div id="paMsg"></div>
        <div class="btn-row">
          <button class="btn" id="paNew">New corrupted block</button>
          <button class="btn sec" id="paShow">Show me the answer</button>
        </div>
        <div class="callout tip"><div class="ttl">The method</div>
        <p>Check the parity of every <b>row</b>, then of every <b>column</b>. Exactly one row and one column will be wrong. The corrupted bit sits where that row crosses that column, which is why a parity block check can locate the error while a single parity bit cannot.</p></div>`;

      const parityOf = bits => bits.reduce((a, b) => a + b, 0) % 2;

      function build() {
        found = false;
        grid = [];
        for (let r = 0; r < N; r++) {
          const row = [];
          for (let c = 0; c < N; c++) row.push(Math.random() < 0.5 ? 0 : 1);
          // row parity bit
          row.push(mode === "even" ? parityOf(row) : 1 - parityOf(row));
          grid.push(row);
        }
        // parity byte along the bottom
        const last = [];
        for (let c = 0; c <= N; c++) {
          const col = grid.map(r => r[c]);
          last.push(mode === "even" ? parityOf(col) : 1 - parityOf(col));
        }
        grid.push(last);

        badR = Math.floor(Math.random() * (N + 1));
        badC = Math.floor(Math.random() * (N + 1));
        grid[badR][badC] = 1 - grid[badR][badC];
        paint();
        q(el, "#paMsg").innerHTML = "";
      }

      function paint() {
        const want = mode === "even" ? 0 : 1;
        let html = '<div class="table-wrap"><table class="mono parity-grid"><tr><th></th>' +
          Array.from({ length: N + 1 }, (_, c) => "<th>" + (c === N ? "P" : "c" + (c + 1)) + "</th>").join("") +
          "<th>row</th></tr>";

        grid.forEach((row, r) => {
          const rp = parityOf(row) === want;
          html += "<tr><th>" + (r === N ? "P" : "b" + (r + 1)) + "</th>" +
            row.map((b, c) =>
              '<td><button class="pbit' + (found && r === badR && c === badC ? " culprit" : "") +
              '" data-r="' + r + '" data-c="' + c + '">' + b + "</button></td>").join("") +
            '<td><span class="chip ' + (rp ? "good" : "bad") + '">' + (rp ? "ok" : "wrong") + "</span></td></tr>";
        });

        html += "<tr><th>col</th>";
        for (let c = 0; c <= N; c++) {
          const cp = parityOf(grid.map(r => r[c])) === want;
          html += '<td><span class="chip ' + (cp ? "good" : "bad") + '">' + (cp ? "ok" : "wrong") + "</span></td>";
        }
        html += "<td></td></tr></table></div>";
        q(el, "#paGrid").innerHTML = html;

        qa(el, ".pbit").forEach(b => b.onclick = () => {
          const r = +b.dataset.r, c = +b.dataset.c;
          if (r === badR && c === badC) {
            found = true;
            paint();
            q(el, "#paMsg").innerHTML = '<div class="callout tip"><div class="ttl">Correct</div><p>Row ' +
              (badR === N ? "P (the parity byte)" : "b" + (badR + 1)) + " and column " +
              (badC === N ? "P (the parity bits)" : "c" + (badC + 1)) +
              " both failed their parity check, so the bit where they cross is the corrupted one.</p></div>";
            Store.addXp(4);
            App.confetti();
          } else {
            q(el, "#paMsg").innerHTML = '<div class="callout trap"><div class="ttl">Not that one</div><p>Find the row marked wrong and the column marked wrong. The corrupted bit is where those two meet.</p></div>';
          }
        });
      }

      q(el, "#paNew").onclick = build;
      q(el, "#paShow").onclick = () => { found = true; paint(); };
      qa(el, "#paMode button").forEach(b => b.onclick = () => {
        qa(el, "#paMode button").forEach(x => x.classList.toggle("on", x === b));
        mode = b.dataset.m;
        build();
      });
      build();
    }
  };

    render(el) {
      let order = [], k = 0, score = 0, phase = 0, current = null;

      el.innerHTML = `

              if (k === order.length - 1) done(); else { k++; ask(); }
            };

    }
