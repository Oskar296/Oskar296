<script>
/* Progress, saved in localStorage. Everything stays on the device. */
(function () {
  'use strict';

  var KEY = 'bio4bi1.v1';
  var blank = {
    v: 1,
    studied: {},     // subId -> true
    cards: {},       // cardKey -> {box, due, seen, right}
    qs: {},          // questionKey -> {seen, right}
    sessions: [],    // {d: 'YYYY-MM-DD', scope, score, total}
    days: [],        // 'YYYY-MM-DD' study days, newest last
    theme: 'auto'
  };
  var state;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      state = raw ? Object.assign({}, blank, JSON.parse(raw)) : Object.assign({}, blank);
    } catch (e) { state = Object.assign({}, blank); }
    ['studied', 'cards', 'qs'].forEach(function (k) { if (!state[k]) state[k] = {}; });
    ['sessions', 'days'].forEach(function (k) { if (!Array.isArray(state[k])) state[k] = []; });
    return state;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function touchDay() {
    var t = today();
    if (state.days[state.days.length - 1] !== t) { state.days.push(t); if (state.days.length > 400) state.days.shift(); save(); }
  }

  /* ---- streak: consecutive days ending today or yesterday ---- */
  function streak() {
    if (!state.days.length) return 0;
    var set = {}; state.days.forEach(function (d) { set[d] = 1; });
    var n = 0, d = new Date();
    if (!set[today()]) d.setDate(d.getDate() - 1);        // yesterday still counts
    for (;;) {
      var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (!set[k]) break;
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }

  /* ---- subtopics ---- */
  function isStudied(id) { return !!state.studied[id]; }
  function setStudied(id, on) {
    if (on) { state.studied[id] = true; touchDay(); } else { delete state.studied[id]; }
    save();
  }
  function topicProgress(topicId) {
    var t = window.SYL.topic(topicId);
    if (!t) return { done: 0, total: 0, pct: 0 };
    var done = t.subs.filter(function (s) { return isStudied(s.id); }).length;
    return { done: done, total: t.subs.length, pct: Math.round(done / t.subs.length * 100) };
  }
  function overallProgress() {
    var all = window.SYL.ALL_SUBS;
    var done = all.filter(function (s) { return isStudied(s.id); }).length;
    return { done: done, total: all.length, pct: Math.round(done / all.length * 100) };
  }

  /* ---- flashcards: Leitner boxes 1..5 ---- */
  var INTERVAL = [0, 0, 1, 3, 7, 21];   // days until due, by box
  function card(key) {
    return state.cards[key] || { box: 1, due: 0, seen: 0, right: 0 };
  }
  function gradeCard(key, good) {
    var c = card(key);
    c.seen++;
    if (good) { c.right++; c.box = Math.min(5, c.box + 1); }
    else { c.box = 1; }
    c.due = Date.now() + INTERVAL[c.box] * 864e5;
    state.cards[key] = c;
    touchDay(); save();
    return c;
  }
  function isDue(key) {
    var c = state.cards[key];
    return !c || c.due <= Date.now();
  }
  function cardStats() {
    var all = window.SYL.allTerms();
    var due = 0, learning = 0, known = 0, unseen = 0;
    all.forEach(function (t) {
      var k = t.sub + '|' + t.t, c = state.cards[k];
      if (!c) { unseen++; due++; return; }
      if (c.box >= 4) known++; else learning++;
      if (c.due <= Date.now()) due++;
    });
    return { total: all.length, due: due, learning: learning, known: known, unseen: unseen };
  }

  /* ---- questions ---- */
  function gradeQ(key, right) {
    var q = state.qs[key] || { seen: 0, right: 0 };
    q.seen++; if (right) q.right++;
    state.qs[key] = q; touchDay(); save();
  }
  function qStat(key) { return state.qs[key] || { seen: 0, right: 0 }; }
  function logSession(scope, score, total) {
    state.sessions.push({ d: today(), scope: scope, score: score, total: total, t: Date.now() });
    if (state.sessions.length > 60) state.sessions.shift();
    touchDay(); save();
  }
  /* accuracy per topic, from answered questions only */
  function topicAccuracy() {
    var acc = {};
    window.SYL.ALL_SUBS.forEach(function (s) {
      s.qs.forEach(function (q, i) {
        var st = state.qs[s.id + ':' + i];
        if (!st || !st.seen) return;
        var a = acc[s.topicId] || (acc[s.topicId] = { seen: 0, right: 0 });
        a.seen += st.seen; a.right += st.right;
      });
    });
    return acc;
  }
  function weakSubs(limit) {
    var rows = [];
    window.SYL.ALL_SUBS.forEach(function (s) {
      var seen = 0, right = 0;
      s.qs.forEach(function (q, i) {
        var st = state.qs[s.id + ':' + i];
        if (st) { seen += st.seen; right += st.right; }
      });
      if (seen >= 2) rows.push({ sub: s, seen: seen, right: right, pct: Math.round(right / seen * 100) });
    });
    rows.sort(function (a, b) { return a.pct - b.pct; });
    return rows.slice(0, limit || 5);
  }

  /* ---- theme ---- */
  function theme() { return state.theme || 'auto'; }
  function setTheme(t) {
    state.theme = t; save();
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  function cycleTheme() {
    var order = ['auto', 'light', 'dark'];
    setTheme(order[(order.indexOf(theme()) + 1) % 3]);
    return theme();
  }

  function reset(what) {
    if (what === 'all') { state = Object.assign({}, blank, { theme: state.theme }); }
    else if (what === 'cards') state.cards = {};
    else if (what === 'qs') { state.qs = {}; state.sessions = []; }
    else if (what === 'studied') state.studied = {};
    save();
  }
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(txt) {
    var o = JSON.parse(txt);
    if (!o || typeof o !== 'object') throw new Error('not valid progress data');
    state = Object.assign({}, blank, o); save();
  }

  load();

  window.STORE = {
    load: load, save: save, state: function () { return state; },
    isStudied: isStudied, setStudied: setStudied,
    topicProgress: topicProgress, overallProgress: overallProgress,
    card: card, gradeCard: gradeCard, isDue: isDue, cardStats: cardStats,
    gradeQ: gradeQ, qStat: qStat, logSession: logSession,
    topicAccuracy: topicAccuracy, weakSubs: weakSubs,
    streak: streak, today: today,
    theme: theme, setTheme: setTheme, cycleTheme: cycleTheme,
    reset: reset, exportJSON: exportJSON, importJSON: importJSON
  };
})();
</script>
<script>
/* Turns note blocks into HTML, plus a few shared UI helpers. */
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* very small inline formatter: **bold**, *italic*, `code` */
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*]+)\*/g, '$1<i>$2</i>');
  }

  var NOTE_TITLE = {
    tip: 'Remember', exam: 'In the exam', warn: 'Common mistake',
    link: 'Links to', prac: 'Practical'
  };

  function block(b) {
    if (typeof b === 'string') return '<p>' + inline(b) + '</p>';
    switch (b.t) {
      case 'h':
        return '<h2>' + inline(b.x) + '</h2>';
      case 'h3':
        return '<h3>' + inline(b.x) + '</h3>';
      case 'p':
        return '<p>' + inline(b.x) + '</p>';
      case 'ul':
        return '<ul>' + b.x.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>';
      case 'ol':
        return '<ol>' + b.x.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ol>';
      case 'table':
        return '<div class="tablewrap"><table><thead><tr>' +
          b.head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          b.rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>';
      case 'eq':
        return '<div class="eq">' + (b.label ? '<b>' + esc(b.label) + '</b>' : '') +
          (Array.isArray(b.x) ? b.x.map(inline).join('<br/>') : inline(b.x)) + '</div>';
      case 'note':
        return '<div class="callout ' + esc(b.k || 'tip') + '">' +
          '<div class="ct">' + esc(b.title || NOTE_TITLE[b.k] || 'Note') + '</div>' +
          (Array.isArray(b.x) ? b.x.map(function (p) { return '<p>' + inline(p) + '</p>'; }).join('')
            : '<p>' + inline(b.x) + '</p>') + '</div>';
      case 'def':
        return '<div class="defbox"><b>' + inline(b.term) + '</b> — ' + inline(b.x) + '</div>';
      case 'fig':
        var svg = (window.DIAGRAMS || {})[b.id];
        if (!svg) return '';
        return '<figure class="figure">' + svg +
          (b.cap ? '<figcaption>' + inline(b.cap) + '</figcaption>' : '') + '</figure>';
      default:
        return '';
    }
  }

  function blocks(list) { return (list || []).map(block).join(''); }

  function bar(pct) {
    return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }

  function objectives(list) {
    if (!list || !list.length) return '';
    return '<ul class="obj">' + list.map(function (o) { return '<li><span>' + inline(o) + '</span></li>'; }).join('') + '</ul>';
  }

  function terms(list) {
    if (!list || !list.length) return '';
    return '<div class="terms">' + list.map(function (t) {
      return '<div class="term"><b>' + inline(t.t) + '</b><span>' + inline(t.d) + '</span></div>';
    }).join('') + '</div>';
  }

  window.R = { esc: esc, inline: inline, block: block, blocks: blocks, bar: bar, objectives: objectives, terms: terms };
})();
</script>
<script>
/* Page views. Each returns { html, mount? }. */
(function () {
  'use strict';
  var R = window.R, S = window.SYL, ST = window.STORE;

  function head(eyebrow, title, lede) {
    return '<div class="page-head">' +
      (eyebrow ? '<div class="eyebrow">' + R.esc(eyebrow) + '</div>' : '') +
      '<h1>' + R.esc(title) + '</h1>' +
      (lede ? '<p class="lede">' + R.inline(lede) + '</p>' : '') + '</div>';
  }

  /* ------------------------------------------------ dashboard */
  function home() {
    var p = ST.overallProgress(), cs = ST.cardStats(), c = S.counts();
    var sessions = ST.state().sessions;
    var last = sessions.slice(-8).reverse();
    var weak = ST.weakSubs(4);
    var streak = ST.streak();

    var next = S.ALL_SUBS.find(function (s) { return !ST.isStudied(s.id); });

    var h = head(S.SPEC.board + ' · ' + S.SPEC.code, 'Everything for IGCSE Biology, in one place',
      'The whole ' + S.SPEC.name + ' specification: **' + c.subs + ' sub-topics**, **' + c.terms +
      ' key terms** on flashcards and **' + c.questions + ' practice questions**. Your progress is saved in this browser.');

    h += '<div class="grid g4">' +
      stat('Syllabus covered', p.pct + '%', p.done + ' of ' + p.total + ' sub-topics') +
      stat('Cards due', cs.due, cs.known + ' known · ' + cs.learning + ' learning') +
      stat('Questions answered', answered(), c.questions + ' in the bank') +
      stat('Study streak', streak + (streak === 1 ? ' day' : ' days'), streak ? 'Keep it going' : 'Study today to start') +
      '</div>';

    h += '<div class="grid g2 mt">';
    h += '<div class="card"><h2>Pick up where you left off</h2>' +
      (next
        ? '<p class="muted">Next unstudied section:</p>' +
        '<a class="subrow" href="#/sub/' + next.id + '"><span class="sid">' + next.id.toUpperCase() + '</span>' +
        '<span class="st">' + R.esc(next.title) + '</span><span class="sm">Topic ' + next.topicId + '</span></a>'
        : '<p class="muted">Every section is marked as studied. Time to test yourself.</p>') +
      '<div class="row mt-s"><a class="btn primary" href="#/cards">Review ' + cs.due + ' cards</a>' +
      '<a class="btn" href="#/quiz">Start a quiz</a>' +
      '<a class="btn" href="#/mock">Sit a timed paper</a></div></div>';

    h += '<div class="card"><h2>Topic progress</h2><div style="display:flex;flex-direction:column;gap:11px">';
    S.TOPICS.forEach(function (t) {
      var tp = ST.topicProgress(t.id);
      h += '<div><div class="spread" style="margin-bottom:4px"><a href="#/topic/' + t.id + '" style="font-size:.88rem;font-weight:600">' +
        t.id + '. ' + R.esc(t.title) + '</a><span class="dim">' + tp.done + '/' + tp.total + '</span></div>' +
        R.bar(tp.pct) + '</div>';
    });
    h += '</div></div></div>';

    if (weak.length) {
      h += '<div class="card mt"><h2>Worth another look</h2>' +
        '<p class="muted">Where your quiz answers have been weakest.</p><div class="sublist">' +
        weak.map(function (w) {
          return '<a class="subrow" href="#/sub/' + w.sub.id + '"><span class="sid">' + w.sub.id.toUpperCase() + '</span>' +
            '<span class="st">' + R.esc(w.sub.title) + '</span><span class="chip ' + (w.pct < 50 ? 'rose' : 'amber') + '">' + w.pct + '%</span></a>';
        }).join('') + '</div></div>';
    }

    if (last.length) {
      h += '<div class="card mt"><h2>Recent quizzes</h2><div class="tablewrap"><table style="width:100%;border-collapse:collapse;font-size:.88rem">' +
        '<thead><tr><th>When</th><th>Scope</th><th>Score</th></tr></thead><tbody>' +
        last.map(function (s) {
          var pct = Math.round(s.score / s.total * 100);
          return '<tr><td>' + R.esc(s.d) + '</td><td>' + R.esc(scopeName(s.scope)) + '</td><td>' + s.score + '/' + s.total + ' (' + pct + '%)</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    h += '<div class="card mt"><h2>How to use this</h2><ol>' +
      '<li><b>Read a sub-topic</b>, then tick <i>Mark as studied</i> at the bottom.</li>' +
      '<li><b>Review the flashcards</b> daily. Cards you get right come back less often; ones you miss come straight back.</li>' +
      '<li><b>Quiz yourself</b> by topic. Multiple choice marks itself; longer answers show a mark scheme so you can mark honestly.</li>' +
      '<li><b>Sit a timed paper</b> once you have covered a few topics. Timing is what most people lose marks to, not knowledge.</li>' +
      '<li>Check <b>Core practicals</b> and <b>Exam skills</b> before the paper — a lot of marks live there.</li>' +
      '</ol></div>';

    return { html: h };
  }

  function answered() {
    var qs = ST.state().qs, n = 0;
    for (var k in qs) if (qs[k].seen) n++;
    return n;
  }
  function scopeName(sc) {
    if (!sc || sc === 'all') return 'Whole syllabus';
    if (sc.indexOf('mock:') === 0) return 'Mock paper — ' + scopeName(sc.slice(5));
    var s = S.sub(sc); if (s) return s.id.toUpperCase() + ' ' + s.title;
    var t = S.topic(sc); if (t) return 'Topic ' + t.id;
    return sc;
  }
  function stat(k, v, s) {
    return '<div class="stat"><div class="k">' + R.esc(k) + '</div><div class="v">' + R.esc(v) + '</div><div class="s">' + R.esc(s) + '</div></div>';
  }

  /* ------------------------------------------------ syllabus index */
  function syllabus() {
    var h = head('Specification ' + S.SPEC.code, 'The full syllabus',
      'Five topics, ' + S.ALL_SUBS.length + ' sub-topics. Both papers can draw on any of it.');
    h += '<div class="grid g2">';
    S.TOPICS.forEach(function (t) {
      var tp = ST.topicProgress(t.id);
      h += '<a class="tcard" href="#/topic/' + t.id + '">' +
        '<div class="th"><span class="tn">' + t.id + '</span><h3>' + R.esc(t.title) + '</h3></div>' +
        '<p>' + R.esc(t.blurb) + '</p>' +
        '<div class="spread" style="margin-bottom:5px"><span class="dim">' + t.subs.length + ' sub-topics</span>' +
        '<span class="dim">' + tp.pct + '%</span></div>' + R.bar(tp.pct) + '</a>';
    });
    h += '</div>';
    return { html: h };
  }

  /* ------------------------------------------------ one topic */
  function topic(id) {
    var t = S.topic(id);
    if (!t) return notFound();
    var tp = ST.topicProgress(id);
    var nq = t.subs.reduce(function (a, s) { return a + s.qs.length; }, 0);
    var nt = t.subs.reduce(function (a, s) { return a + s.terms.length; }, 0);

    var h = '<div class="crumb"><a href="#/syllabus">Syllabus</a> › Topic ' + t.id + '</div>';
    h += head('Topic ' + t.id, t.title, t.blurb);
    h += '<div class="row" style="margin-bottom:18px">' +
      '<span class="chip accent">' + tp.done + '/' + tp.total + ' studied</span>' +
      '<span class="chip">' + nt + ' key terms</span>' +
      '<span class="chip">' + nq + ' questions</span>' +
      '<a class="btn sm" href="#/quiz?scope=' + t.id + '">Quiz this topic</a>' +
      '<a class="btn sm" href="#/cards?scope=' + t.id + '">Cards for this topic</a></div>';

    h += '<div class="sublist">' + t.subs.map(subRow).join('') + '</div>';
    return { html: h };
  }

  function subRow(s) {
    var done = ST.isStudied(s.id);
    return '<a class="subrow' + (done ? ' done' : '') + '" href="#/sub/' + s.id + '">' +
      '<span class="sid">' + s.id.toUpperCase() + '</span>' +
      '<span class="st">' + R.esc(s.title) + '</span>' +
      '<span class="sm">' + s.terms.length + ' terms · ' + s.qs.length + ' Qs</span>' +
      '<span class="tick">✓</span></a>';
  }

  /* ------------------------------------------------ one sub-topic */
  function sub(id) {
    var s = S.sub(id);
    if (!s) return notFound();
    var done = ST.isStudied(id);
    var prev = S.prevSub(id), next = S.nextSub(id);

    var h = '<div class="crumb"><a href="#/syllabus">Syllabus</a> › <a href="#/topic/' + s.topicId + '">Topic ' + s.topicId + '</a> › ' + R.esc(s.title) + '</div>';
    h += head(s.id.toUpperCase(), s.title, '');
    if (s.objectives.length) {
      h += '<div class="card" style="margin-bottom:22px"><h3 style="margin-bottom:9px">You need to be able to</h3>' + R.objectives(s.objectives) + '</div>';
    }
    h += '<div class="notes">' + R.blocks(s.notes) + '</div>';

    if (s.terms.length) {
      h += '<h2 class="mt">Key terms</h2>' + R.terms(s.terms);
    }

    h += '<div class="card mt"><div class="spread">' +
      '<label class="check"><input type="checkbox" id="studiedBox"' + (done ? ' checked' : '') + '/> <span>Mark this sub-topic as studied</span></label>' +
      '<div class="row">' +
      (s.qs.length ? '<a class="btn sm" href="#/quiz?scope=' + s.id + '">Quiz these ' + s.qs.length + ' questions</a>' : '') +
      (s.terms.length ? '<a class="btn sm" href="#/cards?scope=' + s.id + '">Revise ' + s.terms.length + ' cards</a>' : '') +
      '</div></div></div>';

    h += '<div class="pager">' +
      (prev ? '<a class="btn" href="#/sub/' + prev.id + '">← ' + R.esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a class="btn" href="#/sub/' + next.id + '">' + R.esc(next.title) + ' →</a>' : '<span></span>') +
      '</div>';

    return {
      html: h,
      mount: function (root) {
        var box = root.querySelector('#studiedBox');
        if (box) box.addEventListener('change', function () {
          ST.setStudied(id, box.checked);
          window.APP.refreshSidebar();
        });
      }
    };
  }

  /* ------------------------------------------------ core practicals */
  function practicals() {
    var list = window.BIO_PRACTICALS || [];
    var h = head('Required practical work', 'Core practicals',
      'The experiments named in the specification. Examiners ask for the method, the control variables and the reason behind each step.');
    h += list.map(function (p) {
      return '<details class="acc"><summary><span>' + R.esc(p.title) + '</span>' +
        '<span class="chip">' + R.esc(p.topic) + '</span></summary>' +
        '<div class="acc-body notes">' + R.blocks(p.body) + '</div></details>';
    }).join('');
    return { html: h };
  }

  /* ------------------------------------------------ exam skills */
  function exam() {
    var e = window.BIO_EXAM || {};
    var h = head('Papers, command words and technique', 'Exam skills',
      'How ' + S.SPEC.code + ' is assessed, and the habits that pick up marks in every paper.');

    h += '<div class="grid g2">';
    h += '<div class="card"><h2>The papers</h2><div class="tablewrap"><table style="width:100%;border-collapse:collapse;font-size:.9rem">' +
      '<thead><tr><th>Paper</th><th>Length</th><th>Marks</th><th>Weighting</th></tr></thead><tbody>' +
      S.SPEC.papers.map(function (p) {
        return '<tr><td>Paper ' + p.n + '</td><td>' + p.time + '</td><td>' + p.marks + '</td><td>' + p.weight + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="dim">Both papers are assessed by written exam, graded 9–1, with a calculator allowed. Paper 2 also draws on the extra higher-demand content flagged in the official specification, so check the spec document for which points those are.</p></div>';

    h += '<div class="card"><h2>Marks to bank</h2>' + R.blocks(e.quickWins || []) + '</div>';
    h += '</div>';

    h += '<h2 class="mt">Command words</h2><p class="muted">Answer the verb that is actually written on the paper.</p>' +
      R.blocks([{ t: 'table', head: ['Command word', 'What the examiner wants'], rows: e.commands || [] }]);

    h += '<h2 class="mt">Maths and practical skills</h2>' + R.blocks(e.maths || []);
    h += '<h2 class="mt">Six-mark answers</h2>' + R.blocks(e.longAnswers || []);
    h += '<h2 class="mt">Things students lose marks on every year</h2>' + R.blocks(e.pitfalls || []);
    return { html: h };
  }

  /* ------------------------------------------------ glossary */
  function glossary() {
    var terms = S.allTerms().slice().sort(function (a, b) { return a.t.toLowerCase() < b.t.toLowerCase() ? -1 : 1; });
    var letters = {};
    terms.forEach(function (t) {
      var L = t.t[0].toUpperCase();
      (letters[L] || (letters[L] = [])).push(t);
    });
    var keys = Object.keys(letters).sort();

    var h = head('Every definition in one list', 'Glossary', terms.length + ' key terms from across the whole specification.');
    h += '<div class="row" style="margin-bottom:18px">' + keys.map(function (k) {
      return '<a class="chip" href="#g-' + k + '">' + k + '</a>';
    }).join('') + '</div>';
    keys.forEach(function (k) {
      h += '<h2 id="g-' + k + '">' + k + '</h2><div class="terms">' + letters[k].map(function (t) {
        return '<div class="term"><b>' + R.inline(t.t) + '</b><span>' + R.inline(t.d) + '</span>' +
          '<a class="dim" href="#/sub/' + t.sub + '" style="display:block;margin-top:5px">' + t.sub.toUpperCase() + ' ' + R.esc(t.subTitle) + '</a></div>';
      }).join('') + '</div>';
    });
    return { html: h };
  }

  /* ------------------------------------------------ progress page */
  function progress() {
    var p = ST.overallProgress(), cs = ST.cardStats(), acc = ST.topicAccuracy();
    var h = head('Your data', 'Progress', 'Stored only in this browser, under the key `bio4bi1.v1`. Clearing site data wipes it, so export a copy if it matters.');

    h += '<div class="grid g4">' +
      stat('Sub-topics studied', p.done + '/' + p.total, p.pct + '% of the syllabus') +
      stat('Cards known', cs.known, 'box 4 or 5 of 5') +
      stat('Cards due now', cs.due, cs.unseen + ' never seen') +
      stat('Study days', ST.state().days.length, 'streak: ' + ST.streak()) + '</div>';

    h += '<div class="card mt"><h2>Quiz accuracy by topic</h2>';
    var any = false;
    S.TOPICS.forEach(function (t) {
      var a = acc[t.id]; if (!a) return; any = true;
      var pct = Math.round(a.right / a.seen * 100);
      h += '<div style="margin-bottom:11px"><div class="spread" style="margin-bottom:4px">' +
        '<span style="font-size:.88rem;font-weight:600">' + t.id + '. ' + R.esc(t.title) + '</span>' +
        '<span class="dim">' + a.right + '/' + a.seen + ' · ' + pct + '%</span></div>' + R.bar(pct) + '</div>';
    });
    if (!any) h += '<p class="muted">Answer some quiz questions and your accuracy will show up here.</p>';
    h += '</div>';

    h += '<div class="card mt"><h2>Back up or move your progress</h2>' +
      '<p class="muted">Copy the text below to save it, or paste a saved copy in and load it.</p>' +
      '<textarea id="ioBox" rows="6" style="width:100%;font-family:var(--mono);font-size:.78rem;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)"></textarea>' +
      '<div class="row mt-s"><button class="btn sm" data-act="export">Fill with my progress</button>' +
      '<button class="btn sm" data-act="import">Load from the box</button>' +
      '<span id="ioMsg" class="dim"></span></div></div>';

    h += '<div class="card mt"><h2>Reset</h2><p class="muted">There is no undo.</p><div class="row">' +
      '<button class="btn sm" data-act="reset-studied">Clear studied ticks</button>' +
      '<button class="btn sm" data-act="reset-cards">Reset flashcards</button>' +
      '<button class="btn sm" data-act="reset-qs">Reset quiz history</button>' +
      '<button class="btn sm" data-act="reset-all">Erase everything</button></div></div>';

    return {
      html: h,
      mount: function (root) {
        var box = root.querySelector('#ioBox'), msg = root.querySelector('#ioMsg');
        root.addEventListener('click', function (ev) {
          var b = ev.target.closest('[data-act]'); if (!b) return;
          var a = b.dataset.act;
          if (a === 'export') { box.value = ST.exportJSON(); box.select(); msg.textContent = 'Copied into the box — now copy it somewhere safe.'; return; }
          if (a === 'import') {
            try { ST.importJSON(box.value); msg.textContent = 'Loaded.'; window.APP.go(location.hash, true); }
            catch (e) { msg.textContent = 'That did not look like saved progress.'; }
            return;
          }
          if (a.indexOf('reset-') === 0) {
            var what = a.slice(6);
            var label = { studied: 'the studied ticks', cards: 'all flashcard progress', qs: 'all quiz history', all: 'everything' }[what];
            if (confirm('Erase ' + label + '? This cannot be undone.')) {
              ST.reset(what); window.APP.refreshSidebar(); window.APP.go(location.hash, true);
            }
          }
        });
      }
    };
  }

  /* ------------------------------------------------ search */
  function search(q) {
    var query = (q || '').trim();
    var h = head('Search', query ? '“' + query + '”' : 'Search the syllabus', '');
    if (query.length < 2) {
      h += '<p class="muted">Type at least two letters.</p>';
      return { html: h };
    }
    var needle = query.toLowerCase();
    var hits = [];

    S.ALL_SUBS.forEach(function (s) {
      var text = S.subText(s);
      var i = text.toLowerCase().indexOf(needle);
      if (i > -1) {
        hits.push({
          score: s.title.toLowerCase().indexOf(needle) > -1 ? 0 : 1,
          href: '#/sub/' + s.id,
          title: s.id.toUpperCase() + ' · ' + s.title,
          sub: 'Topic ' + s.topicId + ' — ' + s.topicTitle,
          snip: snippet(text, i, needle.length)
        });
      }
    });
    S.allTerms().forEach(function (t) {
      if (t.t.toLowerCase().indexOf(needle) > -1) {
        hits.push({ score: -1, href: '#/sub/' + t.sub, title: t.t, sub: 'Key term · ' + t.sub.toUpperCase() + ' ' + t.subTitle, snip: t.d });
      }
    });
    (window.BIO_PRACTICALS || []).forEach(function (p, i) {
      if (p.title.toLowerCase().indexOf(needle) > -1) {
        hits.push({ score: 0, href: '#/practicals', title: p.title, sub: 'Core practical · ' + p.topic, snip: '' });
      }
    });

    hits.sort(function (a, b) { return a.score - b.score; });
    if (!hits.length) {
      h += '<div class="empty">Nothing matched “' + R.esc(query) + '”.</div>';
    } else {
      h += '<p class="muted">' + hits.length + ' result' + (hits.length === 1 ? '' : 's') + '.</p><div class="result-list">' +
        hits.slice(0, 60).map(function (x) {
          return '<a class="hit" href="' + x.href + '"><b>' + R.esc(x.title) + '</b><small>' + R.esc(x.sub) + '</small>' +
            (x.snip ? '<span class="dim">' + x.snip + '</span>' : '') + '</a>';
        }).join('') + '</div>';
    }
    return { html: h };
  }

  function snippet(text, i, len) {
    var from = Math.max(0, i - 70), to = Math.min(text.length, i + len + 90);
    return (from ? '…' : '') + R.esc(text.slice(from, i)) + '<mark>' + R.esc(text.slice(i, i + len)) + '</mark>' +
      R.esc(text.slice(i + len, to)) + (to < text.length ? '…' : '');
  }

  function notFound() {
    return { html: '<div class="empty"><h1>Not found</h1><p>That page does not exist. <a href="#/home">Back to the dashboard</a>.</p></div>' };
  }

  window.VIEWS = {
    home: home, syllabus: syllabus, topic: topic, sub: sub,
    practicals: practicals, exam: exam, glossary: glossary,
    progress: progress, search: search, notFound: notFound, head: head, stat: stat
  };
})();
</script>
<script>
/* Flashcards with Leitner-box spacing. */
(function () {
  'use strict';
  var R = window.R, S = window.SYL, ST = window.STORE;

  var deck = [], pos = 0, flipped = false, session = null, opts = { scope: 'all', mode: 'due', dir: 'term', size: 20 };

  function key(c) { return c.sub + '|' + c.t; }

  function build() {
    var all = S.allTerms().filter(function (t) {
      return opts.scope === 'all' || t.sub === opts.scope || t.topicId === opts.scope;
    });
    if (opts.mode === 'due') all = all.filter(function (t) { return ST.isDue(key(t)); });
    if (opts.mode === 'weak') all = all.filter(function (t) { return ST.card(key(t)).box <= 2; });
    // shuffle
    for (var i = all.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = all[i]; all[i] = all[j]; all[j] = tmp; }
    deck = opts.size ? all.slice(0, opts.size) : all;
    pos = 0; flipped = false;
    session = { right: 0, wrong: 0, total: deck.length };
  }

  function scopeOptions(sel) {
    var o = '<option value="all"' + (sel === 'all' ? ' selected' : '') + '>Whole syllabus</option>';
    S.TOPICS.forEach(function (t) {
      o += '<option value="' + t.id + '"' + (sel === t.id ? ' selected' : '') + '>Topic ' + t.id + ' — ' + R.esc(t.title) + '</option>';
      t.subs.forEach(function (s) {
        o += '<option value="' + s.id + '"' + (sel === s.id ? ' selected' : '') + '>&nbsp;&nbsp;&nbsp;' + s.id.toUpperCase() + ' ' + R.esc(s.title) + '</option>';
      });
    });
    return o;
  }

  function setup() {
    var cs = ST.cardStats();
    var h = window.VIEWS.head('Spaced repetition', 'Flashcards',
      'Cards you get right come back after longer and longer gaps. Cards you miss come straight back to the front.');
    h += '<div class="grid g4" style="margin-bottom:20px">' +
      window.VIEWS.stat('Due now', cs.due, 'ready to review') +
      window.VIEWS.stat('Known', cs.known, 'box 4–5') +
      window.VIEWS.stat('Learning', cs.learning, 'box 1–3') +
      window.VIEWS.stat('Never seen', cs.unseen, 'of ' + cs.total + ' cards') + '</div>';

    h += '<div class="card"><h2>Start a review</h2>' +
      '<div class="grid g2" style="margin-bottom:14px">' +
      field('Cards from', '<select id="fScope">' + scopeOptions(opts.scope) + '</select>') +
      field('Which cards', '<select id="fMode">' +
        opt('due', 'Only cards due today', opts.mode) +
        opt('weak', 'Cards I keep missing (box 1–2)', opts.mode) +
        opt('all', 'Everything in range', opts.mode) + '</select>') +
      field('Direction', '<select id="fDir">' +
        opt('term', 'Show the term, recall the meaning', opts.dir) +
        opt('def', 'Show the meaning, recall the term', opts.dir) +
        opt('mix', 'Mix both ways', opts.dir) + '</select>') +
      field('Session length', '<select id="fSize">' +
        opt('10', '10 cards', String(opts.size)) + opt('20', '20 cards', String(opts.size)) +
        opt('40', '40 cards', String(opts.size)) + opt('0', 'No limit', String(opts.size)) + '</select>') +
      '</div><button class="btn primary" id="startCards">Start reviewing</button>' +
      '<p class="dim mt-s">Keyboard: <b>space</b> flips, <b>1</b> missed it, <b>2</b> got it.</p></div>';

    return {
      html: h,
      mount: function (root) {
        root.querySelector('#startCards').addEventListener('click', function () {
          opts.scope = root.querySelector('#fScope').value;
          opts.mode = root.querySelector('#fMode').value;
          opts.dir = root.querySelector('#fDir').value;
          opts.size = parseInt(root.querySelector('#fSize').value, 10) || 0;
          build();
          window.APP.render(view({ started: true }));
        });
      }
    };
  }

  function field(label, control) {
    return '<label style="display:block"><span class="dim" style="display:block;margin-bottom:5px">' + label + '</span>' + control + '</label>';
  }
  function opt(v, label, sel) {
    return '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + label + '</option>';
  }

  function running() {
    if (pos >= deck.length) return done();
    var c = deck[pos];
    var k = key(c), card = ST.card(k);
    var showTerm = opts.dir === 'term' || (opts.dir === 'mix' && (pos % 2 === 0));
    var front = showTerm ? c.t : c.d;
    var back = showTerm ? c.d : c.t;

    var h = '<div class="qwrap">';
    h += '<div class="qmeta"><span>Card ' + (pos + 1) + ' of ' + deck.length + '</span>' +
      '<span>' + R.esc(c.sub.toUpperCase() + ' ' + c.subTitle) + '</span></div>';
    h += '<div class="progress-strip">' + deck.map(function (_, i) {
      return '<i class="' + (i < pos ? 'ok' : i === pos ? 'now' : '') + '"></i>';
    }).join('') + '</div>';

    h += '<div class="fc-stage"><div class="fc' + (flipped ? ' flip' : '') + '" id="fcard">' +
      '<div class="fc-face"><span class="tag">' + (showTerm ? 'TERM' : 'DEFINITION') + '</span>' +
      '<span class="' + (showTerm ? 'q' : 'a') + '">' + R.inline(front) + '</span>' +
      '<span class="hint">click, or press space, to flip</span></div>' +
      '<div class="fc-face fc-back"><span class="tag">' + (showTerm ? 'MEANING' : 'TERM') + '</span>' +
      '<span class="' + (showTerm ? 'a' : 'q') + '">' + R.inline(back) + '</span>' +
      '<span class="hint">' + (card.seen ? 'seen ' + card.seen + '× · box ' + card.box + ' of 5' : 'new card') + '</span></div>' +
      '</div></div>';

    h += '<div class="box-dots">' + [1, 2, 3, 4, 5].map(function (b) {
      return '<i class="' + (b <= card.box ? 'on' : '') + '"></i>';
    }).join('') + '</div>';

    h += '<div class="row mt" style="justify-content:center">' +
      '<button class="btn" data-grade="0"' + (flipped ? '' : ' disabled') + '>Missed it</button>' +
      '<button class="btn primary" data-grade="1"' + (flipped ? '' : ' disabled') + '>Got it</button>' +
      '<button class="btn ghost" data-skip="1">Skip</button>' +
      '<a class="btn ghost" href="#/sub/' + c.sub + '">Read the notes</a>' +
      '</div>';
    h += '<p class="center dim mt-s">' + session.right + ' right · ' + session.wrong + ' to redo</p>';
    h += '</div>';

    return { html: h, mount: mountRunning };
  }

  function mountRunning(root) {
    var fc = root.querySelector('#fcard');
    if (fc) fc.addEventListener('click', function () { flip(); });
    root.addEventListener('click', function (ev) {
      var g = ev.target.closest('[data-grade]');
      if (g && !g.disabled) { grade(g.dataset.grade === '1'); return; }
      if (ev.target.closest('[data-skip]')) { pos++; flipped = false; window.APP.render(view({ started: true })); }
    });
  }

  function flip() {
    flipped = !flipped;
    var fc = document.querySelector('#fcard');
    if (fc) fc.classList.toggle('flip', flipped);
    document.querySelectorAll('[data-grade]').forEach(function (b) { b.disabled = !flipped; });
  }

  function grade(good) {
    var c = deck[pos];
    ST.gradeCard(key(c), good);
    if (good) session.right++; else { session.wrong++; deck.push(c); }
    pos++; flipped = false;
    window.APP.refreshSidebar();
    window.APP.render(view({ started: true }));
  }

  function done() {
    var pct = session.total ? Math.round(session.right / (session.right + session.wrong) * 100) : 0;
    var cs = ST.cardStats();
    var h = '<div class="qwrap center">' +
      '<h1>Review finished</h1>' +
      '<p class="lede" style="margin:0 auto 20px">You cleared ' + session.total + ' card' + (session.total === 1 ? '' : 's') +
      ' with ' + pct + '% first-time recall.</p>' +
      '<div class="grid g3" style="margin-bottom:22px">' +
      window.VIEWS.stat('Right first time', session.right, '') +
      window.VIEWS.stat('Needed a redo', session.wrong, '') +
      window.VIEWS.stat('Still due', cs.due, 'across the syllabus') + '</div>' +
      '<div class="row" style="justify-content:center">' +
      '<button class="btn primary" id="again">Review more</button>' +
      '<a class="btn" href="#/quiz">Try a quiz</a>' +
      '<a class="btn ghost" href="#/home">Dashboard</a></div></div>';
    return {
      html: h,
      mount: function (root) {
        root.querySelector('#again').addEventListener('click', function () { session = null; window.APP.render(view({})); });
      }
    };
  }

  function view(params) {
    if (params && params.scope && !params.started) {
      opts.scope = params.scope; session = null;
    }
    if (!session) return setup();
    return running();
  }

  function keydown(e) {
    if (!session || pos >= deck.length) return;
    if (e.key === ' ') { e.preventDefault(); flip(); }
    else if (e.key === '1' && flipped) grade(false);
    else if (e.key === '2' && flipped) grade(true);
  }

  window.CARDS = { view: view, keydown: keydown, reset: function () { session = null; } };
})();
</script>
<script>
/* Quiz engine: auto-marked multiple choice plus self-marked written answers. */
(function () {
  'use strict';
  var R = window.R, S = window.SYL, ST = window.STORE;

  var qs = [], pos = 0, answers = [], session = null, revealed = false, picked = -1;
  var opts = { scope: 'all', size: 10, type: 'mix', order: 'random' };

  function build() {
    var pool = S.questions(opts.scope);
    if (opts.type === 'mcq') pool = pool.filter(function (q) { return q.t === 'mcq'; });
    if (opts.type === 'saq') pool = pool.filter(function (q) { return q.t === 'saq'; });

    if (opts.order === 'weak') {
      pool.sort(function (a, b) { return score(a) - score(b); });
    } else {
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    }
    qs = opts.size ? pool.slice(0, opts.size) : pool;
    pos = 0; answers = []; revealed = false; picked = -1;
    session = { right: 0, total: qs.length };
  }
  function score(q) {
    var st = ST.qStat(q.key);
    if (!st.seen) return 0.5;              // unseen questions sit in the middle
    return st.right / st.seen;
  }

  function scopeOptions(sel) {
    var o = '<option value="all"' + (sel === 'all' ? ' selected' : '') + '>Whole syllabus</option>';
    S.TOPICS.forEach(function (t) {
      o += '<option value="' + t.id + '"' + (sel === t.id ? ' selected' : '') + '>Topic ' + t.id + ' — ' + R.esc(t.title) + '</option>';
      t.subs.forEach(function (s) {
        o += '<option value="' + s.id + '"' + (sel === s.id ? ' selected' : '') + '>&nbsp;&nbsp;&nbsp;' + s.id.toUpperCase() + ' ' + R.esc(s.title) + '</option>';
      });
    });
    return o;
  }
  function field(label, control) {
    return '<label style="display:block"><span class="dim" style="display:block;margin-bottom:5px">' + label + '</span>' + control + '</label>';
  }
  function opt(v, label, sel) { return '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + label + '</option>'; }

  function setup() {
    var c = S.counts();
    var h = window.VIEWS.head('Test yourself', 'Quiz',
      c.questions + ' questions across the whole specification. Multiple choice marks itself; written answers come with a mark scheme so you can mark your own.');

    h += '<div class="card"><h2>Set up a quiz</h2><div class="grid g2" style="margin-bottom:14px">' +
      field('Questions from', '<select id="qScope">' + scopeOptions(opts.scope) + '</select>') +
      field('How many', '<select id="qSize">' + opt('5', '5 questions', String(opts.size)) +
        opt('10', '10 questions', String(opts.size)) + opt('20', '20 questions', String(opts.size)) +
        opt('0', 'Everything in range', String(opts.size)) + '</select>') +
      field('Question type', '<select id="qType">' + opt('mix', 'Mixed', opts.type) +
        opt('mcq', 'Multiple choice only', opts.type) + opt('saq', 'Written answers only', opts.type) + '</select>') +
      field('Order', '<select id="qOrder">' + opt('random', 'Random', opts.order) +
        opt('weak', 'My weakest first', opts.order) + '</select>') +
      '</div><button class="btn primary" id="startQuiz">Start</button></div>';

    var weak = ST.weakSubs(5);
    if (weak.length) {
      h += '<div class="card mt"><h2>Straight to a weak spot</h2><div class="sublist">' +
        weak.map(function (w) {
          return '<a class="subrow" href="#/quiz?scope=' + w.sub.id + '"><span class="sid">' + w.sub.id.toUpperCase() + '</span>' +
            '<span class="st">' + R.esc(w.sub.title) + '</span><span class="chip ' + (w.pct < 50 ? 'rose' : 'amber') + '">' + w.pct + '%</span></a>';
        }).join('') + '</div></div>';
    }

    return {
      html: h,
      mount: function (root) {
        root.querySelector('#startQuiz').addEventListener('click', function () {
          opts.scope = root.querySelector('#qScope').value;
          opts.size = parseInt(root.querySelector('#qSize').value, 10) || 0;
          opts.type = root.querySelector('#qType').value;
          opts.order = root.querySelector('#qOrder').value;
          build();
          if (!qs.length) { alert('No questions match that combination.'); session = null; return; }
          window.APP.render(view({ started: true }));
        });
      }
    };
  }

  function strip() {
    return '<div class="progress-strip">' + qs.map(function (_, i) {
      var a = answers[i];
      return '<i class="' + (a ? (a.right ? 'ok' : 'no') : i === pos ? 'now' : '') + '"></i>';
    }).join('') + '</div>';
  }

  function running() {
    if (pos >= qs.length) return results();
    var q = qs[pos];
    var h = '<div class="qwrap">';
    h += '<div class="qmeta"><span>Question ' + (pos + 1) + ' of ' + qs.length + '</span>' +
      '<span>' + R.esc(q.sub.toUpperCase() + ' ' + q.subTitle) + '</span></div>';
    h += strip();
    h += '<div class="qtext">' + R.inline(q.q) + (q.t === 'saq' ? ' <span class="chip">' + q.m + ' mark' + (q.m === 1 ? '' : 's') + '</span>' : '') + '</div>';

    if (q.t === 'mcq') {
      h += '<div class="opts">' + q.o.map(function (o, i) {
        var cls = '';
        if (revealed) {
          if (i === q.a) cls = ' right';
          else if (i === picked) cls = ' wrong';
        }
        return '<button class="opt' + cls + '" data-pick="' + i + '"' + (revealed ? ' disabled' : '') + '>' +
          '<span class="lt">' + 'ABCDEF'[i] + '</span><span>' + R.inline(o) + '</span></button>';
      }).join('') + '</div>';
      if (revealed) {
        h += '<div class="ms"><h4>' + (picked === q.a ? 'Correct' : 'Not this time') + '</h4><p style="margin:0">' + R.inline(q.e || q.o[q.a]) + '</p></div>';
        h += nextBtn(q);
      }
    } else {
      h += '<textarea id="myAnswer" rows="5" placeholder="Write your answer here first — then check it against the mark scheme." style="width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:.95rem;margin-bottom:14px"></textarea>';
      if (!revealed) {
        h += '<button class="btn primary" data-reveal="1">Show the mark scheme</button>';
      } else {
        h += '<div class="ms"><h4>Mark scheme — ' + q.m + ' mark' + (q.m === 1 ? '' : 's') + '</h4><ul>' +
          q.ms.map(function (m) { return '<li>' + R.inline(m) + '</li>'; }).join('') + '</ul></div>';
        h += '<p class="dim">Mark yourself honestly. Did you make the points above?</p>' +
          '<div class="selfmark"><button class="btn" data-self="0">Not quite</button>' +
          '<button class="btn primary" data-self="1">I made those points</button></div>';
      }
    }

    h += '<p class="dim mt" style="text-align:center"><a href="#/sub/' + q.sub + '">Read the notes for ' + R.esc(q.subTitle) + '</a></p>';
    h += '</div>';
    return { html: h, mount: mountRunning };
  }

  function nextBtn(q) {
    return '<div class="row"><button class="btn primary" data-next="1">' +
      (pos === qs.length - 1 ? 'See my score' : 'Next question') + '</button></div>';
  }

  function mountRunning(root) {
    root.addEventListener('click', function (ev) {
      var p = ev.target.closest('[data-pick]');
      if (p && !revealed) {
        picked = parseInt(p.dataset.pick, 10);
        var q = qs[pos], right = picked === q.a;
        revealed = true;
        answers[pos] = { right: right, picked: picked, q: q };
        ST.gradeQ(q.key, right);
        if (right) session.right++;
        window.APP.render(view({ started: true }));
        return;
      }
      if (ev.target.closest('[data-reveal]')) { revealed = true; window.APP.render(view({ started: true })); return; }
      var sm = ev.target.closest('[data-self]');
      if (sm) {
        var ok = sm.dataset.self === '1', qq = qs[pos];
        answers[pos] = { right: ok, q: qq };
        ST.gradeQ(qq.key, ok);
        if (ok) session.right++;
        pos++; revealed = false; picked = -1;
        window.APP.render(view({ started: true }));
        return;
      }
      if (ev.target.closest('[data-next]')) {
        pos++; revealed = false; picked = -1;
        window.APP.render(view({ started: true }));
      }
    });
  }

  function results() {
    var pct = Math.round(session.right / session.total * 100);
    if (!session.logged) { ST.logSession(opts.scope, session.right, session.total); session.logged = true; window.APP.refreshSidebar(); }
    var msg = pct >= 85 ? 'Strong. Move on to the next topic.'
      : pct >= 65 ? 'Solid, but reread the ones you missed.'
        : pct >= 40 ? 'Worth going back over the notes for this.'
          : 'Read the notes again before retrying — this one needs time, not another quiz.';

    var h = '<div class="qwrap">' +
      '<div class="center"><h1>' + session.right + ' / ' + session.total + '</h1>' +
      '<p class="lede" style="margin:0 auto 8px">' + pct + '% — ' + msg + '</p></div>' +
      strip() +
      '<div class="row mt" style="justify-content:center">' +
      '<button class="btn primary" id="retry">Another quiz</button>' +
      '<button class="btn" id="redoWrong"' + (session.right === session.total ? ' disabled' : '') + '>Redo the ones I missed</button>' +
      '<a class="btn ghost" href="#/home">Dashboard</a></div>';

    h += '<h2 class="mt">Your answers</h2><div class="sublist">' +
      answers.map(function (a, i) {
        if (!a) return '';
        return '<a class="subrow" href="#/sub/' + a.q.sub + '">' +
          '<span class="chip ' + (a.right ? 'accent' : 'rose') + '">' + (a.right ? '✓' : '✗') + '</span>' +
          '<span class="st" style="font-weight:500">' + R.inline(a.q.q) + '</span>' +
          '<span class="sm">' + a.q.sub.toUpperCase() + '</span></a>';
      }).join('') + '</div></div>';

    return {
      html: h,
      mount: function (root) {
        root.querySelector('#retry').addEventListener('click', function () { session = null; window.APP.render(view({})); });
        var rw = root.querySelector('#redoWrong');
        if (rw) rw.addEventListener('click', function () {
          var wrong = answers.filter(function (a) { return a && !a.right; }).map(function (a) { return a.q; });
          if (!wrong.length) return;
          qs = wrong; pos = 0; answers = []; revealed = false; picked = -1;
          session = { right: 0, total: qs.length };
          window.APP.render(view({ started: true }));
        });
      }
    };
  }

  function view(params) {
    if (params && params.scope && !params.started) { opts.scope = params.scope; session = null; }
    if (!session) return setup();
    return running();
  }

  window.QUIZ = { view: view, reset: function () { session = null; } };
})();
</script>
<script>
/* Timed mock paper: all questions on one page, a countdown, then self-marking. */
(function () {
  'use strict';
  var R = window.R, S = window.SYL, ST = window.STORE;

  var PAPERS = [
    { id: 'p1', name: 'Paper 1 style', marks: 110, mins: 120, note: '2 hours · 110 marks · 61.1% of the qualification' },
    { id: 'p2', name: 'Paper 2 style', marks: 70, mins: 75, note: '1 hour 15 minutes · 70 marks · 38.9% of the qualification' },
    { id: 'sh', name: 'Short test', marks: 30, mins: 35, note: 'A quick 35-minute check on one topic or the whole syllabus' }
  ];

  var paper = null;     // {qs:[], marks, mins, scope, name}
  var answers = {};     // index -> picked option (mcq) or awarded marks (saq, after submit)
  var written = {};     // index -> the student's typed answer
  var submitted = false;
  var deadline = 0, timeUp = false, tick = null;
  var opts = { paper: 'p1', scope: 'all' };

  /* ---------------- building the paper ---------------- */
  function build() {
    var def = PAPERS.filter(function (p) { return p.id === opts.paper; })[0];
    var pool = S.questions(opts.scope);
    var mcq = shuffle(pool.filter(function (q) { return q.t === 'mcq'; }));
    var saq = shuffle(pool.filter(function (q) { return q.t === 'saq'; }));

    var target = def.marks, mcqTarget = Math.round(target * 0.25);
    var picked = [], total = 0;

    while (mcq.length && total < mcqTarget) { picked.push(mcq.pop()); total += 1; }
    while (saq.length && total < target) {
      var q = saq.pop();
      if (total + q.m > target + 2) continue;      // do not overshoot the paper badly
      picked.push(q); total += q.m;
      if (target - total < 2) break;
    }
    while (mcq.length && total < target) { picked.push(mcq.pop()); total += 1; }

    // read like a paper: topic order, and within a topic the short questions first
    picked.sort(function (a, b) {
      if (a.sub !== b.sub) return a.sub < b.sub ? -1 : 1;
      return marksOf(a) - marksOf(b);
    });

    paper = { qs: picked, marks: total, mins: def.mins, scope: opts.scope, name: def.name };
    answers = {}; written = {}; submitted = false; timeUp = false;
    deadline = Date.now() + def.mins * 60000;
  }
  function marksOf(q) { return q.t === 'mcq' ? 1 : q.m; }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ---------------- setup screen ---------------- */
  function setup() {
    var h = window.VIEWS.head('Sit a full paper', 'Mock exam',
      'A timed paper built from the question bank. Write your answers, keep an eye on the clock, then mark yourself against the mark scheme.');

    h += '<div class="grid g3" style="margin-bottom:18px">' + PAPERS.map(function (p) {
      return '<button class="tcard papercard' + (opts.paper === p.id ? ' on' : '') + '" data-paper="' + p.id + '" style="text-align:left">' +
        '<div class="th"><span class="tn">' + p.marks + '</span><h3>' + p.name + '</h3></div>' +
        '<p>' + R.esc(p.note) + '</p></button>';
    }).join('') + '</div>';

    h += '<div class="card"><div class="grid g2" style="margin-bottom:14px">' +
      '<label style="display:block"><span class="dim" style="display:block;margin-bottom:5px">Questions from</span>' +
      '<select id="mScope">' + scopeOptions(opts.scope) + '</select></label>' +
      '<div></div></div>' +
      '<button class="btn primary" id="startMock">Start the paper</button>' +
      '<p class="dim mt-s">The clock starts as soon as you press start. You can submit early, and the paper is submitted automatically when the time runs out.</p></div>';

    h += '<div class="card mt"><h2>How the real thing is marked</h2>' +
      '<p class="muted">Grade boundaries move every series, so treat a percentage here as a rough guide, not a predicted grade. What it is genuinely useful for is timing: whether you can write a six-mark answer in about seven minutes, and whether you run out of paper before you run out of clock.</p>' +
      '<p class="muted">Roughly a mark a minute is the pace to aim for on both papers.</p></div>';

    return {
      html: h,
      mount: function (root) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-paper]');
          if (b) {
            opts.paper = b.dataset.paper;
            root.querySelectorAll('.papercard').forEach(function (c) { c.classList.toggle('on', c.dataset.paper === opts.paper); });
          }
        });
        root.querySelector('#startMock').addEventListener('click', function () {
          opts.scope = root.querySelector('#mScope').value;
          build();
          if (!paper.qs.length) { alert('There are not enough questions in that topic for a paper this long.'); paper = null; return; }
          window.APP.render(view({ started: true }));
          window.scrollTo(0, 0);
        });
      }
    };
  }

  function scopeOptions(sel) {
    var o = '<option value="all"' + (sel === 'all' ? ' selected' : '') + '>Whole syllabus</option>';
    S.TOPICS.forEach(function (t) {
      o += '<option value="' + t.id + '"' + (sel === t.id ? ' selected' : '') + '>Topic ' + t.id + ' — ' + R.esc(t.title) + '</option>';
    });
    return o;
  }

  /* ---------------- the paper ---------------- */
  function running() {
    var h = '<div class="exam-bar" id="examBar">' +
      '<div><b>' + R.esc(paper.name) + '</b> <span class="dim">· ' + paper.qs.length + ' questions · ' + paper.marks + ' marks</span></div>' +
      '<div class="row">' +
      '<span class="clock" id="clock">--:--</span>' +
      '<button class="btn primary sm" id="submitPaper">Submit paper</button></div></div>';

    h += '<div class="qwrap" style="max-width:820px">';
    h += '<p class="dim">Answer every question. Written answers are marked by you against the mark scheme once you submit, so write them as if an examiner will read them.</p>';

    paper.qs.forEach(function (q, i) {
      h += questionHTML(q, i);
    });

    h += '<div class="row mt" style="justify-content:center"><button class="btn primary" data-submit="1">Submit paper</button></div></div>';
    return { html: h, mount: mountPaper };
  }

  function questionHTML(q, i) {
    var m = marksOf(q);
    var h = '<div class="exam-q" id="q' + i + '">' +
      '<div class="exam-qhead"><span class="qn">' + (i + 1) + '</span>' +
      '<span class="qbody">' + R.inline(q.q) + '</span>' +
      '<span class="qm">(' + m + ')</span></div>';

    if (q.t === 'mcq') {
      h += '<div class="opts">' + q.o.map(function (o, j) {
        return '<button class="opt' + (answers[i] === j ? ' picked' : '') + '" data-q="' + i + '" data-pick="' + j + '">' +
          '<span class="lt">' + 'ABCDEF'[j] + '</span><span>' + R.inline(o) + '</span></button>';
      }).join('') + '</div>';
    } else {
      h += '<textarea class="exam-ans" data-q="' + i + '" rows="' + Math.min(9, 2 + m) + '" ' +
        'placeholder="' + m + ' mark' + (m === 1 ? '' : 's') + '">' + R.esc(written[i] || '') + '</textarea>';
    }
    h += '<div class="dim" style="font-size:.75rem">' + q.sub.toUpperCase() + ' · ' + R.esc(q.subTitle) + '</div></div>';
    return h;
  }

  function mountPaper(root) {
    startClock();
    root.addEventListener('click', function (e) {
      var p = e.target.closest('[data-pick]');
      if (p) {
        var i = +p.dataset.q;
        answers[i] = +p.dataset.pick;
        p.parentNode.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('picked', o === p); });
        return;
      }
      if (e.target.closest('#submitPaper') || e.target.closest('[data-submit]')) submit();
    });
    root.addEventListener('input', function (e) {
      if (e.target.classList.contains('exam-ans')) written[+e.target.dataset.q] = e.target.value;
    });
  }

  function startClock() {
    stopClock();
    var el = document.getElementById('clock');
    var paint = function () {
      var left = Math.max(0, deadline - Date.now());
      var mm = Math.floor(left / 60000), ss = Math.floor(left % 60000 / 1000);
      if (el) {
        el.textContent = mm + ':' + String(ss).padStart(2, '0');
        el.classList.toggle('low', left < 5 * 60000);
      }
      if (left <= 0) { timeUp = true; stopClock(); submit(); }
    };
    paint();
    tick = setInterval(paint, 1000);
    window.APP.onCleanup(stopClock);
  }
  function stopClock() { if (tick) { clearInterval(tick); tick = null; } }

  function submit() {
    if (submitted) return;
    submitted = true;
    stopClock();
    // auto-mark the multiple choice now
    paper.qs.forEach(function (q, i) {
      if (q.t === 'mcq') {
        var right = answers[i] === q.a;
        ST.gradeQ(q.key, right);
      }
    });
    window.APP.render(view({ started: true }));
    window.scrollTo(0, 0);
  }

  /* ---------------- marking ---------------- */
  function awardedFor(i) {
    var q = paper.qs[i];
    if (q.t === 'mcq') return answers[i] === q.a ? 1 : 0;
    return typeof answers[i] === 'number' ? answers[i] : 0;
  }
  function totals() {
    var got = 0, marked = 0;
    paper.qs.forEach(function (q, i) {
      got += awardedFor(i);
      if (q.t === 'mcq' || typeof answers[i] === 'number') marked += marksOf(q);
    });
    return { got: got, marked: marked, total: paper.marks };
  }

  function marking() {
    var t = totals();
    var pct = Math.round(t.got / t.total * 100);
    var unmarked = paper.qs.filter(function (q, i) { return q.t === 'saq' && typeof answers[i] !== 'number'; }).length;

    var h = '<div class="exam-bar">' +
      '<div><b>Marking</b> <span class="dim">· ' + paper.name + '</span></div>' +
      '<div class="row"><span class="score" id="scoreBox">' + t.got + ' / ' + t.total + ' · ' + pct + '%</span>' +
      '<button class="btn sm" id="finishMock">Finish and save</button></div></div>';

    h += '<div class="qwrap" style="max-width:820px">';
    if (timeUp) h += '<div class="callout warn"><div class="ct">Time up</div><p>The paper was submitted automatically. Anything left blank scores nothing — worth noticing where you ran out of time.</p></div>';
    h += '<p class="muted" id="unmarkedNote">' + (unmarked
      ? 'Award yourself marks for each written answer below. <b>' + unmarked + '</b> still to mark.'
      : 'Every question is marked. Press <b>Finish and save</b> to record the result.') + '</p>';

    paper.qs.forEach(function (q, i) {
      var m = marksOf(q);
      h += '<div class="exam-q marked" id="m' + i + '">' +
        '<div class="exam-qhead"><span class="qn">' + (i + 1) + '</span>' +
        '<span class="qbody">' + R.inline(q.q) + '</span>' +
        '<span class="qm">(' + m + ')</span></div>';

      if (q.t === 'mcq') {
        h += '<div class="opts">' + q.o.map(function (o, j) {
          var cls = j === q.a ? ' right' : (answers[i] === j ? ' wrong' : '');
          return '<div class="opt' + cls + '"><span class="lt">' + 'ABCDEF'[j] + '</span><span>' + R.inline(o) + '</span></div>';
        }).join('') + '</div>' +
          '<div class="ms"><h4>' + (answers[i] === q.a ? 'Correct — 1 mark' : answers[i] == null ? 'Not answered — 0 marks' : 'Incorrect — 0 marks') + '</h4>' +
          '<p style="margin:0">' + R.inline(q.e) + '</p></div>';
      } else {
        h += '<div class="your-answer"><b>Your answer</b><p>' + (written[i] ? R.esc(written[i]) : '<i class="dim">left blank</i>') + '</p></div>';
        h += '<div class="ms"><h4>Mark scheme — ' + m + ' mark' + (m === 1 ? '' : 's') + '</h4><ul>' +
          q.ms.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ul></div>';
        h += '<div class="award" data-award-row="' + i + '"><span class="dim">Award:</span>' +
          range(m + 1).map(function (n) {
            return '<button class="btn sm award-btn' + (answers[i] === n ? ' on' : '') + '" data-award="' + n + '" data-q="' + i + '">' + n + '</button>';
          }).join('') + '</div>';
      }
      h += '</div>';
    });

    h += '<div class="row mt" style="justify-content:center">' +
      '<button class="btn primary" id="finishMock2">Finish and save</button>' +
      '<a class="btn ghost" href="#/mock">New paper</a></div></div>';

    return {
      html: h,
      mount: function (root) {
        root.addEventListener('click', function (e) {
          var a = e.target.closest('[data-award]');
          if (a) {
            var i = +a.dataset.q, n = +a.dataset.award, q = paper.qs[i];
            answers[i] = n;
            root.querySelectorAll('[data-award-row="' + i + '"] .award-btn').forEach(function (b) {
              b.classList.toggle('on', +b.dataset.award === n);
            });
            ST.gradeQ(q.key, n >= Math.ceil(q.m / 2));
            repaintScore(root);
            return;
          }
          if (e.target.closest('#finishMock') || e.target.closest('#finishMock2')) finish();
        });
      }
    };
  }

  function repaintScore(root) {
    var t = totals(), box = root.querySelector('#scoreBox');
    if (box) box.textContent = t.got + ' / ' + t.total + ' · ' + Math.round(t.got / t.total * 100) + '%';
    var left = paper.qs.filter(function (q, i) { return q.t === 'saq' && typeof answers[i] !== 'number'; }).length;
    var note = root.querySelector('#unmarkedNote');
    if (note) note.innerHTML = left
      ? 'Award yourself marks for each written answer below. <b>' + left + '</b> still to mark.'
      : 'Every question is marked. Press <b>Finish and save</b> to record the result.';
  }

  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  function finish() {
    var t = totals();
    ST.logSession('mock:' + paper.scope, t.got, t.total);
    window.APP.refreshSidebar();
    var pct = Math.round(t.got / t.total * 100);
    var weakest = weakTopics();

    var h = '<div class="qwrap center">' +
      '<h1>' + t.got + ' / ' + t.total + '</h1>' +
      '<p class="lede" style="margin:0 auto 20px">' + pct + '% on the ' + R.esc(paper.name) + '. ' +
      'Grade boundaries move every series, so use this to find gaps rather than to predict a grade.</p>';

    if (weakest.length) {
      h += '<h2 class="mt">Where the marks went missing</h2><div class="sublist" style="text-align:left">' +
        weakest.map(function (w) {
          return '<a class="subrow" href="#/sub/' + w.id + '"><span class="sid">' + w.id.toUpperCase() + '</span>' +
            '<span class="st">' + R.esc(w.title) + '</span>' +
            '<span class="chip ' + (w.pct < 50 ? 'rose' : 'amber') + '">' + w.got + '/' + w.total + '</span></a>';
        }).join('') + '</div>';
    }

    h += '<div class="row mt" style="justify-content:center">' +
      '<a class="btn primary" href="#/mock">Another paper</a>' +
      '<a class="btn" href="#/cards">Review flashcards</a>' +
      '<a class="btn ghost" href="#/home">Dashboard</a></div></div>';

    paper = null;
    window.APP.render({ html: h });
    window.scrollTo(0, 0);
  }

  function weakTopics() {
    var by = {};
    paper.qs.forEach(function (q, i) {
      var r = by[q.sub] || (by[q.sub] = { id: q.sub, title: q.subTitle, got: 0, total: 0 });
      r.got += awardedFor(i); r.total += marksOf(q);
    });
    return Object.keys(by).map(function (k) {
      var r = by[k]; r.pct = Math.round(r.got / r.total * 100); return r;
    }).filter(function (r) { return r.pct < 80; })
      .sort(function (a, b) { return a.pct - b.pct; }).slice(0, 6);
  }

  /* ---------------- entry ---------------- */
  function view(params) {
    if (params && params.scope && !params.started) { opts.scope = params.scope; paper = null; }
    if (!paper) return setup();
    return submitted ? marking() : running();
  }

  window.MOCK = { view: view, reset: function () { stopClock(); paper = null; } };
})();
</script>
<script>
/* Router, sidebar and global chrome. */
(function () {
  'use strict';
  var R = window.R, S = window.SYL, ST = window.STORE;

  var main = document.getElementById('main');
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  var searchInput = document.getElementById('searchInput');
  var current = 'home';

  /* ---------- theme ----------
     On 'auto' we leave the root element alone, so a data-theme set by
     whatever is hosting the page survives. Picking a theme still wins. */
  if (ST.theme() !== 'auto') ST.setTheme(ST.theme());
  document.getElementById('themeBtn').addEventListener('click', function () { ST.cycleTheme(); });

  /* ---------- sidebar ---------- */
  function buildSidebar() {
    var box = document.getElementById('sideTopics');
    box.innerHTML = S.TOPICS.map(function (t) {
      var p = ST.topicProgress(t.id);
      return '<a class="side-link" href="#/topic/' + t.id + '" data-nav="topic-' + t.id + '">' +
        '<span class="side-topic" style="width:100%">' +
        '<span class="num">' + t.id + '</span>' +
        '<span class="tt">' + R.esc(t.title) + '</span>' +
        '<span class="pc">' + p.pct + '%</span></span></a>';
    }).join('');
    var cs = ST.cardStats();
    var pill = document.getElementById('duePill');
    if (cs.due > 0) { pill.hidden = false; pill.textContent = cs.due; } else { pill.hidden = true; }
    highlight();
  }
  function highlight() {
    document.querySelectorAll('.side-link').forEach(function (a) {
      a.classList.toggle('on', a.dataset.nav === current);
    });
  }
  function closeMenu() { sidebar.classList.remove('open'); scrim.hidden = true; document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); }
  document.getElementById('menuBtn').addEventListener('click', function () {
    var open = sidebar.classList.toggle('open');
    scrim.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  scrim.addEventListener('click', closeMenu);
  sidebar.addEventListener('click', function (e) { if (e.target.closest('a')) closeMenu(); });

  /* ---------- render ---------- */
  var cleanups = [];
  function render(v) {
    cleanups.splice(0).forEach(function (f) { try { f(); } catch (e) { /* ignore */ } });
    main.innerHTML = v.html;
    if (v.mount) v.mount(main);
  }

  /* ---------- routing ---------- */
  function parse(hash) {
    var h = (hash || '').replace(/^#/, '');
    if (h.indexOf('/') !== 0) return null;              // in-page anchors are not routes
    var qi = h.indexOf('?');
    var params = {};
    if (qi > -1) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
      });
      h = h.slice(0, qi);
    }
    return { parts: h.split('/').filter(Boolean), params: params };
  }

  function route() {
    var r = parse(location.hash);
    if (!r) { if (!location.hash) location.replace('#/home'); return; }
    var p = r.parts, page = p[0] || 'home', v;

    switch (page) {
      case 'home': current = 'home'; v = window.VIEWS.home(); break;
      case 'syllabus': current = 'syllabus'; v = window.VIEWS.syllabus(); break;
      case 'topic': current = 'topic-' + p[1]; v = window.VIEWS.topic(p[1]); break;
      case 'sub':
        var s = S.sub(p[1]);
        current = s ? 'topic-' + s.topicId : '';
        v = window.VIEWS.sub(p[1]); break;
      case 'cards': current = 'cards'; v = window.CARDS.view(r.params); break;
      case 'quiz': current = 'quiz'; v = window.QUIZ.view(r.params); break;
      case 'mock': current = 'mock'; v = window.MOCK.view(r.params); break;
      case 'practicals': current = 'practicals'; v = window.VIEWS.practicals(); break;
      case 'exam': current = 'exam'; v = window.VIEWS.exam(); break;
      case 'glossary': current = 'glossary'; v = window.VIEWS.glossary(); break;
      case 'progress': current = 'progress'; v = window.VIEWS.progress(); break;
      case 'search': current = ''; v = window.VIEWS.search(r.params.q); break;
      default: current = ''; v = window.VIEWS.notFound();
    }
    render(v);
    highlight();
    document.title = titleFor(page, p[1]) + ' · Bio 4BI1';
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  function titleFor(page, id) {
    if (page === 'sub') { var s = S.sub(id); return s ? s.id.toUpperCase() + ' ' + s.title : 'Not found'; }
    if (page === 'topic') { var t = S.topic(id); return t ? 'Topic ' + t.id : 'Not found'; }
    return { home: 'Dashboard', syllabus: 'Syllabus', cards: 'Flashcards', quiz: 'Quiz', mock: 'Mock exam', practicals: 'Core practicals', exam: 'Exam skills', glossary: 'Glossary', progress: 'Progress', search: 'Search' }[page] || 'Not found';
  }

  /* ---------- search ---------- */
  var searchTimer;
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    location.hash = '#/search?q=' + encodeURIComponent(searchInput.value);
  });
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    var q = searchInput.value;
    searchTimer = setTimeout(function () {
      if (q.trim().length >= 2) location.hash = '#/search?q=' + encodeURIComponent(q);
    }, 280);
  });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
    if (e.key === 'Escape') { if (document.activeElement === searchInput) searchInput.blur(); closeMenu(); return; }
    if (typing) return;
    if (current === 'cards') window.CARDS.keydown(e);
  });

  window.APP = {
    render: render,
    refreshSidebar: buildSidebar,
    onCleanup: function (fn) { cleanups.push(fn); },
    go: function (hash, force) {
      if (force && location.hash === hash) route();
      else location.hash = hash;
    }
  };

  window.addEventListener('hashchange', route);
  buildSidebar();
  if (!location.hash) location.replace('#/home');
  route();
})();
</script>
</body>
</html>
