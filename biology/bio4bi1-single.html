<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bio 4BI1 — Edexcel IGCSE Biology study app</title>
<meta name="description" content="Revision notes, flashcards and quizzes for the whole Pearson Edexcel International GCSE Biology (4BI1) specification."/>
<meta name="theme-color" content="#0d1b17"/>
<style>
/* ============================================================
   Bio 4BI1 — Edexcel IGCSE Biology study app
   ============================================================ */

:root{
  --bg:#f4f7f5;
  --bg-2:#e8efea;
  --surface:#ffffff;
  --surface-2:#f7faf8;
  --line:#d9e3dc;
  --line-soft:#e7eee9;
  --text:#12211b;
  --text-2:#4c6158;
  --text-3:#7a8f85;
  --accent:#0f7a5a;
  --accent-2:#0b5f46;
  --accent-soft:#e2f3ec;
  --amber:#a8710d;
  --amber-soft:#fdf1dc;
  --rose:#b03a4a;
  --rose-soft:#fbe7e9;
  --violet:#6a4bb5;
  --violet-soft:#eee9fb;
  --blue:#2a6bab;
  --blue-soft:#e4eff9;
  --shadow:0 1px 2px rgba(18,33,27,.06), 0 8px 24px -12px rgba(18,33,27,.18);
  --radius:14px;
  --radius-s:9px;
  --side-w:266px;
  --top-h:58px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1512;
    --bg-2:#0f1c18;
    --surface:#121f1b;
    --surface-2:#16261f;
    --line:#24382f;
    --line-soft:#1c2c25;
    --text:#e6f0ea;
    --text-2:#a9bfb5;
    --text-3:#7d968b;
    --accent:#4fd6a4;
    --accent-2:#7ee9bf;
    --accent-soft:#12352a;
    --amber:#e8b35c;
    --amber-soft:#33270f;
    --rose:#f0929e;
    --rose-soft:#3a1c21;
    --violet:#b7a4f0;
    --violet-soft:#241d3d;
    --blue:#8ec2f2;
    --blue-soft:#132738;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1512;
  --bg-2:#0f1c18;
  --surface:#121f1b;
  --surface-2:#16261f;
  --line:#24382f;
  --line-soft:#1c2c25;
  --text:#e6f0ea;
  --text-2:#a9bfb5;
  --text-3:#7d968b;
  --accent:#4fd6a4;
  --accent-2:#7ee9bf;
  --accent-soft:#12352a;
  --amber:#e8b35c;
  --amber-soft:#33270f;
  --rose:#f0929e;
  --rose-soft:#3a1c21;
  --violet:#b7a4f0;
  --violet-soft:#241d3d;
  --blue:#8ec2f2;
  --blue-soft:#132738;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.8rem;letter-spacing:-.02em}
h2{font-size:1.28rem;letter-spacing:-.01em}
h3{font-size:1.05rem}
p{margin:0 0 .85em}
ul,ol{margin:0 0 .95em;padding-left:1.25em}
li{margin:.3em 0}
code{font-family:var(--mono);font-size:.9em;background:var(--bg-2);padding:.1em .35em;border-radius:5px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:8px 12px;border-radius:8px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;height:var(--top-h);
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;flex:none}
.brand:hover{text-decoration:none}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.brand-mark svg{width:19px;height:19px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font-size:.98rem;letter-spacing:-.01em}
.brand-text small{font-size:.68rem;color:var(--text-3);letter-spacing:.02em}
.icon-btn{
  display:grid;place-items:center;width:38px;height:38px;flex:none;
  background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer;color:var(--text-2)
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.menu-btn{display:none}
#themeBtn .ic-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #themeBtn .ic-moon{display:block}:root:not([data-theme="light"]) #themeBtn .ic-sun{display:none}}
:root[data-theme="dark"] #themeBtn .ic-moon{display:block}
:root[data-theme="dark"] #themeBtn .ic-sun{display:none}
:root[data-theme="light"] #themeBtn .ic-moon{display:none}
:root[data-theme="light"] #themeBtn .ic-sun{display:block}

.search{flex:1;max-width:520px;margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:17px;height:17px;color:var(--text-3);pointer-events:none}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:.9rem
}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start}
.sidebar{
  position:sticky;top:var(--top-h);flex:none;width:var(--side-w);
  height:calc(100vh - var(--top-h));border-right:1px solid var(--line);
  background:var(--bg-2);
}
.side-scroll{height:100%;overflow-y:auto;padding:14px 10px 40px}
.side-label{
  margin:14px 8px 5px;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3)
}
.side-label:first-child{margin-top:2px}
.side-link{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
  color:var(--text-2);font-size:.9rem;text-decoration:none
}
.side-link:hover{background:var(--surface);color:var(--text);text-decoration:none}
.side-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-link .si{width:18px;text-align:center;font-size:.85em;opacity:.8;flex:none}
.side-topic{display:flex;align-items:center;gap:9px}
.side-topic .num{
  width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:6px;
  background:var(--surface);border:1px solid var(--line);font-size:.7rem;font-weight:700;color:var(--text-2)
}
.side-link.on .num{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.side-topic .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-topic .pc{font-size:.7rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.due-pill{
  margin-left:auto;font-style:normal;font-size:.7rem;font-weight:700;
  background:var(--amber);color:#fff;border-radius:999px;padding:1px 7px
}
:root[data-theme="dark"] .due-pill{color:#231a06}
.scrim{position:fixed;inset:var(--top-h) 0 0;background:rgba(0,0,0,.45);z-index:29;border:0}

.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1080px;margin:0 auto}
.main:focus{outline:none}

@media (max-width:940px){
  .menu-btn{display:grid}
  .sidebar{position:fixed;left:0;top:var(--top-h);z-index:30;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{padding:20px 16px 80px}
  .brand-text small{display:none}
}
@media (max-width:560px){
  .brand-text{display:none}
  h1{font-size:1.45rem}
}

/* ---------- generic pieces ---------- */
.page-head{margin-bottom:22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px
}
.lede{color:var(--text-2);font-size:1.02rem;max-width:70ch;margin:0}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow)
}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--text-2)}
.dim{color:var(--text-3);font-size:.86rem}
.mt{margin-top:20px}
.mt-s{margin-top:12px}
.center{text-align:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:.9rem;font-weight:600;
  text-decoration:none;transition:background .12s,border-color .12s,transform .06s
}
.btn:hover{background:var(--bg-2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06231a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06231a}}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line-soft);font-size:.75rem;color:var(--text-2);font-weight:600
}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.rose{background:var(--rose-soft);color:var(--rose);border-color:transparent}

.bar{height:7px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:700}
.stat .v{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s{font-size:.8rem;color:var(--text-2)}

/* ---------- topic / subtopic cards ---------- */
.tcard{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;color:inherit;text-decoration:none;box-shadow:var(--shadow);
  transition:border-color .14s, transform .08s
}
.tcard:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-1px)}
.tcard .th{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tcard .tn{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;
  background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.9rem
}
.tcard h3{margin:0;font-size:1rem}
.tcard p{margin:0 0 10px;font-size:.87rem;color:var(--text-2)}

.sublist{display:flex;flex-direction:column;gap:8px}
.subrow{
  display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-s);color:inherit;text-decoration:none
}
.subrow:hover{text-decoration:none;border-color:var(--accent)}
.subrow .sid{
  font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none
}
.subrow .st{flex:1;min-width:0;font-weight:600;font-size:.94rem}
.subrow .sm{font-size:.78rem;color:var(--text-3);flex:none}
.subrow .tick{color:var(--accent);flex:none;opacity:0}
.subrow.done .tick{opacity:1}
.subrow.done .st{color:var(--text-2)}

/* ---------- notes rendering ---------- */
.notes{max-width:74ch}
.notes h2{margin:1.7em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line-soft)}
.notes h2:first-child{margin-top:.2em}
.notes>ul>li::marker,.notes>ol>li::marker{color:var(--accent)}
.notes table{width:100%;border-collapse:collapse;margin:0 0 1em;font-size:.9rem}
.notes th,.notes td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.notes th{background:var(--bg-2);font-weight:700;font-size:.82rem;letter-spacing:.01em}
.notes tbody tr:nth-child(even){background:var(--surface-2)}
.tablewrap{overflow-x:auto;margin-bottom:1em}
.tablewrap table{margin-bottom:0}

.eq{
  font-family:var(--mono);font-size:.92rem;line-height:1.7;text-align:center;
  background:var(--accent-soft);color:var(--accent-2);border-radius:var(--radius-s);
  padding:14px 16px;margin:0 0 1em;overflow-x:auto
}
:root[data-theme="dark"] .eq{color:var(--accent-2)}
.eq b{display:block;font-family:var(--sans);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:6px}

.callout{
  border-left:3px solid var(--accent);background:var(--surface-2);
  border-radius:0 var(--radius-s) var(--radius-s) 0;padding:12px 15px;margin:0 0 1em
}
.callout .ct{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.callout p:last-child{margin-bottom:0}
.callout.exam{border-color:var(--amber);background:var(--amber-soft)}
.callout.exam .ct{color:var(--amber)}
.callout.warn{border-color:var(--rose);background:var(--rose-soft)}
.callout.warn .ct{color:var(--rose)}
.callout.link{border-color:var(--violet);background:var(--violet-soft)}
.callout.link .ct{color:var(--violet)}
.callout.prac{border-color:var(--blue);background:var(--blue-soft)}
.callout.prac .ct{color:var(--blue)}

.defbox{border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 14px;margin:0 0 1em;background:var(--surface)}
.defbox b{color:var(--accent)}

.figure{margin:0 0 1.2em;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px}
.figure svg{width:100%;height:auto;max-height:420px;stroke-width:1.4}
.figure figcaption{font-size:.8rem;color:var(--text-3);margin-top:8px;text-align:center}

.obj{list-style:none;padding:0;margin:0 0 1em}
.obj li{display:flex;gap:9px;align-items:flex-start;font-size:.93rem;color:var(--text-2);margin:.42em 0}
.obj li::before{content:"→";color:var(--accent);font-weight:700;flex:none}

/* ---------- terms ---------- */
.terms{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 13px}
.term b{display:block;color:var(--accent);font-size:.9rem}
.term span{font-size:.87rem;color:var(--text-2)}

/* ---------- quiz ---------- */
.qwrap{max-width:720px}
.qmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-3);margin-bottom:10px}
.qtext{font-size:1.08rem;font-weight:600;margin-bottom:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:12px 14px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:.94rem;line-height:1.45
}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--surface-2)}
.opt .lt{
  width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;
  background:var(--bg-2);font-size:.76rem;font-weight:800;color:var(--text-2)
}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .lt{background:var(--accent);color:#fff}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt.wrong .lt{background:var(--rose);color:#fff}
.opt[disabled]{cursor:default;opacity:1}

.ms{border:1px solid var(--line);border-radius:var(--radius-s);padding:13px 15px;background:var(--surface-2);margin-bottom:14px}
.ms h4{margin:0 0 7px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ms ul{margin:0;padding-left:1.15em;font-size:.92rem}
.selfmark{display:flex;gap:8px;flex-wrap:wrap}

.progress-strip{display:flex;gap:3px;margin-bottom:18px}
.progress-strip i{flex:1;height:4px;border-radius:99px;background:var(--bg-2)}
.progress-strip i.ok{background:var(--accent)}
.progress-strip i.no{background:var(--rose)}
.progress-strip i.now{background:var(--text-3)}

/* ---------- flashcards ---------- */
.fc-stage{perspective:1400px;margin-bottom:16px}
.fc{
  position:relative;width:100%;min-height:260px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.3,1)
}
.fc.flip{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 26px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow)
}
.fc-back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-face .q{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.fc-face .a{font-size:1.02rem;color:var(--text-2);max-width:52ch}
.fc-face .tag{position:absolute;top:12px;left:14px;font-size:.7rem;color:var(--text-3);font-family:var(--mono)}
.fc-face .hint{position:absolute;bottom:12px;font-size:.72rem;color:var(--text-3)}
.box-dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.box-dots i{width:8px;height:8px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line)}
.box-dots i.on{background:var(--accent);border-color:var(--accent)}

/* ---------- misc ---------- */
.check{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:.9rem;user-select:none}
.check input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
select,input[type=number]{
  padding:8px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:.88rem
}
.crumb{font-size:.82rem;color:var(--text-3);margin-bottom:6px}
.crumb a{color:var(--text-3)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.result-list{display:flex;flex-direction:column;gap:8px}
.hit{display:block;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:inherit;text-decoration:none}
.hit:hover{border-color:var(--accent);text-decoration:none}
.hit b{font-size:.93rem}
.hit small{display:block;color:var(--text-3);font-size:.78rem}
.hit mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.acc{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);margin-bottom:8px;overflow:hidden}
.acc>summary{padding:12px 15px;cursor:pointer;font-weight:600;font-size:.94rem;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";color:var(--accent);font-weight:700}
.acc[open]>summary::after{content:"–"}
.acc>summary:hover{background:var(--surface-2)}
.acc .acc-body{padding:0 15px 14px;border-top:1px solid var(--line-soft)}
.acc .acc-body>*:first-child{margin-top:12px}
@media print{.topbar,.sidebar,.pager{display:none}.main{max-width:none;padding:0}}

/* ---------- figure legends ---------- */
.fig-legend{margin:12px 0 0;padding-left:1.4em;font-size:.86rem;color:var(--text-2)}
.fig-legend li{margin:.35em 0}
.fig-legend li::marker{color:var(--accent);font-weight:700}
.fig-legend b{color:var(--text)}

/* ---------- mock exam ---------- */
.papercard{background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%;font:inherit}
.papercard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.papercard.on .tn{background:var(--accent);color:#fff}
:root[data-theme="dark"] .papercard.on .tn{color:#06231a}

.exam-bar{
  position:sticky;top:var(--top-h);z-index:20;margin:-26px -30px 20px;padding:12px 30px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:color-mix(in srgb, var(--surface) 97%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)
}
@media (max-width:940px){.exam-bar{margin:-20px -16px 16px;padding:10px 16px}}
.clock{
  font-family:var(--mono);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;
  padding:4px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent)
}
.clock.low{background:var(--rose-soft);color:var(--rose)}
.score{
  font-family:var(--mono);font-size:1rem;font-weight:700;padding:4px 12px;
  border-radius:9px;background:var(--accent-soft);color:var(--accent)
}
.exam-q{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:16px 18px;margin-bottom:14px
}
.exam-qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.exam-qhead .qn{
  flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  background:var(--bg-2);font-size:.82rem;font-weight:800;color:var(--text-2)
}
.exam-qhead .qbody{flex:1;min-width:0;font-weight:600;line-height:1.5}
.exam-qhead .qm{flex:none;font-family:var(--mono);font-size:.85rem;color:var(--text-3);font-weight:700}
.exam-ans{
  width:100%;padding:11px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);font:inherit;font-size:.94rem;margin-bottom:8px;resize:vertical
}
.exam-ans:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .lt{background:var(--accent);color:#fff}
:root[data-theme="dark"] .opt.picked .lt{color:#06231a}
.exam-q.marked{border-color:var(--line-soft)}
.your-answer{
  border-left:3px solid var(--line);padding:8px 0 8px 13px;margin-bottom:12px;font-size:.92rem
}
.your-answer b{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.your-answer p{margin:0;white-space:pre-wrap}
.award{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.award-btn{min-width:38px;font-variant-numeric:tabular-nums}
.award-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .award-btn.on{color:#06231a}

<script>
/* Inline SVG diagrams. Each entry is raw HTML: an <svg> plus a numbered legend.
   Numbered pins on the drawing match the ordered list underneath. */
(function () {
  'use strict';

  var S = 'stroke="currentColor" fill="none"';

  /* numbered badge sitting directly on a structure */
  function pin(n, x, y) {
    return '<g><circle cx="' + x + '" cy="' + y + '" r="11" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/>' +
      '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)" stroke="none">' + n + '</text></g>';
  }
  /* numbered badge sitting clear of the drawing, with a leader line to (tx,ty) */
  function pinL(n, x, y, tx, ty) {
    return '<line x1="' + x + '" y1="' + y + '" x2="' + tx + '" y2="' + ty + '" stroke="var(--accent)" stroke-width="1.1" opacity=".75"/>' + pin(n, x, y);
  }
  function label(x, y, text, anchor) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || 'middle') + '" font-size="11" fill="currentColor" stroke="none">' + text + '</text>';
  }
  function arrowDefs(id) {
    return '<defs><marker id="' + id + '" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">' +
      '<path d="M0 0 L9 4.5 L0 9 z" fill="currentColor" stroke="none"/></marker></defs>';
  }
  function legend(items) {
    return '<ol class="fig-legend">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ol>';
  }

  var D = {};

  /* ---------------- animal + plant cell ---------------- */
  D.cells =
    '<svg viewBox="0 0 660 330" role="img" aria-label="Animal cell and plant cell compared">' +
    '<text x="150" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">Animal cell</text>' +
    // animal cell
    '<ellipse cx="150" cy="170" rx="118" ry="95" ' + S + ' stroke-width="2.4"/>' +
    '<circle cx="150" cy="150" r="33" ' + S + ' stroke-width="1.6"/>' +
    '<circle cx="150" cy="150" r="10" fill="currentColor" opacity=".3" stroke="none"/>' +
    '<ellipse cx="86" cy="212" rx="21" ry="10" ' + S + ' transform="rotate(-22 86 212)"/>' +
    '<ellipse cx="222" cy="212" rx="21" ry="10" ' + S + ' transform="rotate(20 222 212)"/>' +
    '<g fill="currentColor" stroke="none"><circle cx="196" cy="108" r="3.6"/><circle cx="216" cy="126" r="3.6"/>' +
    '<circle cx="182" cy="132" r="3.6"/><circle cx="104" cy="118" r="3.6"/></g>' +
    pin(1, 150, 150) +
    pinL(2, 30, 92, 66, 118) +
    pin(3, 150, 236) +
    pinL(4, 34, 232, 70, 217) +
    pinL(5, 266, 72, 214, 120) +
    // plant cell
    '<text x="490" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">Plant cell</text>' +
    '<rect x="362" y="58" width="256" height="216" rx="6" ' + S + ' stroke-width="3.4"/>' +
    '<rect x="371" y="67" width="238" height="198" rx="4" ' + S + ' stroke-width="1.4"/>' +
    '<rect x="404" y="102" width="172" height="128" rx="16" ' + S + ' stroke-width="1.5"/>' +
    '<circle cx="466" cy="246" r="15" ' + S + ' stroke-width="1.6"/>' +
    '<circle cx="466" cy="246" r="5" fill="currentColor" opacity=".3" stroke="none"/>' +
    '<g ' + S + ' stroke-width="1.4">' +
    '<ellipse cx="387" cy="130" rx="9" ry="16" transform="rotate(-16 387 130)"/>' +
    '<ellipse cx="593" cy="160" rx="9" ry="16" transform="rotate(14 593 160)"/>' +
    '<ellipse cx="500" cy="84" rx="16" ry="9"/>' +
    '<ellipse cx="545" cy="248" rx="16" ry="9"/></g>' +
    pin(1, 466, 246) +
    pinL(6, 646, 40, 616, 60) +
    pin(7, 490, 166) +
    pinL(8, 610, 306, 552, 258) +
    '</svg>' +
    legend([
      '<b>Nucleus</b> — holds the chromosomes (DNA); controls the cell and its activities.',
      '<b>Cell membrane</b> — partially permeable; controls what enters and leaves.',
      '<b>Cytoplasm</b> — jelly where most chemical reactions happen.',
      '<b>Mitochondria</b> — site of aerobic respiration, releasing energy from glucose.',
      '<b>Ribosomes</b> — site of protein synthesis.',
      '<b>Cell wall</b> (plant only) — cellulose; supports the cell and stops it bursting.',
      '<b>Permanent vacuole</b> (plant only) — full of cell sap; keeps the cell turgid.',
      '<b>Chloroplasts</b> (plant only) — contain chlorophyll; absorb light for photosynthesis.'
    ]);

  /* ---------------- leaf cross-section ---------------- */
  D.leaf =
    '<svg viewBox="0 0 660 310" role="img" aria-label="Cross-section through a leaf">' +
    '<rect x="70" y="40" width="530" height="26" ' + S + ' stroke-width="1.6"/>' +
    label(335, 58, 'waxy cuticle + upper epidermis') +
    '<g ' + S + ' stroke-width="1.4">' +
    '<rect x="70" y="66" width="59" height="70"/><rect x="129" y="66" width="59" height="70"/><rect x="188" y="66" width="59" height="70"/>' +
    '<rect x="247" y="66" width="59" height="70"/><rect x="306" y="66" width="59" height="70"/><rect x="365" y="66" width="59" height="70"/>' +
    '<rect x="424" y="66" width="59" height="70"/><rect x="483" y="66" width="59" height="70"/><rect x="541" y="66" width="59" height="70"/></g>' +
    '<g fill="currentColor" opacity=".38" stroke="none">' +
    '<ellipse cx="90" cy="90" rx="7" ry="4"/><ellipse cx="108" cy="115" rx="7" ry="4"/><ellipse cx="152" cy="88" rx="7" ry="4"/>' +
    '<ellipse cx="212" cy="112" rx="7" ry="4"/><ellipse cx="272" cy="90" rx="7" ry="4"/><ellipse cx="330" cy="115" rx="7" ry="4"/>' +
    '<ellipse cx="390" cy="88" rx="7" ry="4"/><ellipse cx="448" cy="112" rx="7" ry="4"/><ellipse cx="508" cy="90" rx="7" ry="4"/>' +
    '<ellipse cx="566" cy="112" rx="7" ry="4"/></g>' +
    '<g ' + S + ' stroke-width="1.3">' +
    '<circle cx="100" cy="166" r="17"/><circle cx="145" cy="196" r="14"/><circle cx="193" cy="164" r="16"/>' +
    '<circle cx="246" cy="198" r="15"/><circle cx="412" cy="166" r="17"/><circle cx="460" cy="197" r="14"/>' +
    '<circle cx="510" cy="164" r="16"/><circle cx="562" cy="198" r="15"/><circle cx="358" cy="201" r="13"/></g>' +
    '<ellipse cx="316" cy="172" rx="42" ry="30" ' + S + ' stroke-width="1.6"/>' +
    '<circle cx="303" cy="164" r="9" ' + S + '/><circle cx="329" cy="181" r="9" ' + S + '/>' +
    '<rect x="70" y="228" width="530" height="24" ' + S + ' stroke-width="1.6"/>' +
    '<path d="M196 228 a16 12 0 0 0 30 0" ' + S + ' stroke-width="1.8"/>' +
    '<path d="M438 252 a16 12 0 0 1 30 0" ' + S + ' stroke-width="1.8"/>' +
    '<path d="M211 264 v20 M453 264 v20" ' + S + ' stroke-width="1.4" stroke-dasharray="4 3"/>' +
    label(332, 294, 'gases diffuse in and out') +
    pin(1, 44, 53) + pin(2, 44, 100) + pin(3, 44, 180) + pin(4, 316, 172) + pin(5, 44, 240) + pinL(6, 152, 268, 205, 244) +
    '</svg>' +
    legend([
      '<b>Waxy cuticle and upper epidermis</b> — transparent so light passes through; the wax cuts water loss.',
      '<b>Palisade mesophyll</b> — tall column cells packed with chloroplasts, right at the top where light is brightest.',
      '<b>Spongy mesophyll</b> — loosely packed with large air spaces, giving a big surface area for gas exchange.',
      '<b>Vascular bundle (vein)</b> — xylem (upper) brings water and mineral ions in, phloem (lower) carries sucrose away.',
      '<b>Lower epidermis</b> — thinner cuticle, and it contains most of the stomata.',
      '<b>Stoma with two guard cells</b> — opens in light to let CO₂ in and O₂ (and water vapour) out.'
    ]);

  /* ---------------- heart ---------------- */
  D.heart =
    '<svg viewBox="0 0 660 420" role="img" aria-label="Section through the human heart">' +
    arrowDefs('ahH') +
    // vessels
    '<path d="M78 132 H196" ' + S + ' stroke-width="15"/>' +
    '<path d="M78 300 H196" ' + S + ' stroke-width="15"/>' +
    '<path d="M470 132 H588" ' + S + ' stroke-width="15"/>' +
    '<path d="M470 300 H588" ' + S + ' stroke-width="15"/>' +
    '<path d="M110 152 h58" ' + S + ' stroke-width="2" marker-end="url(#ahH)"/>' +
    '<path d="M168 320 h-58" ' + S + ' stroke-width="2" marker-end="url(#ahH)"/>' +
    '<path d="M556 152 h-58" ' + S + ' stroke-width="2" marker-end="url(#ahH)"/>' +
    '<path d="M498 320 h58" ' + S + ' stroke-width="2" marker-end="url(#ahH)"/>' +
    // outline
    '<path d="M330 58 C 228 58 176 124 176 208 C 176 292 244 358 330 374 C 416 358 484 292 484 208 C 484 124 432 58 330 58 Z" ' + S + ' stroke-width="2.6"/>' +
    // thick left ventricle wall vs thin right
    '<path d="M180 220 C 186 292 250 348 328 366" ' + S + ' stroke-width="8" opacity=".22"/>' +
    '<path d="M480 220 C 474 292 410 348 332 366" ' + S + ' stroke-width="18" opacity=".22"/>' +
    // septum and chamber divisions
    '<path d="M330 70 V 370" ' + S + ' stroke-width="3"/>' +
    '<path d="M196 196 H 322 M338 196 H 466" ' + S + ' stroke-width="1.8"/>' +
    // valves
    '<path d="M244 196 l14 16 l14 -16" ' + S + ' stroke-width="2.2"/>' +
    '<path d="M388 196 l14 16 l14 -16" ' + S + ' stroke-width="2.2"/>' +
    label(258, 140, 'right atrium') + label(402, 140, 'left atrium') +
    label(256, 282, 'right ventricle') + label(404, 282, 'left ventricle') +
    pinL(1, 96, 96, 130, 124) +
    pinL(2, 96, 344, 130, 308) +
    pinL(3, 566, 96, 532, 124) +
    pinL(4, 566, 344, 532, 308) +
    pinL(5, 214, 240, 250, 206) +
    pinL(6, 446, 240, 410, 206) +
    pinL(7, 540, 240, 478, 250) +
    pinL(8, 330, 32, 330, 68) +
    '</svg>' +
    legend([
      '<b>Vena cava</b> — brings deoxygenated blood from the body into the right atrium.',
      '<b>Pulmonary artery</b> — carries deoxygenated blood from the right ventricle to the lungs.',
      '<b>Pulmonary vein</b> — brings oxygenated blood from the lungs into the left atrium.',
      '<b>Aorta</b> — carries oxygenated blood from the left ventricle to the whole body.',
      '<b>Right atrioventricular valve</b> — stops backflow into the right atrium when the ventricle contracts.',
      '<b>Left atrioventricular valve</b> — the same job on the left. Semilunar valves sit in the artery exits.',
      '<b>Thicker left ventricle wall</b> — more muscle, to push blood all round the body at high pressure.',
      '<b>Septum</b> — keeps oxygenated and deoxygenated blood completely separate (double circulation).'
    ]);

  /* ---------------- alveolus ---------------- */
  D.alveolus =
    '<svg viewBox="0 0 620 340" role="img" aria-label="Gas exchange at an alveolus">' +
    arrowDefs('ahA') +
    '<path d="M40 52 C 100 44 150 62 186 92" ' + S + ' stroke-width="10"/>' +
    label(96, 36, 'bronchiole', 'start') +
    // capillary wrapping the alveolus
    '<path d="M352 24 C 428 82 428 218 352 288" ' + S + ' stroke-width="30" opacity=".16"/>' +
    '<path d="M352 24 C 428 82 428 218 352 288" ' + S + ' stroke-width="1.5"/>' +
    '<g ' + S + ' stroke-width="1.4"><ellipse cx="386" cy="76" rx="10" ry="7"/><ellipse cx="398" cy="152" rx="10" ry="7"/><ellipse cx="382" cy="234" rx="10" ry="7"/></g>' +
    // alveoli
    '<circle cx="240" cy="150" r="92" ' + S + ' stroke-width="2.4"/>' +
    '<circle cx="146" cy="268" r="46" ' + S + ' stroke-width="2.2"/>' +
    '<circle cx="272" cy="286" r="38" ' + S + ' stroke-width="2.2"/>' +
    // gas arrows across the shared wall
    '<path d="M296 106 h72" ' + S + ' stroke-width="2.2" marker-end="url(#ahA)"/>' +
    '<path d="M368 196 h-72" ' + S + ' stroke-width="2.2" marker-end="url(#ahA)"/>' +
    label(332, 96, 'O₂') + label(332, 216, 'CO₂') +
    pin(1, 240, 150) +
    pinL(2, 500, 60, 412, 96) +
    pinL(3, 496, 244, 396, 232) +
    pinL(4, 132, 96, 172, 116) +
    pinL(5, 176, 214, 214, 192) +
    '</svg>' +
    legend([
      '<b>Alveolus</b> — millions of them give a huge surface area, about 70 m² in total.',
      '<b>Capillary</b> — blood flow keeps the concentration gradient steep by removing oxygen constantly.',
      '<b>Red blood cell</b> — carries the oxygen away as oxyhaemoglobin.',
      '<b>Wall one cell thick</b> — the alveolus and capillary walls together make a very short diffusion distance.',
      '<b>Moist lining</b> — gases dissolve first, which is required for diffusion across the surface.'
    ]);

  /* ---------------- nephron ---------------- */
  D.nephron =
    '<svg viewBox="0 0 660 360" role="img" aria-label="A nephron in the kidney">' +
    arrowDefs('ahN') +
    // arterioles
    '<path d="M22 78 H 74" ' + S + ' stroke-width="11"/>' +
    '<path d="M22 116 H 74" ' + S + ' stroke-width="5"/>' +
    // Bowman's capsule and glomerulus
    '<circle cx="118" cy="98" r="46" ' + S + ' stroke-width="2.4"/>' +
    '<path d="M118 74 c -20 6 -22 34 0 44 c 22 -10 20 -38 0 -44 M100 88 h36 M102 106 h32" ' + S + ' stroke-width="1.5"/>' +
    // proximal convoluted tubule
    '<path d="M164 98 c 22 -26 40 26 62 0 c 22 -26 40 26 62 0" ' + S + ' stroke-width="9"/>' +
    // loop of Henle
    '<path d="M288 98 V 250 a 32 32 0 0 0 64 0 V 98" ' + S + ' stroke-width="9"/>' +
    // distal convoluted tubule
    '<path d="M352 98 c 22 -26 40 26 62 0 c 20 -24 38 24 58 0" ' + S + ' stroke-width="9"/>' +
    // collecting duct
    '<path d="M472 98 V 306" ' + S + ' stroke-width="13"/>' +
    '<path d="M472 306 h 66" ' + S + ' stroke-width="2" marker-end="url(#ahN)"/>' +
    label(548, 310, 'to ureter → bladder', 'start') +
    pin(1, 118, 98) +
    pinL(2, 40, 32, 52, 70) +
    pinL(3, 190, 36, 152, 64) +
    pinL(4, 258, 40, 250, 84) +
    pinL(5, 320, 306, 320, 278) +
    pinL(6, 412, 40, 412, 84) +
    pinL(7, 542, 170, 480, 170) +
    '</svg>' +
    legend([
      '<b>Glomerulus</b> — a knot of capillaries under high pressure.',
      '<b>Afferent arteriole</b> (wide, in) and <b>efferent arteriole</b> (narrow, out) — the difference in width is what raises the pressure.',
      '<b>Bowman\'s capsule — ultrafiltration</b>: water, glucose, ions and urea are forced out. Blood cells and plasma proteins are too big and stay behind.',
      '<b>First (proximal) convoluted tubule — selective reabsorption</b>: all the glucose, plus some water and ions, are taken back into the blood.',

<script>
/* Assembles the topic data files into one syllabus and exposes lookup helpers. */
(function () {
  'use strict';

  var SPEC = {
    code: '4BI1',
    board: 'Pearson Edexcel',
    name: 'International GCSE Biology',
    papers: [
      { n: 1, time: '2 hours', marks: 110, weight: '61.1%' },
      { n: 2, time: '1 hour 15 minutes', marks: 70, weight: '38.9%' }
    ]
  };

  var TOPICS = [window.BIO_T1, window.BIO_T2, window.BIO_T3, window.BIO_T4, window.BIO_T5]
    .filter(Boolean);

  // back-link every sub to its topic
  TOPICS.forEach(function (t) {
    t.subs.forEach(function (s, i) {
      s.topicId = t.id;
      s.topicTitle = t.title;
      s.index = i;
      s.terms = s.terms || [];
      s.qs = s.qs || [];
      s.notes = s.notes || [];
      s.objectives = s.objectives || [];
    });
  });

  var ALL_SUBS = TOPICS.reduce(function (a, t) { return a.concat(t.subs); }, []);

  function topic(id) {
    for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return TOPICS[i];
    return null;
  }
  function sub(id) {
    for (var i = 0; i < ALL_SUBS.length; i++) if (ALL_SUBS[i].id === id) return ALL_SUBS[i];
    return null;
  }
  function nextSub(id) {
    var i = ALL_SUBS.findIndex(function (s) { return s.id === id; });
    return i > -1 && i < ALL_SUBS.length - 1 ? ALL_SUBS[i + 1] : null;
  }
  function prevSub(id) {
    var i = ALL_SUBS.findIndex(function (s) { return s.id === id; });
    return i > 0 ? ALL_SUBS[i - 1] : null;
  }

  /* every key term, tagged with where it came from */
  function allTerms() {
    var out = [];
    ALL_SUBS.forEach(function (s) {
      s.terms.forEach(function (t) {
        out.push({ t: t.t, d: t.d, sub: s.id, subTitle: s.title, topicId: s.topicId });
      });
    });
    return out;
  }

  /* every question, tagged. scope = 'all' | topic id ('3') | sub id ('3b') */
  function questions(scope) {
    var out = [];
    ALL_SUBS.forEach(function (s) {
      if (scope && scope !== 'all' && s.id !== scope && s.topicId !== scope) return;
      s.qs.forEach(function (q, i) {
        out.push(Object.assign({}, q, {
          key: s.id + ':' + i, sub: s.id, subTitle: s.title, topicId: s.topicId
        }));
      });
    });
    return out;
  }

  function counts() {
    return {
      topics: TOPICS.length,
      subs: ALL_SUBS.length,
      terms: allTerms().length,
      questions: questions('all').length,
      practicals: (window.BIO_PRACTICALS || []).length
    };
  }

  /* plain text of a sub, used by search */
  function subText(s) {
    var bits = [s.id, s.title, s.topicTitle].concat(s.objectives);
    s.notes.forEach(function (b) {
      if (typeof b === 'string') { bits.push(b); return; }
      if (b.x) bits.push(Array.isArray(b.x) ? b.x.join(' ') : b.x);
      if (b.term) bits.push(b.term);
      if (b.head) bits.push(b.head.join(' '));
      if (b.rows) b.rows.forEach(function (r) { bits.push(r.join(' ')); });
    });
    s.terms.forEach(function (t) { bits.push(t.t + ' ' + t.d); });
    return bits.join(' • ');
  }

  window.SYL = {
    SPEC: SPEC, TOPICS: TOPICS, ALL_SUBS: ALL_SUBS,
    topic: topic, sub: sub, nextSub: nextSub, prevSub: prevSub,
    allTerms: allTerms, questions: questions, counts: counts, subText: subText
  };
})();
