  { id: 'labour-turnover', t: 'Labour turnover', d: 'The percentage of a business\'s workforce that leaves in a year. Calculated as (number leaving ÷ average number employed) × 100.', u: 2, tp: '2.1' },
  { id: 'productivity', t: 'Productivity', d: 'A measure of efficiency: the output produced per worker (or per machine) in a given period.', u: 2, tp: '2.1' },
  { id: 'piece-rate', t: 'Piece rate', d: 'A payment system where workers are paid a fixed amount for each unit they produce.', u: 2, tp: '2.1' },
  { id: 'time-rate', t: 'Time rate (wage)', d: 'A payment system where workers are paid a fixed amount for each hour worked.', u: 2, tp: '2.1' },
  { id: 'salary', t: 'Salary', d: 'A fixed annual amount of pay, usually paid monthly, not directly linked to hours worked or units produced.', u: 2, tp: '2.1' },
  { id: 'commission', t: 'Commission', d: 'Payment based on a percentage of the value of the sales an employee makes.', u: 2, tp: '2.1' },
  { id: 'bonus', t: 'Bonus', d: 'An additional payment made to employees for reaching a target or for good performance.', u: 2, tp: '2.1' },
  { id: 'profit-sharing', t: 'Profit sharing', d: 'A system in which employees receive a share of the profits the business makes.', u: 2, tp: '2.1' },
  { id: 'performance-related-pay', t: 'Performance-related pay', d: 'Pay linked to how well an employee performs, usually judged through an appraisal.', u: 2, tp: '2.1' },
  { id: 'fringe-benefits', t: 'Fringe benefits', d: 'Non-cash rewards given to employees in addition to pay, such as a company car, health insurance, staff discount or a pension.', u: 2, tp: '2.1' },
  { id: 'job-rotation', t: 'Job rotation', d: 'Regularly switching employees between different tasks of a similar level to reduce boredom.', u: 2, tp: '2.1' },
  { id: 'job-enlargement', t: 'Job enlargement', d: 'Adding more tasks of a similar level of difficulty to a job to give more variety.', u: 2, tp: '2.1' },
  { id: 'job-enrichment', t: 'Job enrichment', d: 'Adding tasks that require more skill and responsibility to a job, so it becomes more challenging and rewarding.', u: 2, tp: '2.1' },
  { id: 'empowerment', t: 'Empowerment', d: 'Giving employees the authority to make decisions about how they do their own work.', u: 2, tp: '2.1' },
  { id: 'teamworking', t: 'Teamworking', d: 'Organising employees into groups that are jointly responsible for a complete unit of work.', u: 2, tp: '2.1' },
  { id: 'taylor', t: 'Taylor (scientific management)', d: 'The theory that workers are motivated mainly by money, so jobs should be broken into simple timed tasks and workers paid per unit produced.', u: 2, tp: '2.1' },
  { id: 'maslow', t: 'Maslow (hierarchy of needs)', d: 'The theory that human needs form a hierarchy — physical, safety, social, esteem, self-actualisation — and each level must be satisfied before the next motivates.', u: 2, tp: '2.1' },
  { id: 'herzberg', t: 'Herzberg (two-factor theory)', d: 'The theory that hygiene factors such as pay and conditions prevent dissatisfaction but do not motivate; only motivators such as achievement, recognition and responsibility create satisfaction.', u: 2, tp: '2.1' },

  { id: 'organisational-structure', t: 'Organisational structure', d: 'The way a business arranges its employees into levels and departments, showing who is responsible to whom.', u: 2, tp: '2.2' },
  { id: 'hierarchy', t: 'Hierarchy', d: 'The levels of management within a business, from the most senior at the top to the least senior at the bottom.', u: 2, tp: '2.2' },
  { id: 'chain-of-command', t: 'Chain of command', d: 'The path along which instructions and authority pass down through the levels of an organisation.', u: 2, tp: '2.2' },
  { id: 'span-of-control', t: 'Span of control', d: 'The number of subordinates who report directly to one manager.', u: 2, tp: '2.2' },
  { id: 'delegation', t: 'Delegation', d: 'Giving a subordinate the authority to carry out a task, while the manager keeps overall responsibility for it.', u: 2, tp: '2.2' },
  { id: 'delayering', t: 'Delayering', d: 'Removing one or more levels of the hierarchy, usually middle management, to make the structure flatter.', u: 2, tp: '2.2' },
  { id: 'autocratic', t: 'Autocratic leadership', d: 'A leadership style in which the leader makes all the decisions alone and tells employees what to do.', u: 2, tp: '2.2' },
  { id: 'democratic', t: 'Democratic leadership', d: 'A leadership style in which the leader discusses decisions with employees and takes their views into account.', u: 2, tp: '2.2' },
  { id: 'laissez-faire', t: 'Laissez-faire leadership', d: 'A leadership style in which the leader sets broad goals and then leaves employees to decide how to achieve them.', u: 2, tp: '2.2' },
  { id: 'trade-union', t: 'Trade union', d: 'An organisation of workers that negotiates with employers over pay and conditions on behalf of its members.', u: 2, tp: '2.2' },
  { id: 'collective-bargaining', t: 'Collective bargaining', d: 'Negotiations between a trade union and an employer over pay and conditions on behalf of all the union\'s members.', u: 2, tp: '2.2' },

  { id: 'job-description', t: 'Job description', d: 'A document setting out the title, duties, responsibilities and reporting line of a job.', u: 2, tp: '2.3' },
  { id: 'person-specification', t: 'Person specification', d: 'A document setting out the qualifications, skills, experience and personal qualities needed by the ideal candidate for a job.', u: 2, tp: '2.3' },
  { id: 'internal-recruitment', t: 'Internal recruitment', d: 'Filling a vacancy with someone who already works for the business.', u: 2, tp: '2.3' },
  { id: 'external-recruitment', t: 'External recruitment', d: 'Filling a vacancy with someone from outside the business.', u: 2, tp: '2.3' },
  { id: 'induction-training', t: 'Induction training', d: 'Training given to a new employee when they first start, covering the layout, procedures, health and safety and key people.', u: 2, tp: '2.3' },
  { id: 'on-the-job-training', t: 'On-the-job training', d: 'Training given at the workplace by watching and being guided by an experienced employee while doing the job.', u: 2, tp: '2.3' },
  { id: 'off-the-job-training', t: 'Off-the-job training', d: 'Training given away from the workplace, such as a college course or a specialist training centre.', u: 2, tp: '2.3' },
  { id: 'redundancy', t: 'Redundancy', d: 'When an employee loses their job because the job itself is no longer needed, not because of anything they have done wrong.', u: 2, tp: '2.3' },
  { id: 'dismissal', t: 'Dismissal', d: 'When an employee\'s contract is ended because they have broken it, for example through poor performance or misconduct.', u: 2, tp: '2.3' },
  { id: 'natural-wastage', t: 'Natural wastage', d: 'Reducing the size of the workforce by not replacing employees who leave or retire.', u: 2, tp: '2.3' },
  { id: 'minimum-wage', t: 'Minimum wage', d: 'A legally enforced lowest hourly rate of pay that employers must pay their workers.', u: 2, tp: '2.3' },
  { id: 'part-time-employee', t: 'Part-time employee', d: 'An employee who works fewer hours than a full-time employee, giving the business flexibility to match staffing to demand.', u: 2, tp: '2.3' },

  { id: 'communication', t: 'Communication', d: 'The transfer of a message from a sender to a receiver, which is only effective when it is understood and feedback is given.', u: 2, tp: '2.4' },
  { id: 'feedback', t: 'Feedback', d: 'The response of the receiver, which tells the sender that the message has been received and understood.', u: 2, tp: '2.4' },
  { id: 'internal-communication', t: 'Internal communication', d: 'Communication between people within the same business.', u: 2, tp: '2.4' },
  { id: 'external-communication', t: 'External communication', d: 'Communication between the business and people or organisations outside it, such as customers, suppliers and government.', u: 2, tp: '2.4' },
  { id: 'one-way-communication', t: 'One-way communication', d: 'Communication in which the receiver has no opportunity to respond, such as a notice on a noticeboard.', u: 2, tp: '2.4' },
  { id: 'two-way-communication', t: 'Two-way communication', d: 'Communication in which the receiver can respond and give feedback, such as a meeting or a phone call.', u: 2, tp: '2.4' },
  { id: 'communication-barrier', t: 'Communication barrier', d: 'Anything that stops a message being received or understood, such as jargon, noise, the wrong medium or a long chain of command.', u: 2, tp: '2.4' },

  /* ---------------- Unit 3 ---------------- */
  { id: 'marketing', t: 'Marketing', d: 'The management process of identifying, anticipating and satisfying customer requirements profitably.', u: 3, tp: '3.1' },
  { id: 'mass-marketing', t: 'Mass marketing', d: 'Selling one product to the whole market rather than to a particular segment.', u: 3, tp: '3.1' },
  { id: 'niche-marketing', t: 'Niche marketing', d: 'Aiming a product at a small, specific segment of a larger market.', u: 3, tp: '3.1' },
  { id: 'market-segmentation', t: 'Market segmentation', d: 'Dividing a market into groups of customers with similar characteristics so a product and marketing mix can be aimed at each group.', u: 3, tp: '3.1' },
  { id: 'consumer', t: 'Consumer', d: 'The person who uses a product, who is not always the person who bought it.', u: 3, tp: '3.1' },
  { id: 'brand', t: 'Brand', d: 'A name, symbol or design that identifies a product and distinguishes it from those of competitors.', u: 3, tp: '3.1' },

  { id: 'market-research', t: 'Market research', d: 'The collection, recording and analysis of data about customers, competitors and the market, in order to reduce the risk of business decisions.', u: 3, tp: '3.2' },
  { id: 'primary-research', t: 'Primary (field) research', d: 'Collecting new, original data first hand for a specific purpose.', u: 3, tp: '3.2' },
  { id: 'secondary-research', t: 'Secondary (desk) research', d: 'Using data that already exists, collected by someone else for a different purpose.', u: 3, tp: '3.2' },
  { id: 'questionnaire', t: 'Questionnaire', d: 'A set of questions used to collect data from a sample of people, in person, by post, by phone or online.', u: 3, tp: '3.2' },
  { id: 'focus-group', t: 'Focus group', d: 'A small group of consumers who discuss a product or idea with a researcher to give detailed opinions.', u: 3, tp: '3.2' },
  { id: 'sample', t: 'Sample', d: 'The group of people questioned in market research, chosen to represent the whole target market.', u: 3, tp: '3.2' },
  { id: 'quantitative-data', t: 'Quantitative data', d: 'Data that can be measured and expressed as numbers, making it easy to compare but unable to explain why.', u: 3, tp: '3.2' },
  { id: 'qualitative-data', t: 'Qualitative data', d: 'Data about opinions, attitudes and reasons, which explains motives but is harder to analyse.', u: 3, tp: '3.2' },
  { id: 'test-marketing', t: 'Test marketing', d: 'Selling a new product in a limited area before a full launch, to gather real sales data and find problems.', u: 3, tp: '3.2' },

  { id: 'marketing-mix', t: 'Marketing mix', d: 'The combination of product, price, place and promotion used to market a product. All four must be consistent with each other.', u: 3, tp: '3.3' },
  { id: 'product-life-cycle', t: 'Product life cycle', d: 'The stages a product passes through from development, through introduction, growth and maturity, to decline.', u: 3, tp: '3.3' },
  { id: 'extension-strategy', t: 'Extension strategy', d: 'A method used to lengthen the life of a product at the maturity or decline stage, such as new packaging, new versions, new markets or a price cut.', u: 3, tp: '3.3' },
  { id: 'packaging', t: 'Packaging', d: 'The material around a product, which protects it, makes it easy to transport, promotes it and informs the customer.', u: 3, tp: '3.3' },
  { id: 'cost-plus-pricing', t: 'Cost-plus pricing', d: 'Setting a price by calculating the cost per unit and adding a fixed percentage mark-up.', u: 3, tp: '3.3' },
  { id: 'penetration-pricing', t: 'Penetration pricing', d: 'Setting a low price when entering a market in order to gain customers and market share quickly.', u: 3, tp: '3.3' },
  { id: 'price-skimming', t: 'Price skimming', d: 'Setting a high price for a new, innovative product at launch, then lowering it once competitors appear.', u: 3, tp: '3.3' },
  { id: 'competitive-pricing', t: 'Competitive pricing', d: 'Setting a price at or just below the prices charged by competitors.', u: 3, tp: '3.3' },
  { id: 'promotional-pricing', t: 'Promotional pricing', d: 'Temporarily lowering the price to boost sales, clear stock or launch a product.', u: 3, tp: '3.3' },
  { id: 'psychological-pricing', t: 'Psychological pricing', d: 'Setting a price to influence how customers perceive it, such as $9.99 instead of $10, or a high price to signal quality.', u: 3, tp: '3.3' },
  { id: 'price-elasticity-of-demand', t: 'Price elasticity of demand', d: 'A measure of how much the quantity demanded responds to a change in price: % change in quantity demanded ÷ % change in price. Above 1 is elastic; below 1 is inelastic.', u: 3, tp: '3.3' },
  { id: 'channel-of-distribution', t: 'Channel of distribution', d: 'The route a product takes from the producer to the final consumer.', u: 3, tp: '3.3' },
  { id: 'wholesaler', t: 'Wholesaler', d: 'A business that buys in bulk from producers, stores the goods and sells smaller quantities to retailers.', u: 3, tp: '3.3' },
  { id: 'retailer', t: 'Retailer', d: 'A business that sells goods directly to the final consumer.', u: 3, tp: '3.3' },
  { id: 'informative-advertising', t: 'Informative advertising', d: 'Advertising that gives customers factual information about a product, such as its features, price and where to buy it.', u: 3, tp: '3.3' },
  { id: 'persuasive-advertising', t: 'Persuasive advertising', d: 'Advertising that tries to convince customers that they want or need a product, often using images and emotion.', u: 3, tp: '3.3' },
  { id: 'above-the-line', t: 'Above-the-line promotion', d: 'Promotion carried out through independent media such as TV, radio, newspapers and billboards.', u: 3, tp: '3.3' },
  { id: 'below-the-line', t: 'Below-the-line promotion', d: 'Promotion the business controls directly, such as special offers, free samples, loyalty cards, point-of-sale displays and direct mail.', u: 3, tp: '3.3' },
  { id: 'e-commerce', t: 'E-commerce', d: 'Buying and selling goods and services over the internet.', u: 3, tp: '3.3' },
  { id: 'viral-marketing', t: 'Viral marketing', d: 'Using social media so that users share the marketing message themselves, spreading it rapidly at little cost.', u: 3, tp: '3.3' },

  { id: 'marketing-strategy', t: 'Marketing strategy', d: 'A plan that uses the marketing mix to achieve the marketing objectives of a business.', u: 3, tp: '3.4' },
  { id: 'misleading-advertising', t: 'Misleading advertising', d: 'Advertising that makes false or exaggerated claims about a product. It is illegal in most countries.', u: 3, tp: '3.4' },
  { id: 'consumer-protection', t: 'Consumer protection', d: 'Laws that protect customers from unsafe products, false descriptions, misleading advertising and unfair trading.', u: 3, tp: '3.4' },
  { id: 'exporting', t: 'Exporting', d: 'Selling goods or services produced in one country to customers in another country.', u: 3, tp: '3.4' },

  /* ---------------- Unit 4 ---------------- */
  { id: 'production', t: 'Production', d: 'The process of converting inputs such as land, labour and capital into outputs of goods and services.', u: 4, tp: '4.1' },
  { id: 'job-production', t: 'Job production', d: 'Producing one unique item at a time, made to the customer\'s specific order and completed before the next is started.', u: 4, tp: '4.1' },
  { id: 'batch-production', t: 'Batch production', d: 'Producing groups of identical items together, with each stage completed for the whole batch before the next begins.', u: 4, tp: '4.1' },
  { id: 'flow-production', t: 'Flow (mass) production', d: 'Producing large quantities of an identical product continuously along a production line.', u: 4, tp: '4.1' },
  { id: 'lean-production', t: 'Lean production', d: 'Producing goods and services with the minimum waste of time, materials, labour, space and energy.', u: 4, tp: '4.1' },
  { id: 'just-in-time', t: 'Just-in-time (JIT)', d: 'An inventory method in which materials arrive exactly when they are needed, so almost no stock is held.', u: 4, tp: '4.1' },
  { id: 'kaizen', t: 'Kaizen', d: 'Continuous improvement — all employees regularly suggest small improvements to methods, layout and processes.', u: 4, tp: '4.1' },
  { id: 'cell-production', t: 'Cell production', d: 'Dividing the production line into self-contained teams, each responsible for a complete unit of work.', u: 4, tp: '4.1' },
  { id: 'buffer-stock', t: 'Buffer stock', d: 'A minimum level of inventory held in reserve in case of unexpected demand or supply problems.', u: 4, tp: '4.1' },
  { id: 'automation', t: 'Automation', d: 'Using machines and computers to carry out tasks previously done by workers.', u: 4, tp: '4.1' },
  { id: 'cad-cam', t: 'CAD / CAM', d: 'Computer-aided design (designing products on a computer) and computer-aided manufacture (computers controlling the machines that make them).', u: 4, tp: '4.1' },

  { id: 'fixed-costs', t: 'Fixed costs', d: 'Costs that do not change with the level of output in the short run, such as rent, insurance and managers\' salaries.', u: 4, tp: '4.2' },
  { id: 'variable-costs', t: 'Variable costs', d: 'Costs that change directly with the level of output, such as raw materials, components and piece-rate wages.', u: 4, tp: '4.2' },
  { id: 'total-costs', t: 'Total costs', d: 'Fixed costs plus total variable costs.', u: 4, tp: '4.2' },
  { id: 'average-cost', t: 'Average cost (unit cost)', d: 'The cost of producing one unit: total costs divided by output.', u: 4, tp: '4.2' },
  { id: 'revenue', t: 'Revenue', d: 'The income a business receives from selling its products: selling price × quantity sold.', u: 4, tp: '4.2' },
  { id: 'contribution', t: 'Contribution per unit', d: 'Selling price per unit minus variable cost per unit. It contributes first to paying fixed costs and then to profit.', u: 4, tp: '4.2' },
  { id: 'break-even', t: 'Break-even point', d: 'The level of output at which total revenue exactly equals total costs, so the business makes neither profit nor loss. Calculated as fixed costs ÷ contribution per unit.', u: 4, tp: '4.2' },
  { id: 'margin-of-safety', t: 'Margin of safety', d: 'The amount by which current output exceeds the break-even output, showing how far sales can fall before a loss is made.', u: 4, tp: '4.2' },
  { id: 'economies-of-scale', t: 'Economies of scale', d: 'The factors that cause average cost per unit to fall as a business grows: purchasing, technical, financial, marketing, managerial and risk-bearing.', u: 4, tp: '4.2' },
  { id: 'diseconomies-of-scale', t: 'Diseconomies of scale', d: 'The factors that cause average cost per unit to rise when a business becomes too large: poor communication, poor coordination, low morale and slow decision making.', u: 4, tp: '4.2' },

  { id: 'quality', t: 'Quality', d: 'Producing a good or service that meets customers\' expectations — fit for purpose, reliable and safe.', u: 4, tp: '4.3' },
  { id: 'quality-control', t: 'Quality control', d: 'Checking and inspecting products at the end of the production process to find and remove faults.', u: 4, tp: '4.3' },
  { id: 'quality-assurance', t: 'Quality assurance', d: 'Checking quality throughout the production process, with standards agreed at every stage, so that faults are prevented rather than found later.', u: 4, tp: '4.3' },
  { id: 'tqm', t: 'Total quality management (TQM)', d: 'A quality assurance approach in which every employee is responsible for quality at every stage, aiming for zero defects.', u: 4, tp: '4.3' },

  { id: 'location', t: 'Location decision', d: 'The choice of where to site a business, based on factors such as costs, markets, labour, transport and legal controls.', u: 4, tp: '4.4' },
  { id: 'relocation', t: 'Relocation', d: 'Moving a business from one site to another, usually to cut costs, expand or get closer to a market.', u: 4, tp: '4.4' },
  { id: 'footfall', t: 'Footfall', d: 'The number of potential customers passing a retail site, a key factor in shop location.', u: 4, tp: '4.4' },
  { id: 'infrastructure', t: 'Infrastructure', d: 'The basic facilities a business needs to operate: roads, ports, airports, power, water and communications.', u: 4, tp: '4.4' },
  { id: 'government-incentives', t: 'Government incentives', d: 'Grants, subsidies, tax breaks and cheap rent offered to persuade businesses to locate in a particular area.', u: 4, tp: '4.4' },
  { id: 'planning-permission', t: 'Planning permission', d: 'Legal approval from local government that a business must obtain before building or changing the use of premises.', u: 4, tp: '4.4' },

  /* ---------------- Unit 5 ---------------- */
  { id: 'retained-profit', t: 'Retained profit', d: 'Profit kept in the business after tax and dividends, and reinvested. It is an internal, permanent source of finance with no interest.', u: 5, tp: '5.1' },
  { id: 'overdraft', t: 'Bank overdraft', d: 'An arrangement allowing a business to withdraw more than is in its bank account, up to an agreed limit. Flexible but with a high interest rate.', u: 5, tp: '5.1' },
  { id: 'trade-credit', t: 'Trade credit', d: 'Buying goods from suppliers and paying for them at a later date, usually 30 to 90 days — effectively an interest-free short-term loan.', u: 5, tp: '5.1' },
  { id: 'bank-loan', t: 'Bank loan', d: 'A fixed sum borrowed from a bank and repaid with interest in instalments over an agreed period. Usually requires collateral.', u: 5, tp: '5.1' },
  { id: 'share-issue', t: 'Share issue', d: 'Raising permanent capital by selling new shares in a limited company. It never has to be repaid but dilutes ownership.', u: 5, tp: '5.1' },
  { id: 'debenture', t: 'Debenture', d: 'A long-term loan certificate sold by a company to investors, repayable on a fixed future date with interest.', u: 5, tp: '5.1' },
  { id: 'hire-purchase', t: 'Hire purchase', d: 'Paying for an asset in instalments, with ownership passing to the business at the final payment.', u: 5, tp: '5.1' },
  { id: 'leasing', t: 'Leasing', d: 'Renting an asset rather than buying it, avoiding a large initial payment but never owning the asset.', u: 5, tp: '5.1' },
  { id: 'venture-capital', t: 'Venture capital', d: 'Finance provided by specialist investors to high-risk, high-growth businesses in return for a share of the business.', u: 5, tp: '5.1' },
  { id: 'collateral', t: 'Collateral (security)', d: 'An asset pledged to a lender, which the lender can take and sell if the loan is not repaid.', u: 5, tp: '5.1' },
  { id: 'crowdfunding', t: 'Crowdfunding', d: 'Raising finance by collecting small amounts from a large number of people, usually through an online platform.', u: 5, tp: '5.1' },
  { id: 'microfinance', t: 'Microfinance', d: 'Very small loans provided to entrepreneurs in low-income countries who cannot access normal banking services.', u: 5, tp: '5.1' },
  { id: 'debt-factoring', t: 'Debt factoring', d: 'Selling unpaid customer invoices to a finance company, which pays most of their value immediately, improving cash flow.', u: 5, tp: '5.1' },

  { id: 'cash-flow', t: 'Cash flow', d: 'The flow of money into and out of a business over a period of time.', u: 5, tp: '5.2' },
  { id: 'cash-inflow', t: 'Cash inflow', d: 'Money coming into a business, such as cash sales, payments from debtors, loans received and asset sales.', u: 5, tp: '5.2' },
  { id: 'cash-outflow', t: 'Cash outflow', d: 'Money going out of a business, such as payments for materials, wages, rent, loan repayments and equipment.', u: 5, tp: '5.2' },
  { id: 'net-cash-flow', t: 'Net cash flow', d: 'Total cash inflows minus total cash outflows in a period.', u: 5, tp: '5.2' },
  { id: 'opening-balance', t: 'Opening balance', d: 'The amount of cash a business holds at the start of a period, which equals the previous period\'s closing balance.', u: 5, tp: '5.2' },
  { id: 'closing-balance', t: 'Closing balance', d: 'The amount of cash held at the end of a period: opening balance plus net cash flow.', u: 5, tp: '5.2' },
  { id: 'cash-flow-forecast', t: 'Cash-flow forecast', d: 'An estimate of future cash inflows and outflows, month by month, used to predict when cash shortages will occur.', u: 5, tp: '5.2' },
  { id: 'working-capital', t: 'Working capital', d: 'The finance available for day-to-day running of a business: current assets minus current liabilities.', u: 5, tp: '5.2' },
  { id: 'liquidity', t: 'Liquidity', d: 'The ability of a business to pay its short-term debts as they fall due.', u: 5, tp: '5.2' },
  { id: 'insolvency', t: 'Insolvency', d: 'When a business cannot pay its debts as they fall due, even if it owns valuable assets.', u: 5, tp: '5.2' },

  { id: 'income-statement', t: 'Income statement', d: 'A financial statement showing a business\'s revenue, costs and profit over a period of time, usually one year.', u: 5, tp: '5.3' },
  { id: 'cost-of-sales', t: 'Cost of sales', d: 'The direct cost of the goods actually sold during the period, such as materials and direct labour.', u: 5, tp: '5.3' },
  { id: 'gross-profit', t: 'Gross profit', d: 'Revenue minus cost of sales — profit before overheads and expenses are deducted.', u: 5, tp: '5.3' },
  { id: 'net-profit', t: 'Profit (net profit)', d: 'Gross profit minus all expenses and overheads — what the business has actually earned from trading.', u: 5, tp: '5.3' },
  { id: 'expenses', t: 'Expenses (overheads)', d: 'The indirect running costs of a business, such as rent, salaries, marketing, insurance and electricity.', u: 5, tp: '5.3' },
  { id: 'depreciation', t: 'Depreciation', d: 'The fall in the value of a non-current asset over time, recorded as an expense in the income statement.', u: 5, tp: '5.3' },

  { id: 'statement-of-financial-position', t: 'Statement of financial position', d: 'A financial statement showing what a business owns, what it owes and the capital invested by the owners at one point in time.', u: 5, tp: '5.4' },
  { id: 'non-current-asset', t: 'Non-current (fixed) asset', d: 'An asset a business keeps and uses for more than one year, such as land, buildings, machinery and vehicles.', u: 5, tp: '5.4' },
  { id: 'current-asset', t: 'Current asset', d: 'An asset likely to be turned into cash within one year: inventory, trade receivables and cash.', u: 5, tp: '5.4' },
  { id: 'current-liability', t: 'Current liability', d: 'A debt that must be repaid within one year: trade payables, overdraft, short-term loans and tax owed.', u: 5, tp: '5.4' },
  { id: 'non-current-liability', t: 'Non-current (long-term) liability', d: 'A debt repayable in more than one year, such as a bank loan, mortgage or debenture.', u: 5, tp: '5.4' },
  { id: 'inventory', t: 'Inventory (stock)', d: 'Raw materials, work in progress and finished goods held by a business. A current asset.', u: 5, tp: '5.4' },
  { id: 'trade-receivables', t: 'Trade receivables (debtors)', d: 'Money owed to the business by customers who have bought on credit. A current asset.', u: 5, tp: '5.4' },
  { id: 'trade-payables', t: 'Trade payables (creditors)', d: 'Money the business owes to suppliers for goods bought on credit. A current liability.', u: 5, tp: '5.4' },
  { id: 'shareholders-equity', t: 'Shareholders\' equity', d: 'The owners\' stake in a company: share capital plus retained earnings.', u: 5, tp: '5.4' },

  { id: 'gross-profit-margin', t: 'Gross profit margin', d: 'A profitability ratio: (gross profit ÷ revenue) × 100. It shows how well direct costs and pricing are controlled.', u: 5, tp: '5.5' },
  { id: 'profit-margin', t: 'Profit margin', d: 'A profitability ratio: (profit ÷ revenue) × 100. It shows how well both direct costs and overheads are controlled.', u: 5, tp: '5.5' },
  { id: 'roce', t: 'Return on capital employed (ROCE)', d: 'A profitability ratio: (profit ÷ capital employed) × 100. It shows how much profit is earned for every $100 of capital invested.', u: 5, tp: '5.5' },
  { id: 'current-ratio', t: 'Current ratio', d: 'A liquidity ratio: current assets ÷ current liabilities. Around 1.5:1 to 2:1 is usually considered safe.', u: 5, tp: '5.5' },
  { id: 'acid-test-ratio', t: 'Acid test ratio', d: 'A liquidity ratio: (current assets − inventory) ÷ current liabilities. Around 1:1 is usually considered safe.', u: 5, tp: '5.5' },
  { id: 'ratio-analysis', t: 'Ratio analysis', d: 'Using figures from the accounts to calculate ratios that measure performance and allow comparison over time and between businesses.', u: 5, tp: '5.5' },
  { id: 'window-dressing', t: 'Window dressing', d: 'Presenting accounts in a way that makes the business look better than it really is.', u: 5, tp: '5.5' },

  /* ---------------- Unit 6 ---------------- */
  { id: 'inflation', t: 'Inflation', d: 'A sustained rise in the general level of prices, which reduces the value of money.', u: 6, tp: '6.1' },
  { id: 'unemployment', t: 'Unemployment', d: 'People who are willing and able to work but cannot find a job.', u: 6, tp: '6.1' },
  { id: 'economic-growth', t: 'Economic growth', d: 'An increase in a country\'s real gross domestic product (GDP) over time.', u: 6, tp: '6.1' },
  { id: 'gdp', t: 'Gross domestic product (GDP)', d: 'The total value of goods and services produced in a country in a year.', u: 6, tp: '6.1' },
  { id: 'recession', t: 'Recession', d: 'A period of falling GDP, usually lasting two consecutive quarters or more, with rising unemployment and falling demand.', u: 6, tp: '6.1' },
  { id: 'business-cycle', t: 'Business (trade) cycle', d: 'The pattern of growth, boom, recession, slump and recovery that an economy repeatedly passes through.', u: 6, tp: '6.1' },
  { id: 'fiscal-policy', t: 'Fiscal policy', d: 'Government decisions about taxation and government spending, used to influence the economy.', u: 6, tp: '6.1' },
  { id: 'monetary-policy', t: 'Monetary policy', d: 'Government or central bank decisions about interest rates and the money supply, used to influence the economy.', u: 6, tp: '6.1' },
  { id: 'direct-tax', t: 'Direct tax', d: 'A tax on income and profit, paid directly by the person or business earning it, such as income tax and corporation tax.', u: 6, tp: '6.1' },
  { id: 'indirect-tax', t: 'Indirect tax', d: 'A tax on spending, added to the price of goods and services, such as VAT or sales tax.', u: 6, tp: '6.1' },
  { id: 'interest-rate', t: 'Interest rate', d: 'The cost of borrowing money, and the reward for saving, expressed as a percentage.', u: 6, tp: '6.1' },
  { id: 'disposable-income', t: 'Disposable income', d: 'The income a consumer has left to spend or save after income tax has been deducted.', u: 6, tp: '6.1' },
  { id: 'supply-side-policy', t: 'Supply-side policy', d: 'Government policies that aim to increase the economy\'s capacity to produce, such as training, lower business taxes and better infrastructure.', u: 6, tp: '6.1' },

  { id: 'sustainable-development', t: 'Sustainable development', d: 'Development that meets the needs of the present without reducing the ability of future generations to meet their own needs.', u: 6, tp: '6.2' },
  { id: 'externalities', t: 'Externalities', d: 'Costs or benefits of business activity that fall on third parties rather than on the business itself, such as pollution.', u: 6, tp: '6.2' },
  { id: 'social-costs', t: 'Social costs', d: 'The full cost to society of business activity: the private costs paid by the business plus the external costs borne by others.', u: 6, tp: '6.2' },
  { id: 'business-ethics', t: 'Business ethics', d: 'The moral principles that guide business decisions — doing what is right, not just what is legal or profitable.', u: 6, tp: '6.2' },
  { id: 'pressure-group', t: 'Pressure group', d: 'An organisation of people who campaign to change the behaviour of businesses or governments, for example on the environment.', u: 6, tp: '6.2' },
  { id: 'recycling', t: 'Recycling', d: 'Reprocessing used materials into new products, reducing waste and the use of non-renewable resources.', u: 6, tp: '6.2' },
  { id: 'carbon-footprint', t: 'Carbon footprint', d: 'The total amount of greenhouse gases produced by the activities of a business or product.', u: 6, tp: '6.2' },

  { id: 'globalisation', t: 'Globalisation', d: 'The growing integration of the world\'s economies, so that businesses increasingly buy, sell, produce and invest across national borders.', u: 6, tp: '6.3' },
  { id: 'tariff', t: 'Tariff', d: 'A tax on imported goods, which raises their price so consumers switch to domestic products.', u: 6, tp: '6.3' },
  { id: 'quota', t: 'Quota', d: 'A physical limit on the quantity of a good that may be imported into a country.', u: 6, tp: '6.3' },
  { id: 'free-trade', t: 'Free trade', d: 'International trade without tariffs, quotas or other barriers.', u: 6, tp: '6.3' },
  { id: 'trade-bloc', t: 'Trade bloc', d: 'A group of countries that have agreed to remove trade barriers between themselves.', u: 6, tp: '6.3' },
  { id: 'multinational-company', t: 'Multinational company (MNC)', d: 'A business with its headquarters in one country that produces or operates in two or more countries.', u: 6, tp: '6.3' },
  { id: 'exchange-rate', t: 'Exchange rate', d: 'The price of one currency in terms of another.', u: 6, tp: '6.3' },
  { id: 'currency-appreciation', t: 'Appreciation of a currency', d: 'A rise in the value of a currency against others. It makes imports cheaper and exports dearer (SPICED).', u: 6, tp: '6.3' },
  { id: 'currency-depreciation', t: 'Depreciation of a currency', d: 'A fall in the value of a currency against others. It makes imports dearer and exports cheaper.', u: 6, tp: '6.3' },
  { id: 'exports', t: 'Exports', d: 'Goods and services produced in one country and sold to customers in another.', u: 6, tp: '6.3' },
  { id: 'imports', t: 'Imports', d: 'Goods and services bought from producers in another country.', u: 6, tp: '6.3' },
  { id: 'protectionism', t: 'Protectionism', d: 'Government policies such as tariffs and quotas that restrict imports in order to protect domestic businesses and jobs.', u: 6, tp: '6.3' }
];

BS.term = function (id) {
  for (var i = 0; i < BS.glossary.length; i++) if (BS.glossary[i].id === id) return BS.glossary[i];
  return null;
};
</script>
<script>
/* ===== js/quizbank.js ===== */
/* quizbank.js — multiple-choice questions.
   { id, u: unit, tp: topic, q: question, o: [options], a: index of answer, e: explanation } */

BS.quiz = [
/* ================= UNIT 1 ================= */
{ id: 'q101', u: 1, tp: '1.1', q: 'A bakery buys flour, yeast and butter for $0.60 and sells a loaf for $2.40. What is the added value per loaf?', o: ['$0.60', '$1.80', '$2.40', '$3.00'], a: 1, e: 'Added value = selling price − cost of bought-in materials = $2.40 − $0.60 = $1.80. It is not profit: wages, rent and energy still have to be paid out of it.' },
{ id: 'q102', u: 1, tp: '1.1', q: 'A business has $30,000 and chooses to buy a delivery van instead of upgrading its website. What is the opportunity cost?', o: ['The $30,000 spent', 'The delivery van', 'The website upgrade that was given up', 'The interest lost on the $30,000'], a: 2, e: 'Opportunity cost is the next best alternative given up — here, the website upgrade. It is never simply "the money spent".' },
{ id: 'q103', u: 1, tp: '1.1', q: 'Which of these is a reward to the factor of production "enterprise"?', o: ['Rent', 'Wages', 'Interest', 'Profit'], a: 3, e: 'Land earns rent, labour earns wages, capital earns interest and enterprise earns profit — the reward for risk taking.' },
{ id: 'q104', u: 1, tp: '1.1', q: 'Which is a disadvantage of the division of labour for a business?', o: ['Workers become more skilled at one task', 'Training costs fall', 'Boredom leads to higher labour turnover', 'Output per worker rises'], a: 2, e: 'Repeating one task is boring, which lowers motivation and raises turnover and absenteeism. The other three are advantages.' },
{ id: 'q105', u: 1, tp: '1.2', q: 'In which sector is a company that builds houses?', o: ['Primary', 'Secondary', 'Tertiary', 'Public'], a: 1, e: 'Construction is part of the secondary sector, along with manufacturing and processing.' },
{ id: 'q106', u: 1, tp: '1.2', q: 'A public limited company is best described as being in the:', o: ['public sector because the public own the shares', 'private sector because it is owned by private individuals', 'public sector because it is regulated', 'tertiary sector by definition'], a: 1, e: 'A plc is a private-sector business. "Public" only means its shares can be bought by the general public — not that the government owns it.' },
{ id: 'q107', u: 1, tp: '1.2', q: 'De-industrialisation means:', o: ['a rise in the importance of the primary sector', 'a decline in the importance of the secondary sector', 'the closure of all factories in a country', 'the government selling businesses to the private sector'], a: 1, e: 'De-industrialisation is the decline in the relative importance of manufacturing, usually alongside growth in the tertiary sector.' },
{ id: 'q108', u: 1, tp: '1.3', q: 'Which of the following is an example of backward vertical integration?', o: ['A supermarket buying another supermarket', 'A car maker buying a steel producer', 'A car maker buying a chain of car showrooms', 'A car maker buying a hotel chain'], a: 1, e: 'Backward vertical integration is joining with a business at an earlier stage, closer to the raw materials — a steel producer supplies the car maker.' },
{ id: 'q109', u: 1, tp: '1.3', q: 'Which is the least reliable single measure of the size of a business?', o: ['Number of employees', 'Value of sales', 'Profit', 'Capital employed'], a: 2, e: 'Profit is a measure of performance, not size — a small business can be very profitable and a huge business can make a loss.' },
{ id: 'q110', u: 1, tp: '1.3', q: 'Which is a benefit of internal (organic) growth compared with a takeover?', o: ['It is faster', 'It removes a competitor from the market', 'It is easier to manage and control', 'It always requires less finance in total'], a: 2, e: 'Organic growth is slower but far easier to control, and it avoids the culture clashes that follow a takeover.' },
{ id: 'q111', u: 1, tp: '1.3', q: 'The most common single cause of business failure is:', o: ['a fall in the share price', 'poor cash flow', 'too much competition', 'high interest rates'], a: 1, e: 'Cash-flow problems are the most common cause. A business that cannot pay its bills fails even if it is profitable on paper.' },
{ id: 'q112', u: 1, tp: '1.4', q: 'Which form of business organisation always has unlimited liability?', o: ['Private limited company', 'Public limited company', 'Sole trader', 'Public corporation'], a: 2, e: 'A sole trader is unincorporated, so the owner is personally liable for all business debts.' },
{ id: 'q113', u: 1, tp: '1.4', q: 'The main disadvantage to the original owners of converting a private limited company into a plc is:', o: ['losing limited liability', 'the risk of losing control through a takeover', 'no longer being able to borrow from banks', 'having to pay dividends for the first time'], a: 1, e: 'Once shares are traded publicly anyone can buy them, so the original owners risk losing control. Limited liability is kept.' },
{ id: 'q114', u: 1, tp: '1.4', q: 'A benefit to a franchisee of buying a franchise rather than starting an independent business is:', o: ['keeping all the profit', 'complete freedom over pricing and products', 'trading under an established brand with existing customers', 'no start-up costs'], a: 2, e: 'The franchisee gets a known brand, training and marketing support, which greatly reduces the risk of failure — but must pay fees and follow the franchisor\'s rules.' },
{ id: 'q115', u: 1, tp: '1.4', q: 'Which document sets out the internal rules of a company, including directors\' powers and how meetings are run?', o: ['Memorandum of Association', 'Articles of Association', 'Certificate of Incorporation', 'Deed of partnership'], a: 1, e: 'The Articles of Association contain the internal rules. The Memorandum states the name, address, share capital and purpose.' },
{ id: 'q116', u: 1, tp: '1.5', q: 'Which objective is most likely to be the priority of a business in its first year of trading?', o: ['Growth', 'Survival', 'Maximising market share', 'Increasing shareholder value'], a: 1, e: 'New businesses focus on survival: without it, no other objective is possible. Objectives change as a business becomes established.' },
{ id: 'q117', u: 1, tp: '1.5', q: 'Which pair of stakeholders is most likely to have directly conflicting objectives?', o: ['Managers and directors', 'Shareholders wanting higher dividends and employees wanting higher wages', 'Customers and suppliers', 'Government and banks'], a: 1, e: 'Money paid out in higher wages is money not available for dividends, so these two objectives directly conflict.' },
{ id: 'q118', u: 1, tp: '1.5', q: 'Which of these is an internal stakeholder?', o: ['A supplier', 'The local community', 'An employee', 'A bank'], a: 2, e: 'Employees, managers and owners are internal. Suppliers, banks, customers, government and the community are external.' },
{ id: 'q119', u: 1, tp: '1.5', q: 'The "M" in SMART objectives stands for:', o: ['Motivating', 'Measurable', 'Marketable', 'Manageable'], a: 1, e: 'SMART = Specific, Measurable, Achievable, Realistic, Time-bound. Measurable means progress can be checked against a number.' },
{ id: 'q120', u: 1, tp: '1.3', q: 'A government is most likely to support new business start-ups because they:', o: ['always pay high dividends', 'create jobs and increase output', 'reduce competition in the market', 'guarantee lower prices for consumers'], a: 1, e: 'Start-ups create employment, raise GDP, increase choice and eventually generate tax revenue.' },

/* ================= UNIT 2 ================= */
{ id: 'q201', u: 2, tp: '2.1', q: 'A business employs 200 people and 30 left last year. What is the labour turnover?', o: ['6.7%', '15%', '30%', '85%'], a: 1, e: 'Labour turnover = (30 ÷ 200) × 100 = 15%.' },
{ id: 'q202', u: 2, tp: '2.1', q: 'According to Herzberg, which of these is a hygiene factor rather than a motivator?', o: ['Recognition', 'Responsibility', 'Pay', 'Achievement'], a: 2, e: 'Herzberg classed pay, conditions, company policy and relationships as hygiene factors: poor ones cause dissatisfaction, but improving them does not motivate.' },
{ id: 'q203', u: 2, tp: '2.1', q: 'Adding tasks that require more skill and responsibility to a job is called:', o: ['job rotation', 'job enlargement', 'job enrichment', 'delayering'], a: 2, e: 'Job enrichment adds responsibility (vertical loading). Job enlargement adds more tasks at the same level (horizontal loading).' },
{ id: 'q204', u: 2, tp: '2.1', q: 'Which payment method is most likely to raise output but risk lower quality?', o: ['Salary', 'Time rate', 'Piece rate', 'Fringe benefits'], a: 2, e: 'Piece rate pays per unit, so workers rush to produce more and quality can suffer.' },
{ id: 'q205', u: 2, tp: '2.1', q: 'In Maslow\'s hierarchy, providing a permanent contract and safe working conditions meets which need?', o: ['Physical', 'Safety', 'Social', 'Esteem'], a: 1, e: 'Safety needs cover security of employment and a safe working environment.' },
{ id: 'q206', u: 2, tp: '2.1', q: 'Which is NOT a likely benefit of a well-motivated workforce?', o: ['Lower labour turnover', 'Higher productivity', 'Higher wage costs', 'Better quality output'], a: 2, e: 'Higher wage costs are a possible cost of motivating staff, not a benefit of motivation itself.' },
{ id: 'q207', u: 2, tp: '2.2', q: 'A manager has 12 people reporting directly to them. This is a description of:', o: ['a long chain of command', 'a wide span of control', 'a tall hierarchy', 'delegation'], a: 1, e: 'The span of control is the number of subordinates reporting directly to one manager; 12 is wide.' },
{ id: 'q208', u: 2, tp: '2.2', q: 'One likely effect of delayering is:', o: ['a longer chain of command', 'lower management salary costs', 'a narrower span of control', 'slower communication'], a: 1, e: 'Removing a layer of management cuts wage costs and shortens the chain of command, but widens the span of control of those who remain.' },
{ id: 'q209', u: 2, tp: '2.2', q: 'When a manager delegates a task, who keeps overall responsibility for it?', o: ['The subordinate', 'The manager', 'Nobody', 'The human resources department'], a: 1, e: 'Authority can be delegated but responsibility cannot — the manager remains accountable.' },
{ id: 'q210', u: 2, tp: '2.2', q: 'Which leadership style is most appropriate during an emergency requiring immediate action?', o: ['Democratic', 'Laissez-faire', 'Autocratic', 'Consultative'], a: 2, e: 'Autocratic leadership gives fast, clear decisions with no time lost to consultation — the right choice in a crisis.' },
{ id: 'q211', u: 2, tp: '2.2', q: 'A benefit to an employer of dealing with a trade union is:', o: ['wage costs are always lower', 'negotiating with one representative is quicker than with every worker', 'strikes become impossible', 'no need for health and safety rules'], a: 1, e: 'Collective bargaining means the employer negotiates once, with one representative, instead of with hundreds of individuals.' },
{ id: 'q212', u: 2, tp: '2.3', q: 'A document listing the qualifications, skills and personal qualities needed by an ideal candidate is a:', o: ['job description', 'person specification', 'contract of employment', 'curriculum vitae'], a: 1, e: 'The person specification describes the person; the job description describes the job.' },
{ id: 'q213', u: 2, tp: '2.3', q: 'Which is an advantage of internal recruitment?', o: ['It brings new ideas into the business', 'The candidate is already known to the business', 'It gives a larger pool of applicants', 'It avoids creating another vacancy'], a: 1, e: 'The business already knows the candidate\'s strengths and weaknesses, and the candidate knows the business. But it creates a second vacancy and brings in no new ideas.' },
{ id: 'q214', u: 2, tp: '2.3', q: 'The main disadvantage of off-the-job training is that:', o: ['workers learn bad habits from colleagues', 'it is expensive and the worker produces nothing while away', 'it cannot lead to a qualification', 'it is only suitable for new employees'], a: 1, e: 'Off-the-job training is delivered by experts and can lead to qualifications, but the business pays for it and loses the worker\'s output meanwhile.' },
{ id: 'q215', u: 2, tp: '2.3', q: 'A worker loses their job because the business has automated the production line. This is:', o: ['unfair dismissal', 'redundancy', 'dismissal for misconduct', 'natural wastage'], a: 1, e: 'Redundancy is when the job itself is no longer needed. The employee has done nothing wrong.' },
{ id: 'q216', u: 2, tp: '2.3', q: 'Which is a disadvantage to a business of employing part-time rather than full-time staff?', o: ['Less flexibility at busy periods', 'More people to train and communicate with', 'A smaller pool of applicants', 'Higher fixed costs'], a: 1, e: 'Part-time staff give flexibility and a wider recruitment pool, but there are more individuals to train, manage and communicate with, and turnover is often higher.' },
{ id: 'q217', u: 2, tp: '2.4', q: 'Which method of communication provides the most immediate feedback?', o: ['A notice on the staff noticeboard', 'A company-wide email', 'A face-to-face meeting', 'An annual report'], a: 2, e: 'Face-to-face is two-way: the sender sees the reaction, can clarify immediately and receives instant feedback.' },
{ id: 'q218', u: 2, tp: '2.4', q: 'Which is a barrier to effective communication?', o: ['Using two-way communication', 'Using technical jargon the receiver does not understand', 'Asking the receiver to confirm the message', 'Keeping messages short'], a: 1, e: 'Jargon prevents the receiver understanding the message. The other options all improve communication.' },
{ id: 'q219', u: 2, tp: '2.4', q: 'A very tall organisational structure is likely to cause communication problems because:', o: ['there are too few managers', 'messages must pass through many levels and can be distorted', 'the span of control is too wide', 'employees are too empowered'], a: 1, e: 'A long chain of command slows messages down and distorts them as they pass through each level.' },
{ id: 'q220', u: 2, tp: '2.1', q: 'A factory produces 4,800 units a week with 40 employees. What is the labour productivity per employee?', o: ['48 units', '120 units', '480 units', '1,200 units'], a: 1, e: 'Labour productivity = total output ÷ number of employees = 4,800 ÷ 40 = 120 units per employee per week.' },

/* ================= UNIT 3 ================= */
{ id: 'q301', u: 3, tp: '3.1', q: 'A business sells $6m in a market worth $40m. What is its market share?', o: ['6%', '15%', '24%', '40%'], a: 1, e: 'Market share = (6 ÷ 40) × 100 = 15%.' },
{ id: 'q302', u: 3, tp: '3.1', q: 'Which is an advantage of niche marketing compared with mass marketing?', o: ['Greater economies of scale', 'Higher total sales volume', 'Less competition and often higher prices', 'Risk is spread across many customers'], a: 2, e: 'A niche has fewer competitors and customers who will pay a premium for a specialist product — but volumes are small and all the risk sits in one segment.' },
{ id: 'q303', u: 3, tp: '3.1', q: 'Dividing a market by age, income and lifestyle is called:', o: ['test marketing', 'market segmentation', 'mass marketing', 'market research'], a: 1, e: 'Segmentation divides a market into groups of customers with similar characteristics.' },
{ id: 'q304', u: 3, tp: '3.2', q: 'Which of these is primary market research?', o: ['Reading a government population report', 'Analysing the business\'s own past sales records', 'Running a focus group with 8 customers', 'Studying a competitor\'s published accounts'], a: 2, e: 'A focus group collects new, original data first hand. The other three all use data that already exists.' },
{ id: 'q305', u: 3, tp: '3.2', q: 'The main advantage of secondary research over primary research is that it is:', o: ['exactly tailored to the business\'s needs', 'cheaper and faster to obtain', 'unavailable to competitors', 'always completely up to date'], a: 1, e: 'Secondary data already exists, so it is cheap and immediate — but it was collected for someone else\'s purpose, may be out of date, and rivals can see it too.' },
{ id: 'q306', u: 3, tp: '3.2', q: 'Which is a limitation of market research?', o: ['It guarantees a product will succeed', 'Respondents may not answer honestly', 'It can only produce quantitative data', 'It is always free'], a: 1, e: 'People may say what they think the researcher wants to hear, and what they say they will buy is not always what they do buy. Research reduces risk; it does not remove it.' },
{ id: 'q307', u: 3, tp: '3.3', q: 'A technology firm launches a genuinely new product with no competitors and charges a very high price at first. This is:', o: ['penetration pricing', 'price skimming', 'competitive pricing', 'cost-plus pricing'], a: 1, e: 'Price skimming sets a high launch price to recover development costs from customers keen to buy first, then lowers it as rivals enter.' },
{ id: 'q308', u: 3, tp: '3.3', q: 'Price falls from $20 to $18 and quantity demanded rises from 500 to 650. Demand is:', o: ['inelastic, so revenue falls', 'elastic, so revenue rises', 'inelastic, so revenue rises', 'perfectly inelastic'], a: 1, e: 'Price fell 10%; quantity rose 30%. PED = 30 ÷ 10 = 3, which is elastic. Revenue rises from $10,000 to $11,700.' },
{ id: 'q309', u: 3, tp: '3.3', q: 'At which stage of the product life cycle are profits usually highest?', o: ['Introduction', 'Growth', 'Maturity', 'Decline'], a: 2, e: 'At maturity, sales are at their peak, development costs have been recovered and unit costs are low from high output.' },
{ id: 'q310', u: 3, tp: '3.3', q: 'Which is an extension strategy?', o: ['Withdrawing the product from sale', 'Launching a new flavour and repackaging the product', 'Increasing the price to reduce demand', 'Reducing quality to cut costs'], a: 1, e: 'Extension strategies lengthen the life of a mature product — new versions, new packaging, new markets, new advertising or a price cut.' },
{ id: 'q311', u: 3, tp: '3.3', q: 'A producer sells through a wholesaler, which sells to retailers. A drawback for the producer is:', o: ['the wholesaler will not store any stock', 'two profit margins are taken, so less is left for the producer', 'the producer must deliver to every small shop itself', 'the producer cannot reach many retailers'], a: 1, e: 'Each intermediary takes a margin, and the producer loses control over how the product is priced and displayed — but the wholesaler does reach many small retailers and holds stock.' },
{ id: 'q312', u: 3, tp: '3.3', q: 'Free samples, loyalty cards and point-of-sale displays are examples of:', o: ['above-the-line promotion', 'below-the-line promotion', 'informative advertising', 'public relations only'], a: 1, e: 'Below-the-line promotion is controlled directly by the business rather than being bought through independent media.' },
{ id: 'q313', u: 3, tp: '3.3', q: 'A luxury watch brand sells through discount supermarkets at a low price. The main problem is that:', o: ['the marketing mix is inconsistent and the brand image is damaged', 'distribution costs will rise', 'market research will be impossible', 'the product life cycle will shorten automatically'], a: 0, e: 'The four Ps must support each other. A premium product needs a premium price, exclusive distribution and matching promotion.' },
{ id: 'q314', u: 3, tp: '3.3', q: 'Which is a problem of selling through e-commerce?', o: ['The business can only trade during shop hours', 'Customers cannot touch or try the product before buying', 'It is impossible to reach customers abroad', 'No customer data can be collected'], a: 1, e: 'Online selling gives global, 24-hour reach and rich customer data, but customers cannot physically examine goods, and delivery and returns are costly.' },
{ id: 'q315', u: 3, tp: '3.4', q: 'A business entering a foreign market decides to work with a local firm, sharing costs and profits on a specific project. This is:', o: ['a franchise', 'a joint venture', 'a takeover', 'exporting'], a: 1, e: 'A joint venture shares the cost, risk and expertise of a project without a full merger, and brings valuable local knowledge.' },
{ id: 'q316', u: 3, tp: '3.4', q: 'Which is a legal control on marketing?', o: ['A ban on charging different prices in different countries', 'A ban on misleading claims in advertisements', 'A requirement to advertise on television', 'A limit on the number of products a firm may sell'], a: 1, e: 'Consumer protection law prevents false or misleading advertising, incorrect descriptions and unsafe products.' },
{ id: 'q317', u: 3, tp: '3.4', q: 'The biggest cultural risk when marketing abroad is that:', o: ['exchange rates never change', 'brand names, colours or images may offend or mean something different', 'tariffs are always zero', 'market research is unnecessary'], a: 1, e: 'Names, colours, humour and imagery do not travel. Local research and adapting the mix reduce the risk.' },
{ id: 'q318', u: 3, tp: '3.3', q: 'A supermarket adds a 40% mark-up to the cost of each item. This pricing method is:', o: ['penetration pricing', 'cost-plus pricing', 'psychological pricing', 'price discrimination'], a: 1, e: 'Cost-plus pricing adds a fixed percentage to unit cost. It is simple but ignores what competitors charge and what customers will pay.' },
{ id: 'q319', u: 3, tp: '3.1', q: 'A key reason markets change over time is:', o: ['businesses stop advertising', 'consumer tastes and technology change', 'market research becomes illegal', 'prices are fixed by law'], a: 1, e: 'Changing tastes, technology, incomes, globalisation and environmental concerns all reshape markets, forcing businesses to adapt their mix.' },
{ id: 'q320', u: 3, tp: '3.3', q: 'Demand for a product is price inelastic. To increase total revenue the business should:', o: ['lower the price', 'raise the price', 'keep the price the same', 'stop selling the product'], a: 1, e: 'With inelastic demand, quantity falls only slightly when price rises, so total revenue increases.' },

{ id: 'q401', u: 4, tp: '4.1', q: 'A factory hires 10 more workers and total output rises, but output per worker is unchanged. This means:', o: ['production and productivity both rose', 'production rose but productivity did not', 'productivity rose but production did not', 'neither rose'], a: 1, e: 'Production is total output; productivity is output per worker. More workers can raise total output while efficiency stays the same.' },
{ id: 'q402', u: 4, tp: '4.1', q: 'Which production method is most suitable for a firm making one-off custom-designed wedding dresses?', o: ['Flow production', 'Batch production', 'Job production', 'Mass production'], a: 2, e: 'Job production makes one unique item at a time to the customer\'s exact requirements. Unit costs are high, but a high price can be charged.' },
{ id: 'q403', u: 4, tp: '4.1', q: 'The main risk of just-in-time inventory management is that:', o: ['storage costs become too high', 'a late delivery from a supplier stops production', 'too much cash is tied up in stock', 'stock becomes obsolete'], a: 1, e: 'JIT holds almost no buffer stock, so it depends completely on reliable suppliers. The other three are problems of holding high stock levels.' },
{ id: 'q404', u: 4, tp: '4.1', q: 'Kaizen means:', o: ['producing in large batches', 'continuous improvement through employee suggestions', 'inspecting products at the end of the line', 'buying materials in bulk'], a: 1, e: 'Kaizen is a lean production method in which all employees regularly suggest small improvements.' },
{ id: 'q405', u: 4, tp: '4.2', q: 'Which of these is a fixed cost for a bakery?', o: ['Flour', 'Packaging', 'Rent on the shop', 'Electricity used by the ovens per loaf'], a: 2, e: 'Rent does not change with the number of loaves baked in the short run. Flour, packaging and per-unit power are variable.' },
{ id: 'q406', u: 4, tp: '4.2', q: 'Fixed costs are $9,000, the selling price is $15 and the variable cost per unit is $6. What is the break-even output?', o: ['600 units', '1,000 units', '1,500 units', '2,250 units'], a: 1, e: 'Contribution = $15 − $6 = $9. Break-even = 9,000 ÷ 9 = 1,000 units.' },
{ id: 'q407', u: 4, tp: '4.2', q: 'Using the same figures (fixed costs $9,000, price $15, variable cost $6), what is the profit at 1,400 units?', o: ['$3,600', '$4,200', '$9,000', '$12,600'], a: 0, e: 'Profit = (contribution × units) − fixed costs = (9 × 1,400) − 9,000 = 12,600 − 9,000 = $3,600.' },
{ id: 'q408', u: 4, tp: '4.2', q: 'A business breaks even at 800 units and currently sells 1,100. Its margin of safety is:', o: ['300 units', '800 units', '1,100 units', '1,900 units'], a: 0, e: 'Margin of safety = current output − break-even output = 1,100 − 800 = 300 units.' },
{ id: 'q409', u: 4, tp: '4.2', q: 'If fixed costs rise but price and variable costs stay the same, the break-even output will:', o: ['fall', 'rise', 'stay the same', 'become zero'], a: 1, e: 'More units are needed to cover the higher fixed costs, since contribution per unit has not changed.' },
{ id: 'q410', u: 4, tp: '4.2', q: 'Which is an example of a financial economy of scale?', o: ['Getting a discount for buying materials in bulk', 'Borrowing at a lower interest rate because the firm is large and low risk', 'Spreading advertising costs over more units', 'Employing a specialist marketing director'], a: 1, e: 'Financial economies come from banks lending to large, low-risk firms more cheaply. Bulk buying is purchasing, advertising is marketing, and specialists are managerial.' },
{ id: 'q411', u: 4, tp: '4.2', q: 'Which is a diseconomy of scale?', o: ['Bulk-buying discounts', 'Poor communication in a very large firm', 'Using specialist machinery fully', 'Spreading risk across several products'], a: 1, e: 'Diseconomies raise average costs: poor communication, poor coordination, low morale and slow decisions in an over-large business.' },
{ id: 'q412', u: 4, tp: '4.2', q: 'On a break-even chart, the total revenue line should start at:', o: ['the level of fixed costs', 'the origin (0,0)', 'the break-even point', 'the level of total costs'], a: 1, e: 'At zero output there is zero revenue, so the revenue line starts at the origin. The total cost line starts at the fixed cost level.' },
{ id: 'q413', u: 4, tp: '4.2', q: 'A key limitation of break-even analysis is that it assumes:', o: ['All output produced is sold and costs rise in a straight line', 'Everything is produced by machines', 'Fixed costs are always zero', 'Prices change every month'], a: 0, e: 'Break-even assumes all output is sold and that cost and revenue lines are straight, ignoring bulk discounts, economies of scale and unsold stock.' },
{ id: 'q414', u: 4, tp: '4.3', q: 'Quality assurance differs from quality control because it:', o: ['only checks the finished product', 'aims to prevent faults at every stage rather than find them at the end', 'is carried out by a separate inspection department only', 'requires no staff training'], a: 1, e: 'Quality assurance builds standards into every stage so faults are prevented. Quality control inspects at the end to find faults.' },
{ id: 'q415', u: 4, tp: '4.3', q: 'A drawback of introducing total quality management is that:', o: ['it increases the number of faulty products', 'it needs extensive training and total commitment from all staff', 'it removes the need for any quality standards', 'it always reduces the reputation of the business'], a: 1, e: 'TQM works only if every employee takes responsibility, which requires costly training and time before the benefits appear.' },
{ id: 'q416', u: 4, tp: '4.4', q: 'Which factor is most important when locating a food-processing factory that uses heavy, bulky raw materials?', o: ['Footfall', 'Nearness to the raw materials', 'Shop window display space', 'Customer parking'], a: 1, e: 'For bulk-reducing industries, transporting heavy raw materials is expensive, so locating near the source cuts costs.' },
{ id: 'q417', u: 4, tp: '4.4', q: 'The most important location factor for a new coffee shop is likely to be:', o: ['nearness to raw materials', 'availability of a large factory site', 'high footfall of passing customers', 'access to a deep-water port'], a: 2, e: 'Retail and service businesses depend on passing trade — the number of potential customers walking past.' },
{ id: 'q418', u: 4, tp: '4.4', q: 'Which is a problem of relocating a business?', o: ['Lower rent at the new site', 'Skilled staff may refuse to move', 'Government grants may be available', 'Room to expand'], a: 1, e: 'Relocation risks losing experienced staff and their knowledge, plus production stops during the move. The others are reasons *to* relocate.' },
{ id: 'q419', u: 4, tp: '4.4', q: 'A business locating production in another country mainly to get inside a trade bloc is trying to:', o: ['increase its labour costs', 'avoid tariffs and quotas', 'reduce its market size', 'avoid paying any tax anywhere'], a: 1, e: 'Producing inside the market avoids import tariffs and quotas on finished goods, as well as cutting transport costs.' },
{ id: 'q420', u: 4, tp: '4.1', q: 'Which is an advantage of flow production?', o: ['Products can be customised for each buyer', 'Very low unit costs at high volumes', 'Low set-up costs', 'Highly varied and motivating work'], a: 1, e: 'Flow production achieves large economies of scale and very low costs per unit, but set-up costs are huge, it is inflexible and the work is repetitive.' },

{ id: 'q501', u: 5, tp: '5.1', q: 'Which is an internal source of finance?', o: ['Bank loan', 'Retained profit', 'Share issue', 'Debenture'], a: 1, e: 'Retained profit comes from within the business. Loans, share issues and debentures all come from outside it.' },

{ id: 'q503', u: 5, tp: '5.1', q: 'The main disadvantage of raising finance through a share issue is:', o: ['it must be repaid within a year', 'the interest rate is very high', 'ownership is diluted and control may be lost', 'only sole traders can use it'], a: 2, e: 'Shares never have to be repaid and pay no interest, but each new share dilutes the original owners\' control.' },
{ id: 'q504', u: 5, tp: '5.1', q: 'A business uses an asset immediately and pays in instalments, owning it after the final payment. This is:', o: ['leasing', 'hire purchase', 'debt factoring', 'trade credit'], a: 1, e: 'With hire purchase ownership transfers at the last instalment. With leasing the business never owns the asset.' },

{ id: 'q506', u: 5, tp: '5.2', q: 'A profitable business can still fail because:', o: ['profit is always taxed at 100%', 'it may run out of cash to pay its bills on time', 'profit and cash are the same thing', 'revenue is always lower than profit'], a: 1, e: 'Profit is not cash. If customers pay on 90 days\' credit while wages are due weekly, a profitable firm can become insolvent.' },

{ id: 'q509', u: 5, tp: '5.3', q: 'Revenue is $400,000 and cost of sales is $260,000. What is the gross profit?', o: ['$140,000', '$260,000', '$400,000', '$660,000'], a: 0, e: 'Gross profit = revenue − cost of sales = 400,000 − 260,000 = $140,000.' },

{ id: 'q513', u: 5, tp: '5.4', q: 'A bank overdraft appears in a statement of financial position as a:', o: ['non-current asset', 'current asset', 'current liability', 'non-current liability'], a: 2, e: 'An overdraft is repayable on demand, so it is a current liability.' },

{ id: 'q515', u: 5, tp: '5.5', q: 'Revenue $600,000, gross profit $240,000. What is the gross profit margin?', o: ['24%', '40%', '60%', '250%'], a: 1, e: 'Gross profit margin = (240,000 ÷ 600,000) × 100 = 40%.' },

{ id: 'q517', u: 5, tp: '5.5', q: 'Current assets are $180,000 (including $80,000 inventory) and current liabilities are $100,000. What is the acid test ratio?', o: ['0.8 : 1', '1 : 1', '1.8 : 1', '2.6 : 1'], a: 1, e: 'Acid test = (180,000 − 80,000) ÷ 100,000 = 100,000 ÷ 100,000 = 1 : 1.' },
{ id: 'q518', u: 5, tp: '5.5', q: 'A business has a high gross profit margin but a low profit margin. The most likely explanation is that:', o: ['its selling price is too low', 'its overheads and expenses are too high', 'it buys materials too cheaply', 'it has no customers'], a: 1, e: 'The gap between the two margins is caused by expenses. A healthy gross margin with a poor net margin points straight to overheads.' },

    'Improve the product — better design, personalisation, a lining (1) — justifies a higher price (1)',

},
{
  id: 'w103', u: 1, tp: '1.3', marks: 6, cmd: 'Analyse',

    'Economies of scale (1) — bulk buying of coffee beans and cups for 17 shops (1) — lowers cost per unit and raises the profit margin (1)',
    'Access to a new geographical market (1) — spreads risk across two cities (1) — a downturn in one city no longer threatens the whole business (1)',

{
  id: 'w202', u: 2, tp: '2.1', marks: 6, cmd: 'Recommend',
  stem: 'A call centre has labour turnover of 38% and staff describe the work as repetitive. The manager wants to pay a bonus for the number of calls handled per hour.',
  q: 'Recommend whether a bonus based on calls handled is the best way to reduce labour turnover. Justify your answer. (6)',
  scheme: [
    'For: a financial incentive may raise effort and pay, addressing Taylor\'s view that money motivates (1) — higher pay may persuade some staff to stay (1)',
    'Against: Herzberg — pay is a hygiene factor, it removes dissatisfaction but does not motivate (1) — so it will not fix the underlying boredom (1)',
    'Against: rewarding call volume encourages rushing, so call quality and customer satisfaction fall (1)',
    'Alternative: job rotation, job enrichment, teamworking or empowerment tackle the repetitiveness directly (1)',
    'Alternative: training and a clear promotion path meet esteem and self-actualisation needs (Maslow) (1)',
    'Judgement: a supported recommendation naming a better option and saying what it depends on (up to 2)'
  ],
  model: 'A bonus would raise pay, and Taylor argued that money is the main motivator, so some staff may stay for the higher earnings.\n\nHowever, the stated problem is that the work is *repetitive*, not that it is badly paid. Herzberg classed pay as a hygiene factor: raising it stops people being dissatisfied but does not create satisfaction, so the boredom driving the 38% turnover would remain. Worse, paying per call handled encourages staff to rush, so call quality and customer satisfaction would probably fall.\n\nI would therefore not recommend the bonus as the main solution. Job rotation between different call types, combined with empowerment to resolve customer problems without escalating them, tackles the repetitiveness directly and gives staff the responsibility Herzberg identified as a true motivator. A bonus could still be used, but tied to customer satisfaction rather than call volume. This depends on whether the call centre can afford the training time that rotation and empowerment require.',
  watch: 'Notice the question gives you the cause (repetitive work). Your recommendation must address *that* cause, not a generic one.'
},

{

{

/* ================= UNIT 3 ================= */
{
  id: 'w301', u: 3, tp: '3.2', marks: 6, cmd: 'Recommend',
  stem: 'Amara is opening a small vegan bakery in a town where none exists. She has a budget of $500 for market research.',

    'Primary: a questionnaire or focus group answers *her* questions about *her* town (1) — she can test whether local people would actually buy vegan baked goods and at what price (1)',
    'Primary drawback: costs money and takes time, and $500 limits the sample size, so results may be unreliable (1)',

  watch: 'The best answers here use *both* in sequence and explain the order. That is a genuine evaluation point.'
},

{
  id: 'w303', u: 3, tp: '3.3', marks: 6, cmd: 'Recommend',
  stem: 'A technology company is launching the world\'s first folding e-reader. No competitor has anything similar, but rivals are expected to copy it within 18 months. Development cost $4 million.',
  q: 'Recommend a pricing method for the launch. Justify your answer. (6)',
  scheme: [
    'Price skimming: set a high launch price (1) — no substitutes exist so demand is price inelastic among early adopters (1) — recovers the $4m development cost quickly before rivals arrive (1)',
    'A high price also signals quality and innovation, supporting the brand (1)',
    'Against skimming: sales volume is low, and early buyers feel cheated when the price falls (1)',
    'Penetration pricing rejected: with no competitors there is no need to buy market share cheaply, and it would not recover $4m (1)',
    'Cost-plus rejected: ignores what customers will pay for a unique product (1)',
    'Judgement: named method, justified from the case, with a condition (up to 2)'
  ],
  model: 'I would recommend price skimming. Because no competitor has a folding e-reader, there are no substitutes, so demand among early adopters — the people who must have the newest technology — will be price inelastic. A high launch price therefore reduces quantity only slightly while generating a large margin on each unit, which is essential given the $4 million development cost that must be recovered.\n\nSkimming also fits the 18-month window. The company can charge a premium while it has the market to itself, then cut the price as rivals appear, keeping sales going as the product matures.\n\nPenetration pricing would be wrong here: its purpose is to win share from competitors, and there are none to win it from. It would also make recovering $4 million far slower.\n\nThe risk is that early buyers resent the later price cuts, and that sales volume is low at first. This depends on how quickly rivals actually arrive — if a competitor launches in six months rather than eighteen, the skimming window closes early and the company will not recover its costs.',
  watch: 'Name the method explicitly and reject at least one alternative using a fact from the case.'
},

},
{
  id: 'w305', u: 3, tp: '3.1', marks: 6, cmd: 'Analyse',
  stem: 'A small firm makes climbing equipment for left-handed climbers, a segment ignored by the large manufacturers.',

    'Marketing can be tightly targeted (1) — advertise in climbing magazines and forums rather than to the mass market (1) — far less wasted spending, which matters for a small firm (1)',

/* ================= UNIT 4 ================= */
{
  id: 'w401', u: 4, tp: '4.2', marks: 4, cmd: 'Calculate',
  stem: 'A furniture workshop has fixed costs of $18,000 per year. Each table sells for $260 and costs $110 in materials and direct labour.',
  q: 'Calculate (a) the contribution per table and (b) the break-even output. Show your working. (4)',
  scheme: [
    '(a) Method: selling price − variable cost = 260 − 110 (1)',
    '(a) Answer: $150 (1)',
    '(b) Method: fixed costs ÷ contribution = 18,000 ÷ 150 (1)',
    '(b) Answer: 120 tables (1)'
  ],
  model: '(a) Contribution per unit = selling price − variable cost per unit\n= $260 − $110 = **$150**\n\n(b) Break-even output = fixed costs ÷ contribution per unit\n= $18,000 ÷ $150 = **120 tables**',
  watch: 'Divide by the **contribution**, not by the selling price. That single error is the most common in the whole syllabus.'
},
{
  id: 'w402', u: 4, tp: '4.2', marks: 6, cmd: 'Analyse',
  stem: 'Using the workshop above (fixed costs $18,000, price $260, variable cost $110), the owner currently sells 200 tables a year. A landlord increase will raise fixed costs to $24,000.',
  q: 'Analyse the effect of the rent increase on the workshop. (6)',
  scheme: [
    'New break-even = 24,000 ÷ 150 = 160 tables (1) — up from 120 (1)',
    'Margin of safety falls from 80 tables (200 − 120) to 40 tables (200 − 160) (1)',
    'The workshop is now far more vulnerable — sales can only fall 20% before a loss is made, instead of 40% (1)',
    'Profit falls from (150 × 200) − 18,000 = $12,000 to (150 × 200) − 24,000 = $6,000 (1)',
    'Consequence / response: must raise price, cut variable costs, sell more, or relocate (1)'
  ],
  model: 'The break-even output rises from 120 tables ($18,000 ÷ $150) to 160 tables ($24,000 ÷ $150), because contribution per table is unchanged at $150 but there are now more fixed costs to cover.\n\nSince the workshop sells 200 tables, its margin of safety falls from 80 tables to just 40. In percentage terms sales could previously fall 40% before a loss was made; now they can only fall 20%. The business is therefore considerably more vulnerable to a downturn.\n\nProfit halves, from (150 × 200) − 18,000 = $12,000 to (150 × 200) − 24,000 = $6,000. To restore the old profit the owner would need to sell 280 tables, raise the price, or find cheaper materials — otherwise relocating to cheaper premises may be the better option.',
  watch: 'Calculate *both* the old and new figures. The analysis marks come from the comparison, not from one number.'
},
{
  id: 'w403', u: 4, tp: '4.1', marks: 6, cmd: 'Recommend',
  stem: 'A bakery currently uses batch production to make bread. It has won a contract to supply 8,000 identical loaves a day to a supermarket chain. It has limited capital.',
  q: 'Recommend whether the bakery should switch to flow production. Justify your answer. (6)',
  scheme: [
    'For: 8,000 identical loaves daily is exactly what flow production suits (1) — large economies of scale cut the cost per loaf sharply (1) — essential on a supermarket contract with thin margins (1)',
    'For: consistent quality and no downtime resetting machines between batches (1)',
    'Against: very high set-up cost, and the bakery has limited capital (1)',
    'Against: flow production is inflexible — the bakery could no longer easily make its other varieties (1)',
    'Against: total dependence on one customer; if the contract ends, the specialised line is worthless (1)',
    'Judgement: supported decision with a condition (up to 2)'
  ],
  model: 'Flow production suits this contract well. 8,000 identical loaves a day is exactly the high-volume, standardised output flow production is designed for, and the economies of scale would cut the cost per loaf substantially — important because supermarket contracts usually carry thin margins. Quality would also be more consistent, and no time would be lost resetting machines between batches.\n\nHowever, flow production requires a very large capital investment, and the case states the bakery\'s capital is limited. It is also highly inflexible: a dedicated bread line could not easily produce the bakery\'s other varieties, so it would be putting almost everything into one customer. If the supermarket did not renew the contract, the bakery would be left with expensive equipment it cannot use.\n\nI would recommend switching only if the bakery can secure a long contract — three years or more — and can finance the equipment without over-borrowing. Otherwise it should expand its existing batch capacity, which is cheaper and keeps its flexibility, even though unit costs stay higher.',
  watch: 'The case gives you two constraints — limited capital and a single customer. A top answer uses both.'
},
{
  id: 'w404', u: 4, tp: '4.3', marks: 4, cmd: 'Explain',
  q: 'Explain the difference between **quality control** and **quality assurance**. (4)',
  scheme: [
    'Quality control: inspecting/checking products at the end of production (1) — to find and remove faults before they reach the customer (1)',

  model: 'Quality control means inspecting the finished product at the end of the production process, using inspectors to find faulty items and remove them before they reach the customer. The fault has already been made, so the materials and labour are wasted.\n\nQuality assurance means agreeing quality standards at every stage of the process and making every employee responsible for checking their own work. Faults are therefore prevented rather than detected, which cuts waste and reworking, though it requires training all staff.',
