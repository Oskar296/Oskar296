/* ================= UNIT 5 ================= */
{
  id: 'w501', u: 5, tp: '5.1', marks: 6, cmd: 'Recommend',
  stem: 'A private limited company that has traded profitably for six years needs $200,000 to buy a second delivery lorry and expand its warehouse. It already has a bank loan and the owners want to keep control within the family.',
  q: 'Recommend the most suitable source of finance. Justify your answer. (6)',
  scheme: [
    'Retained profit: the business is profitable (1) — no interest, no repayment, no loss of control (1) — but six years of profit may not cover $200,000 and it reduces the owners\' income (1)',
    'Bank loan: matches the long life of the assets (1) — but the firm already has borrowing, so more debt raises interest costs and risk, and the bank may refuse (1)',
    'Share issue rejected: dilutes ownership, and the owners explicitly want to keep control in the family (1)',
    'Leasing or hire purchase for the lorry: no large initial outlay, spreads the cost (1) — but costs more in total (1)',
    'Judgement: named source, justified from the case, with a condition (up to 2)'
  ],
  model: 'A share issue should be rejected immediately: the case states the owners want to keep control within the family, and selling shares to outsiders would dilute exactly that.\n\nRetained profit is attractive because the company has traded profitably for six years and it carries no interest, no repayment schedule and no loss of control. However, $200,000 is a large sum and six years of retained profit may not cover it, particularly if the owners have been drawing dividends.\n\nI would recommend a combination: lease or hire-purchase the lorry, and fund the warehouse extension from retained profit. Leasing avoids a large initial outlay and spreads the cost over the lorry\'s working life, and it does not add to the existing bank borrowing, which is important since further debt would raise interest costs and the bank may be reluctant given the loan already outstanding. This depends on how much retained profit has actually accumulated — if it is well below the warehouse cost, a second loan may be unavoidable.',
  watch: 'The case tells you two things — existing borrowing and a desire to keep control. Both must appear in a top answer.'
},
{
  id: 'w502', u: 5, tp: '5.2', marks: 6, cmd: 'Explain',
  stem: 'A furniture retailer reports a profit of $90,000 for the year, but cannot pay its suppliers this month.',
  q: 'Explain how a business can be profitable and still be unable to pay its bills. (6)',
  scheme: [
    'Profit is not cash (1) — revenue is recorded when the sale is made, not when the money arrives (1)',
    'Sales made on credit (1) — customers may take 60–90 days to pay, so the profit exists on paper but the cash has not arrived (1)',
    'Meanwhile outflows are immediate (1) — wages weekly, suppliers on 30 days, rent monthly (1)',
    'Cash may have been spent on non-current assets or inventory (1) — which does not reduce profit but does drain cash (1)',
    'Overtrading — expanding too fast without enough working capital (1)',
    'Consequence: suppliers stop delivering, the business may be forced to close despite being profitable (1)'
  ],
  model: 'Profit and cash are not the same thing. Profit is calculated when a sale is *made*, whereas cash only arrives when the customer actually *pays*. A furniture retailer selling on credit may record a $90,000 profit for sofas delivered in the year while much of that money is still owed by customers on 60- or 90-day terms.\n\nAt the same time the retailer\'s outflows are immediate: wages must be paid weekly, rent monthly and suppliers within 30 days. So money leaves faster than it comes in.\n\nCash may also have been tied up in ways that do not reduce profit — buying a delivery van, or building up showroom inventory. Both drain the bank account without appearing as costs in the income statement.\n\nThe consequence is serious: if suppliers are not paid they will stop delivering, and a profitable business can be forced to close. This is why cash-flow forecasting matters as much as profit.',
  watch: 'This is one of the most frequently examined ideas in Unit 5. Learn the "profit is recorded at the sale, cash arrives later" line.'
},

en before the board bets $1.2 million on it.'

e elastic enough to convert an 18% price advantage into real extra bookings. If inbound volumes have not risen within a season, the board should switch to the cost-cutting route.'

  drills: [

        '**Against:** the factory\'s problem includes **quality** — piece rate encourages speed over care, so faulty garments would probably increase, not fall.',
        '**Against:** Herzberg argues pay is a hygiene factor: it stops dissatisfaction but does not motivate. High turnover suggests boredom and lack of recognition, which pay will not fix.',
        '**Alternative:** job rotation, cell production and teamworking address the boredom directly; training addresses the quality problem.',

    },

      u: 3, tp: '3.3', marks: 12,
      q: 'A small independent coffee shop faces a new national chain opening opposite. Recommend changes to its marketing mix.',
      plan: [
        '**Price:** it cannot win a price war against a chain with economies of scale — competing on price would destroy its margin. Better to hold price and add a loyalty card.',
        '**Product:** differentiate on what the chain cannot copy — locally roasted beans, homemade food, personal service, a distinctive atmosphere. This is niche marketing.',
        '**Promotion:** cheap, targeted local social media and community events, not expensive advertising the shop cannot afford.',
        '**Place:** extend to delivery apps and pre-order collection to defend convenience.',

      plan: [

        '**Judgement:** delay the non-urgent capital spending and negotiate longer supplier credit first, because these cost nothing; arrange an overdraft as a back-up for the remaining gap. Do not take a long-term loan for a short-term timing problem. It depends on whether suppliers will agree, which depends on the business\'s payment record.'

      plan: [

        '**Net effect:** because exports (70% of output) outweigh imported inputs (40% of materials), the gain is likely to be larger than the loss — but only if demand abroad is price elastic enough to convert cheaper prices into extra volume.',
        '**Judgement:** overall positive in the short run. It depends on the elasticity of export demand, whether the depreciation lasts, and whether local suppliers could replace some imported materials. Recommend sourcing more locally to reduce exposure if the weakness persists.'
      ]
    }
  ]
};

<script>
/* ===== js/render.js ===== */
/* render.js — small helpers to turn note data into HTML */

var R = (function () {

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* Inline markup allowed inside note text:
       **bold**  *italic*  `code`  [[3.3]] -> link to topic 3.3            */
  function inline(s) {
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/\[\[([\d.]+)\]\]/g, function (m, id) {
      var t = BS.topic(id);
      return '<a href="#/notes/' + id + '">' + id + (t ? ' ' + esc(t.title) : '') + '</a>';
    });
    return out;
  }

  function list(items, ordered) {
    var tag = ordered ? 'ol' : 'ul';
    return '<' + tag + '>' + items.map(function (i) {
      return '<li>' + inline(i) + '</li>';
    }).join('') + '</' + tag + '>';
  }

  function table(t) {
    var h = '<div class="twrap"><table><thead><tr>' +
      t.head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      t.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
      }).join('') +
      '</tbody></table></div>';
    return h;
  }

  var LABELS = { tip: 'Exam tip', warn: 'Common mistake', eg: 'Example', note: 'Note' };

  function callout(c) {
    var kind = c.k || 'note';
    var cls = kind === 'note' ? '' : ' ' + kind;
    var body = Array.isArray(c.b) ? c.b.map(function (p) { return '<p>' + inline(p) + '</p>'; }).join('')
      : '<p>' + inline(c.b) + '</p>';
    return '<div class="callout' + cls + '"><span class="clabel">' + esc(c.t || LABELS[kind] || 'Note') + '</span>' + body + '</div>';
  }

  /* A body is an array of: string | {list} | {num} | {table} | {callout} |
     {formula} | {h3} | {defs:[[term,def],...]}                            */
  function body(blocks) {
    if (!blocks) return '';
    return blocks.map(function (b) {
      if (typeof b === 'string') return '<p>' + inline(b) + '</p>';
      if (b.h3) return '<h3>' + inline(b.h3) + '</h3>';
      if (b.list) return list(b.list, false);
      if (b.num) return list(b.num, true);
      if (b.table) return table(b.table);
      if (b.callout) return callout(b.callout);
      if (b.formula) return '<div class="formula">' + esc(b.formula) + '</div>';
      if (b.diagram) return (typeof DIA !== 'undefined') ? DIA.render(b.diagram) : '';
      if (b.defs) {
        return '<div class="twrap"><table><tbody>' + b.defs.map(function (d) {
          return '<tr><th style="width:32%">' + inline(d[0]) + '</th><td>' + inline(d[1]) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      }
      return '';
    }).join('');
  }

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function money(n, cur) {
    var neg = n < 0;
    var s = (Math.round(Math.abs(n) * 100) / 100).toFixed(2).replace(/\.00$/, '');
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + (cur || '$') + parts.join('.');
  }

  function pct(n) { return (Math.round(n * 10) / 10) + '%'; }

  return {
    esc: esc, inline: inline, body: body, table: table, list: list,
    callout: callout, shuffle: shuffle, money: money, pct: pct
  };
})();
</script>
<script>
/* ===== js/views-notes.js ===== */
/* views-notes.js — syllabus index, topic pages, glossary */

var V = window.V || {};

V.notes = function () {
  var s = BS.store;
  var h = '<div class="eyebrow">Syllabus</div><h1>Revision notes</h1>' +
    '<p class="lead">All six units of the Cambridge IGCSE Business Studies 0450 syllabus. ' +
    'Rate your confidence at the bottom of each topic and it will show up here and on the dashboard.</p>';

  BS.units.forEach(function (u) {
    h += '<h2 id="u' + u.n + '">' + u.n + '. ' + R.esc(u.title) + '</h2>';
    BS.unitTopics(u.n).forEach(function (t) {
      var c = s.conf(t.id);
      h += '<a class="topic-row" href="#/notes/' + t.id + '">' +
        '<span class="dot' + (c ? ' c' + c : '') + '" title="Confidence"></span>' +
        '<span class="n">' + t.id + '</span>' +
        '<span class="t">' + R.esc(t.title) + '</span>' +
        (s.isRead(t.id) ? '<span class="pill g">Read</span>' : '') +
        '</a>';
    });
  });
  return h;
};

V.topic = function (id) {
  var t = BS.topic(id);
  if (!t) return '<h1>Topic not found</h1><p><a href="#/notes">Back to the syllabus</a></p>';

  var s = BS.store;
  s.markRead(t.id);
  s.tick(1);

  var unit = BS.units.filter(function (u) { return u.n === t.unit; })[0];
  var all = BS.notes;
  var i = all.indexOf(t);
  var prev = all[i - 1], next = all[i + 1];

  var h = '';
  h += '<div class="crumb"><a href="#/notes">Notes</a> › Unit ' + t.unit + ' · ' + R.esc(unit.title) + '</div>';
  h += '<div class="eyebrow">' + t.id + '</div>';
  h += '<h1>' + R.esc(t.title) + '</h1>';

  h += '<div class="card tight"><div class="k" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:6px">What the syllabus says you must know</div>';
  h += '<ul style="margin-bottom:0">' + t.syllabus.map(function (p) { return '<li>' + R.inline(p) + '</li>'; }).join('') + '</ul></div>';

  t.sections.forEach(function (sec) {
    h += '<h2>' + R.inline(sec.h) + '</h2>';
    h += R.body(sec.body);
  });

  /* key terms for this topic */
  if (t.terms && t.terms.length) {
    var terms = t.terms.map(function (id2) { return BS.term(id2); }).filter(Boolean);
    if (terms.length) {
      h += '<h2>Key terms in this topic</h2><div class="twrap"><table><tbody>';
      terms.forEach(function (g) {
        h += '<tr><th style="width:30%">' + R.esc(g.t) + '</th><td>' + R.esc(g.d) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      h += '<div class="btnrow"><a class="btn sm" href="#/cards?topic=' + t.id + '">Drill these as flashcards</a>' +
           '<a class="btn sm" href="#/quiz?topic=' + t.id + '">Quiz me on ' + t.id + '</a>';
      var nw = BS.written.filter(function (w) { return w.tp === t.id; }).length;
      if (nw) h += '<a class="btn sm primary" href="#/written?topic=' + t.id + '">Write ' + nw +
        ' exam answer' + (nw === 1 ? '' : 's') + '</a>';
      h += '</div>';
    }
  }

  if (t.tips && t.tips.length) {
    h += '<h2>Exam tips</h2><ul>' + t.tips.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ul>';
  }
  if (t.traps && t.traps.length) {
    h += '<div class="callout warn"><span class="clabel">Marks most often lost here</span><ul style="margin-bottom:0">' +
      t.traps.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ul></div>';
  }

  /* confidence */
  var c = s.conf(t.id);
  h += '<hr/><div class="card tight"><label class="f">How confident are you with ' + t.id + '?</label>' +
    '<div class="conf" data-conf="' + t.id + '">' +
    '<button data-c="1" aria-pressed="' + (c === 1) + '">Shaky</button>' +
    '<button data-c="2" aria-pressed="' + (c === 2) + '">Getting there</button>' +
    '<button data-c="3" aria-pressed="' + (c === 3) + '">Confident</button>' +
    '</div></div>';

  h += '<div class="pagenav">';
  h += prev ? '<a href="#/notes/' + prev.id + '"><div class="lbl">← Previous</div><div class="ttl">' + prev.id + ' ' + R.esc(prev.title) + '</div></a>' : '<span></span>';
  h += next ? '<a class="r" href="#/notes/' + next.id + '"><div class="lbl">Next →</div><div class="ttl">' + next.id + ' ' + R.esc(next.title) + '</div></a>' : '<span></span>';
  h += '</div>';

  return h;
};

V.afterTopic = function (root) {
  var box = root.querySelector('[data-conf]');
  if (!box) return;
  var id = box.getAttribute('data-conf');
  box.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-c]');
    if (!b) return;
    var v = parseInt(b.getAttribute('data-c'), 10);
    var cur = BS.store.conf(id);
    BS.store.conf(id, cur === v ? 0 : v);
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(parseInt(x.getAttribute('data-c'), 10) === BS.store.conf(id)));
    });
  });
};

/* ---------------- glossary ---------------- */

V.glossary = function () {
  var h = '<div class="eyebrow">Reference</div><h1>Glossary</h1>' +
    '<p class="lead">' + BS.glossary.length + ' key terms. Definitions are written the way an examiner wants to read them — ' +
    'short, precise, and using the exact wording the mark scheme looks for.</p>';

  h += '<div class="field"><input id="glosSearch" type="search" placeholder="Search terms and definitions…" autocomplete="off"/></div>';
  h += '<div class="chips" id="glosChips"><button class="chip" data-u="0" aria-pressed="true">All units</button>';
  BS.units.forEach(function (u) {
    h += '<button class="chip" data-u="' + u.n + '" aria-pressed="false">Unit ' + u.n + '</button>';
  });
  h += '</div>';
  h += '<div id="glosList"></div>';
  return h;
};

V.afterGlossary = function (root) {
  var input = root.querySelector('#glosSearch');
  var chips = root.querySelector('#glosChips');
  var list = root.querySelector('#glosList');
  var unit = 0;

  function draw() {
    var q = (input.value || '').toLowerCase().trim();
    var items = BS.glossary.filter(function (g) {
      if (unit && g.u !== unit) return false;
      if (!q) return true;
      return (g.t + ' ' + g.d).toLowerCase().indexOf(q) !== -1;
    });
    if (!items.length) { list.innerHTML = '<div class="empty">No terms match that search.</div>'; return; }

    var byUnit = {};
    items.forEach(function (g) { (byUnit[g.u] = byUnit[g.u] || []).push(g); });

    var h = '';
    BS.units.forEach(function (u) {
      if (!byUnit[u.n]) return;
      h += '<h2>' + u.n + '. ' + R.esc(u.title) + '</h2><div class="twrap"><table><tbody>';
      byUnit[u.n].forEach(function (g) {
        h += '<tr><th style="width:30%">' + R.esc(g.t) +
          '<div style="font-weight:400"><a class="small" href="#/notes/' + g.tp + '">' + g.tp + '</a></div></th>' +
          '<td>' + R.esc(g.d) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
    list.innerHTML = h;
  }

  input.addEventListener('input', draw);
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    unit = parseInt(b.getAttribute('data-u'), 10);
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    draw();
  });
  draw();
};

window.V = V;
</script>
<script>
/* ===== js/views-cards.js ===== */
/* views-cards.js — flashcards with Leitner spaced repetition */

var V = window.V || {};

V.cards = function (params) {
  var h = '<div class="eyebrow">Active recall</div><h1>Flashcards</h1>';
  h += '<p class="lead">Each card you get right moves up a box and comes back later; each card you get wrong drops to box 1 and comes back tomorrow. ' +
    'Try to say the definition out loud <em>before</em> you flip.</p>';
  h += '<div id="deckSetup"></div><div id="deckArea"></div>';
  V._cardParams = params || {};
  return h;
};

V.afterCards = function (root) {
  var s = BS.store;
  var setup = root.querySelector('#deckSetup');
  var area = root.querySelector('#deckArea');
  var state = { unit: 0, dueOnly: true, topic: V._cardParams.topic || null, queue: [], i: 0, flipped: false, right: 0, done: 0 };

  function pool() {
    return BS.glossary.filter(function (g) {
      if (state.topic) {
        var t = BS.topic(state.topic);
        return t && t.terms && t.terms.indexOf(g.id) !== -1;
      }
      return !state.unit || g.u === state.unit;
    });
  }

  function drawSetup() {
    var p = pool();
    var dueIds = s.dueCards(p.map(function (g) { return g.id; }));
    var h = '';

    if (state.topic) {
      var tp = BS.topic(state.topic);
      h += '<div class="callout"><span class="clabel">Filtered</span><p>Only the ' + p.length + ' key terms from <a href="#/notes/' + state.topic + '">' +
        state.topic + ' ' + R.esc(tp ? tp.title : '') + '</a>. <a href="#/cards">Use the whole deck instead</a>.</p></div>';
    } else {
      h += '<div class="chips" id="cUnits"><button class="chip" data-u="0" aria-pressed="' + (state.unit === 0) + '">All units</button>';
      BS.units.forEach(function (u) {
        h += '<button class="chip" data-u="' + u.n + '" aria-pressed="' + (state.unit === u.n) + '">Unit ' + u.n + '</button>';
      });
      h += '</div>';
    }

    h += '<div class="chips" id="cMode">' +
      '<button class="chip" data-m="due" aria-pressed="' + (state.dueOnly) + '">Due today (' + dueIds.length + ')</button>' +
      '<button class="chip" data-m="all" aria-pressed="' + (!state.dueOnly) + '">All cards (' + p.length + ')</button>' +
      '</div>';

    /* box breakdown */
    var boxes = [0, 0, 0, 0, 0, 0];
    p.forEach(function (g) { boxes[s.card(g.id).box]++; });
    h += '<div class="card tight"><span class="small">Box breakdown: </span>' +
      '<span class="pill">' + boxes[0] + ' new</span> ' +
      '<span class="pill b">' + boxes[1] + ' box 1</span> ' +
      '<span class="pill w">' + (boxes[2] + boxes[3]) + ' box 2–3</span> ' +
      '<span class="pill g">' + (boxes[4] + boxes[5]) + ' box 4–5 (mastered)</span></div>';

    h += '<div class="btnrow"><button class="btn primary" id="startDeck">Start</button></div>';
    setup.innerHTML = h;

    var cu = setup.querySelector('#cUnits');
    if (cu) cu.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.unit = parseInt(b.getAttribute('data-u'), 10);
      drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#cMode').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.dueOnly = b.getAttribute('data-m') === 'due';
      drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#startDeck').addEventListener('click', start);
  }

  function start() {
    var p = pool();
    var items = state.dueOnly
      ? p.filter(function (g) { return s.dueCards([g.id]).length; })
      : p.slice();
    if (!items.length) {
      area.innerHTML = '<div class="card center"><h2 class="mt0">Nothing due 🎉</h2>' +
        '<p>Every card in this selection has been reviewed recently. Switch to <strong>All cards</strong> to keep practising, or come back tomorrow.</p></div>';
      return;
    }
    state.queue = R.shuffle(items);
    state.i = 0; state.flipped = false; state.right = 0; state.done = 0;
    setup.style.display = 'none';
    drawCard();
  }

  function drawCard() {
    if (state.i >= state.queue.length) return finish();
    var g = state.queue[state.i];
    var c = s.card(g.id);
    var h = '';
    h += '<div class="card tight" style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
      '<span class="small">Card ' + (state.i + 1) + ' of ' + state.queue.length + '</span>' +
      '<span class="pill a">Box ' + (c.box || 0) + '</span>' +
      '<a class="small" href="#/notes/' + g.tp + '">' + g.tp + '</a></div>';
    h += '<div class="bar" style="margin-bottom:14px"><i style="width:' + Math.round(state.i / state.queue.length * 100) + '%"></i></div>';
    h += '<div class="card deck" id="theCard">';
    if (!state.flipped) {
      h += '<div class="side">Term</div><div class="front">' + R.esc(g.t) + '</div>' +
        '<div class="hintline">Say the definition, then tap the card (or press Space) to check</div>';
    } else {
      h += '<div class="side">Definition</div><div class="front" style="font-size:19px">' + R.esc(g.t) + '</div>' +
        '<div class="back">' + R.esc(g.d) + '</div>';
    }
    h += '</div>';
    if (state.flipped) {
      h += '<div class="btnrow"><button class="btn bad" id="gWrong">Not yet (1)</button>' +
        '<button class="btn good" id="gRight">Got it (2)</button></div>';
    }
    area.innerHTML = h;

    area.querySelector('#theCard').addEventListener('click', function () {
      if (!state.flipped) { state.flipped = true; drawCard(); }
    });
    if (state.flipped) {
      area.querySelector('#gWrong').addEventListener('click', function () { grade(false); });
      area.querySelector('#gRight').addEventListener('click', function () { grade(true); });
    }
  }

  function grade(ok) {
    var g = state.queue[state.i];
    s.gradeCard(g.id, ok);
    s.tick(1);
    if (ok) state.right++;
    state.done++;
    state.i++; state.flipped = false;
    drawCard();
  }

  function finish() {
    s.logSession('cards', state.right, state.done);
    var pctv = state.done ? Math.round(state.right / state.done * 100) : 0;
    area.innerHTML = '<div class="card center"><h2 class="mt0">Session complete</h2>' +
      '<p style="font-size:34px;font-weight:750;margin:6px 0">' + state.right + ' / ' + state.done + '</p>' +
      '<p class="small">' + pctv + '% correct. Cards you missed will come back tomorrow.</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn primary" id="again">Another round</button>' +
      '<a class="btn" href="#/quiz">Try a quiz</a></div></div>';
    area.querySelector('#again').addEventListener('click', function () {
      setup.style.display = ''; drawSetup(); area.innerHTML = '';
    });
  }

  /* keyboard */
  V._cardKey = function (e) {
    if (!state.queue.length || state.i >= state.queue.length) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!state.flipped) { state.flipped = true; drawCard(); }
    } else if (state.flipped && (e.key === '1')) grade(false);
    else if (state.flipped && (e.key === '2')) grade(true);
  };

  drawSetup();
};

window.V = V;
</script>
<script>
/* ===== js/views-quiz.js ===== */
/* views-quiz.js — multiple-choice quiz and the exam technique reference */

var V = window.V || {};

V.quiz = function (params) {
  V._quizParams = params || {};
  return '<div class="eyebrow">Practice</div><h1>Quiz</h1>' +
    '<p class="lead">Every question has a worked explanation, so a wrong answer is worth as much as a right one. ' +
    'Questions you get wrong are more likely to come back.</p>' +
    '<div id="quizSetup"></div><div id="quizArea"></div>';
};

V.afterQuiz = function (root) {
  var s = BS.store;
  var setup = root.querySelector('#quizSetup');
  var area = root.querySelector('#quizArea');
  var state = { unit: 0, topic: V._quizParams.topic || null, len: 10, queue: [], i: 0, answered: false, score: 0, log: [] };

  function pool() {
    return BS.quiz.filter(function (q) {
      if (state.topic) return q.tp === state.topic;
      return !state.unit || q.u === state.unit;
    });
  }

  function drawSetup() {
    var p = pool();
    var h = '';
    if (state.topic) {
      var tp = BS.topic(state.topic);
      h += '<div class="callout"><span class="clabel">Filtered</span><p>' + p.length + ' question' + (p.length === 1 ? '' : 's') +
        ' from <a href="#/notes/' + state.topic + '">' + state.topic + ' ' + R.esc(tp ? tp.title : '') + '</a>. ' +
        '<a href="#/quiz">Use the whole bank instead</a>.</p></div>';
    } else {
      h += '<div class="chips" id="qUnits"><button class="chip" data-u="0" aria-pressed="' + (state.unit === 0) + '">All units</button>';
      BS.units.forEach(function (u) {
        h += '<button class="chip" data-u="' + u.n + '" aria-pressed="' + (state.unit === u.n) + '">Unit ' + u.n + '</button>';
      });
      h += '</div>';
    }
    h += '<div class="chips" id="qLen">';
    [5, 10, 20, 0].forEach(function (n) {
      h += '<button class="chip" data-n="' + n + '" aria-pressed="' + (state.len === n) + '">' +
        (n === 0 ? 'All (' + p.length + ')' : n + ' questions') + '</button>';
    });
    h += '</div>';

    /* weak spots */
    var wrong = p.filter(function (q) { var r = s.question(q.id); return r.tries && !r.lastOk; });
    if (wrong.length) {
      h += '<div class="card tight"><span class="small">You last answered <strong>' + wrong.length +
        '</strong> of these incorrectly. </span><button class="btn sm" id="doWrong">Retry just those</button></div>';
    }

    h += '<div class="btnrow"><button class="btn primary" id="startQuiz">Start quiz</button></div>';
    setup.innerHTML = h;

    var qu = setup.querySelector('#qUnits');
    if (qu) qu.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.unit = parseInt(b.getAttribute('data-u'), 10); drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#qLen').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.len = parseInt(b.getAttribute('data-n'), 10); drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#startQuiz').addEventListener('click', function () { start(pool()); });
    var dw = setup.querySelector('#doWrong');
    if (dw) dw.addEventListener('click', function () { start(wrong); });
  }

  function start(items) {
    if (!items.length) { area.innerHTML = '<div class="empty">No questions in that selection yet.</div>'; return; }
    /* weight: questions never tried, or last answered wrong, come first */
    var weighted = R.shuffle(items).sort(function (a, b) { return w(a) - w(b); });
    function w(q) { var r = s.question(q.id); if (!r.tries) return 0; return r.lastOk ? 2 : 1; }
    state.queue = state.len ? weighted.slice(0, state.len) : weighted;
    state.i = 0; state.score = 0; state.answered = false; state.log = [];
    setup.style.display = 'none';
    drawQ();
  }

  function drawQ() {
    if (state.i >= state.queue.length) return finish();
    var q = state.queue[state.i];
    var h = '';
    h += '<div class="card tight" style="display:flex;justify-content:space-between;align-items:center">' +
      '<span class="small">Question ' + (state.i + 1) + ' of ' + state.queue.length + '</span>' +
      '<span class="pill a">Score ' + state.score + '</span></div>';
    h += '<div class="bar" style="margin-bottom:14px"><i style="width:' + Math.round(state.i / state.queue.length * 100) + '%"></i></div>';
    h += '<div class="card"><p class="qtext">' + R.inline(q.q) + '</p><div class="opts" id="opts">';
    q.o.forEach(function (o, idx) {
      h += '<button class="opt" data-i="' + idx + '"><span class="letter">' + 'ABCD'[idx] + '</span><span>' + R.inline(o) + '</span></button>';
    });
    h += '</div><div id="exp"></div></div>';
    area.innerHTML = h;
    state.answered = false;

    area.querySelector('#opts').addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b || state.answered) return;
      answer(parseInt(b.getAttribute('data-i'), 10));
    });
  }

  function answer(idx) {
    var q = state.queue[state.i];
    state.answered = true;
    var ok = idx === q.a;
    if (ok) state.score++;
    s.gradeQuestion(q.id, ok);
    s.tick(1);
    state.log.push({ q: q, chose: idx, ok: ok });

    var btns = area.querySelectorAll('.opt');
    Array.prototype.forEach.call(btns, function (b, i) {
      b.disabled = true;
      if (i === q.a) b.classList.add('correct');
      else if (i === idx) b.classList.add('wrong');
    });

    var exp = area.querySelector('#exp');
    exp.innerHTML = '<div class="callout ' + (ok ? 'eg' : 'warn') + '"><span class="clabel">' +
      (ok ? 'Correct' : 'Not quite — the answer is ' + 'ABCD'[q.a]) + '</span><p>' + R.inline(q.e) + '</p>' +
      '<p class="small" style="margin-bottom:0">More on this in <a href="#/notes/' + q.tp + '">' + q.tp + '</a></p></div>' +
      '<div class="btnrow"><button class="btn primary" id="nextQ">' +
      (state.i + 1 >= state.queue.length ? 'See results' : 'Next question') + '</button></div>';
    exp.querySelector('#nextQ').addEventListener('click', function () { state.i++; drawQ(); });
    exp.querySelector('#nextQ').focus();
  }

  function finish() {
    s.logSession('quiz', state.score, state.queue.length);
    var pctv = state.queue.length ? Math.round(state.score / state.queue.length * 100) : 0;
    var msg = pctv >= 80 ? 'Strong. Move on to the next unit.' :
      pctv >= 60 ? 'Solid, but re-read the topics you missed.' :
        'Worth going back over the notes for these topics before trying again.';

    var h = '<div class="card center"><h2 class="mt0">Quiz complete</h2>' +
      '<p style="font-size:38px;font-weight:750;margin:6px 0">' + state.score + ' / ' + state.queue.length + '</p>' +
      '<p class="small">' + pctv + '% — ' + msg + '</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn primary" id="again">New quiz</button>' +
      '<a class="btn" href="#/cards">Flashcards</a></div></div>';

    var missed = state.log.filter(function (l) { return !l.ok; });
    if (missed.length) {
      h += '<h2>Review what you missed</h2>';
      missed.forEach(function (l) {
        h += '<div class="card"><p class="qtext">' + R.inline(l.q.q) + '</p>' +
          '<p><span class="pill b">You chose ' + 'ABCD'[l.chose] + '</span> ' +
          '<span class="pill g">Answer: ' + 'ABCD'[l.q.a] + ' — ' + R.esc(l.q.o[l.q.a]) + '</span></p>' +
          '<p class="small">' + R.inline(l.q.e) + ' &nbsp;<a href="#/notes/' + l.q.tp + '">Read ' + l.q.tp + ' →</a></p></div>';
      });
    }
    area.innerHTML = h;
    area.querySelector('#again').addEventListener('click', function () {
      setup.style.display = ''; drawSetup(); area.innerHTML = '';
      window.scrollTo(0, 0);
    });
  }

  drawSetup();
};

/* ---------------- exam technique ---------------- */

V.exam = function () {
  var e = BS.exam;
  var h = '<div class="eyebrow">Technique</div><h1>How to answer the paper</h1>' +
    '<p class="lead">Content gets you into the exam. Technique gets you the grade. ' +
    'Most marks are lost by not developing points, not applying them to the business, and not deciding on the 12-markers.</p>';

  /* papers */
  h += '<h2>The two papers</h2><div class="grid g2">';
  e.papers.forEach(function (p) {
    h += '<div class="card"><h3 class="mt0">' + R.esc(p.name) + '</h3>' +
      '<p><span class="pill a">' + p.time + '</span> <span class="pill">' + p.marks + '</span> <span class="pill">' + p.weight + '</span></p>' +
      '<ul>' + p.shape.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ul>' +
      '<div class="twrap"><table><thead><tr><th>Assessment objective</th><th>Weight</th></tr></thead><tbody>' +
      p.aos.map(function (a) { return '<tr><td>' + a[0] + '</td><td>' + a[1] + '</td></tr>'; }).join('') +
      '</tbody></table></div>' +
      '<h3>Strategy</h3><ul>' + p.strategy.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ul>' +
      '</div>';
  });
  h += '</div>';

  /* command words */
  h += '<h2>Command words</h2>' +
    '<p>Underline the command word before you write anything. It tells you exactly how much to write and what skill is being marked.</p>' +
    '<div class="twrap"><table><thead><tr><th>Command word</th><th>What it asks for</th><th>How to answer it</th></tr></thead><tbody>';
  e.commandWords.forEach(function (c) {
    h += '<tr><td><strong>' + R.esc(c.w) + '</strong></td><td>' + R.inline(c.m) + '</td><td>' + R.inline(c.how) + '</td></tr>';
  });
  h += '</tbody></table></div>';

  /* PEAL */
  h += '<h2>' + R.esc(e.peel.title) + '</h2><div class="twrap"><table><thead><tr><th>Stage</th><th>What to write</th><th>Marks it earns</th></tr></thead><tbody>' +
    e.peel.rows.map(function (r) { return '<tr><td>' + R.inline(r[0]) + '</td><td>' + R.inline(r[1]) + '</td><td><span class="pill a">' + r[2] + '</span></td></tr>'; }).join('') +
    '</tbody></table></div>';

  /* ladders */
  h += '<h2>What each mark allocation needs</h2>';
  e.ladders.forEach(function (l) {
    h += '<div class="card"><h3 class="mt0">' + R.inline(l.marks) + '</h3><ol>' +
      l.steps.map(function (x) { return '<li>' + R.inline(x) + '</li>'; }).join('') + '</ol>' +
      '<div class="callout eg"><span class="clabel">Model</span><p>' + R.inline(l.example) + '</p></div></div>';
  });

  /* mistakes */
  h += '<h2>The eight most expensive mistakes</h2><div class="callout warn"><span class="clabel">Avoid these</span><ol style="margin-bottom:0">' +
    e.mistakes.map(function (m) { return '<li>' + R.inline(m) + '</li>'; }).join('') + '</ol></div>';

  /* drills */
  h += '<h2>12-mark practice questions</h2>' +
    '<p>Plan each one for two minutes on paper, then open the plan and compare. The point is the <em>structure</em>, not matching the wording.</p>';
  e.drills.forEach(function (d, i) {
    h += '<div class="card"><div class="eyebrow">Unit ' + d.u + ' · <a href="#/notes/' + d.tp + '">' + d.tp + '</a> · ' + d.marks + ' marks</div>' +
      '<p class="qtext">' + R.inline(d.q) + '</p>' +
      '<button class="btn sm" data-drill="' + i + '">Show a model plan</button>' +
      '<div id="drill' + i + '" hidden><ul style="margin-top:14px">' +
      d.plan.map(function (p) { return '<li>' + R.inline(p) + '</li>'; }).join('') + '</ul></div></div>';
  });

  /* formula sheet */
  h += '<h2>Every formula you need</h2>' +
    '<p class="small">These are <strong>not</strong> given to you in the exam. Learn all of them.</p>' +
    '<div class="twrap"><table><thead><tr><th>Formula</th><th></th><th>Topic</th></tr></thead><tbody>' +
    e.formulae.map(function (f) {
      return '<tr><td><strong>' + R.esc(f[0]) + '</strong></td><td><code>' + R.esc(f[1]) + '</code></td>' +
        '<td><a href="#/notes/' + f[2].split(' / ')[0] + '">' + f[2] + '</a></td></tr>';
    }).join('') + '</tbody></table></div>';

  return h;
};

V.afterExam = function (root) {
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-drill]'); if (!b) return;
    var box = root.querySelector('#drill' + b.getAttribute('data-drill'));
    box.hidden = !box.hidden;
    b.textContent = box.hidden ? 'Show a model plan' : 'Hide the plan';
  });
};

window.V = V;
</script>
<script>
/* ===== js/views-written.js ===== */
/* views-written.js — write a real answer, then self-mark it against the mark scheme */

var V = window.V || {};

V.written = function (params) {
  V._wParams = params || {};
  return '<div class="eyebrow">The real thing</div><h1>Written practice</h1>' +
    '<p class="lead">This subject is examined by written answers, not multiple choice. ' +
    'Write your answer in full, then mark it yourself against the scheme — the same points the examiner is looking for. ' +
    'Marking your own work is where most of the learning happens.</p>' +
    '<div id="wSetup"></div><div id="wArea"></div>';
};

V.afterWritten = function (root) {
  var s = BS.store;
  var setup = root.querySelector('#wSetup');
  var area = root.querySelector('#wArea');
  var state = { unit: 0, marks: 0, topic: V._wParams.topic || null, queue: [], i: 0, revealed: false, got: [], total: 0, max: 0 };

  function pool() {
    return BS.written.filter(function (q) {
      if (state.topic && q.tp !== state.topic) return false;
      if (state.unit && q.u !== state.unit) return false;
      if (state.marks && q.marks !== state.marks) return false;
      return true;
    });
  }

  function drawSetup() {
    var p = pool();
    var h = '';
    if (state.topic) {
      var tp = BS.topic(state.topic);
      h += '<div class="callout"><span class="clabel">Filtered</span><p>' + p.length + ' question' + (p.length === 1 ? '' : 's') +
        ' from <a href="#/notes/' + state.topic + '">' + state.topic + ' ' + R.esc(tp ? tp.title : '') + '</a>. ' +
        '<a href="#/written">Use them all instead</a>.</p></div>';
    } else {
      h += '<div class="chips" id="wUnits"><button class="chip" data-u="0" aria-pressed="' + (state.unit === 0) + '">All units</button>';
      BS.units.forEach(function (u) {
        h += '<button class="chip" data-u="' + u.n + '" aria-pressed="' + (state.unit === u.n) + '">Unit ' + u.n + '</button>';
      });
      h += '</div>';
    }
    h += '<div class="chips" id="wMarks"><button class="chip" data-m="0" aria-pressed="' + (state.marks === 0) + '">Any length</button>';
    [2, 4, 6].forEach(function (m) {
      var n = BS.written.filter(function (q) { return q.marks === m; }).length;
      h += '<button class="chip" data-m="' + m + '" aria-pressed="' + (state.marks === m) + '">' + m + '-mark (' + n + ')</button>';
    });
    h += '</div>';

    /* progress across the bank */
    var done = p.filter(function (q) { return s.written(q.id).tries; });
    var gained = 0, avail = 0;
    done.forEach(function (q) { gained += s.written(q.id).best; avail += q.marks; });
    if (done.length) {
      h += '<div class="card tight"><span class="small">Attempted <strong>' + done.length + '</strong> of ' + p.length +
        ' · best marks <strong>' + gained + '/' + avail + '</strong> (' + Math.round(gained / avail * 100) + '%)</span></div>';
    }

    h += '<div class="btnrow"><button class="btn primary" id="wStart">Start writing</button></div>';
    setup.innerHTML = h;

    var wu = setup.querySelector('#wUnits');
    if (wu) wu.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.unit = parseInt(b.getAttribute('data-u'), 10); drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#wMarks').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.marks = parseInt(b.getAttribute('data-m'), 10); drawSetup(); area.innerHTML = '';
    });
    setup.querySelector('#wStart').addEventListener('click', start);
  }

  function start() {
    var p = pool();
    if (!p.length) { area.innerHTML = '<div class="empty">No questions match that filter.</div>'; return; }
    state.queue = R.shuffle(p);
    state.i = 0; state.revealed = false; state.total = 0; state.max = 0;
    setup.style.display = 'none';
    drawQ();
  }

  function drawQ() {
    if (state.i >= state.queue.length) return finish();
    var q = state.queue[state.i];
    var prev = s.written(q.id);
    state.revealed = false;
    state.got = q.scheme.map(function () { return false; });

    var mins = Math.max(2, Math.round(q.marks * 1.2));
    var h = '';
    h += '<div class="card tight" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<span class="small">Question ' + (state.i + 1) + ' of ' + state.queue.length + '</span>' +
      '<span><span class="pill a">' + R.esc(q.cmd) + '</span> <span class="pill">' + q.marks + ' marks</span> ' +
      '<span class="pill">~' + mins + ' min</span> <a class="small" href="#/notes/' + q.tp + '">' + q.tp + '</a></span></div>';
    h += '<div class="bar" style="margin-bottom:14px"><i style="width:' + Math.round(state.i / state.queue.length * 100) + '%"></i></div>';

    h += '<div class="card">';
    if (q.stem) h += '<div class="stem">' + R.inline(q.stem) + '</div>';
    h += '<p class="qtext">' + R.inline(q.q) + '</p>';
    h += '<label class="f" for="wAns">Your answer</label>';
    h += '<textarea id="wAns" rows="' + (q.marks <= 2 ? 3 : q.marks <= 4 ? 6 : 10) + '" ' +
      'placeholder="Write it out in full, as you would in the exam."></textarea>';
    h += '<div class="btnrow"><button class="btn primary" id="wReveal">I\'ve finished — show the mark scheme</button>';
    if (prev.tries) h += '<button class="btn sm" id="wPrev">Show my last attempt (' + prev.last + '/' + prev.outOf + ')</button>';
    h += '</div>';
    h += '<div id="wMark"></div></div>';
    area.innerHTML = h;

    var ta = area.querySelector('#wAns');
    ta.focus();
    area.querySelector('#wReveal').addEventListener('click', function () { reveal(q, ta.value); });
    var pb = area.querySelector('#wPrev');
    if (pb) pb.addEventListener('click', function () { ta.value = prev.text; pb.remove(); });
  }

  function reveal(q, text) {
    state.revealed = true;
    var h = '<hr/><h3 class="mt0">Mark scheme — tick every point you actually made</h3>' +
      '<p class="small">Be honest. If you did not write it, do not tick it.</p><div class="scheme" id="wScheme">';
    q.scheme.forEach(function (pt, i) {
      h += '<label class="tick"><input type="checkbox" data-i="' + i + '"/><span>' + R.inline(pt) + '</span></label>';
    });
    h += '</div>';
    h += '<div class="card tight" id="wScore" style="margin-top:14px"></div>';
    h += '<div class="btnrow"><button class="btn sm" id="wModel">Show a model answer</button></div>';
    h += '<div id="wModelBox" hidden><div class="callout eg" style="margin-top:12px"><span class="clabel">Model answer</span>' +
      q.model.split('\n\n').map(function (p) { return '<p>' + R.inline(p) + '</p>'; }).join('') + '</div></div>';
    if (q.watch) h += '<div class="callout warn"><span class="clabel">Watch out</span><p>' + R.inline(q.watch) + '</p></div>';
    h += '<div class="btnrow"><button class="btn primary" id="wNext">' +
      (state.i + 1 >= state.queue.length ? 'Save and see results' : 'Save and next question') + '</button></div>';

    var box = area.querySelector('#wMark');
    box.innerHTML = h;
    area.querySelector('#wReveal').disabled = true;

    var schemeBox = box.querySelector('#wScheme');
    var scoreBox = box.querySelector('#wScore');

    function updateScore() {
      var ticked = state.got.filter(Boolean).length;
      var score = Math.min(q.marks, ticked);
      var pctv = Math.round(score / q.marks * 100);
      var verdict = pctv >= 80 ? ['g', 'Strong — that would score well.']
        : pctv >= 50 ? ['w', 'Half marks. Look at the points you missed and note the pattern.']
          : ['b', 'Re-read the notes for this topic, then try it again in a few days.'];
      scoreBox.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span style="font-size:22px;font-weight:750">' + score + ' / ' + q.marks + '</span>' +
        '<span class="pill ' + verdict[0] + '">' + verdict[1] + '</span></div>' +
        '<div class="bar' + (pctv >= 80 ? ' good' : '') + '" style="margin-top:10px"><i style="width:' + pctv + '%"></i></div>' +
        (ticked > q.marks ? '<p class="small" style="margin:8px 0 0">You ticked ' + ticked + ' points but the question is only worth ' +
          q.marks + ' marks — the scheme lists more creditable points than you need, so any ' + q.marks + ' of them would do.</p>' : '');
      return score;
    }
    updateScore();

    schemeBox.addEventListener('change', function (e) {
      var cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
      state.got[parseInt(cb.getAttribute('data-i'), 10)] = cb.checked;
      cb.closest('.tick').classList.toggle('on', cb.checked);
      updateScore();
    });

    box.querySelector('#wModel').addEventListener('click', function () {
      var m = box.querySelector('#wModelBox');
      m.hidden = !m.hidden;
      this.textContent = m.hidden ? 'Show a model answer' : 'Hide the model answer';
    });

    box.querySelector('#wNext').addEventListener('click', function () {
      var score = Math.min(q.marks, state.got.filter(Boolean).length);
      s.saveWritten(q.id, score, q.marks, text);
      s.tick(2);
      state.total += score; state.max += q.marks;
      state.i++;
      drawQ();
      window.scrollTo(0, 0);
    });
  }

  function finish() {
    s.logSession('written', state.total, state.max);
    var pctv = state.max ? Math.round(state.total / state.max * 100) : 0;
    area.innerHTML = '<div class="card center"><h2 class="mt0">Session complete</h2>' +
      '<p style="font-size:38px;font-weight:750;margin:6px 0">' + state.total + ' / ' + state.max + '</p>' +
      '<p class="small">' + pctv + '% self-marked. Come back to these in a few days — writing the same answer twice is what makes it stick.</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn primary" id="wAgain">More questions</button>' +
      '<a class="btn" href="#/cases">Try a full case study</a></div></div>';
    area.querySelector('#wAgain').addEventListener('click', function () {
      setup.style.display = ''; drawSetup(); area.innerHTML = ''; window.scrollTo(0, 0);
    });
  }

  drawSetup();
};

window.V = V;
</script>
<script>
/* ===== js/views-cases.js ===== */
/* views-cases.js — Paper 2 case studies: read the stimulus, answer under time,
   then self-mark each part against the scheme.                               */

var V = window.V || {};

V.cases = function () {
  var s = BS.store;
  var h = '<div class="eyebrow">Paper 2</div><h1>Case studies</h1>' +
    '<p class="lead">Paper 2 is half your grade and it is one case study with four 20-mark questions. ' +
    'Read the case and the appendices first, then answer. Every point must come from the case — ' +
    'a general textbook answer cannot reach the top band here.</p>';

  BS.cases.forEach(function (c) {
    var totalMarks = 0, best = 0, attempted = 0;
    c.questions.forEach(function (q, qi) {
      q.parts.forEach(function (p, pi) {
        totalMarks += p.marks;
        var a = s.caseAns(c.id + '.' + qi + '.' + pi);
        if (a.outOf) { best += a.best; attempted++; }
      });
    });
    var parts = c.questions.reduce(function (n, q) { return n + q.parts.length; }, 0);

    h += '<a class="topic-row" style="align-items:flex-start;padding:16px 18px" href="#/cases/' + c.id + '">' +
      '<span style="flex:1">' +
      '<span style="font-size:17px;font-weight:650;display:block">' + R.esc(c.title) + '</span>' +
      '<span class="small" style="display:block;margin:3px 0 7px">' + R.esc(c.tag) + ' · ' +
      c.questions.length + ' questions · ' + totalMarks + ' marks</span>' +
      '<span class="small">' + R.esc(c.blurb) + '</span>' +
      (attempted ? '<span class="small" style="display:block;margin-top:8px"><strong>' + best + '/' + totalMarks +
        '</strong> self-marked so far (' + attempted + '/' + parts + ' parts attempted)</span>' : '') +
      '</span>' +
      (attempted ? '<span class="pill g">In progress</span>' : '<span class="pill a">Start</span>') +
      '</a>';
  });

  h += '<div class="callout tip"><span class="clabel">How to use these</span>' +
    '<p>Give yourself the real conditions at least once: <strong>1 hour 30 minutes</strong> for the whole case, ' +
    'with the first 8–10 minutes spent reading before you write anything. Use the timer at the top of the case. ' +
    'Then mark yourself honestly — the marks you did not get are the ones worth studying.</p></div>';
  return h;
};

V.case = function (id) {
  var c = BS.cases.filter(function (x) { return x.id === id; })[0];
  V._case = c || null;
  if (!c) return '<h1>Case study not found</h1><p><a href="#/cases">Back to case studies</a></p>';

  var totalMarks = 0;
  c.questions.forEach(function (q) { q.parts.forEach(function (p) { totalMarks += p.marks; }); });

  var h = '<div class="crumb"><a href="#/cases">Case studies</a> › ' + R.esc(c.title) + '</div>';

  h += '<div class="casebar">' +
    '<span><span class="timer" id="caseTimer">1:30:00</span> ' +
    '<span class="small" id="timerNote">not started</span></span>' +
    '<span><button class="btn sm" id="timerBtn">Start timer</button> ' +
    '<button class="btn sm" id="timerReset">Reset</button></span>' +
    '<span class="pill">' + totalMarks + ' marks</span></div>';

  h += '<div class="eyebrow">Case study</div><h1>' + R.esc(c.title) + '</h1>';
  h += '<div class="card case-text">' + c.text.map(function (p) {
    return '<p>' + R.inline(p).replace(/\n/g, '<br/>') + '</p>';
  }).join('') + '</div>';

  h += '<h2>Appendices</h2>';
  c.appendices.forEach(function (a) {
    h += '<div class="appendix"><h4>Appendix ' + a.n + ' — ' + R.esc(a.title) + '</h4>';
    if (a.table) h += R.table(a.table);
    if (a.quotes) {
      h += '<div class="twrap"><table><tbody>' + a.quotes.map(function (q) {
        return '<tr><th style="width:30%">' + R.inline(q[0]) + '</th><td>' + R.inline(q[1]) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    h += '</div>';
  });

  h += '<h2>Questions</h2>';
  c.questions.forEach(function (q, qi) {
    h += '<div class="card qcard"><div class="eyebrow">Question ' + q.n + ' · ' + q.total + ' marks</div>';
    q.parts.forEach(function (p, pi) {
      var key = c.id + '.' + qi + '.' + pi;
      var prev = BS.store.caseAns(key);
      h += '<div style="margin-top:16px" data-part="' + key + '">';
      h += '<p class="qtext" style="margin-bottom:8px">' +
        '<span class="pill a">' + R.esc(p.cmd) + '</span> ' +
        '<span class="pill">' + p.marks + ' marks</span><br/>' +
        '<span style="display:inline-block;margin-top:8px">(' + String.fromCharCode(97 + pi) + ') ' + R.inline(p.q) + '</span></p>';
      h += '<textarea rows="' + (p.marks <= 2 ? 2 : p.marks <= 6 ? 6 : 12) + '" data-ans="' + key + '" ' +
        'placeholder="Your answer…">' + R.esc(prev.text || '') + '</textarea>';
      h += '<div class="btnrow"><button class="btn sm" data-reveal="' + key + '">Show mark scheme</button>' +
        (prev.outOf ? ' <span class="pill g" style="align-self:center">Best so far: ' + prev.best + '/' + prev.outOf + '</span>' : '') +
        '</div>';
      h += '<div id="m-' + key.replace(/\./g, '-') + '"></div>';
      h += '</div>';
      if (pi < q.parts.length - 1) h += '<hr style="margin:18px 0"/>';
    });
    h += '</div>';
  });

  h += '<div class="card" id="caseTotal"></div>';
  h += '<div class="pagenav"><a href="#/cases"><div class="lbl">← Back</div><div class="ttl">All case studies</div></a>' +
    '<a class="r" href="#/exam"><div class="lbl">Next →</div><div class="ttl">Exam technique</div></a></div>';
  return h;
};

V.afterCase = function (root) {
  var c = V._case;
  var tEl = root.querySelector('#caseTimer');
  var note = root.querySelector('#timerNote');
  var btn = root.querySelector('#timerBtn');
  if (!c || !tEl || !note || !btn) return;
  var s = BS.store;

  /* ---------- timer ---------- */
  var LEN = 90 * 60;
  var left = LEN, running = false, iv = null;

  function fmt(n) {
    var hrs = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), sec = n % 60;
    return hrs + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function tick() {
    left--;
    if (left <= 0) {
      left = 0; stop();
      note.textContent = 'time up — pens down';
    } else if (left <= 600) {
      tEl.classList.add('low');
      note.textContent = 'under 10 minutes left';
    } else if (left > LEN - 600) {
      note.textContent = 'reading time — do not write yet';
    } else {
      note.textContent = 'writing';
    }
    tEl.textContent = fmt(left);
  }
  function stop() {
    running = false; clearInterval(iv); iv = null; btn.textContent = 'Resume';
  }
  btn.addEventListener('click', function () {
    if (running) { stop(); note.textContent = 'paused'; return; }
    running = true; btn.textContent = 'Pause'; iv = setInterval(tick, 1000); tick();
  });
  root.querySelector('#timerReset').addEventListener('click', function () {
    stop(); left = LEN; tEl.textContent = fmt(left); tEl.classList.remove('low');
    note.textContent = 'not started'; btn.textContent = 'Start timer';
  });
  V._caseCleanup = function () { if (iv) clearInterval(iv); };

  /* ---------- mark schemes ---------- */
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-reveal]');
    if (!b) return;
    var key = b.getAttribute('data-reveal');
    var bits = key.split('.');
    var q = c.questions[+bits[1]], part = q.parts[+bits[2]];
    var boxId = 'm-' + key.replace(/\./g, '-');
    var box = root.querySelector('#' + boxId);
    if (box.innerHTML) { box.innerHTML = ''; b.textContent = 'Show mark scheme'; return; }
    b.textContent = 'Hide mark scheme';

    var got = part.scheme.map(function () { return false; });
    var h = '<hr/><h3 class="mt0">Mark scheme — tick what you actually wrote</h3>' +
      '<p class="small">The scheme usually lists more creditable points than the marks available, so you do not need all of them.</p>' +
      '<div class="scheme">';
    part.scheme.forEach(function (pt, i) {
      h += '<label class="tick"><input type="checkbox" data-i="' + i + '"/><span>' + R.inline(pt) + '</span></label>';
    });
    h += '</div><div class="card tight" style="margin-top:14px" data-score></div>';
    if (part.model) {
      h += '<div class="btnrow"><button class="btn sm" data-model>Show a model answer</button></div>' +
        '<div data-modelbox hidden><div class="callout eg" style="margin-top:12px"><span class="clabel">Model answer</span>' +
        part.model.split('\n\n').map(function (p) { return '<p>' + R.inline(p) + '</p>'; }).join('') + '</div></div>';
    }
    box.innerHTML = h;

    var scoreBox = box.querySelector('[data-score]');
    var ta = root.querySelector('[data-ans="' + key + '"]');

    function update() {
      var score = Math.min(part.marks, got.filter(Boolean).length);
      var pctv = Math.round(score / part.marks * 100);
      scoreBox.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span style="font-size:20px;font-weight:750">' + score + ' / ' + part.marks + '</span>' +
        '<span class="pill ' + (pctv >= 80 ? 'g' : pctv >= 50 ? 'w' : 'b') + '">' + pctv + '%</span></div>' +
        '<div class="bar' + (pctv >= 80 ? ' good' : '') + '" style="margin-top:10px"><i style="width:' + pctv + '%"></i></div>';
      s.saveCase(key, score, part.marks, ta ? ta.value : '');
      s.tick(1);
      total();
    }
    update();

    box.querySelector('.scheme').addEventListener('change', function (ev) {
      var cb = ev.target.closest('input[type=checkbox]'); if (!cb) return;
      got[+cb.getAttribute('data-i')] = cb.checked;
      cb.closest('.tick').classList.toggle('on', cb.checked);
      update();
    });
    var mb = box.querySelector('[data-model]');
    if (mb) mb.addEventListener('click', function () {
      var m = box.querySelector('[data-modelbox]');
      m.hidden = !m.hidden;
      this.textContent = m.hidden ? 'Show a model answer' : 'Hide the model answer';
    });
  });

  /* ---------- running total ---------- */
  function total() {
    var got = 0, avail = 0, attempted = 0, parts = 0;
    c.questions.forEach(function (q, qi) {
      q.parts.forEach(function (p, pi) {
        parts++; avail += p.marks;
        var a = s.caseAns(c.id + '.' + qi + '.' + pi);
        if (a.outOf) { got += a.best; attempted++; }
      });
    });
    var el = root.querySelector('#caseTotal');
    if (!el) return;
    if (!attempted) {
      el.innerHTML = '<p class="small mt0" style="margin-bottom:0">Reveal a mark scheme and tick your points to build a total for this case.</p>';
      return;
    }
    var pctv = Math.round(got / avail * 100);
    el.innerHTML = '<h3 class="mt0">Your total for this case</h3>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<span style="font-size:30px;font-weight:750">' + got + ' / ' + avail + '</span>' +
      '<span class="pill ' + (pctv >= 70 ? 'g' : pctv >= 45 ? 'w' : 'b') + '">' + pctv + '%</span></div>' +
      '<div class="bar' + (pctv >= 70 ? ' good' : '') + '" style="margin:12px 0"><i style="width:' + pctv + '%"></i></div>' +
      '<p class="small" style="margin-bottom:0">' + attempted + ' of ' + parts + ' parts marked. ' +
      'Only parts you have marked count towards this total.</p>';
  }
  total();

  /* save answers as they type */
  root.addEventListener('input', function (e) {
    var ta = e.target.closest('[data-ans]'); if (!ta) return;
    var key = ta.getAttribute('data-ans');
    var a = s.caseAns(key);
    s.saveCase(key, a.best, a.outOf, ta.value);
  });
};

window.V = V;
</script>
<script>
/* ===== js/views-tools.js ===== */
/* views-tools.js — calculators: break-even, ratios, cash flow, quick formulas */

var V = window.V || {};

V.tools = function () {
  var h = '<div class="eyebrow">Numbers</div><h1>Calculators</h1>' +
    '<p class="lead">Check your practice answers, and see how a change in price or costs moves the result. ' +
    'In the exam you must show the formula and your working — these tools show both.</p>';

  h += '<div class="chips" id="toolTabs">' +
    '<button class="chip" data-t="be" aria-pressed="true">Break-even</button>' +
    '<button class="chip" data-t="ratio" aria-pressed="false">Ratios</button>' +
    '<button class="chip" data-t="cash" aria-pressed="false">Cash flow</button>' +
    '<button class="chip" data-t="quick" aria-pressed="false">Quick formulas</button>' +
    '</div><div id="toolBody"></div>';
  return h;
};

V.afterTools = function (root) {
  var tabs = root.querySelector('#toolTabs');
  var body = root.querySelector('#toolBody');
  var builders = { be: breakEven, ratio: ratios, cash: cashflow, quick: quick };

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    Array.prototype.forEach.call(tabs.querySelectorAll('.chip'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    builders[b.getAttribute('data-t')]();
  });
  breakEven();

  function num(id) {
    var el = body.querySelector('#' + id);
    var v = parseFloat(el.value);
    return isNaN(v) ? 0 : v;
  }
  function field(id, label, val, step) {
    return '<div class="field"><label class="f" for="' + id + '">' + label + '</label>' +
      '<input type="number" id="' + id + '" value="' + val + '" step="' + (step || 'any') + '"/></div>';
  }

  /* ---------------- break-even ---------------- */
  function breakEven() {
    body.innerHTML =
      '<div class="card"><h2 class="mt0">Break-even analysis</h2>' +
      '<div class="grid g3">' +
      field('beFC', 'Fixed costs ($ per period)', 12000) +
      field('bePrice', 'Selling price per unit ($)', 20) +
      field('beVC', 'Variable cost per unit ($)', 8) +
      field('beOut', 'Current output (units)', 1500) +
      '</div><div id="beOutBox"></div><div class="chartwrap" id="beChart"></div></div>' +
      '<div class="callout tip"><span class="clabel">In the exam</span>' +
      '<p>Write it out in three lines: <code>Contribution = price − variable cost</code>, then ' +
      '<code>Break-even = fixed costs ÷ contribution</code>, then the answer with the unit. ' +
      'Method marks are awarded even if the arithmetic slips.</p></div>' +
      '<div class="callout warn"><span class="clabel">Remember the assumptions</span>' +
      '<p>Break-even assumes every unit produced is sold, and that costs and revenue rise in straight lines. ' +
      'In reality bulk discounts, economies of scale and unsold stock all break those assumptions — say so if a question asks for limitations. See [[4.2]].</p></div>';

    ['beFC', 'bePrice', 'beVC', 'beOut'].forEach(function (id) {
      body.querySelector('#' + id).addEventListener('input', calcBE);
    });
    calcBE();

    function calcBE() {
      var fc = num('beFC'), p = num('bePrice'), vc = num('beVC'), out = num('beOut');
      var box = body.querySelector('#beOutBox');
      var contrib = p - vc;
      if (contrib <= 0) {
        box.innerHTML = '<div class="callout warn"><span class="clabel">No break-even point</span>' +
          '<p>The variable cost per unit is not below the selling price, so every unit sold makes a loss. ' +
          'The business can never break even at this price — it must raise the price or cut variable costs.</p></div>';
        body.querySelector('#beChart').innerHTML = '';
        return;
      }
      var be = fc / contrib;
      var mos = out - be;
      var profit = contrib * out - fc;
      var rev = p * out, tc = fc + vc * out;

      box.innerHTML = '<div class="out">' +
        'Contribution per unit = $' + p + ' − $' + vc + ' = <b>' + R.money(contrib) + '</b>\n' +
        'Break-even output     = ' + R.money(fc) + ' ÷ ' + R.money(contrib) + ' = <b>' + Math.ceil(be).toLocaleString() + ' units</b>' +
        (be % 1 ? '  (' + (Math.round(be * 100) / 100) + ' exactly — always round UP to the next whole unit)' : '') + '\n' +
        'Break-even revenue    = ' + Math.ceil(be).toLocaleString() + ' × ' + R.money(p) + ' = <b>' + R.money(Math.ceil(be) * p) + '</b>\n' +
        '\nAt an output of ' + out.toLocaleString() + ' units:\n' +
        '  Total revenue  = <b>' + R.money(rev) + '</b>\n' +
        '  Total costs    = ' + R.money(fc) + ' + (' + R.money(vc) + ' × ' + out.toLocaleString() + ') = <b>' + R.money(tc) + '</b>\n' +
        '  Profit         = <b>' + R.money(profit) + '</b>' + (profit < 0 ? '  (a LOSS)' : '') + '\n' +
        '  Margin of safety = ' + out.toLocaleString() + ' − ' + Math.ceil(be).toLocaleString() + ' = <b>' + Math.round(mos).toLocaleString() + ' units</b>' +
        (mos < 0 ? '  (below break-even)' : '') +
        '</div>';

      drawChart(fc, p, vc, be, out);
    }

    function drawChart(fc, p, vc, be, out) {
      var W = 620, H = 340, L = 62, Rr = 26, T = 22, B = 44;
      var maxX = Math.max(be * 1.9, out * 1.25, 10);
      var maxY = Math.max(p * maxX, fc + vc * maxX) * 1.05;
      if (maxY <= 0) return;
      var px = function (x) { return L + (x / maxX) * (W - L - Rr); };
      var py = function (y) { return H - B - (y / maxY) * (H - T - B); };

      var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Break-even chart">';
      /* grid */
      for (var i = 1; i <= 4; i++) {
        var gy = py(maxY * i / 5);
        s += '<line class="grid" x1="' + L + '" y1="' + gy + '" x2="' + (W - Rr) + '" y2="' + gy + '"/>';
        s += '<text x="' + (L - 7) + '" y="' + (gy + 4) + '" text-anchor="end">' + short(maxY * i / 5) + '</text>';
      }
      /* profit / loss shading */
      s += '<polygon points="' + px(be) + ',' + py(p * be) + ' ' + px(maxX) + ',' + py(p * maxX) + ' ' + px(maxX) + ',' + py(fc + vc * maxX) +
        '" fill="var(--good)" opacity=".16"/>';
      s += '<polygon points="' + px(0) + ',' + py(0) + ' ' + px(be) + ',' + py(p * be) + ' ' + px(0) + ',' + py(fc) +
        '" fill="var(--bad)" opacity=".16"/>';
      /* axes */
      s += '<line class="axis" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '"/>';
      s += '<line class="axis" x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - Rr) + '" y2="' + (H - B) + '"/>';
      /* fixed costs */
      s += line(px(0), py(fc), px(maxX), py(fc), 'var(--muted)', '4 4');
      /* total costs */
      s += line(px(0), py(fc), px(maxX), py(fc + vc * maxX), 'var(--bad)');
      /* revenue */
      s += line(px(0), py(0), px(maxX), py(p * maxX), 'var(--accent)');
      /* break-even marker */
      s += '<line class="grid" x1="' + px(be) + '" y1="' + py(p * be) + '" x2="' + px(be) + '" y2="' + (H - B) + '" stroke="var(--text)"/>';
      s += '<circle cx="' + px(be) + '" cy="' + py(p * be) + '" r="5" fill="var(--text)"/>';
      s += '<text x="' + px(be) + '" y="' + (H - B + 16) + '" text-anchor="middle" font-weight="700" fill="var(--text)">' + Math.ceil(be).toLocaleString() + '</text>';
      /* current output marker */
      if (out > 0 && out < maxX) {
        s += '<line class="grid" x1="' + px(out) + '" y1="' + T + '" x2="' + px(out) + '" y2="' + (H - B) + '"/>';
        s += '<text x="' + px(out) + '" y="' + (H - B + 32) + '" text-anchor="middle">output ' + out.toLocaleString() + '</text>';
      }
      /* labels */
      s += '<text x="' + (W - Rr) + '" y="' + (py(p * maxX) + 12) + '" text-anchor="end" fill="var(--accent)">Total revenue</text>';
      s += '<text x="' + (W - Rr) + '" y="' + (py(fc + vc * maxX) - 6) + '" text-anchor="end" fill="var(--bad)">Total costs</text>';
      s += '<text x="' + (L + 6) + '" y="' + (py(fc) - 5) + '">Fixed costs</text>';
      s += '<text x="' + (L - 7) + '" y="' + (H - B + 4) + '" text-anchor="end">0</text>';
      s += '<text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle">Output (units)</text>';
      s += '<text transform="translate(14,' + (H / 2) + ') rotate(-90)" text-anchor="middle">Costs and revenue ($)</text>';
      s += '</svg>';
      body.querySelector('#beChart').innerHTML = s;

      function line(x1, y1, x2, y2, col, dash) {
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col +
          '" stroke-width="2.2"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
      }
      function short(n) {
        if (n >= 1e6) return (Math.round(n / 1e5) / 10) + 'm';
        if (n >= 1e3) return Math.round(n / 1e3) + 'k';
        return Math.round(n);
      }
    }
  }

  /* ---------------- ratios ---------------- */
  function ratios() {
    body.innerHTML =
      '<div class="card"><h2 class="mt0">Profitability ratios</h2><div class="grid g3">' +
      field('rRev', 'Revenue ($)', 500000) +
      field('rCos', 'Cost of sales ($)', 300000) +
      field('rExp', 'Expenses / overheads ($)', 120000) +
      field('rCap', 'Capital employed ($)', 450000) +
      '</div><div id="rOut1"></div></div>' +

      '<div class="card"><h2 class="mt0">Liquidity ratios</h2><div class="grid g3">' +
      field('lCA', 'Current assets ($)', 130000) +
      field('lInv', 'Inventory, included above ($)', 60000) +
      field('lCL', 'Current liabilities ($)', 80000) +
      '</div><div id="rOut2"></div></div>' +

      '<div class="callout tip"><span class="clabel">In the exam</span><p>A number on its own scores only the calculation mark. ' +
      'Always follow it with a comparison — better or worse than last year, or than the competitor — and a judgement about what the business should do. See [[5.5]].</p></div>';

    ['rRev', 'rCos', 'rExp', 'rCap', 'lCA', 'lInv', 'lCL'].forEach(function (id) {
      body.querySelector('#' + id).addEventListener('input', calcR);
    });
    calcR();

    function calcR() {
      var rev = num('rRev'), cos = num('rCos'), exp = num('rExp'), cap = num('rCap');
      var gp = rev - cos, np = gp - exp;
      var gpm = rev ? gp / rev * 100 : 0, pm = rev ? np / rev * 100 : 0, roce = cap ? np / cap * 100 : 0;

      body.querySelector('#rOut1').innerHTML = '<div class="out">' +
        'Gross profit = ' + R.money(rev) + ' − ' + R.money(cos) + ' = <b>' + R.money(gp) + '</b>\n' +
        'Profit       = ' + R.money(gp) + ' − ' + R.money(exp) + ' = <b>' + R.money(np) + '</b>\n\n' +
        'Gross profit margin = (' + R.money(gp) + ' ÷ ' + R.money(rev) + ') × 100 = <b>' + R.pct(gpm) + '</b>\n' +
        'Profit margin       = (' + R.money(np) + ' ÷ ' + R.money(rev) + ') × 100 = <b>' + R.pct(pm) + '</b>\n' +
        'ROCE                = (' + R.money(np) + ' ÷ ' + R.money(cap) + ') × 100 = <b>' + R.pct(roce) + '</b>' +
        '</div>' + comment(gpm, pm);

      var ca = num('lCA'), inv = num('lInv'), cl = num('lCL');
      var cr = cl ? ca / cl : 0, at = cl ? (ca - inv) / cl : 0;
      body.querySelector('#rOut2').innerHTML = '<div class="out">' +
        'Current ratio   = ' + R.money(ca) + ' ÷ ' + R.money(cl) + ' = <b>' + rd(cr) + ' : 1</b>\n' +
        'Acid test ratio = (' + R.money(ca) + ' − ' + R.money(inv) + ') ÷ ' + R.money(cl) + ' = <b>' + rd(at) + ' : 1</b>\n' +
        'Working capital = ' + R.money(ca) + ' − ' + R.money(cl) + ' = <b>' + R.money(ca - cl) + '</b>' +
        '</div>' + liqComment(cr, at);

      function rd(n) { return Math.round(n * 100) / 100; }
    }

    function comment(gpm, pm) {
      var gap = gpm - pm;
      var t = '';
      if (gpm > 0 && gap > gpm * 0.55) t = 'The gross margin is healthy but a large share of it is eaten by expenses. The problem is <strong>overheads</strong>, not pricing or the cost of sales.';
      else if (gpm > 0 && gpm < 20) t = 'A low gross margin means the selling price is close to the cost of sales. Look at raising the price or finding cheaper suppliers.';
      else t = 'Direct costs and overheads are both reasonably controlled. Compare with last year and with a competitor before judging.';
      return '<div class="callout"><span class="clabel">What this suggests</span><p>' + t + '</p></div>';
    }
    function liqComment(cr, at) {
      var t;
      if (cr < 1) t = 'A current ratio below 1 : 1 means current liabilities exceed current assets — the business may not be able to pay its short-term debts. This is a serious liquidity warning.';
      else if (cr > 2.5) t = 'A current ratio well above 2 : 1 suggests too much cash sitting idle or too much money tied up in inventory and receivables. That capital could be earning a return elsewhere.';
      else t = 'The current ratio is in the usual safe range of about 1.5 : 1 to 2 : 1.';
      if (at < 0.5) t += ' The acid test is below 0.5 : 1, so without selling inventory the business would struggle badly to pay its creditors.';
      else if (at < 1) t += ' The acid test is below the 1 : 1 guide, so the business depends on selling inventory to meet its short-term debts.';
      return '<div class="callout"><span class="clabel">What this suggests</span><p>' + t + '</p></div>';
    }
  }

  /* ---------------- cash flow ---------------- */
  function cashflow() {
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
    var h = '<div class="card"><h2 class="mt0">Cash-flow forecast</h2>' +
      '<p class="small">Enter the inflows and outflows for each month. The opening balance carries forward automatically.</p>' +
      '<div class="field" style="max-width:240px"><label class="f" for="cfOpen">Opening balance, month 1 ($)</label>' +
      '<input type="number" id="cfOpen" value="2000"/></div>' +
      '<div class="twrap"><table><thead><tr><th>$</th>' +
      months.map(function (m) { return '<th>' + m + '</th>'; }).join('') + '</tr></thead><tbody>' +
      '<tr><th>Cash inflows</th>' + months.map(function (m, i) {
        return '<td><input type="number" id="in' + i + '" value="' + [14000, 17000, 15000, 16000, 19000, 21000][i] + '"/></td>';
      }).join('') + '</tr>' +
      '<tr><th>Cash outflows</th>' + months.map(function (m, i) {
        return '<td><input type="number" id="out' + i + '" value="' + [13000, 22000, 12500, 15000, 17000, 18000][i] + '"/></td>';
      }).join('') + '</tr>' +
      '</tbody></table></div><div id="cfResult"></div></div>' +
      '<div class="callout tip"><span class="clabel">In the exam</span><p>Work down the columns: total inflows, total outflows, net cash flow, then ' +
      '<code>opening + net = closing</code>. The closing balance of one month is always the opening balance of the next — use that to fill in any missing figure. See [[5.2]].</p></div>';
    body.innerHTML = h;

    var ids = ['cfOpen'];
    months.forEach(function (m, i) { ids.push('in' + i, 'out' + i); });
    ids.forEach(function (id) { body.querySelector('#' + id).addEventListener('input', calcCF); });
    calcCF();

    function calcCF() {
      var open = num('cfOpen'), rows = [], bal = open, worst = null;
      months.forEach(function (m, i) {
        var inn = num('in' + i), o = num('out' + i), net = inn - o;
        var start = bal; bal = start + net;
        rows.push({ m: m, in: inn, out: o, net: net, open: start, close: bal });
        if (worst === null || bal < rows[worst].close) worst = i;
      });

      var h = '<div class="twrap"><table><thead><tr><th>$</th>' +
        rows.map(function (r) { return '<th>' + r.m + '</th>'; }).join('') + '</tr></thead><tbody>' +
        row('Total inflows', function (r) { return R.money(r.in); }) +
        row('Total outflows', function (r) { return R.money(r.out); }) +
        row('<strong>Net cash flow</strong>', function (r) { return neg(r.net); }) +
        row('Opening balance', function (r) { return neg(r.open); }) +
        row('<strong>Closing balance</strong>', function (r) { return neg(r.close); }) +
        '</tbody></table></div>';

      var negs = rows.filter(function (r) { return r.close < 0; });
      if (negs.length) {
        h += '<div class="callout warn"><span class="clabel">Cash shortage</span><p>The closing balance is negative in <strong>' +
          negs.map(function (r) { return r.m; }).join(', ') + '</strong>, with the worst point at ' +
          R.money(rows[worst].close) + ' in ' + rows[worst].m + '. The business needs to arrange an overdraft <em>before</em> then, ' +
          'delay a large outflow into a stronger month, negotiate longer credit from suppliers, or speed up payments from customers.</p></div>';
      } else {
        h += '<div class="callout eg"><span class="clabel">Healthy</span><p>The closing balance stays positive all six months, ending at ' +
          R.money(rows[rows.length - 1].close) + '. The lowest point is ' + R.money(rows[worst].close) + ' in ' + rows[worst].m +
          ' — that is the month with the least margin for error if a customer pays late.</p></div>';
      }
      body.querySelector('#cfResult').innerHTML = h;

      function row(label, f) {
        return '<tr><th>' + label + '</th>' + rows.map(function (r) { return '<td>' + f(r) + '</td>'; }).join('') + '</tr>';
      }
      function neg(n) {
        return n < 0 ? '<span style="color:var(--bad);font-weight:600">(' + R.money(Math.abs(n)) + ')</span>' : R.money(n);
      }
    }
  }

  /* ---------------- quick formulas ---------------- */
  function quick() {
    body.innerHTML =
      card('Added value', [f('avPrice', 'Selling price ($)', 4.5), f('avMat', 'Bought-in materials ($)', 1.2)], 'avOut') +
      card('Market share', [f('msSales', 'Business sales ($)', 4000000), f('msMarket', 'Total market sales ($)', 50000000)], 'msOut') +
      card('Labour turnover', [f('ltLeft', 'Employees who left', 30), f('ltTotal', 'Average number employed', 200)], 'ltOut') +
      card('Labour productivity', [f('lpOut', 'Total output (units)', 4800), f('lpEmp', 'Number of employees', 40)], 'lpOutBox') +
      card('Price elasticity of demand', [
        f('pedP1', 'Old price ($)', 20), f('pedP2', 'New price ($)', 18),
        f('pedQ1', 'Old quantity', 500), f('pedQ2', 'New quantity', 650)
      ], 'pedOut') +
      '<div class="callout tip"><span class="clabel">Reminder</span><p>Show the formula, the substitution and the answer with its unit. ' +
      'Percentages need a <code>%</code>, money needs a <code>$</code>, and liquidity ratios are written as <code>1.6 : 1</code>, never as a percentage.</p></div>';

    var all = ['avPrice', 'avMat', 'msSales', 'msMarket', 'ltLeft', 'ltTotal', 'lpOut', 'lpEmp', 'pedP1', 'pedP2', 'pedQ1', 'pedQ2'];
    all.forEach(function (id) { body.querySelector('#' + id).addEventListener('input', calcQ); });
    calcQ();

    function f(id, label, val) { return field(id, label, val); }
    function card(title, fields, outId) {
      return '<div class="card"><h3 class="mt0">' + title + '</h3><div class="grid g3">' + fields.join('') +
        '</div><div id="' + outId + '"></div></div>';
    }

    function calcQ() {
      var p = num('avPrice'), m = num('avMat');
      set('avOut', 'Added value = ' + R.money(p) + ' − ' + R.money(m) + ' = <b>' + R.money(p - m) + ' per unit</b>\n' +
        'Remember: this is not profit — wages, rent and other costs still come out of it.');

      var ss = num('msSales'), mk = num('msMarket');
      set('msOut', 'Market share = (' + R.money(ss) + ' ÷ ' + R.money(mk) + ') × 100 = <b>' + (mk ? R.pct(ss / mk * 100) : '—') + '</b>');

      var l = num('ltLeft'), t = num('ltTotal');
      set('ltOut', 'Labour turnover = (' + l + ' ÷ ' + t + ') × 100 = <b>' + (t ? R.pct(l / t * 100) : '—') + '</b>\n' +
        (t && l / t > 0.2 ? 'Above about 20% is high — expect heavy recruitment and training costs, and look at motivation.' : 'A moderate rate. Compare with the industry average before judging.'));

      var o = num('lpOut'), e2 = num('lpEmp');
      set('lpOutBox', 'Labour productivity = ' + o.toLocaleString() + ' ÷ ' + e2 + ' = <b>' +
        (e2 ? (Math.round(o / e2 * 100) / 100).toLocaleString() + ' units per employee' : '—') + '</b>');

      var p1 = num('pedP1'), p2 = num('pedP2'), q1 = num('pedQ1'), q2 = num('pedQ2');
      if (p1 && q1 && p1 !== p2) {
        var dp = (p2 - p1) / p1 * 100, dq = (q2 - q1) / q1 * 100;
        var ped = dq / dp;
        var abs = Math.abs(ped);
        var verdict = abs > 1 ? 'ELASTIC — demand responds strongly to price. To raise revenue, LOWER the price.'
          : abs < 1 ? 'INELASTIC — demand barely responds to price. To raise revenue, RAISE the price.'
            : 'UNIT ELASTIC — revenue is unchanged by a price change.';
        set('pedOut', '% change in price    = (' + p2 + ' − ' + p1 + ') ÷ ' + p1 + ' × 100 = ' + (Math.round(dp * 10) / 10) + '%\n' +
          '% change in quantity = (' + q2 + ' − ' + q1 + ') ÷ ' + q1 + ' × 100 = ' + (Math.round(dq * 10) / 10) + '%\n' +
