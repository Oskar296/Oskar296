<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>IGCSE Business Studies 0450 · Revision</title>
<meta name="description" content="Revision app for Cambridge IGCSE Business Studies 0450: syllabus notes, flashcards, quizzes, exam technique and finance calculators."/>
<meta name="theme-color" content="#0f172a"/>
<style>
/* IGCSE Business Studies 0450 — revision app */

:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --surface-2:#f0f2f8;
  --border:#dfe3ec;
  --text:#1a1f2b;
  --muted:#5c6478;
  --accent:#2f5fe0;
  --accent-soft:#e6ecfd;
  --good:#177a52;
  --good-soft:#dff5ec;
  --warn:#9a5b06;
  --warn-soft:#fdf0d9;
  --bad:#b3261e;
  --bad-soft:#fce8e6;
  --tip:#5b3fd1;
  --tip-soft:#eee9fd;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  --radius:14px;
  --topbar-h:56px;
  --sidebar-w:248px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Dark tokens apply from the OS preference before main.js has stamped
   data-theme, so the page never flashes light on a dark device. Once
   data-theme is set — by the app's own toggle or by the artifact viewer's —
   the rules below win in both directions. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0e1220;
    --surface:#161b2c;
    --surface-2:#1e2438;
    --border:#2a3149;
    --text:#e8ebf4;
    --muted:#a0a8bf;
    --accent:#7b9cff;
    --accent-soft:#1d2745;
    --good:#5fd7a8;
    --good-soft:#12312a;
    --warn:#f0b95c;
    --warn-soft:#33280f;
    --bad:#ff8a80;
    --bad-soft:#3a1c1c;
    --tip:#b6a4ff;
    --tip-soft:#251f42;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}

html[data-theme="dark"]{
  --bg:#0e1220;
  --surface:#161b2c;
  --surface-2:#1e2438;
  --border:#2a3149;
  --text:#e8ebf4;
  --muted:#a0a8bf;
  --accent:#7b9cff;
  --accent-soft:#1d2745;
  --good:#5fd7a8;
  --good-soft:#12312a;
  --warn:#f0b95c;
  --warn-soft:#33280f;
  --bad:#ff8a80;
  --bad-soft:#3a1c1c;
  --tip:#b6a4ff;
  --tip-soft:#251f42;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent)}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:8px 14px;z-index:100}
.skip:focus{left:8px;top:8px}

/* ---------- top bar ---------- */
#topbar{
  position:sticky; top:0; z-index:40; height:var(--topbar-h);
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:var(--surface); border-bottom:1px solid var(--border);
}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-weight:650}
.brand-mark{
  background:var(--accent); color:#fff; font-family:var(--mono); font-size:12px;
  padding:3px 7px; border-radius:7px; letter-spacing:.5px;
}
.brand-text{font-size:15px}
.icon-btn{
  background:transparent;border:1px solid transparent;color:var(--text);
  font-size:17px;width:38px;height:38px;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:hover{background:var(--surface-2)}
#navToggle{display:none}

/* ---------- layout ---------- */
#shell{display:flex; align-items:flex-start; max-width:1400px; margin:0 auto}
#sidebar{
  position:sticky; top:var(--topbar-h); flex:0 0 var(--sidebar-w); width:var(--sidebar-w);
  height:calc(100vh - var(--topbar-h)); overflow-y:auto; padding:14px 10px 40px;
  border-right:1px solid var(--border); background:var(--surface);
}
#scrim{display:none}
.nav-group{display:flex;flex-direction:column;gap:2px}
#sidebar a{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
  text-decoration:none; color:var(--text); font-size:14.5px;
}
#sidebar a:hover{background:var(--surface-2)}
#sidebar a.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
#sidebar a .num{
  font-family:var(--mono); font-size:11.5px; color:var(--muted);
  min-width:26px;
}
#sidebar a.active .num{color:var(--accent)}
.nav-head{
  font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
  margin:20px 10px 8px; font-weight:700;
}
.nav-unit{
  font-size:12.5px; font-weight:700; color:var(--muted);
  margin:12px 10px 4px; display:flex; gap:7px; align-items:baseline;
}
.nav-foot{margin-top:24px;padding:0 10px}
.linkish{
  background:none;border:none;color:var(--muted);font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;
}
.linkish:hover{color:var(--bad)}

#main{
  flex:1 1 auto; min-width:0; padding:26px 30px 90px; max-width:920px; margin:0 auto;
}
#main:focus{outline:none}

@media (max-width: 900px){
  #navToggle{display:grid}
  #sidebar{
    position:fixed; top:var(--topbar-h); left:0; z-index:35;
    transform:translateX(-100%); transition:transform .18s ease; box-shadow:var(--shadow);
  }
  body.nav-open #sidebar{transform:none}
  body.nav-open #scrim{
    display:block; position:fixed; inset:var(--topbar-h) 0 0 0; z-index:30;
    background:rgba(10,14,25,.45);
  }
  #main{padding:20px 16px 80px}
}

/* ---------- typography ---------- */
h1{font-size:27px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:34px 0 10px;letter-spacing:-.005em}
h3{font-size:16.5px;margin:22px 0 6px}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin:4px 0}
li>strong:first-child{color:var(--text)}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.lead{color:var(--muted);font-size:15.5px;margin-bottom:18px}
.eyebrow{
  font-family:var(--mono); font-size:12px; color:var(--accent); font-weight:600;
  text-transform:uppercase; letter-spacing:.07em; margin-bottom:2px;
}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; margin:0 0 16px; box-shadow:var(--shadow);
}
.card.tight{padding:14px 16px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

/* ---------- callouts ---------- */
.callout{
  border-left:4px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; padding:12px 14px; margin:14px 0; font-size:15px;
}
.callout p:last-child{margin-bottom:0}
.callout .clabel{
  display:block; font-size:11.5px; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; margin-bottom:4px; color:var(--accent);
}
.callout.tip{border-color:var(--tip);background:var(--tip-soft)}
.callout.tip .clabel{color:var(--tip)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.warn .clabel{color:var(--warn)}
.callout.eg{border-color:var(--good);background:var(--good-soft)}
.callout.eg .clabel{color:var(--good)}

.formula{
  font-family:var(--mono); font-size:14.5px; background:var(--surface-2);
  border:1px dashed var(--border); border-radius:10px; padding:11px 14px; margin:12px 0;
  overflow-x:auto; white-space:pre-wrap;
}

/* ---------- tables ---------- */
.twrap{overflow-x:auto; margin:14px 0; border:1px solid var(--border); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:14.5px; background:var(--surface)}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
th{background:var(--surface-2); font-weight:650; white-space:nowrap}
tr:last-child td{border-bottom:none}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-block; font-size:12px; font-weight:600; padding:2px 9px;
  border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap;
}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{
  font-size:13px; padding:5px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  font-family:inherit;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:inherit; font-size:14.5px; font-weight:600; padding:9px 17px;
  border-radius:10px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); cursor:pointer; text-decoration:none;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:6px 12px}
.btn.wide{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 0}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.good>i{background:var(--good)}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; text-align:left;
}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:750;line-height:1.15;margin-top:3px;letter-spacing:-.02em}
.stat .s{font-size:12.5px;color:var(--muted)}

/* ---------- topic list ---------- */
.topic-row{
  display:flex; align-items:center; gap:12px; padding:11px 14px;
  border:1px solid var(--border); border-radius:11px; background:var(--surface);
  text-decoration:none; color:var(--text); margin-bottom:8px;
}
.topic-row:hover{border-color:var(--accent)}
.topic-row .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:30px}
.topic-row .t{flex:1;font-size:15px;font-weight:550}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);flex:0 0 auto}
.dot.c1{background:var(--bad)}
.dot.c2{background:var(--warn)}
.dot.c3{background:var(--good)}

/* ---------- confidence picker ---------- */
.conf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conf button{
  font-family:inherit;font-size:13.5px;padding:7px 14px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;
}
.conf button[aria-pressed="true"]{color:#fff;border-color:transparent}
.conf button[data-c="1"][aria-pressed="true"]{background:var(--bad)}
.conf button[data-c="2"][aria-pressed="true"]{background:var(--warn)}
.conf button[data-c="3"][aria-pressed="true"]{background:var(--good)}

/* ---------- flashcards ---------- */
.deck{
  min-height:230px; display:flex; flex-direction:column; justify-content:center;
  text-align:center; padding:34px 24px; cursor:pointer; user-select:none;
}
.deck .side{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.deck .front{font-size:24px;font-weight:700;margin:14px 0;letter-spacing:-.01em}
.deck .back{font-size:16.5px;color:var(--text);max-width:52ch;margin:0 auto}
.deck .hintline{font-size:12.5px;color:var(--muted);margin-top:16px}

/* ---------- quiz ---------- */
.qtext{font-size:17px;font-weight:600;margin:0 0 14px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  font-family:inherit; font-size:15px; padding:12px 14px; border-radius:11px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .letter{
  font-family:var(--mono); font-weight:700; font-size:13px; color:var(--muted);
  border:1px solid var(--border); border-radius:6px; width:23px; height:23px;
  display:grid; place-items:center; flex:0 0 auto; margin-top:1px;
}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.correct .letter{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .letter{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;font-size:14.5px}

/* ---------- written practice ---------- */
.stem{
  background:var(--surface-2); border-left:4px solid var(--muted);
  border-radius:0 10px 10px 0; padding:12px 14px; margin:0 0 14px;
  font-size:15px; line-height:1.55;
}
.scheme{display:flex;flex-direction:column;gap:7px;margin-top:10px}
label.tick{
  display:flex; gap:11px; align-items:flex-start; cursor:pointer;
  padding:10px 13px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); font-size:14.5px; line-height:1.5;
}
label.tick:hover{border-color:var(--accent)}
label.tick.on{background:var(--good-soft);border-color:var(--good)}
label.tick input{
  width:17px;height:17px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--good);cursor:pointer;
}
textarea{resize:vertical;min-height:70px;line-height:1.6;font-size:15px}

/* ---------- case study ---------- */
.casebar{
  position:sticky; top:var(--topbar-h); z-index:20; background:var(--surface);
  border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.timer{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.02em}
.timer.low{color:var(--bad)}
.case-text{font-size:15.5px;line-height:1.65}
.case-text p{margin:0 0 11px}
.appendix{
  border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  margin:14px 0; background:var(--surface);
}
.appendix h4{
  margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--accent); font-weight:800;
}
.qcard{border-left:4px solid var(--accent)}

/* ---------- inputs ---------- */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=number],input[type=search],select,textarea{
  font-family:inherit; font-size:15px; width:100%; padding:9px 12px;
  border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field{margin-bottom:12px}
.out{
  font-family:var(--mono); font-size:15px; background:var(--surface-2);
  border-radius:10px; padding:13px 15px; margin-top:6px; white-space:pre-wrap; overflow-x:auto;
}
.out b{color:var(--accent)}

/* ---------- diagrams ---------- */
figure.dia{
  margin:18px 0; padding:14px 14px 10px; background:var(--surface);
  border:1px solid var(--border); border-radius:12px; overflow-x:auto;
}
figure.dia svg{display:block;width:100%;height:auto;min-width:420px}
figure.dia figcaption{
  font-size:12.5px; color:var(--muted); margin-top:10px; padding-top:9px;
  border-top:1px solid var(--border); line-height:1.5;
}

/* ---------- chart ---------- */
.chartwrap{margin-top:14px;overflow-x:auto}
svg.chart{display:block;max-width:100%;height:auto;font-size:11px}
svg.chart text{fill:var(--muted)}
svg.chart .axis{stroke:var(--border);stroke-width:1}
svg.chart .grid{stroke:var(--border);stroke-width:.5;stroke-dasharray:3 3}

/* ---------- search modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,25,.5);display:grid;place-items:start center;padding:12vh 16px 16px}
.modal[hidden]{display:none}
.modal-card{
  width:min(640px,100%); background:var(--surface); border:1px solid var(--border);
  border-radius:16px; box-shadow:var(--shadow); padding:14px; max-height:70vh;
  display:flex; flex-direction:column;
}
#searchResults{overflow-y:auto;margin-top:10px}
#searchResults a{
  display:block;padding:9px 11px;border-radius:9px;text-decoration:none;color:var(--text);
}
#searchResults a:hover,#searchResults a.sel{background:var(--accent-soft)}
#searchResults .r-t{font-size:14.5px;font-weight:600}
#searchResults .r-s{font-size:12.5px;color:var(--muted)}
.modal-hint{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:14px;text-align:center}

/* ---------- misc ---------- */
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{text-decoration:none}
.pagenav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pagenav a{
  flex:1 1 200px;text-decoration:none;color:var(--text);border:1px solid var(--border);
  border-radius:11px;padding:11px 14px;background:var(--surface);
}
.pagenav a:hover{border-color:var(--accent)}
.pagenav .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.pagenav .ttl{font-size:14.5px;font-weight:600}
.pagenav .r{text-align:right}
hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.mt0{margin-top:0}
</style>

<body>

<a class="skip" href="#main">Skip to content</a>

<header id="topbar">
  <button id="navToggle" class="icon-btn" aria-label="Menu" aria-expanded="false">☰</button>
  <a class="brand" href="#/">
    <span class="brand-mark">0450</span>
    <span class="brand-text">Business Studies</span>
  </a>
  <div class="spacer"></div>
  <button id="searchBtn" class="icon-btn" aria-label="Search" title="Search (press /)">🔎</button>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Light / dark">◐</button>
</header>

<div id="shell">
  <nav id="sidebar" aria-label="Sections">
    <div class="nav-group">
      <a href="#/" data-nav="home">🏠 <span>Dashboard</span></a>
      <a href="#/notes" data-nav="notes">📖 <span>Notes</span></a>
      <a href="#/cards" data-nav="cards">🗂 <span>Flashcards</span></a>
      <a href="#/quiz" data-nav="quiz">✍️ <span>Quiz</span></a>
      <a href="#/written" data-nav="written">📝 <span>Written practice</span></a>

    <div class="nav-head">Syllabus</div>

</div>

<div id="searchModal" class="modal" hidden>

    <input id="searchInput" type="search" placeholder="Search notes, terms, topics…" autocomplete="off"/>
    <div id="searchResults"></div>
    <div class="modal-hint">Enter to open first result · Esc to close</div>
  </div>

<script>
/* ===== js/store.js ===== */
/* store.js — namespace, localStorage progress, spaced-repetition scheduling */

var BS = {
  units: [
    { n: 1, title: 'Understanding business activity' },
    { n: 2, title: 'People in business' },
    { n: 3, title: 'Marketing' },
    { n: 4, title: 'Operations management' },
    { n: 5, title: 'Financial information and decisions' },
    { n: 6, title: 'External influences on business activity' }
  ],
  notes: [],   // filled by js/notes/u*.js
  glossary: [], // filled by js/glossary.js
  quiz: [],    // filled by js/quizbank.js
  exam: {}     // filled by js/exam.js
};

BS.addTopic = function (t) { BS.notes.push(t); };
BS.topic = function (id) { return BS.notes.filter(function (t) { return t.id === id; })[0]; };
BS.unitTopics = function (n) { return BS.notes.filter(function (t) { return t.unit === n; }); };

/* ------------------------------------------------------------------ */
/* Persistence                                                         */
/* ------------------------------------------------------------------ */

BS.store = (function () {
  var KEY = 'bs0450.v1';
  var blank = {
    conf: {},        // topicId -> 1|2|3
    read: {},        // topicId -> timestamp
    cards: {},       // termId  -> { box:1..5, due:ts, seen:n, right:n }
    quiz: {},        // questionId -> { tries:n, right:n, lastOk:bool }
    written: {},     // writtenId  -> { tries:n, best:n, last:n, outOf:n, text:'' }
    cases: {},       // caseId.qIndex -> { best:n, outOf:n, text:'' }
    sessions: [],    // { t:ts, kind:'quiz'|'cards', score:n, total:n }
    days: {},        // 'YYYY-MM-DD' -> count of studied items
    theme: null
  };
  var data;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      data = raw ? JSON.parse(raw) : null;
    } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = JSON.parse(JSON.stringify(blank));
    for (var k in blank) if (!(k in data)) data[k] = JSON.parse(JSON.stringify(blank[k]));
    return data;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode */ }
  }

  load();

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function tick(n) {
    var d = today();
    data.days[d] = (data.days[d] || 0) + (n || 1);
    save();
  }

  return {
    all: function () { return data; },
    save: save,
    today: today,
    tick: tick,

    conf: function (id, v) {
      if (v === undefined) return data.conf[id] || 0;
      if (v === 0) delete data.conf[id]; else data.conf[id] = v;
      save();
      return v;
    },
    markRead: function (id) {
      if (!data.read[id]) { data.read[id] = Date.now(); save(); }
    },
    isRead: function (id) { return !!data.read[id]; },

    card: function (id) {
      return data.cards[id] || { box: 0, due: 0, seen: 0, right: 0 };
    },
    gradeCard: function (id, ok) {
      var c = data.cards[id] || { box: 0, due: 0, seen: 0, right: 0 };
      c.seen++;
      if (ok) { c.right++; c.box = Math.min(5, (c.box || 0) + 1); }
      else { c.box = 1; }
      // Leitner intervals in days for boxes 1..5
      var days = [0, 1, 2, 4, 8, 16][c.box] || 1;
      c.due = Date.now() + days * 864e5;
      data.cards[id] = c;
      save();
      return c;
    },
    dueCards: function (ids) {
      var now = Date.now();
      return ids.filter(function (id) {
        var c = data.cards[id];
        return !c || c.due <= now;
      });
    },

    gradeQuestion: function (id, ok) {
      var q = data.quiz[id] || { tries: 0, right: 0, lastOk: false };
      q.tries++; if (ok) q.right++;
      q.lastOk = !!ok;
      data.quiz[id] = q;
      save();
    },
    question: function (id) { return data.quiz[id] || { tries: 0, right: 0, lastOk: false }; },

    written: function (id) { return data.written[id] || { tries: 0, best: 0, last: 0, outOf: 0, text: '' }; },
    saveWritten: function (id, score, outOf, text) {
      var w = data.written[id] || { tries: 0, best: 0, last: 0, outOf: 0, text: '' };
      w.tries++;
      w.last = score;
      w.best = Math.max(w.best, score);
      w.outOf = outOf;
      w.text = (text || '').slice(0, 4000);
      data.written[id] = w;
      save();
      return w;
    },
    caseAns: function (key) { return data.cases[key] || { best: 0, outOf: 0, text: '' }; },
    saveCase: function (key, score, outOf, text) {
      var c = data.cases[key] || { best: 0, outOf: 0, text: '' };
      c.best = Math.max(c.best, score);
      c.outOf = outOf;
      c.text = (text || '').slice(0, 8000);
      data.cases[key] = c;
      save();
      return c;
    },

    logSession: function (kind, score, total) {
      data.sessions.push({ t: Date.now(), kind: kind, score: score, total: total });
      if (data.sessions.length > 200) data.sessions = data.sessions.slice(-200);
      save();
    },

    streak: function () {
      var n = 0, d = new Date();
      for (;;) {
        var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (data.days[key]) { n++; d.setDate(d.getDate() - 1); }
        else if (n === 0) { // allow today to be empty and count back from yesterday
          d.setDate(d.getDate() - 1);
          var k2 = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          if (!data.days[k2]) return 0;
        } else return n;
        if (n > 400) return n;
      }
    },

    theme: function (v) {
      if (v === undefined) return data.theme;
      data.theme = v; save(); return v;
    },

    reset: function () {
      data = JSON.parse(JSON.stringify(blank));
      save();
    }
  };
})();
</script>
<script>
/* ===== js/diagrams.js ===== */
/* diagrams.js — theme-aware inline SVG for the diagrams you can be asked to draw
   or interpret. Every diagram uses CSS custom properties so it works in both
   light and dark themes. Used from note bodies as { diagram: 'plc' }.         */

var DIA = (function () {

  function wrap(vb, inner, caption) {
    return '<figure class="dia"><svg class="chart" viewBox="' + vb + '" role="img" aria-label="' +
      String(caption).replace(/"/g, '') + '">' + inner + '</svg>' +
      '<figcaption>' + caption + '</figcaption></figure>';
  }
  function txt(x, y, s, opt) {
    opt = opt || {};
    return '<text x="' + x + '" y="' + y + '"' +
      ' text-anchor="' + (opt.a || 'middle') + '"' +
      ' font-size="' + (opt.s || 11) + '"' +
      ' font-weight="' + (opt.w || 400) + '"' +
      (opt.f ? ' fill="' + opt.f + '"' : '') +
      (opt.r ? ' transform="rotate(' + opt.r + ' ' + x + ' ' + y + ')"' : '') +
      '>' + s + '</text>';
  }
  function ln(x1, y1, x2, y2, col, w, dash) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
      '" stroke="' + (col || 'var(--border)') + '" stroke-width="' + (w || 1) + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  }
  function path(d, col, w, dash) {
    return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w || 2.4) + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  function box(x, y, w, h, label, opt) {
    opt = opt || {};
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="7" fill="' + (opt.fill || 'var(--surface-2)') + '" stroke="' + (opt.stroke || 'var(--border)') +
      '" stroke-width="1.2"/>' +
      label.split('\n').map(function (l, i, arr) {
        return txt(x + w / 2, y + h / 2 + 4 + (i - (arr.length - 1) / 2) * 13, l, { s: opt.s || 11.5, w: opt.w || 600 });
      }).join('');
  }
  function arrow(x1, y1, x2, y2) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
      '" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>';
  }
  var DEFS = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>';

  var D = {};

  /* ---------- 1.1 inputs → process → outputs ---------- */
  D.transformation = function () {
    var s = DEFS;
    s += box(14, 34, 150, 76, 'INPUTS', { fill: 'var(--accent-soft)', stroke: 'var(--accent)', w: 700 });
    s += txt(89, 74, 'land · labour', { s: 10.5 });
    s += txt(89, 88, 'capital · enterprise', { s: 10.5 });
    s += box(225, 34, 150, 76, 'PROCESS', { fill: 'var(--surface-2)', w: 700 });
    s += txt(300, 74, 'manufacturing,', { s: 10.5 });
    s += txt(300, 88, 'assembling, serving', { s: 10.5 });
    s += box(436, 34, 150, 76, 'OUTPUTS', { fill: 'var(--good-soft)', stroke: 'var(--good)', w: 700 });
    s += txt(511, 74, 'goods and', { s: 10.5 });
    s += txt(511, 88, 'services', { s: 10.5 });
    s += arrow(170, 72, 219, 72) + arrow(381, 72, 430, 72);
    s += txt(300, 132, 'Value is added at the process stage — that is what the business is paid for', { s: 10.5, f: 'var(--muted)' });
    return wrap('0 0 600 150', s, 'Every business is a transformation process: it buys inputs, changes them, and sells the output for more than the materials cost.');
  };

  /* ---------- 2.1 Maslow ---------- */
  D.maslow = function () {
    var s = '', levels = [
      ['Self-actualisation', 'challenging work, promotion, creativity', 'var(--tip)'],
      ['Esteem', 'praise, recognition, job title, status', 'var(--accent)'],
      ['Social', 'teamwork, belonging, communication', 'var(--good)'],
      ['Safety', 'job security, safe conditions, permanent contract', 'var(--warn)'],
      ['Physical', 'enough pay for food, shelter and warmth', 'var(--bad)']
    ];
    var cx = 215, top = 16, bot = 250, halfBase = 165;
    for (var i = 0; i < 5; i++) {
      var y1 = top + (bot - top) * i / 5, y2 = top + (bot - top) * (i + 1) / 5;
      var w1 = halfBase * (i / 5), w2 = halfBase * ((i + 1) / 5);
      s += '<polygon points="' + (cx - w1) + ',' + y1 + ' ' + (cx + w1) + ',' + y1 + ' ' +
        (cx + w2) + ',' + y2 + ' ' + (cx - w2) + ',' + y2 + '" fill="' + levels[i][2] +
        '" opacity="' + (0.14 + i * 0.04) + '" stroke="' + levels[i][2] + '" stroke-width="1.3"/>';
      s += txt(cx, (y1 + y2) / 2 + 1, levels[i][0], { s: 12, w: 700 });
      s += txt(400, (y1 + y2) / 2 + 4, levels[i][1], { a: 'start', s: 10.5, f: 'var(--muted)' });
      s += ln(cx + w2 + 4, (y1 + y2) / 2, 394, (y1 + y2) / 2, 'var(--border)', 1, '3 3');
    }
    s += txt(30, 30, 'satisfied last', { a: 'start', s: 10, f: 'var(--muted)' });
    s += txt(30, 244, 'satisfied first', { a: 'start', s: 10, f: 'var(--muted)' });
    return wrap('0 0 690 262', s, 'Maslow: a need only motivates until it is satisfied, then the person moves up. Match each level to something the business actually provides.');
  };

  /* ---------- 2.2 tall vs flat ---------- */
  D.structures = function () {
    var s = DEFS;
    function node(x, y, w) { return '<rect x="' + x + '" y="' + y + '" width="' + (w || 34) + '" height="17" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.1"/>'; }
    /* tall: 1 - 2 - 4 - 8 */
    s += txt(150, 16, 'TALL — narrow span, long chain', { s: 12, w: 700 });
    var rows = [[1, 30], [2, 62], [4, 94], [8, 126]];
    rows.forEach(function (r, ri) {
      var n = r[0], y = r[1], gapw = 280 / n;
      for (var i = 0; i < n; i++) {
        var x = 12 + gapw * i + gapw / 2 - 17;
        s += node(x, y, 34);
        if (ri > 0) {
          var pn = rows[ri - 1][0], pgap = 280 / pn, pi = Math.floor(i / (n / pn));
          var pxc = 12 + pgap * pi + pgap / 2;
          s += ln(pxc, rows[ri - 1][1] + 17, x + 17, y, 'var(--border)', 1.2);
        }
      }
    });
    s += txt(150, 162, '4 levels · span of 2 · slow, distorted communication', { s: 10.5, f: 'var(--muted)' });

    /* flat: 1 - 8 */
    s += txt(460, 16, 'FLAT — wide span, short chain', { s: 12, w: 700 });
    s += node(443, 46, 34);
    for (var j = 0; j < 8; j++) {
      var fx = 322 + (280 / 8) * j + (280 / 8) / 2 - 17;
      s += node(fx, 110, 34);
      s += ln(460, 63, fx + 17, 110, 'var(--border)', 1.2);
    }
    s += txt(460, 162, '2 levels · span of 8 · fast, but managers stretched', { s: 10.5, f: 'var(--muted)' });
    s += ln(305, 8, 305, 172, 'var(--border)', 1, '4 4');
    return wrap('0 0 620 176', s, 'The same eight workers, two structures. Delayering turns the left into the right: cheaper and faster, but each manager now supervises eight people instead of two.');
  };

  /* ---------- 3.3 product life cycle ---------- */
  D.plc = function () {
    var s = DEFS, L = 58, Rr = 22, W = 660, H = 350;
    var x0 = L, x1 = W - Rr;
    var top = 26;          /* top of the plot area          */
    var zero = 236;        /* the zero line for BOTH curves */
    var lossBot = 288;     /* bottom of the loss zone       */

    /* stage bands */
    var stages = [
      ['Development', 0, 0.14], ['Introduction', 0.14, 0.30],
      ['Growth', 0.30, 0.50], ['Maturity', 0.50, 0.79], ['Decline', 0.79, 1]
    ];
    stages.forEach(function (st, i) {
      var a = x0 + (x1 - x0) * st[1], b = x0 + (x1 - x0) * st[2];
      if (i % 2 === 0) s += '<rect x="' + a + '" y="' + top + '" width="' + (b - a) + '" height="' + (lossBot - top) + '" fill="var(--surface-2)" opacity=".6"/>';
      if (i) s += ln(a, top, a, lossBot, 'var(--border)', 1, '3 3');
      s += txt((a + b) / 2, lossBot + 17, st[0], { s: 11, w: 700 });
    });

    /* loss zone below the zero line */
    s += '<rect x="' + x0 + '" y="' + zero + '" width="' + (x1 - x0) + '" height="' + (lossBot - zero) + '" fill="var(--bad)" opacity=".10"/>';
    s += txt(x0 + 26, lossBot - 8, 'LOSS', { a: 'start', s: 10, w: 800, f: 'var(--bad)' });

    var f = (x1 - x0) / 560; /* horizontal scale factor */
    function X(u) { return x0 + u * f; }

    /* sales: zero through development, slow rise, steep growth, plateau, decline */
    s += path('M' + X(0) + ',' + zero +
      ' L' + X(78) + ',' + zero +
      ' C' + X(108) + ',' + (zero - 8) + ' ' + X(138) + ',' + (zero - 30) + ' ' + X(172) + ',' + (zero - 60) +
      ' C' + X(212) + ',' + (zero - 96) + ' ' + X(252) + ',' + (zero - 158) + ' ' + X(300) + ',' + (zero - 180) +
      ' C' + X(354) + ',' + (zero - 202) + ' ' + X(412) + ',' + (zero - 200) + ' ' + X(450) + ',' + (zero - 188) +
      ' C' + X(490) + ',' + (zero - 176) + ' ' + X(524) + ',' + (zero - 118) + ' ' + X(558) + ',' + (zero - 66),
      'var(--accent)', 2.8);

    /* profit: negative through development and introduction, crosses zero in growth,
       peaks in maturity, falls back to a loss in decline */
    s += path('M' + X(0) + ',' + (zero + 16) +
      ' C' + X(34) + ',' + (zero + 34) + ' ' + X(62) + ',' + (zero + 44) + ' ' + X(96) + ',' + (zero + 42) +
      ' C' + X(128) + ',' + (zero + 40) + ' ' + X(150) + ',' + (zero + 24) + ' ' + X(178) + ',' + zero +
      ' C' + X(226) + ',' + (zero - 40) + ' ' + X(276) + ',' + (zero - 96) + ' ' + X(340) + ',' + (zero - 112) +
      ' C' + X(400) + ',' + (zero - 126) + ' ' + X(440) + ',' + (zero - 110) + ' ' + X(472) + ',' + (zero - 80) +
      ' C' + X(508) + ',' + (zero - 46) + ' ' + X(534) + ',' + (zero - 4) + ' ' + X(558) + ',' + (zero + 26),
      'var(--good)', 2.6);

    /* zero-crossing marker for the profit curve */
    s += '<circle cx="' + X(178) + '" cy="' + zero + '" r="4.5" fill="var(--good)"/>';
    s += txt(X(178) + 8, zero + 17, 'profit turns positive', { a: 'start', s: 9.5, w: 600, f: 'var(--good)' });

    /* axes */
    s += ln(x0, top, x0, lossBot, 'var(--border)', 1.4);
    s += ln(x0, zero, x1, zero, 'var(--border)', 1.6);
    s += txt(x0 - 8, zero + 4, '0', { a: 'end', s: 11, w: 700, f: 'var(--muted)' });
    s += txt((x0 + x1) / 2, H - 8, 'Time', { s: 11.5, w: 600 });
    s += txt(16, (top + lossBot) / 2, 'Sales and profit ($)', { s: 11.5, w: 600, r: -90 });

    /* curve labels */
    s += txt(X(318), zero - 194, 'SALES', { s: 12, w: 800, f: 'var(--accent)' });
    s += txt(X(346), zero - 122, 'PROFIT', { s: 12, w: 800, f: 'var(--good)' });
    return wrap('0 0 660 350', s,
      'Sales and profit are two different curves, and profit lags behind. Profit is negative right through development and introduction — the launch costs have not been recovered — crosses zero during growth, peaks at maturity, then falls back into loss as the product declines.');
  };

  /* ---------- 3.3 extension strategies ---------- */
  D.extension = function () {
    var s = DEFS, L = 46, T = 20, W = 600, H = 230, y0 = H - 44, x1 = W - 20;
    s += ln(L, T, L, y0, 'var(--border)', 1.4) + ln(L, y0, x1, y0, 'var(--border)', 1.4);
    /* base curve declining */
    s += path('M' + L + ',' + y0 + ' C' + (L + 70) + ',' + (y0 - 20) + ' ' + (L + 120) + ',' + (y0 - 120) + ' ' + (L + 200) + ',' + (y0 - 140) +
      ' C' + (L + 260) + ',' + (y0 - 152) + ' ' + (L + 300) + ',' + (y0 - 148) + ' ' + (L + 330) + ',' + (y0 - 140), 'var(--accent)', 2.6);
    /* without extension: falls away */
    s += path('M' + (L + 330) + ',' + (y0 - 140) + ' C' + (L + 380) + ',' + (y0 - 120) + ' ' + (L + 420) + ',' + (y0 - 50) + ' ' + (L + 470) + ',' + (y0 - 14),
      'var(--muted)', 2.2, '6 5');
    /* with extension: stepped revival */
    s += path('M' + (L + 330) + ',' + (y0 - 140) + ' C' + (L + 360) + ',' + (y0 - 162) + ' ' + (L + 390) + ',' + (y0 - 150) + ' ' + (L + 420) + ',' + (y0 - 158) +
      ' C' + (L + 460) + ',' + (y0 - 168) + ' ' + (L + 490) + ',' + (y0 - 140) + ' ' + (L + 530) + ',' + (y0 - 150), 'var(--good)', 2.8);
    s += '<circle cx="' + (L + 330) + '" cy="' + (y0 - 140) + '" r="4.5" fill="var(--text)"/>';
    s += txt(L + 330, y0 - 152, 'extension strategies applied here', { s: 10, f: 'var(--muted)' });
    s += txt(L + 480, y0 - 172, 'with extension', { s: 11, w: 700, f: 'var(--good)' });
    s += txt(L + 462, y0 - 4, 'without', { s: 11, w: 700, f: 'var(--muted)' });
    s += txt((L + x1) / 2, H - 8, 'Time', { s: 11.5, w: 600 });
    s += txt(14, (T + y0) / 2, 'Sales', { s: 11.5, w: 600, r: -90 });
    return wrap('0 0 600 230', s, 'Extension strategies — new versions, new packaging, new markets, a new campaign or a price cut — hold sales up instead of letting the product slide into decline.');
  };

  /* ---------- 3.3 channels of distribution ---------- */
  D.channels = function () {
    var s = DEFS, rows = [
      ['Producer', 'Consumer'],
      ['Producer', 'Retailer', 'Consumer'],
      ['Producer', 'Wholesaler', 'Retailer', 'Consumer'],
      ['Producer', 'Agent', 'Retailer', 'Consumer']
    ];
    var notes = ['Most control and all the profit — but the producer must sell and deliver itself',
      'Retailer reaches many customers, but takes a margin',
      'Wholesaler breaks bulk and holds stock — two margins taken',
      'Used to sell abroad: local knowledge and contacts, paid by commission'];
    rows.forEach(function (r, ri) {
      var y = 14 + ri * 62;
      var bw = 92, gap = 34;
      r.forEach(function (label, i) {
        var x = 12 + i * (bw + gap);
        var isEnd = (i === r.length - 1);
        s += box(x, y, bw, 30, label, {
          fill: i === 0 ? 'var(--accent-soft)' : isEnd ? 'var(--good-soft)' : 'var(--surface-2)',
          stroke: i === 0 ? 'var(--accent)' : isEnd ? 'var(--good)' : 'var(--border)', s: 11
        });
        if (i) s += arrow(x - gap + 2, y + 15, x - 4, y + 15);
      });
      s += txt(12, y + 48, notes[ri], { a: 'start', s: 10, f: 'var(--muted)' });
    });
    return wrap('0 0 520 262', s, 'The more intermediaries, the wider the reach but the less control the producer keeps and the more margin it gives away.');
  };

  /* ---------- 4.2 break-even (generic, labelled) ---------- */
  D.breakeven = function () {
    var s = DEFS, L = 62, Rr = 130, T = 20, B = 46, W = 620, H = 300;
    var x0 = L, x1 = W - Rr, y0 = H - B;
    var fcY = y0 - 52, tcEnd = y0 - 150, trEnd = y0 - 240;
    /* intersection of TR (0,y0)->(x1,trEnd) and TC (0,fcY)->(x1,tcEnd) */
    var mTR = (trEnd - y0) / (x1 - x0), mTC = (tcEnd - fcY) / (x1 - x0);
    var bx = x0 + (fcY - y0) / (mTR - mTC), by = y0 + mTR * (bx - x0);

    s += '<polygon points="' + bx + ',' + by + ' ' + x1 + ',' + trEnd + ' ' + x1 + ',' + tcEnd + '" fill="var(--good)" opacity=".17"/>';
    s += '<polygon points="' + x0 + ',' + y0 + ' ' + bx + ',' + by + ' ' + x0 + ',' + fcY + '" fill="var(--bad)" opacity=".17"/>';
    s += txt((bx + x1) / 2 + 10, (trEnd + tcEnd) / 2 + 4, 'PROFIT', { s: 11.5, w: 800, f: 'var(--good)' });
    s += txt(x0 + 44, (y0 + fcY) / 2 + 12, 'LOSS', { s: 11.5, w: 800, f: 'var(--bad)' });

    s += ln(x0, fcY, x1, fcY, 'var(--muted)', 2, '5 4');
    s += path('M' + x0 + ',' + fcY + ' L' + x1 + ',' + tcEnd, 'var(--bad)', 2.6);
    s += path('M' + x0 + ',' + y0 + ' L' + x1 + ',' + trEnd, 'var(--accent)', 2.6);

    s += ln(x0, T, x0, y0, 'var(--border)', 1.4) + ln(x0, y0, x1, y0, 'var(--border)', 1.4);
    s += ln(bx, by, bx, y0, 'var(--text)', 1.2, '3 3');
    s += '<circle cx="' + bx + '" cy="' + by + '" r="5" fill="var(--text)"/>';
    s += txt(bx, y0 + 16, 'break-even output', { s: 10.5, w: 700 });

    s += txt(x1 + 6, trEnd + 4, 'Total revenue', { a: 'start', s: 11, w: 700, f: 'var(--accent)' });
    s += txt(x1 + 6, tcEnd + 4, 'Total costs', { a: 'start', s: 11, w: 700, f: 'var(--bad)' });
    s += txt(x1 + 6, fcY + 4, 'Fixed costs', { a: 'start', s: 11, w: 700, f: 'var(--muted)' });
    s += txt(x0 - 8, y0 + 4, '0', { a: 'end', s: 10, f: 'var(--muted)' });
    s += txt((x0 + x1) / 2, H - 8, 'Output (units)', { s: 11.5, w: 600 });
    s += txt(16, (T + y0) / 2, 'Costs and revenue ($)', { s: 11.5, w: 600, r: -90 });

    /* margin of safety */
    var mx = x0 + (x1 - x0) * 0.82;
    s += ln(mx, T + 6, mx, y0, 'var(--border)', 1, '3 3');
    s += txt(mx, T + 2, 'current output', { s: 9.5, f: 'var(--muted)' });
    s += '<line x1="' + bx + '" y1="' + (y0 - 10) + '" x2="' + mx + '" y2="' + (y0 - 10) + '" stroke="var(--warn)" stroke-width="2" marker-end="url(#ah)"/>';
    s += txt((bx + mx) / 2, y0 - 15, 'margin of safety', { s: 9.5, w: 700, f: 'var(--warn)' });
    return wrap('0 0 620 300', s, 'The two starting points examiners look for: total revenue starts at the ORIGIN, total costs start at the level of FIXED COSTS.');
  };

  /* ---------- 4.2 average cost curve ---------- */
  D.avgcost = function () {
    var s = DEFS, L = 56, T = 20, W = 580, H = 260, y0 = H - 46, x1 = W - 24;
    var minX = L + (x1 - L) * 0.52, minY = y0 - 62;
    s += path('M' + (L + 14) + ',' + (y0 - 190) + ' C' + (L + 90) + ',' + (y0 - 110) + ' ' + (minX - 70) + ',' + minY + ' ' + minX + ',' + minY +
      ' C' + (minX + 80) + ',' + minY + ' ' + (x1 - 70) + ',' + (y0 - 108) + ' ' + (x1 - 8) + ',' + (y0 - 178), 'var(--accent)', 2.8);
    s += ln(L, T, L, y0, 'var(--border)', 1.4) + ln(L, y0, x1, y0, 'var(--border)', 1.4);
    s += ln(minX, minY, minX, y0, 'var(--border)', 1.2, '3 3');
    s += ln(L, minY, minX, minY, 'var(--border)', 1.2, '3 3');
    s += '<circle cx="' + minX + '" cy="' + minY + '" r="5" fill="var(--text)"/>';
    s += txt(minX, y0 + 17, 'optimum output', { s: 10.5, w: 700 });
    s += txt(L - 8, minY + 4, 'lowest', { a: 'end', s: 10, f: 'var(--muted)' });

    s += '<line x1="' + (L + 26) + '" y1="' + (y0 - 210) + '" x2="' + (minX - 20) + '" y2="' + (y0 - 210) + '" stroke="var(--good)" stroke-width="2" marker-end="url(#ah)"/>';
    s += txt((L + minX) / 2, y0 - 216, 'ECONOMIES OF SCALE — unit cost falling', { s: 10.5, w: 700, f: 'var(--good)' });
    s += '<line x1="' + (minX + 20) + '" y1="' + (y0 - 210) + '" x2="' + (x1 - 14) + '" y2="' + (y0 - 210) + '" stroke="var(--bad)" stroke-width="2" marker-end="url(#ah)"/>';
    s += txt((minX + x1) / 2, y0 - 216, 'DISECONOMIES — unit cost rising', { s: 10.5, w: 700, f: 'var(--bad)' });

    s += txt((L + x1) / 2, H - 8, 'Output (units)', { s: 11.5, w: 600 });
    s += txt(16, (T + y0) / 2, 'Average cost per unit ($)', { s: 11.5, w: 600, r: -90 });
    return wrap('0 0 580 260', s, 'Growth only cuts unit costs up to a point. Past the optimum, poor communication and coordination push average cost back up.');
  };

  /* ---------- 6.1 business cycle ---------- */
  D.cycle = function () {
    var s = DEFS, L = 56, T = 22, W = 620, H = 250, y0 = H - 44, x1 = W - 20;
    var mid = (T + y0) / 2;
    /* trend line */
    s += ln(L, mid + 34, x1, mid - 40, 'var(--muted)', 1.4, '6 5');
    s += txt(x1 - 4, mid - 46, 'long-run trend', { a: 'end', s: 10, f: 'var(--muted)' });
    /* wave */
    s += path('M' + L + ',' + (mid + 46) +
      ' C' + (L + 60) + ',' + (mid + 10) + ' ' + (L + 80) + ',' + (mid - 44) + ' ' + (L + 140) + ',' + (mid - 48) +
      ' C' + (L + 195) + ',' + (mid - 52) + ' ' + (L + 210) + ',' + (mid + 34) + ' ' + (L + 270) + ',' + (mid + 46) +
      ' C' + (L + 330) + ',' + (mid + 58) + ' ' + (L + 350) + ',' + (mid - 14) + ' ' + (L + 410) + ',' + (mid - 44) +
      ' C' + (L + 470) + ',' + (mid - 74) + ' ' + (L + 490) + ',' + (mid - 4) + ' ' + (x1 - 6) + ',' + (mid - 18),
      'var(--accent)', 2.8);
    s += ln(L, T, L, y0, 'var(--border)', 1.4) + ln(L, y0, x1, y0, 'var(--border)', 1.4);

    function tag(x, y, label, col) {
      return '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="' + col + '"/>' + txt(x, y - 10, label, { s: 10.5, w: 700, f: col });
    }
    s += tag(L + 140, mid - 48, 'BOOM', 'var(--good)');
    s += tag(L + 270, mid + 46, 'SLUMP', 'var(--bad)');
    s += tag(L + 410, mid - 44, 'BOOM', 'var(--good)');
    s += txt(L + 68, mid + 4, 'growth', { s: 10, f: 'var(--muted)', r: -52 });
    s += txt(L + 208, mid + 6, 'recession', { s: 10, f: 'var(--muted)', r: 46 });
    s += txt(L + 340, mid + 22, 'recovery', { s: 10, f: 'var(--muted)', r: -44 });

    s += txt((L + x1) / 2, H - 8, 'Time', { s: 11.5, w: 600 });
    s += txt(16, (T + y0) / 2, 'Real GDP', { s: 11.5, w: 600, r: -90 });
    return wrap('0 0 620 250', s, 'Boom, recession, slump, recovery — around a rising long-run trend. Which stage the economy is in decides whether a business expands or cuts costs.');
  };

  /* ---------- 6.3 exchange rates ---------- */
  D.spiced = function () {
    var s = DEFS;
    s += box(16, 16, 250, 118, '', { fill: 'var(--accent-soft)', stroke: 'var(--accent)' });
    s += txt(141, 40, 'APPRECIATION', { s: 13, w: 800, f: 'var(--accent)' });
    s += txt(141, 57, 'currency stronger', { s: 10.5, f: 'var(--muted)' });
    s += txt(141, 82, 'Imports  CHEAPER', { s: 12, w: 700 });
    s += txt(141, 101, 'Exports  DEARER', { s: 12, w: 700 });
    s += txt(141, 122, 'good for importers · bad for exporters', { s: 9.5, f: 'var(--muted)' });

    s += box(300, 16, 250, 118, '', { fill: 'var(--warn-soft)', stroke: 'var(--warn)' });
    s += txt(425, 40, 'DEPRECIATION', { s: 13, w: 800, f: 'var(--warn)' });
    s += txt(425, 57, 'currency weaker', { s: 10.5, f: 'var(--muted)' });
    s += txt(425, 82, 'Imports  DEARER', { s: 12, w: 700 });
    s += txt(425, 101, 'Exports  CHEAPER', { s: 12, w: 700 });
    s += txt(425, 122, 'good for exporters · bad for importers', { s: 9.5, f: 'var(--muted)' });

    s += box(150, 150, 266, 34, 'S P I C E D', { fill: 'var(--surface-2)', s: 15, w: 800 });
    s += txt(283, 200, 'Strong Pound → Imports Cheap, Exports Dear', { s: 11.5, w: 600, f: 'var(--muted)' });
    return wrap('0 0 566 214', s, 'Write SPICED at the top of the page before you answer any exchange rate question.');
  };

  return {
    render: function (name) {
      return D[name] ? D[name]() : '';
    },
    names: Object.keys(D)
  };
})();
</script>

BS.addTopic({

  sections: [
    {
      h: 'Needs, wants and scarcity',
      body: [
        'Every economy faces the same basic problem: people\'s wants are unlimited but the resources available to satisfy them are limited. This is **scarcity**, and it is the reason businesses exist at all.',
        { defs: [
          ['Needs', 'Goods and services essential for survival: food, water, shelter, clothing, warmth. Without them a person cannot live.'],
          ['Wants', 'Goods and services people would *like* to have but can survive without: a phone, a holiday, branded trainers. Wants are unlimited.'],
          ['Scarcity', 'There are not enough resources to produce everything people want, so choices must be made.'],
          ['Opportunity cost', 'The next best alternative given up when a choice is made.']

        { callout: { k: 'warn', b: 'Opportunity cost is *not* "the money you spent". It is the **best alternative you gave up**. Always name a specific alternative in your answer: "the opportunity cost of buying the delivery van is the new oven the bakery could have bought instead."' } }
      ]
    },
    {
      h: 'Factors of production',
      body: [
        'Businesses combine four scarce resources, called the factors of production, to make goods and services.',
        { table: { head: ['Factor', 'What it is', 'Reward'], rows: [
          ['Land', 'All natural resources: the site, water, oil, minerals, crops', 'Rent'],
          ['Labour', 'The physical and mental effort of workers', 'Wages / salaries'],
          ['Capital', 'Man-made resources used to produce: machinery, vehicles, tools, buildings, finance', 'Interest'],

      ]
    },
    {
      h: 'Specialisation and the division of labour',
      body: [
        '**Specialisation** means people, businesses or countries concentrating on what they do best. Inside a business this becomes the **division of labour**, where production is split into separate tasks and each worker repeats one of them.',
        { table: { head: ['Advantages', 'Disadvantages'], rows: [
          ['Workers become quicker and more skilled at their one task, so output per worker rises', 'Repeating one task is boring, so motivation, quality and effort fall'],
          ['Less time wasted moving between tasks and tools', 'Higher labour turnover and absenteeism as workers get fed up'],
          ['Training is cheaper and faster because each worker learns less', 'If one worker is absent or one stage stops, the whole line can stop'],
          ['Quality improves and unit costs fall as skill builds up', 'Workers become less flexible — they can only do one job']
        ] } },
        { callout: { k: 'eg', b: 'A car factory: one team fits the doors, another sprays the body, another installs the electronics. Each team is far faster at its own stage than one worker building the whole car, so more cars are produced per day.' } }
      ]
    },
    {
      h: 'The purpose of business activity',
      body: [
        'A **business** is any organisation that combines the factors of production to make goods or provide services that satisfy people\'s needs and wants.',
        { list: [
          'It identifies the needs and wants of customers',
          'It buys in the resources (**inputs**) needed to satisfy them',
          'It transforms those inputs into **outputs** — goods or services',
          'It sells the output, usually to make a **profit** for the owners'
        ] },
        { diagram: 'transformation' }
      ]
    },
    {
      h: 'Added value',
      body: [
        '**Added value** is the difference between the selling price of a product and the cost of the bought-in materials and components used to make it.',
        { formula: 'Added value = Selling price − Cost of bought-in materials and components' },
        { callout: { k: 'eg', b: 'A sandwich shop buys bread, cheese and salad for $1.20 and sells the sandwich for $4.50. Added value = $4.50 − $1.20 = **$3.30** per sandwich.' } },
        { callout: { k: 'warn', b: 'Added value is **not profit**. Added value still has to cover all the other costs — wages, rent, electricity, marketing. Profit is what is left after *all* costs. Saying "added value is another word for profit" loses marks.' } },
        { h3: 'Why added value matters' },
        { list: [
          'It is the money available to pay the business\'s other running costs',
          'Whatever is left after those costs is profit for the owners',
          'The more value a business adds, the more it can afford to invest and grow'
        ] },
        { h3: 'How a business can increase added value' },
        { table: { head: ['Method', 'How it works', 'Risk'], rows: [
          ['Raise the selling price', 'Charge more without raising material costs', 'Customers may buy from cheaper rivals unless the product is genuinely better'],
          ['Reduce the cost of materials', 'Find a cheaper supplier, buy in bulk, waste less', 'Cheaper materials may reduce quality and damage the brand'],
          ['Improve the product', 'Better design, features, materials or after-sales service justify a higher price', 'Improvements cost money, so added value may not rise'],
          ['Branding and promotion', 'A strong brand makes customers willing to pay a premium', 'Advertising is an extra cost'],
          ['Better customer service / convenience', 'Fast delivery, personalisation, a nicer environment', 'Needs more staff or training']
        ] } }
      ]
    }
  ],
  terms: ['needs', 'wants', 'scarcity', 'opportunity-cost', 'factors-of-production', 'specialisation', 'division-of-labour', 'added-value'],
  tips: [
    'If a question says "calculate the added value", subtract only the **bought-in materials** — not wages, not rent.',
    'For a 2-mark "define" question give the definition plus a short example. The example is often the second mark.',
    'Opportunity cost questions almost always want a named alternative from the case study, not a general definition.'
  ],
  traps: [
    'Confusing added value with profit.',
    'Saying opportunity cost is "the cost of the item".',
    'Listing division-of-labour advantages without linking them to lower costs or higher output.'

});

BS.addTopic({

          ['**Secondary**', 'Manufacturing and processing raw materials into finished or semi-finished goods; construction', 'Car assembly, baking, steel making, house building'],

      ]
    },
    {
      h: 'Changing sector importance',
      body: [
        { defs: [
          ['De-industrialisation', 'The decline in the importance of the secondary (manufacturing) sector in an economy, and the growth of the tertiary sector.'],
          ['Industrialisation', 'The growing importance of the secondary sector — typical of a developing economy.']
        ] },
        { h3: 'Why the secondary sector declines in richer countries' },
        { list: [
          'Manufacturing moves to countries with **lower labour costs**',
          'Automation and machinery mean **fewer workers** are needed for the same output',
          'As incomes rise, people spend proportionally more on **services** — travel, eating out, entertainment, healthcare',
          'Some raw materials **run out**, closing primary industries'
        ] },
        { h3: 'Why industrialisation happens in developing countries' },
        { list: [

          ['Funded by', 'Owners\' capital, loans, retained profit, share issues', 'Taxation and government borrowing'],
          ['Examples', 'A sole trader shop, a supermarket chain, a bank', 'State schools, public hospitals, the army, some rail and postal services']

        { defs: [
          ['Mixed economy', 'An economy with both a private sector and a public sector. Almost every real economy is mixed.'],
          ['Free-market economy', 'Almost all resources are owned and allocated by the private sector.'],
          ['Planned (command) economy', 'The government owns and allocates almost all resources.'],
          ['Privatisation', 'Selling a public-sector business to the private sector.'],

  ],
  terms: ['primary-sector', 'secondary-sector', 'tertiary-sector', 'de-industrialisation', 'private-sector', 'public-sector', 'mixed-economy', 'privatisation'],
  tips: [
    'Public sector does **not** mean "public limited company". A plc is private sector — the shares are just sold to the public.',
    'When asked why a sector is growing, link the reason to the case-study country\'s stage of development.'
  ],
  traps: [
    'Calling a public limited company "public sector".',
    'Putting construction in the primary sector — it is secondary.'

});

BS.addTopic({
  id: '1.3', unit: 1, title: 'Enterprise, business growth and size',
  syllabus: [
    'Characteristics of successful entrepreneurs and the contents of a business plan',
    'Why and how governments support business start-ups',
    'The methods and problems of measuring business size',
    'Why some businesses grow and others stay small; internal and external growth',
    'Why some businesses fail'
  ],
  sections: [
    {
      h: 'Entrepreneurs',

        'An **entrepreneur** is a person who organises the other factors of production and takes the financial risk of starting and running a business.',
        { h3: 'Characteristics of a successful entrepreneur' },

          '**Risk taker** — willing to lose their own money if the idea fails',
          '**Innovative / creative** — spots gaps in the market and thinks of new ideas',
          '**Hard-working and determined** — long hours, does not give up after setbacks',
          '**Self-confident** — believes in the idea and can persuade banks and investors',

        { h3: 'Benefits and drawbacks of being an entrepreneur' },
        { table: { head: ['Benefits', 'Drawbacks'], rows: [
          ['Independence — be your own boss and make your own decisions', 'Risk of losing your savings if the business fails'],
          ['Keep all the profit', 'Long, unsociable hours and stress'],

      ]
    },
    {
      h: 'The business plan',
      body: [
        'A **business plan** is a written document describing the business, its objectives, strategies, target market and financial forecasts.',
        { h3: 'Typical contents' },
        { list: [
          'Description of the business and its **products / services**',
          'The **owners** and key personnel and their experience',
          '**Market research** findings: the target market, customers and competitors',
          '**Marketing plan** — the marketing mix to be used',
          '**Location** and premises',
          '**Finance**: how much is needed, where it will come from, cash-flow forecast, forecast income statement, break-even'
        ] },
        { h3: 'Why a business plan helps' },
        { list: [
          'Banks and investors will usually **not lend without one** — it shows the idea has been thought through',
          'It forces the entrepreneur to **research** the market before spending money',
          'It sets **targets** so performance can be measured later',
          'It reduces the **risk** of failure by identifying problems early'
        ] }
      ]
    },
    {
      h: 'Government support for start-ups',
      body: [
        { h3: 'Why governments help new businesses' },
        { list: [
          'They create **jobs** and reduce unemployment',
          'They increase **output and GDP**, raising living standards',
          'They increase **choice and competition** for consumers',
          'Some grow into large firms that **export**, improving the balance of payments',
          'More business activity means more **tax revenue**'
        ] },
        { h3: 'How governments help' },
        { list: [
          '**Grants and subsidies** — money that does not have to be repaid',
          '**Low-interest loans** and loan guarantees to banks',
          '**Tax breaks** — lower corporation tax or a tax-free start-up period',
          '**Enterprise zones** — cheap rent or reduced business rates in certain areas',
          '**Training and advice** — free courses, mentoring and business support centres',
          '**Reduced regulation** — simpler paperwork for very small firms'

    },
    {
      h: 'Measuring business size',

        { table: { head: ['Method', 'Limitation'], rows: [
          ['**Number of employees**', 'A capital-intensive firm (an oil refinery) has few workers but is huge; a labour-intensive one (a cleaning firm) has many but is small'],

      ]
    },
    {
      h: 'Why businesses grow — and why some stay small',
      body: [
        { h3: 'Reasons owners want to grow' },
        { list: [
          'Higher **profits** for the owners',

          ['**Forward vertical integration**', 'Joining with a firm at the **next stage** — nearer the customer (a farm buying a supermarket)', 'Guaranteed outlet for products; control of quality and price at point of sale; profit of the retailer'],
          ['**Backward vertical integration**', 'Joining with a firm at the **previous stage** — nearer the raw materials (a baker buying a flour mill)', 'Guaranteed supply, controlled input costs and quality; can restrict supply to rivals'],
          ['**Conglomerate (diversification)**', 'Joining with a firm in a **completely different industry**', 'Spreads risk — a fall in one market does not sink the whole group']
        ] } },
