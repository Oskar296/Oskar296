          'PED = ' + (Math.round(dq * 10) / 10) + ' ÷ ' + (Math.round(dp * 10) / 10) + ' = <b>' + (Math.round(ped * 100) / 100) + '</b>\n\n' +
          '<b>' + verdict + '</b>\n' +
          'Old revenue ' + R.money(p1 * q1) + '  →  new revenue ' + R.money(p2 * q2) +
          '  (' + (p2 * q2 >= p1 * q1 ? 'up' : 'down') + ' ' + R.money(Math.abs(p2 * q2 - p1 * q1)) + ')');
      } else {
        set('pedOut', 'Enter an old and new price that differ, plus the quantities.');
      }

      function set(id, txt) { body.querySelector('#' + id).innerHTML = '<div class="out">' + txt + '</div>'; }
    }
  }
};

window.V = V;
</script>
<script>
/* ===== js/views-home.js ===== */
/* views-home.js — dashboard */

var V = window.V || {};

V.home = function () {
  var s = BS.store, d = s.all();
  var total = BS.notes.length;
  var read = BS.notes.filter(function (t) { return s.isRead(t.id); }).length;

  var confCount = { 1: 0, 2: 0, 3: 0 };
  BS.notes.forEach(function (t) { var c = s.conf(t.id); if (c) confCount[c]++; });

  var cardIds = BS.glossary.map(function (g) { return g.id; });
  var mastered = cardIds.filter(function (id) { return s.card(id).box >= 4; }).length;
  var due = s.dueCards(cardIds).length;

  var tries = 0, right = 0;
  BS.quiz.forEach(function (q) { var r = s.question(q.id); tries += r.tries; right += r.right; });
  var acc = tries ? Math.round(right / tries * 100) : null;

  var wDone = 0, wGot = 0, wAvail = 0;
  BS.written.forEach(function (q) {
    var w = s.written(q.id);
    if (w.tries) { wDone++; wGot += w.best; wAvail += q.marks; }
  });

  var streak = s.streak();
  var pct = total ? Math.round(read / total * 100) : 0;

  var h = '';
  h += '<div class="eyebrow">Cambridge IGCSE 0450</div>';
  h += '<h1>Business Studies revision</h1>';
  var caseMarks = 0;
  BS.cases.forEach(function (c) {
    c.questions.forEach(function (q) { q.parts.forEach(function (p) { caseMarks += p.marks; }); });
  });
  h += '<p class="lead">Six units and ' + total + ' syllabus topics, with ' + BS.glossary.length +
       ' key terms, ' + BS.quiz.length + ' quiz questions, ' + BS.written.length +
       ' written questions with mark schemes, and ' + BS.cases.length + ' full case studies worth ' +
       caseMarks + ' marks. Everything is saved in this browser.</p>';

  /* stats */
  h += '<div class="grid g4" style="margin-bottom:18px">';
  h += stat('Topics read', read + ' / ' + total, pct + '% of the syllabus');
  h += stat('Cards mastered', mastered, due + ' due for review');
  h += stat('Quiz accuracy', acc === null ? '—' : acc + '%', tries + ' answered');
  h += stat('Written marks', wAvail ? wGot + '/' + wAvail : '—', wDone + ' of ' + BS.written.length + ' attempted');
  h += stat('Study streak', streak + (streak === 1 ? ' day' : ' days'), streak ? 'Keep it going' : 'Study today to start');
  h += '</div>';

  /* next actions */
  h += '<div class="card"><h2 class="mt0">Pick up where you left off</h2>';
  h += '<div class="btnrow">';
  if (due > 0) h += '<a class="btn primary" href="#/cards">Review ' + due + ' due flashcard' + (due === 1 ? '' : 's') + '</a>';
  else h += '<a class="btn primary" href="#/cards">Practise flashcards</a>';
  var nextTopic = BS.notes.filter(function (t) { return !s.isRead(t.id); })[0];
  if (nextTopic) h += '<a class="btn" href="#/notes/' + nextTopic.id + '">Next topic: ' + nextTopic.id + ' ' + R.esc(nextTopic.title) + '</a>';
  h += '<a class="btn" href="#/written">Write an exam answer</a>';
  h += '<a class="btn" href="#/quiz">Take a mixed quiz</a>';
  h += '<a class="btn" href="#/cases">Do a case study</a>';
  h += '</div>';
  h += '<p class="small" style="margin:14px 0 0">Multiple choice is useful for checking recall, but the exam is written. ' +
    'If you only do one thing today, do a <a href="#/written">written answer</a> and mark it yourself.</p>';
  h += '</div>';

  /* weak topics */
  var weak = BS.notes.filter(function (t) { return s.conf(t.id) === 1; });
  if (weak.length) {
    h += '<div class="card"><h2 class="mt0">Topics you marked as shaky</h2>';
    weak.forEach(function (t) {
      h += '<a class="topic-row" href="#/notes/' + t.id + '"><span class="dot c1"></span>' +
           '<span class="n">' + t.id + '</span><span class="t">' + R.esc(t.title) + '</span>' +
           '<span class="pill b">Revise</span></a>';
    });
    h += '</div>';
  }

  /* unit progress */
  h += '<div class="card"><h2 class="mt0">Progress by unit</h2>';
  BS.units.forEach(function (u) {
    var ts = BS.unitTopics(u.n);
    var r = ts.filter(function (t) { return s.isRead(t.id); }).length;
    var p = ts.length ? Math.round(r / ts.length * 100) : 0;
    h += '<div style="margin-bottom:14px">';
    h += '<div style="display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px">' +
         '<a href="#/notes#u' + u.n + '" style="text-decoration:none;font-weight:600">' + u.n + '. ' + R.esc(u.title) + '</a>' +
         '<span class="small">' + r + '/' + ts.length + '</span></div>';
    h += '<div class="bar' + (p === 100 ? ' good' : '') + '"><i style="width:' + p + '%"></i></div>';
    h += '</div>';
  });
  h += '</div>';

  /* confidence key */
  if (confCount[1] + confCount[2] + confCount[3] > 0) {
    h += '<div class="card tight"><span class="small">Self-rated confidence: </span>' +
         '<span class="pill b">' + confCount[1] + ' shaky</span> ' +
         '<span class="pill w">' + confCount[2] + ' getting there</span> ' +
         '<span class="pill g">' + confCount[3] + ' confident</span></div>';
  }

  h += '<p class="small">Built for the Cambridge IGCSE Business Studies 0450 syllabus. Always check the current syllabus on the Cambridge website for the exact content of your exam series.</p>';

  return h;

  function stat(k, v, sub) {
    return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + sub + '</div></div>';
  }
};
window.V = V;
</script>
<script>
/* ===== js/main.js ===== */
/* main.js — router, navigation, theme, search */

(function () {
  var main = document.getElementById('main');
  var sidebar = document.getElementById('sidebar');
  var unitNav = document.getElementById('unitNav');

  /* ---------------- theme ---------------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0e1220' : '#f6f7fb');
  }
  var saved = BS.store.theme();
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  document.getElementById('themeBtn').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    BS.store.theme(t); applyTheme(t);
  });

  /* ---------------- sidebar ---------------- */
  (function buildNav() {
    var h = '';
    BS.units.forEach(function (u) {
      h += '<div class="nav-unit"><span>' + u.n + '</span><span>' + R.esc(u.title) + '</span></div>';
      BS.unitTopics(u.n).forEach(function (t) {
        h += '<a href="#/notes/' + t.id + '" data-nav="notes/' + t.id + '">' +
          '<span class="num">' + t.id + '</span><span>' + R.esc(t.title) + '</span></a>';
      });
    });
    unitNav.innerHTML = h;
  })();

  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    navToggle.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('scrim').addEventListener('click', closeNav);
  sidebar.addEventListener('click', function (e) { if (e.target.closest('a')) closeNav(); });
  function closeNav() {
    document.body.classList.remove('nav-open');
    navToggle.setAttribute('aria-expanded', 'false');
  }

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (confirm('Erase all saved progress — confidence ratings, flashcard boxes, quiz history and your streak?\n\nThis cannot be undone.')) {
      BS.store.reset();
      location.hash = '#/';
      route();
    }
  });

  /* ---------------- routing ---------------- */
  function parse() {
    var raw = location.hash.replace(/^#\/?/, '');
    var qi = raw.indexOf('?');
    var params = {};
    if (qi !== -1) {
      raw.slice(qi + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      raw = raw.slice(0, qi);
    }
    var hi = raw.indexOf('#');
    var anchor = '';
    if (hi !== -1) { anchor = raw.slice(hi + 1); raw = raw.slice(0, hi); }
    return { parts: raw.split('/').filter(Boolean), params: params, anchor: anchor };
  }

  function linkTopics(html) {
    return html.replace(/\[\[([\d.]+)\]\]/g, function (m, id) {
      var t = BS.topic(id);
      return '<a href="#/notes/' + id + '">' + id + (t ? ' ' + R.esc(t.title) : '') + '</a>';
    });
  }

  function route() {
    var r = parse();
    var p = r.parts;
    var html = '', after = null, navKey = 'home';

    if (!p.length) { html = V.home(); navKey = 'home'; }
    else if (p[0] === 'notes' && p[1]) { html = V.topic(p[1]); after = V.afterTopic; navKey = 'notes/' + p[1]; }
    else if (p[0] === 'notes') { html = V.notes(); navKey = 'notes'; }
    else if (p[0] === 'cards') { html = V.cards(r.params); after = V.afterCards; navKey = 'cards'; }
    else if (p[0] === 'quiz') { html = V.quiz(r.params); after = V.afterQuiz; navKey = 'quiz'; }
    else if (p[0] === 'written') { html = V.written(r.params); after = V.afterWritten; navKey = 'written'; }
    else if (p[0] === 'cases' && p[1]) { html = V.case(p[1]); after = V.afterCase; navKey = 'cases'; }
    else if (p[0] === 'cases') { html = V.cases(); navKey = 'cases'; }
    else if (p[0] === 'exam') { html = V.exam(); after = V.afterExam; navKey = 'exam'; }
    else if (p[0] === 'tools') { html = V.tools(); after = V.afterTools; navKey = 'tools'; }
    else if (p[0] === 'glossary') { html = V.glossary(); after = V.afterGlossary; navKey = 'glossary'; }
    else { html = '<h1>Page not found</h1><p><a href="#/">Back to the dashboard</a></p>'; }

    V._cardKey = null;
    if (V._caseCleanup) { V._caseCleanup(); V._caseCleanup = null; }
    main.innerHTML = linkTopics(html);
    if (after) after(main);

    Array.prototype.forEach.call(sidebar.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === navKey);
    });
    /* keep the parent "Notes" link lit while inside a topic */
    if (navKey.indexOf('notes/') === 0) {
      var parent = sidebar.querySelector('[data-nav="notes"]');
      if (parent) parent.classList.add('active');
    }

    if (r.anchor) {
      var el = document.getElementById(r.anchor);
      if (el) { el.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);

  /* ---------------- search ---------------- */
  var modal = document.getElementById('searchModal');
  var sInput = document.getElementById('searchInput');
  var sResults = document.getElementById('searchResults');
  var index = null, sel = 0;

  function buildIndex() {
    if (index) return index;
    index = [];
    BS.notes.forEach(function (t) {
      var text = t.syllabus.join(' ') + ' ' + t.sections.map(function (s) { return s.h; }).join(' ');
      index.push({ title: t.id + ' ' + t.title, sub: 'Unit ' + t.unit + ' · topic', href: '#/notes/' + t.id, hay: (t.id + ' ' + t.title + ' ' + text).toLowerCase() });
      t.sections.forEach(function (s) {
        index.push({ title: s.h, sub: t.id + ' ' + t.title, href: '#/notes/' + t.id, hay: (s.h + ' ' + JSON.stringify(s.body)).toLowerCase() });
      });
    });
    BS.glossary.forEach(function (g) {
      index.push({ title: g.t, sub: 'Term · ' + g.tp, href: '#/glossary', hay: (g.t + ' ' + g.d).toLowerCase() });
    });
    BS.written.forEach(function (w) {
      index.push({
        title: w.cmd + ' — ' + String(w.q).replace(/\*\*/g, '').slice(0, 70),
        sub: 'Written practice · ' + w.marks + ' marks · ' + w.tp,
        href: '#/written?topic=' + w.tp,
        hay: ((w.stem || '') + ' ' + w.q + ' ' + w.cmd).toLowerCase()
      });
    });
    BS.cases.forEach(function (c) {
      index.push({
        title: c.title, sub: 'Case study · ' + c.tag, href: '#/cases/' + c.id,
        hay: (c.title + ' ' + c.tag + ' ' + c.blurb + ' ' + c.text.join(' ')).toLowerCase()
      });
    });
    index.push({ title: 'Command words', sub: 'Exam technique', href: '#/exam', hay: 'command words define state explain analyse evaluate justify recommend calculate outline discuss suggest' });
    index.push({ title: 'Formula sheet', sub: 'Exam technique', href: '#/exam', hay: 'formula formulae break-even contribution ratio roce margin cash flow added value elasticity' });
    index.push({ title: 'Break-even calculator', sub: 'Calculators', href: '#/tools', hay: 'break even calculator chart contribution margin of safety fixed variable costs' });
    index.push({ title: 'Ratio calculator', sub: 'Calculators', href: '#/tools', hay: 'ratio calculator gross profit margin roce current acid test liquidity' });
    return index;
  }

  function search(q) {
    q = q.toLowerCase().trim();
    if (!q) return [];
    var terms = q.split(/\s+/);
    return buildIndex().filter(function (it) {
      return terms.every(function (t) { return it.hay.indexOf(t) !== -1; });
    }).slice(0, 12);
  }

  function drawResults() {
    var res = search(sInput.value);
    if (!sInput.value.trim()) { sResults.innerHTML = '<div class="empty">Type to search topics, sections and key terms.</div>'; return; }
    if (!res.length) { sResults.innerHTML = '<div class="empty">Nothing found.</div>'; return; }
    sResults.innerHTML = res.map(function (r, i) {
      return '<a href="' + r.href + '" class="' + (i === sel ? 'sel' : '') + '"><div class="r-t">' + R.esc(r.title) +
        '</div><div class="r-s">' + R.esc(r.sub) + '</div></a>';
    }).join('');
  }

  function openSearch() {
    modal.hidden = false; sInput.value = ''; sel = 0; drawResults(); sInput.focus();
  }
  function closeSearch() { modal.hidden = true; }

  document.getElementById('searchBtn').addEventListener('click', openSearch);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeSearch(); });
  sInput.addEventListener('input', function () { sel = 0; drawResults(); });
  sResults.addEventListener('click', function () { setTimeout(closeSearch, 0); });
  sInput.addEventListener('keydown', function (e) {
    var res = search(sInput.value);
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, res.length - 1); drawResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (res[sel]) { location.hash = res[sel].href; closeSearch(); }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) { closeSearch(); return; }
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (!typing && (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey)))) {
      e.preventDefault(); openSearch(); return;
    }
    if (typing || !modal.hidden) return;
    if (V._cardKey) V._cardKey(e);
  });

  /* ---------------- go ---------------- */
  if (!location.hash) location.replace('#/');
  route();
})();
</script>
</body>
</html>
