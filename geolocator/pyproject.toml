[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolocator"
version = "0.1.0"
description = "Estimate where a photograph was taken, anywhere on Earth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# The web app needs only these two: the reasoning head is an API call, so it
# needs no GPU and no model weights.
dependencies = [
    "anthropic>=1.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
# GeoCLIP retrieval. A large download, and optional: it adds a second opinion
# from visual similarity, which helps most where there is nothing to read.
retrieval = [
    "torch>=2.0",
    "geoclip>=1.2",
    "transformers>=4.30",
    "numpy>=1.24",
]
# Offline reverse geocoding, for naming coordinates without a network call.
naming = ["reverse_geocoder>=1.5", "pycountry>=22.0"]
all = ["geolocator[retrieval,naming]"]
dev = ["pytest>=7.0"]

[project.scripts]
geolocate = "geolocator.cli:main"

[tool.setuptools]
packages = ["geolocator"]

[tool.setuptools.package-data]
geolocator = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
