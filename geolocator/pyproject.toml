[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolocator"
version = "0.1.0"
description = "Estimate where a photograph was taken, anywhere on Earth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "torch>=2.0",
    "geoclip>=1.2",
    "transformers>=4.30",
    "pillow>=9.0",
    "numpy>=1.24",
    "reverse_geocoder>=1.5",
    "pycountry>=22.0",
]

[project.optional-dependencies]
# The vision reasoning head. Worth installing: it is the largest single
# accuracy gain in the pipeline.
reasoning = ["anthropic>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
geolocate = "geolocator.cli:main"

[tool.setuptools]
packages = ["geolocator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
