<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geolocator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffb757' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffb757'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Committed to a single dark treatment: this is a tool you stare at, and the
     amber-phosphor terminal read is the point. */
  :root{
    --void:#07090b; --panel:#0d1215; --raised:#121a1e;
    --ink:#c5d2d3; --muted:#5c7075; --line:#1c272b;
    --amber:#ffb757; --cyan:#5ad1e6; --bad:#ff6b5a;
    /* semantic scale for confidence, read independently of the accent */
    --sure:#4fc9a6; --maybe:#ffb757; --unsure:#ef7a63;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--void);color:var(--ink);
    font-family:var(--mono);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* faint graticule + slow scan sweep */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg::before{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(to right,rgba(197,210,211,.035) 0 1px,transparent 1px 64px),
      repeating-linear-gradient(to bottom,rgba(197,210,211,.035) 0 1px,transparent 1px 64px);
  }
  .bg::after{
    content:"";position:absolute;left:0;right:0;height:38vh;
    background:linear-gradient(to bottom,transparent,rgba(255,183,87,.045),transparent);
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep{0%{top:-40vh}100%{top:100vh}}

  .screen{position:relative;z-index:1;min-height:100dvh;display:flex;
    flex-direction:column;justify-content:center;align-items:center;padding:32px 20px}
  .hidden{display:none!important}

  /* ---------- idle: the whole viewport is the target ---------- */
  #idle{cursor:pointer;text-align:center;gap:0}
  .brand{font-size:11px;letter-spacing:.34em;color:var(--muted);
    text-transform:uppercase;margin:0 0 auto;padding-top:8px}
  .idle-mid{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:18px}
  .reticle{width:74px;height:74px;position:relative;opacity:.85}
  .reticle svg{width:100%;height:100%;display:block}
  .reticle circle{transform-origin:50% 50%;animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
  .prompt{font-size:clamp(19px,3.6vw,29px);font-weight:700;letter-spacing:-.01em;margin:0}
  .prompt .caret{color:var(--amber);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hintline{color:var(--muted);font-size:12.5px;margin:0;letter-spacing:.04em}
  .foot{margin:auto 0 0;color:var(--muted);font-size:11px;letter-spacing:.1em;padding-bottom:6px}
  body.dragging{background:#0a1013}
  body.dragging .prompt{color:var(--amber)}
  body.dragging .bg::before{background-image:
    repeating-linear-gradient(to right,rgba(255,183,87,.10) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(to bottom,rgba(255,183,87,.10) 0 1px,transparent 1px 64px)}

  /* ---------- working ---------- */
  #busy{gap:22px}
  .log{width:min(560px,100%);font-size:13px}
  .log div{display:flex;gap:12px;padding:3px 0;color:var(--muted);
    opacity:0;animation:in .3s ease forwards}
  @keyframes in{to{opacity:1}}
  .log .on{color:var(--ink)}
  .log .tick{color:var(--amber);width:12px;flex:none}
  .elapsed{color:var(--muted);font-size:12px;letter-spacing:.12em}

  /* ---------- result ---------- */
  #done{justify-content:flex-start;padding:0}
  .sheet{width:min(1080px,100%);margin:0 auto;padding:26px 22px 72px}
  .topbar{display:flex;justify-content:space-between;align-items:center;
    gap:16px;margin-bottom:26px;flex-wrap:wrap}
  .again{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:9px 15px;cursor:pointer;transition:.15s}
  .again:hover{border-color:var(--amber);color:var(--amber)}
  .again:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .hero{--level:var(--maybe);border:1px solid var(--line);background:var(--panel);
    padding:26px 26px 24px;margin-bottom:16px}
  .hero.sure{--level:var(--sure)} .hero.unsure{--level:var(--unsure)}
  .caution{color:var(--unsure);font-size:12.5px;margin:12px 0 0;font-family:var(--sans)}
  .place{font-size:clamp(22px,4vw,34px);font-weight:700;margin:0 0 14px;
    letter-spacing:-.015em;line-height:1.15}
  .coords{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:22px}
  .coord-item .k{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:block}
  .coord-item .v{font-size:clamp(18px,3vw,25px);color:var(--cyan);font-weight:500;
    font-variant-numeric:tabular-nums}
  .copy{margin-left:2px;background:none;border:1px solid var(--line);color:var(--muted);
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;transition:.15s;align-self:center}
  .copy:hover{border-color:var(--cyan);color:var(--cyan)}
  .copy:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .copy.done{border-color:var(--sure);color:var(--sure)}

  .conf-row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
  .conf-row b{color:var(--level);font-size:15px;letter-spacing:0;font-weight:700}
  .conf-row .lvl{color:var(--level);letter-spacing:.18em}
  .bar{height:3px;background:var(--line);position:relative;overflow:hidden}
  .bar>i{position:absolute;inset:0 auto 0 0;background:var(--level);
    animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{from{width:0!important}}

  .grid{display:grid;gap:16px}
  @media(min-width:860px){.grid{grid-template-columns:1.35fr 1fr}}
  .box{border:1px solid var(--line);background:var(--panel);min-width:0}
  .box h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin:0;padding:14px 20px;border-bottom:1px solid var(--line);font-weight:500}
  .box .body{padding:18px 20px}
  .why{font-family:var(--sans);font-size:15px;line-height:1.62;margin:0;color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td:first-child{color:var(--muted);width:42%;padding-right:14px;
    text-transform:uppercase;font-size:10.5px;letter-spacing:.13em}
  td:last-child{color:var(--ink)}
  /* OSM tiles are light; invert them into the dark treatment. */
  .map{border:0;width:100%;height:270px;display:block;
    filter:invert(1) hue-rotate(180deg) saturate(.62) brightness(.92) contrast(1.05)}
  .shot{max-width:100%;max-height:260px;display:block;margin:0 auto}
  .also{color:var(--muted);font-size:13px;margin:0}
  a{color:var(--amber);text-underline-offset:3px}

  .setup{width:min(560px,100%);border:1px solid var(--line);background:var(--panel);
    padding:18px 20px;text-align:left;margin-top:8px}
  .setup h3{font-size:13px;margin:0 0 4px;color:var(--amber);letter-spacing:.02em}
  .setup p{font-family:var(--sans);font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .setup .cmd{font-family:var(--mono);font-size:11.5px;line-height:1.8;
    background:var(--void);border:1px solid var(--line);padding:11px 13px;margin:0;
    overflow-x:auto;white-space:pre;-webkit-user-select:all;user-select:all}
  .setup .cmd .c{color:var(--muted);user-select:none}
  .setup .cmd b{color:var(--cyan);font-weight:400}
  .banner b{color:var(--amber)}
  .banner code{color:var(--cyan)}
  .err{color:var(--bad)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>

<main>
  <section id="idle" class="screen" tabindex="0" role="button" aria-label="Choose a photo to locate">
    <p class="brand">Geolocator</p>
    <div class="idle-mid">
      <div class="reticle">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="50" cy="50" r="30" stroke="var(--amber)" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="44" stroke="var(--line)" stroke-width="1"/>
          <path d="M50 2v14M50 84v14M2 50h14M84 50h14" stroke="var(--amber)" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="3" fill="var(--amber)" stroke="none"/>
        </svg>
      </div>
      <p class="prompt">Drop a photo<span class="caret">_</span></p>
      <p class="hintline">or click anywhere &middot; or paste an image</p>
      <div id="setup" class="setup hidden"></div>
    </div>
    <p class="foot">FINDS WHERE IT WAS TAKEN</p>
  </section>

  <section id="busy" class="screen hidden">
    <div class="log" id="log"></div>
    <p class="elapsed" id="elapsed">0.0s</p>
  </section>

  <section id="done" class="screen hidden"><div class="sheet" id="sheet"></div></section>
</main>

<input id="file" type="file" accept="image/*" class="hidden">

<script>
const $ = (id) => document.getElementById(id);
const idle = $("idle"), busy = $("busy"), done = $("done"), fileInput = $("file");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function screen(el){ for (const s of [idle,busy,done]) s.classList.toggle("hidden", s!==el); }

fetch("/api/status").then(r=>r.json()).then(s=>{
  if (s.reasoner) return;
  const envFile = s.env_file || ".env";
  $("setup").innerHTML =
    '<h3>No API key yet</h3>'
    + '<p>Without one it can only read GPS metadata. Put your key in a file called '
    + '<b>.env</b> next to where you run it, then restart.</p>'
    + '<div class="cmd"><span class="c"># ' + esc(envFile) + '</span>\n'
    + 'ANTHROPIC_API_KEY=<b>sk-ant-...</b></div>';
  $("setup").classList.remove("hidden");
  $("setup").addEventListener("click", (e)=>e.stopPropagation());
}).catch(()=>{});

// The whole window is the drop target, not just a box.
let depth = 0;
addEventListener("dragenter", (e)=>{ e.preventDefault(); if(++depth===1) document.body.classList.add("dragging"); });
addEventListener("dragover", (e)=>e.preventDefault());
addEventListener("dragleave", ()=>{ if(--depth<=0){depth=0; document.body.classList.remove("dragging");} });
addEventListener("drop", (e)=>{
  e.preventDefault(); depth=0; document.body.classList.remove("dragging");
  if (e.dataTransfer.files.length) run(e.dataTransfer.files[0]);
});
addEventListener("paste", (e)=>{
  for (const item of e.clipboardData.files) if (item.type.startsWith("image/")) return run(item);
});
idle.addEventListener("click", ()=>fileInput.click());
idle.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();fileInput.click();} });
fileInput.addEventListener("change", ()=>{ if(fileInput.files.length) run(fileInput.files[0]); });

let timer = null;
function step(text, done){
  const row = document.createElement("div");
  row.innerHTML = `<span class="tick">${done?"✓":"›"}</span><span>${esc(text)}</span>`;
  if (done) row.className = "on";
  $("log").appendChild(row);
  return row;
}

async function run(f){
  if (!f.type.startsWith("image/") && !/\.(heic|heif)$/i.test(f.name)) {
    screen(busy); $("log").innerHTML=""; step("that file is not an image");
    $("log").lastChild.classList.add("err"); return;
  }
  screen(busy);
  $("log").innerHTML = "";
  step(`${f.name} · ${(f.size/1024).toFixed(0)} KB`, true);
  step("checking metadata", true);
  const thinking = step("analysing the picture");

  const t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(()=>{ $("elapsed").textContent = ((performance.now()-t0)/1000).toFixed(1)+"s"; }, 100);

  const preview = URL.createObjectURL(f);
  try {
    const res = await fetch("/api/locate", {
      method:"POST", headers:{"Content-Type": f.type || "image/jpeg"}, body:f,
    });
    const data = await res.json();
    clearInterval(timer);
    if (!res.ok){
      thinking.className = "err";
      thinking.innerHTML = `<span class="tick">✗</span><span>${esc(data.error||"failed")}</span>`;
      step("click anywhere to try another photo");
      idleAgain();
      return;
    }
    render(data, preview, (performance.now()-t0)/1000);
  } catch (err) {
    clearInterval(timer);
    thinking.className = "err";
    thinking.innerHTML = `<span class="tick">✗</span><span>${esc(err.message)}</span>`;
    idleAgain();
  }
}

function idleAgain(){
  const back = () => { screen(idle); removeEventListener("click", back); };
  setTimeout(()=>addEventListener("click", back), 400);
}

function render(d, preview, secs){
  const conf = Math.round((d.confidence||0)*100);
  const radius = d.radius_km < 1
    ? Math.round(d.radius_km*1000)+" m"
    : Math.round(d.radius_km).toLocaleString()+" km";

  const cues = [];
  for (const h of d.heads||[]){
    const c = (h.evidence||{}).cues; if (!c) continue;
    for (const [k,v] of Object.entries(c)){
      const t = Array.isArray(v)? v.join(", ") : v;
      if (!t || t==="unknown" || t==="none") continue;
      cues.push(`<tr><td>${esc(k.replace(/_/g," "))}</td><td>${esc(t)}</td></tr>`);
    }
  }
  const also = (d.alternatives||[]).map(a=>esc(a.label||a.lat.toFixed(2)+", "+a.lon.toFixed(2))).join("  ·  ");
  const pad = Math.max(.04, Math.min(14, (d.radius_km||60)/111));
  const bbox = [d.lon-pad,d.lat-pad,d.lon+pad,d.lat+pad].join("%2C");

  const level = conf >= 70 ? "sure" : conf >= 35 ? "" : "unsure";
  const levelWord = conf >= 70 ? "high" : conf >= 35 ? "moderate" : "low";

  $("sheet").innerHTML = `
    <div class="topbar">
      <p class="brand" style="margin:0;padding:0">Geolocator &middot; ${secs.toFixed(1)}s</p>
      <button class="again" id="again">Another photo</button>
    </div>

    <div class="hero ${level}">
      <p class="place">${esc(d.description || "Unnamed location")}</p>
      <div class="coords">
        <div class="coord-item"><span class="k">Latitude</span><span class="v">${d.lat.toFixed(5)}</span></div>
        <div class="coord-item"><span class="k">Longitude</span><span class="v">${d.lon.toFixed(5)}</span></div>
        <div class="coord-item"><span class="k">Radius</span><span class="v">${radius}</span></div>
        <button class="copy" id="copy" type="button">Copy</button>
      </div>
      <div class="conf-row">
        <span>Confidence within 200 km &middot; <span class="lvl">${levelWord}</span></span>
        <b>${conf}%</b>
      </div>
      <div class="bar"><i style="width:${conf}%"></i></div>
      ${conf < 35 ? `<p class="caution">The picture does not pin this down. Treat the
        radius as the answer, not the point.</p>` : ""}
    </div>

    <div class="grid">
      <div style="display:grid;gap:16px;min-width:0;align-content:start">
        ${d.rationale ? `<div class="box"><h2>Reasoning</h2><div class="body">
          <p class="why">${esc(d.rationale)}</p></div></div>` : ""}
        <div class="box"><h2>Location</h2>
          <iframe class="map" title="Map" loading="lazy"
            src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${d.lat}%2C${d.lon}"></iframe>
          <div class="body"><a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=13/${d.lat}/${d.lon}"
            target="_blank" rel="noopener">Open in OpenStreetMap</a></div></div>
      </div>
      <div style="display:grid;gap:16px;min-width:0;align-content:start">
        ${cues.length ? `<div class="box"><h2>Evidence</h2><div class="body">
          <table>${cues.join("")}</table></div></div>` : ""}
        ${also ? `<div class="box"><h2>Also considered</h2><div class="body">
          <p class="also">${also}</p></div></div>` : ""}
        <div class="box"><h2>Image</h2><div class="body"><img class="shot" src="${preview}" alt="The photo you supplied"></div></div>
        ${(d.warnings||[]).length ? `<div class="box"><h2>Notes</h2><div class="body">
          <p class="also">${d.warnings.map(esc).join("<br><br>")}</p></div></div>` : ""}
      </div>
    </div>`;

  screen(done);
  scrollTo(0,0);
  $("again").addEventListener("click", ()=>{ fileInput.value=""; screen(idle); });

  const copy = $("copy");
  copy.addEventListener("click", async ()=>{
    const text = `${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}`;
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = "Copied"; copy.classList.add("done");
    } catch {
      // Clipboard can be blocked; select the text so it can still be copied.
      copy.textContent = "Press ctrl+C";
      const r = document.createRange();
      r.selectNodeContents(document.querySelector(".coords"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    setTimeout(()=>{ copy.textContent="Copy"; copy.classList.remove("done"); }, 1800);
  });
}

addEventListener("keydown", (e)=>{ if(e.key==="Escape") screen(idle); });
</script>
</body>
</html>
